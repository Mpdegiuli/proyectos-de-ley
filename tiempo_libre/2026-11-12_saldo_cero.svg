<text x="20" y="34" font-size="17" fill="#0b0b0b" font-weight="bold">Saldo cero: el día del peluquero según el hombre gris</text>
<text x="20" y="56" font-size="12.5" fill="#52514e">Cada celda es un cuarto de hora por día durante 42 años de 365 días: 13.797.000 segundos.</text>
<text x="20" y="74" font-size="12.5" fill="#52514e">Las nueve cifras del libro suman exactamente 1.324.512.000, que es el total: no sobra nada.</text>
<text x="20" y="92" font-size="12.5" fill="#52514e">Sin años bisiestos: con los diez que hay en 42 años serían 864.000 segundos más, diez días que el hombre gris no cobra.</text>
