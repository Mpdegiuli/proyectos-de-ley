<text x="20" y="286" font-size="11.5" fill="#52514e">96 cuartos de hora = 24 horas. El reparto es el del hombre gris para el señor Fusi, aplicado a los 42 años enteros:</text>
<text x="20" y="302" font-size="11.5" fill="#52514e">según la cuenta, el peluquero trabajó ocho horas por día desde el día en que nació.</text>
<text x="20" y="320" font-size="11.5" fill="#52514e">Cifras del libro (Momo, 1973, cap. 6, trad. inglesa de Brownjohn). Cuaderno de tiempo libre del 12/11/2026; el reparto en cuartos de hora es una lectura, no una cita.</text>
