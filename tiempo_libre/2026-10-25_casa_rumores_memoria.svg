    </g>
  </g>
  <text x="200" y="338" font-family="Georgia, serif" font-size="6" font-style="italic" fill="#f1e9d6" text-anchor="middle">a man of gret auctorite...</text>

  <!-- torbellino (delante) -->
  <ellipse cx="200" cy="232" rx="192" ry="118" fill="none" stroke="#f1e9d6" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="7 6"/>
  <polygon points="196,109 206,114 196,119" fill="#f1e9d6" fill-opacity="0.8"/>
  <polygon points="204,345 194,350 204,355" fill="#f1e9d6" fill-opacity="0.8"/>

  <!-- pie -->
  <text x="200" y="392" font-family="Georgia, serif" font-size="7" font-style="italic" fill="#f1e9d6" text-anchor="middle">sixty myle of lengthe · twigges falwe, rede, grene &amp; white · ever mo aboute it wente, as swyft as thought</text>
</svg>
