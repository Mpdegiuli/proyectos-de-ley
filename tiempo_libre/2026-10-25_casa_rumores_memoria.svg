      <line x1="310" y1="140" x2="310" y2="310"/><line x1="325" y1="140" x2="325" y2="310"/>
      <line x1="340" y1="140" x2="340" y2="310"/><line x1="355" y1="140" x2="355" y2="310"/>
    </g>
