    <rect x="160" y="165" width="10" height="14" rx="5"/>
    <circle cx="200" cy="166" r="6"/>
    <rect x="230" y="165" width="10" height="14" rx="5"/>

    <circle cx="100" cy="202" r="5"/>
    <rect x="130" y="188" width="10" height="14" rx="5"/>
    <circle cx="170" cy="193" r="6"/>
    <rect x="200" y="186" width="11" height="15" rx="5.5"/>
    <circle cx="240" cy="193" r="5"/>
    <rect x="270" y="188" width="12" height="15" rx="6"/>
    <circle cx="306" cy="202" r="5"/>

    <rect x="66" y="218" width="9" height="13" rx="4.5"/>
    <circle cx="105" cy="222" r="6"/>
    <rect x="145" y="216" width="10" height="14" rx="5"/>
    <circle cx="192" cy="220" r="5"/>
    <rect x="245" y="216" width="10" height="14" rx="5"/>
    <circle cx="290" cy="222" r="6"/>
    <rect x="326" y="218" width="9" height="13" rx="4.5"/>

    <circle cx="55" cy="253" r="5"/>
    <rect x="85" y="244" width="10" height="14" rx="5"/>
    <circle cx="130" cy="254" r="6"/>
    <rect x="166" y="243" width="10" height="14" rx="5"/>
    <rect x="226" y="243" width="10" height="14" rx="5"/>
    <circle cx="268" cy="254" r="6"/>
    <rect x="306" y="244" width="10" height="14" rx="5"/>
    <circle cx="345" cy="253" r="5"/>

    <rect x="46" y="276" width="9" height="16" rx="4.5"/>
    <circle cx="85" cy="282" r="5"/>
    <rect x="116" y="274" width="10" height="18" rx="5"/>
    <circle cx="155" cy="283" r="6"/>
    <circle cx="246" cy="283" r="6"/>
    <rect x="276" y="274" width="10" height="18" rx="5"/>
    <circle cx="316" cy="282" r="5"/>
    <rect x="346" y="276" width="9" height="16" rx="4.5"/>

    <!-- gran puerta central -->
    <path d="M180 300 V272 Q200 252 220 272 V300 Z"/>
  </g>
  <!-- hojas de puerta abiertas -->
  <g fill="#a67c3e" stroke="#3a2812" stroke-width="0.6">
    <polygon points="140,188 147,192 147,206 140,202"/>
    <polygon points="85,244 78,248 78,262 85,258"/>
    <polygon points="316,244 323,248 323,262 316,258"/>
    <polygon points="276,274 269,278 269,296 276,292"/>
    <polygon points="180,272 168,268 168,304 180,300"/>
    <polygon points="220,272 232,268 232,304 220,300"/>
  </g>

