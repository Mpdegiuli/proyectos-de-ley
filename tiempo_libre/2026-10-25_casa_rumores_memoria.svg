      <path d="M15 288 Q200 278 385 288" stroke="#ece6d4" stroke-dashoffset="15"/>
      <path d="M15 297 Q200 287 385 297" stroke="#c9a24d"/>
    </g>
  </g>
  <path d="M 30 300 C 25 220, 80 150, 200 148 C 320 150, 375 220, 370 300 Z" fill="none" stroke="#3a2812" stroke-width="2"/>

