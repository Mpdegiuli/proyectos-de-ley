  <text x="276" y="183" font-family="Georgia, serif" font-size="5.5" font-style="italic" fill="#fff5dc" stroke="#2a1d10" stroke-width="0.6" paint-order="stroke" text-anchor="middle">sooth &amp; lesyng</text>

  <!-- un hombre de gran autoridad, en la puerta, y el poema se corta -->
  <path d="M192 300 V284 Q200 274 208 284 V300 Z" fill="#7d7490"/>
  <circle cx="200" cy="279" r="4" fill="#e9d5b5"/>
  <path d="M195 280 Q200 271 205 280" fill="none" stroke="#7d7490" stroke-width="2.5"/>
  <text x="200" y="268" font-family="Georgia, serif" font-size="9" fill="#fff5dc" text-anchor="middle">...</text>

  <!-- gente a la puerta: peregrino, marinero, bulero, mensajero -->
  <g stroke="#1e1826" stroke-width="2" stroke-linecap="round" fill="#1e1826">
    <g transform="translate(62,302)">
      <circle cx="0" cy="0" r="3"/>
      <polygon points="-5,-2 5,-2 0,-7" stroke="none"/>
      <line x1="0" y1="3" x2="0" y2="15"/>
      <line x1="0" y1="15" x2="-4" y2="24"/>
      <line x1="0" y1="15" x2="4" y2="24"/>
      <line x1="0" y1="7" x2="7" y2="4"/>
      <line x1="7" y1="-4" x2="7" y2="24" stroke-width="1.5"/>
      <rect x="-9" y="8" width="6" height="6" fill="#a67c3e" stroke="none"/>
    </g>
    <g transform="translate(100,304)">
