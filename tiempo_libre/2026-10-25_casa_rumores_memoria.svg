<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-labelledby="t d">
  <title id="t">Domus Dedaly: la Casa de los Rumores</title>
  <desc id="d">La casa de mimbre girante de Chaucer (House of Fame, libro III), dibujada de memoria: tejida con ramitas de colores, llena de agujeros y puertas siempre abiertas, girando en un valle bajo el castillo de la Fama; las noticias vuelan hacia el castillo, el aguila trae al sonador, y marineros, peregrinos y buleros se agolpan a la puerta.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2340"/>
      <stop offset="0.7" stop-color="#5d5a86"/>
      <stop offset="1" stop-color="#a98fa4"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a7a44"/>
      <stop offset="1" stop-color="#2f3a22"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf6ff"/>
      <stop offset="1" stop-color="#8fb6d6"/>
    </linearGradient>
    <clipPath id="houseClip">
      <path d="M 30 300 C 25 220, 80 150, 200 148 C 320 150, 375 220, 370 300 Z"/>
    </clipPath>
  </defs>

  <!-- cielo del sueno -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <g fill="#fff7d6">
    <circle cx="40" cy="60" r="1.2"/><circle cx="90" cy="48" r="0.9"/><circle cx="150" cy="70" r="1"/>
    <circle cx="230" cy="40" r="1.1"/><circle cx="270" cy="60" r="0.8"/><circle cx="370" cy="30" r="1.2"/>
    <circle cx="20" cy="120" r="0.9"/><circle cx="60" cy="160" r="1"/><circle cx="200" cy="100" r="0.8"/>
  </g>

  <!-- titulo -->
  <text x="14" y="26" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#f1e9d6">Domus Dedaly</text>
  <text x="14" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="7.5" fill="#d9d0bf">the Hous of Rumour · Chaucer, Hous of Fame, III (de memoria)</text>

  <!-- roca de hielo y castillo de la Fama -->
  <polygon points="282,128 300,88 332,76 364,82 392,128" fill="url(#ice)" stroke="#5f86a8" stroke-width="1"/>
  <g fill="#d9ccb3" stroke="#3f3328" stroke-width="1">
    <rect x="312" y="60" width="38" height="26"/>
    <rect x="306" y="48" width="10" height="38"/>
    <rect x="346" y="48" width="10" height="38"/>
    <rect x="326" y="50" width="10" height="36"/>
    <path d="M306 48 h2 v-4 h2 v4 h2 v-4 h2 v4 h2" fill="none"/>
    <path d="M346 48 h2 v-4 h2 v4 h2 v-4 h2 v4 h2" fill="none"/>
    <rect x="329" y="70" width="4" height="7" fill="#3f3328"/>
  </g>
  <line x1="331" y1="50" x2="331" y2="36" stroke="#3f3328" stroke-width="1"/>
  <polygon points="331,36 341,40 331,44" fill="#b5452f"/>
  <text x="300" y="44" font-family="Georgia, serif" font-size="8" font-style="italic" fill="#f1e9d6" text-anchor="end">Fame</text>

  <!-- el valle -->
  <path d="M0 288 Q200 312 400 288 L400 400 L0 400 Z" fill="url(#ground)"/>

  <!-- torbellino (detras) -->
  <ellipse cx="200" cy="232" rx="178" ry="100" fill="none" stroke="#f1e9d6" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="6 5"/>

  <!-- la casa de mimbre -->
  <path d="M 30 300 C 25 220, 80 150, 200 148 C 320 150, 375 220, 370 300 Z" fill="#8a6531"/>
  <g clip-path="url(#houseClip)">
    <g stroke="#5e4220" stroke-width="3" stroke-linecap="round">
      <line x1="40" y1="140" x2="40" y2="310"/><line x1="55" y1="140" x2="55" y2="310"/>
      <line x1="70" y1="140" x2="70" y2="310"/><line x1="85" y1="140" x2="85" y2="310"/>
      <line x1="100" y1="140" x2="100" y2="310"/><line x1="115" y1="140" x2="115" y2="310"/>
      <line x1="130" y1="140" x2="130" y2="310"/><line x1="145" y1="140" x2="145" y2="310"/>
      <line x1="160" y1="140" x2="160" y2="310"/><line x1="175" y1="140" x2="175" y2="310"/>
