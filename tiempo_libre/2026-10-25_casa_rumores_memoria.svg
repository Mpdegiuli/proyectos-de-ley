    <line x1="113" y1="140" x2="109" y2="148"/>
    <line x1="113" y1="140" x2="117" y2="148"/>
  </g>
  <text x="122" y="138" font-family="Georgia, serif" font-size="6" font-style="italic" fill="#f1e9d6">Geffrey</text>

  <!-- sooth y lesyng, apretados en la misma ventana -->
  <g stroke="#f7f2e6" stroke-width="0.5">
    <circle cx="273.5" cy="192" r="2.2" fill="#f7f2e6"/>
    <rect x="272" y="194.5" width="3" height="6" rx="1.5" fill="#f7f2e6"/>
    <circle cx="278.5" cy="192" r="2.2" fill="#3a1420"/>
