      <path d="M15 162 Q200 152 385 162" stroke="#b5452f" stroke-dashoffset="15"/>
      <path d="M15 171 Q200 161 385 171" stroke="#5c8a3c"/>
      <path d="M15 180 Q200 170 385 180" stroke="#ece6d4" stroke-dashoffset="15"/>
      <path d="M15 189 Q200 179 385 189" stroke="#c9a24d"/>
      <path d="M15 198 Q200 188 385 198" stroke="#b5452f" stroke-dashoffset="15"/>
      <path d="M15 207 Q200 197 385 207" stroke="#5c8a3c"/>
      <path d="M15 216 Q200 206 385 216" stroke="#ece6d4" stroke-dashoffset="15"/>
      <path d="M15 225 Q200 215 385 225" stroke="#c9a24d"/>
      <path d="M15 234 Q200 224 385 234" stroke="#b5452f" stroke-dashoffset="15"/>
      <path d="M15 243 Q200 233 385 243" stroke="#5c8a3c"/>
      <path d="M15 252 Q200 242 385 252" stroke="#ece6d4" stroke-dashoffset="15"/>
      <path d="M15 261 Q200 251 385 261" stroke="#c9a24d"/>
      <path d="M15 270 Q200 260 385 270" stroke="#b5452f" stroke-dashoffset="15"/>
