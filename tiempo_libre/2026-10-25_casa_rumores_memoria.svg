      <line x1="0" y1="3" x2="0" y2="15"/>
      <line x1="0" y1="15" x2="-4" y2="24"/>
      <line x1="0" y1="15" x2="4" y2="24"/>
      <line x1="0" y1="7" x2="7" y2="10"/>
      <rect x="5" y="9" width="9" height="6" fill="#b5452f" stroke="#1e1826" stroke-width="1"/>
    </g>
    <g transform="translate(342,302)">
      <circle cx="0" cy="0" r="3"/>
      <line x1="0" y1="3" x2="-2" y2="15"/>
      <line x1="-2" y1="15" x2="-10" y2="22"/>
      <line x1="-2" y1="15" x2="6" y2="23"/>
      <line x1="-1" y1="7" x2="9" y2="4"/>
