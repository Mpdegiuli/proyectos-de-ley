    <g transform="translate(222,142) rotate(-28)"><rect width="14" height="9" rx="2"/><line x1="3" y1="3" x2="11" y2="3" stroke-width="0.6"/><line x1="3" y1="6" x2="9" y2="6" stroke-width="0.6"/></g>
    <g transform="translate(240,128) rotate(-28)"><rect width="13" height="8" rx="2"/><line x1="3" y1="3" x2="10" y2="3" stroke-width="0.6"/><line x1="3" y1="5.5" x2="8" y2="5.5" stroke-width="0.6"/></g>
    <g transform="translate(257,116) rotate(-28)"><rect width="12" height="8" rx="2"/><line x1="2.5" y1="3" x2="9" y2="3" stroke-width="0.6"/><line x1="2.5" y1="5.5" x2="7" y2="5.5" stroke-width="0.6"/></g>
    <g transform="translate(273,105) rotate(-28)"><rect width="11" height="7" rx="1.8"/><line x1="2.5" y1="2.5" x2="8" y2="2.5" stroke-width="0.6"/><line x1="2.5" y1="4.8" x2="6.5" y2="4.8" stroke-width="0.6"/></g>
    <g transform="translate(289,96) rotate(-28)"><rect width="9" height="6" rx="1.5"/><line x1="2" y1="2.2" x2="7" y2="2.2" stroke-width="0.5"/></g>
    <g transform="translate(303,90) rotate(-28)"><rect width="8" height="5" rx="1.5"/><line x1="2" y1="2" x2="6" y2="2" stroke-width="0.5"/></g>
  </g>
  <text x="214" y="126" font-family="Georgia, serif" font-size="7" font-style="italic" fill="#f1e9d6" text-anchor="end">tydynges</text>

  <!-- el aguila trae a Geffrey -->
  <g stroke="#5a3e12" stroke-width="1" stroke-linejoin="round">
    <path d="M106 106 C 92 92, 78 88, 60 94 C 80 96, 94 104, 106 110 Z" fill="#d9a93c"/>
    <path d="M122 106 C 136 88, 152 84, 168 90 C 150 94, 136 104, 124 110 Z" fill="#d9a93c"/>
    <polygon points="103,108 91,114 96,106" fill="#c08f2c"/>
    <ellipse cx="115" cy="108" rx="12" ry="6" fill="#d9a93c"/>
    <circle cx="128" cy="104" r="4.5" fill="#d9a93c"/>
    <polygon points="132,104 139,106 132,107.5" fill="#3a2812"/>
    <circle cx="129.5" cy="103" r="0.9" fill="#1e1826" stroke="none"/>
    <line x1="113" y1="114" x2="111" y2="122" stroke="#3a2812" stroke-width="1.5"/>
    <line x1="117" y1="114" x2="115" y2="122" stroke="#3a2812" stroke-width="1.5"/>
  </g>
  <g stroke="#3a3050" stroke-width="2.2" stroke-linecap="round">
