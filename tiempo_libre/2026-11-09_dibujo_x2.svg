<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>A streetlamp that shines darkness</title>
  <desc>A fully lit night city in which one streetlamp casts a beam of blackout: inside its cone the windows, the street and even the sky go dark.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1430"/>
      <stop offset="1" stop-color="#2a4278"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d0" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffe49a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffe49a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4f1de" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f4f1de" stop-opacity="0"/>
    </radialGradient>
    <pattern id="winLit" width="24" height="32" patternUnits="userSpaceOnUse">
      <rect x="6" y="8" width="12" height="16" fill="#ffd978"/>
    </pattern>
    <pattern id="winDark" width="24" height="32" patternUnits="userSpaceOnUse">
      <rect x="6.5" y="8.5" width="11" height="15" fill="#0a0c13" stroke="#1c2130" stroke-width="1"/>
    </pattern>
    <clipPath id="wedge">
      <polygon points="250,316 170,800 660,800"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- night sky -->
  <rect width="800" height="800" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="40" cy="60" r="1.5"/>
    <circle cx="95" cy="130" r="1"/>
    <circle cx="150" cy="40" r="1.2"/>
    <circle cx="210" cy="95" r="1.6"/>
    <circle cx="265" cy="160" r="1"/>
    <circle cx="320" cy="55" r="1.3"/>
    <circle cx="375" cy="120" r="1"/>
    <circle cx="430" cy="30" r="1.8"/>
    <circle cx="470" cy="170" r="1.1"/>
    <circle cx="520" cy="80" r="1.4"/>
    <circle cx="575" cy="140" r="1"/>
    <circle cx="615" cy="45" r="1.2"/>
    <circle cx="740" cy="200" r="1"/>
    <circle cx="770" cy="60" r="1.5"/>
    <circle cx="60" cy="230" r="1"/>
    <circle cx="130" cy="190" r="1.3"/>
    <circle cx="290" cy="230" r="1"/>
    <circle cx="410" cy="200" r="1.2"/>
    <circle cx="500" cy="110" r="0.9"/>
    <circle cx="640" cy="160" r="1.1"/>
    <circle cx="720" cy="250" r="1"/>
    <circle cx="20" cy="150" r="1.2"/>
    <circle cx="180" cy="250" r="0.9"/>
    <circle cx="355" cy="180" r="1"/>
    <circle cx="560" cy="20" r="1"/>
    <circle cx="700" cy="20" r="1.3"/>
    <circle cx="780" cy="300" r="1"/>
    <circle cx="245" cy="20" r="1"/>
  </g>

  <!-- moon -->
  <circle cx="680" cy="110" r="70" fill="url(#moonglow)"/>
  <circle cx="680" cy="110" r="36" fill="#f4f1de"/>
  <circle cx="668" cy="100" r="6" fill="#e3dfc8"/>
  <circle cx="692" cy="122" r="4" fill="#e3dfc8"/>
  <circle cx="686" cy="96" r="3" fill="#e3dfc8"/>

  <!-- the lit city -->
  <rect x="-6" y="374" width="108" height="266" fill="#2b3552"/>
  <rect x="0" y="384" width="96" height="224" fill="url(#winLit)"/>
  <rect x="114" y="278" width="108" height="362" fill="#34436a"/>
  <rect x="120" y="288" width="96" height="320" fill="url(#winLit)"/>
  <rect x="234" y="406" width="84" height="234" fill="#2b3552"/>
  <rect x="240" y="416" width="72" height="192" fill="url(#winLit)"/>
  <rect x="330" y="246" width="132" height="394" fill="#3a4a74"/>
  <rect x="336" y="256" width="120" height="352" fill="url(#winLit)"/>
  <rect x="474" y="342" width="84" height="298" fill="#2b3552"/>
  <rect x="480" y="352" width="72" height="256" fill="url(#winLit)"/>
  <rect x="570" y="182" width="132" height="458" fill="#34436a"/>
  <rect x="576" y="192" width="120" height="416" fill="url(#winLit)"/>
  <rect x="714" y="310" width="108" height="330" fill="#2b3552"/>
  <rect x="720" y="320" width="96" height="288" fill="url(#winLit)"/>

  <!-- a few windows whose occupants are asleep -->
  <g fill="#1a2236">
    <rect x="30" y="456" width="12" height="16"/>
    <rect x="78" y="552" width="12" height="16"/>
    <rect x="150" y="360" width="12" height="16"/>
    <rect x="174" y="520" width="12" height="16"/>
    <rect x="414" y="328" width="12" height="16"/>
    <rect x="366" y="296" width="12" height="16"/>
    <rect x="606" y="264" width="12" height="16"/>
    <rect x="654" y="456" width="12" height="16"/>
    <rect x="630" y="552" width="12" height="16"/>
    <rect x="582" y="392" width="12" height="16"/>
    <rect x="774" y="424" width="12" height="16"/>
    <rect x="750" y="552" width="12" height="16"/>
    <rect x="510" y="392" width="12" height="16"/>
  </g>

  <!-- rooftops -->
  <rect x="150" y="266" width="24" height="12" fill="#2a3656"/>
  <line x1="396" y1="246" x2="396" y2="206" stroke="#1a2238" stroke-width="3"/>
  <circle cx="396" cy="204" r="3.5" fill="#ff6b6b"/>
  <rect x="612" y="158" width="32" height="24" fill="#2a3656"/>
  <rect x="608" y="154" width="40" height="6" fill="#1f2a46"/>
  <line x1="680" y1="182" x2="680" y2="140" stroke="#1a2238" stroke-width="3"/>
  <circle cx="680" cy="138" r="3" fill="#ff6b6b"/>

  <!-- street -->
  <rect x="0" y="640" width="800" height="160" fill="#2b3140"/>
  <rect x="0" y="640" width="800" height="12" fill="#3f4759"/>
  <line x1="0" y1="730" x2="800" y2="730" stroke="#d9cf7a" stroke-width="4" stroke-dasharray="40 30"/>

  <!-- the lamp's glow, which only survives outside its own beam -->
  <circle cx="250" cy="312" r="70" fill="url(#glow)"/>

  <!-- the blackout: everything inside the beam is switched off -->
  <g clip-path="url(#wedge)">
    <rect width="800" height="800" fill="#04050a"/>
    <rect x="-6" y="374" width="108" height="266" fill="#11141d"/>
    <rect x="0" y="384" width="96" height="224" fill="url(#winDark)"/>
    <rect x="114" y="278" width="108" height="362" fill="#141822"/>
    <rect x="120" y="288" width="96" height="320" fill="url(#winDark)"/>
    <rect x="234" y="406" width="84" height="234" fill="#11141d"/>
    <rect x="240" y="416" width="72" height="192" fill="url(#winDark)"/>
    <rect x="330" y="246" width="132" height="394" fill="#161a26"/>
    <rect x="336" y="256" width="120" height="352" fill="url(#winDark)"/>
    <rect x="474" y="342" width="84" height="298" fill="#11141d"/>
    <rect x="480" y="352" width="72" height="256" fill="url(#winDark)"/>
    <rect x="570" y="182" width="132" height="458" fill="#141822"/>
    <rect x="576" y="192" width="120" height="416" fill="url(#winDark)"/>
    <rect x="714" y="310" width="108" height="330" fill="#11141d"/>
    <rect x="720" y="320" width="96" height="288" fill="url(#winDark)"/>
    <rect x="0" y="640" width="800" height="160" fill="#090a0f"/>
    <rect x="0" y="640" width="800" height="12" fill="#0d0f16"/>
    <line x1="0" y1="730" x2="800" y2="730" stroke="#15151a" stroke-width="4" stroke-dasharray="40 30"/>
  </g>
  <polygon points="250,316 170,800 660,800" fill="none" stroke="#04050a" stroke-width="6" opacity="0.7" filter="url(#soft)"/>

  <!-- the streetlamp -->
  <rect x="188" y="630" width="24" height="12" rx="2" fill="#141824"/>
  <rect x="196" y="330" width="8" height="310" fill="#141824"/>
  <path d="M200 334 C200 300 215 300 246 300" fill="none" stroke="#141824" stroke-width="7" stroke-linecap="round"/>
  <polygon points="232,296 268,296 276,312 224,312" fill="#141824"/>
  <ellipse cx="250" cy="313" rx="20" ry="6" fill="#fff9e0"/>
</svg>
