    <circle cx="110" cy="160" r="0.7"/><circle cx="160" cy="30" r="1.1"/><circle cx="190" cy="140" r="0.8"/>
    <circle cx="205" cy="70" r="0.6"/><circle cx="240" cy="22" r="1.3"/><circle cx="262" cy="110" r="0.8"/>
    <circle cx="285" cy="180" r="0.7"/><circle cx="300" cy="45" r="1"/><circle cx="330" cy="90" r="0.6"/>
    <circle cx="360" cy="20" r="1.2"/><circle cx="375" cy="150" r="0.8"/><circle cx="410" cy="60" r="0.9"/>
    <circle cx="430" cy="115" r="0.6"/><circle cx="455" cy="30" r="1.1"/><circle cx="480" cy="170" r="0.7"/>
    <circle cx="505" cy="80" r="0.8"/><circle cx="530" cy="25" r="1.3"/><circle cx="550" cy="130" r="0.7"/>
    <circle cx="585" cy="55" r="0.9"/><circle cx="610" cy="180" r="0.8"/><circle cx="630" cy="20" r="1.1"/>
    <circle cx="655" cy="110" r="0.7"/><circle cx="680" cy="65" r="1.2"/><circle cx="700" cy="200" r="0.8"/>
    <circle cx="720" cy="30" r="0.9"/><circle cx="745" cy="140" r="0.7"/><circle cx="765" cy="80" r="1.2"/>
    <circle cx="785" cy="210" r="0.8"/><circle cx="40" cy="260" r="0.7"/><circle cx="140" cy="245" r="0.9"/>
    <circle cx="230" cy="230" r="0.6"/><circle cx="350" cy="230" r="0.8"/><circle cx="640" cy="250" r="0.7"/>
    <circle cx="760" cy="250" r="0.9"/><circle cx="90" cy="25" r="0.6"/><circle cx="445" cy="220" r="0.6"/>
    <circle cx="590" cy="120" r="0.6"/><circle cx="700" cy="245" r="0.6"/><circle cx="15" cy="170" r="0.8"/>
    <circle cx="395" cy="195" r="0.5"/><circle cx="570" cy="230" r="0.6"/><circle cx="250" cy="160" r="1"/>
    <circle cx="680" cy="65" r="3" opacity="0.15"/><circle cx="240" cy="22" r="3" opacity="0.15"/><circle cx="530" cy="25" r="3" opacity="0.15"/>
  </g>

  <!-- Tierra -->
  <g>
    <circle cx="130" cy="85" r="42" fill="url(#earth)"/>
    <g clip-path="url(#earthClip)" fill="#ffffff" opacity="0.85">
      <path d="M96,70 q14,-10 30,-2 q12,6 26,-2 q10,-6 22,2 l0,10 q-12,8 -26,2 q-14,-6 -28,2 q-14,6 -24,-4 z"/>
      <path d="M100,105 q18,-8 36,0 q12,6 30,-2 l0,9 q-18,8 -34,0 q-14,-6 -32,2 z" opacity="0.7"/>
      <ellipse cx="150" cy="60" rx="10" ry="4" opacity="0.6"/>
      <path d="M112,120 q20,-6 44,2 l-4,8 q-20,-4 -40,-2 z" opacity="0.5"/>
    </g>
    <g clip-path="url(#earthClip)">
      <circle cx="172" cy="85" r="46" fill="#000" opacity="0.62"/>
    </g>
    <circle cx="130" cy="85" r="42" fill="none" stroke="#bfe6ff" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- Suelo lunar -->
  <path d="M0,300 Q400,278 800,300 L800,500 L0,500 Z" fill="url(#ground)"/>
  <path d="M0,300 Q400,278 800,300 L800,314 Q400,292 0,314 Z" fill="#b8b8b0" opacity="0.45"/>
  <path d="M0,300 Q400,278 800,300" fill="none" stroke="#d6d6ce" stroke-width="1" opacity="0.6"/>

  <!-- Cráteres -->
  <g>
    <ellipse cx="135" cy="425" rx="95" ry="30" fill="#8f8f87"/>
    <ellipse cx="138" cy="424" rx="80" ry="22" fill="#4b4b45"/>
    <ellipse cx="118" cy="424" rx="60" ry="18" fill="#353530" opacity="0.7"/>
    <path d="M165,406 Q212,414 214,430" fill="none" stroke="#b8b8b0" stroke-width="3" opacity="0.6"/>
    <ellipse cx="690" cy="385" rx="58" ry="17" fill="#8a8a82"/>
    <ellipse cx="692" cy="384" rx="48" ry="12" fill="#4b4b45"/>
    <ellipse cx="680" cy="384" rx="36" ry="10" fill="#353530" opacity="0.7"/>
    <path d="M708,375 Q735,380 737,390" fill="none" stroke="#b8b8b0" stroke-width="2" opacity="0.6"/>
    <ellipse cx="250" cy="312" rx="22" ry="4" fill="#6a6a62"/>
    <ellipse cx="247" cy="312" rx="16" ry="2.5" fill="#44443f"/>
    <ellipse cx="620" cy="308" rx="18" ry="3.5" fill="#6a6a62"/>
    <ellipse cx="617" cy="308" rx="13" ry="2" fill="#44443f"/>
    <ellipse cx="80" cy="322" rx="26" ry="5" fill="#6a6a62"/>
    <ellipse cx="77" cy="322" rx="19" ry="3" fill="#44443f"/>
    <ellipse cx="420" cy="470" rx="40" ry="11" fill="#5c5c55"/>
    <ellipse cx="423" cy="469" rx="32" ry="8" fill="#3f3f3a"/>
  </g>

  <!-- Rocas y textura -->
  <g>
    <polygon points="600,445 618,432 640,438 648,452 620,458" fill="#3c3c37"/>
    <polygon points="600,445 618,432 640,438 628,441 606,447" fill="#7a7a72"/>
    <polygon points="300,420 310,412 322,416 324,424 306,426" fill="#3c3c37"/>
    <polygon points="300,420 310,412 322,416 314,418 304,421" fill="#7a7a72"/>
    <polygon points="740,460 756,450 776,456 780,468 752,472" fill="#3c3c37"/>
    <polygon points="740,460 756,450 776,456 766,458 746,462" fill="#7a7a72"/>
    <polygon points="200,350 207,345 215,348 216,354 204,355" fill="#3c3c37"/>
    <polygon points="200,350 207,345 215,348 210,349 203,351" fill="#7a7a72"/>
    <g fill="#000" opacity="0.15">
      <circle cx="60" cy="370" r="2"/><circle cx="240" cy="395" r="1.5"/><circle cx="350" cy="360" r="1.8"/>
      <circle cx="500" cy="420" r="2"/><circle cx="560" cy="470" r="1.5"/><circle cx="660" cy="430" r="1.8"/>
      <circle cx="120" cy="480" r="2.2"/><circle cx="700" cy="490" r="1.5"/><circle cx="30" cy="440" r="1.6"/>
    </g>
    <g fill="#fff" opacity="0.18">
