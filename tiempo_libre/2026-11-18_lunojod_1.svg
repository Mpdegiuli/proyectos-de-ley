<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03030a"/>
      <stop offset="1" stop-color="#0c0e1c"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3a39b"/>
      <stop offset="0.25" stop-color="#7e7e76"/>
      <stop offset="1" stop-color="#45453f"/>
    </linearGradient>
    <radialGradient id="earth" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#9fdcff"/>
      <stop offset="0.5" stop-color="#2d7bd1"/>
      <stop offset="1" stop-color="#0a2a5e"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e6de"/>
      <stop offset="0.6" stop-color="#b9b9b0"/>
      <stop offset="1" stop-color="#7d7d75"/>
    </linearGradient>
    <linearGradient id="solar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b4f8f"/>
      <stop offset="1" stop-color="#0e1f45"/>
    </linearGradient>
    <pattern id="cells" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="none" stroke="#8fb3ff" stroke-width="0.8" opacity="0.7"/>
    </pattern>
    <clipPath id="earthClip"><circle cx="130" cy="85" r="42"/></clipPath>
    <g id="wheel">
      <circle r="23.5" fill="none" stroke="#f0f0e8" stroke-width="2" stroke-dasharray="2 4.5"/>
      <circle r="22" fill="#2a2a26" fill-opacity="0.35" stroke="#cfcfc6" stroke-width="3.5"/>
      <circle r="17.5" fill="none" stroke="#9a9a92" stroke-width="1" stroke-dasharray="2 2"/>
      <circle r="13" fill="none" stroke="#9a9a92" stroke-width="0.8" stroke-dasharray="1.5 2.5"/>
      <g stroke="#bdbdb4" stroke-width="1.6">
        <line x1="0" y1="-20" x2="0" y2="20"/>
        <line x1="-20" y1="0" x2="20" y2="0"/>
        <line x1="-14" y1="-14" x2="14" y2="14"/>
        <line x1="-14" y1="14" x2="14" y2="-14"/>
      </g>
      <circle r="5.5" fill="#6a6a62" stroke="#e8e8e0" stroke-width="1.2"/>
    </g>
  </defs>

