      <circle cx="510" cy="418" r="1.5"/><circle cx="670" cy="428" r="1.3"/><circle cx="130" cy="478" r="1.6"/>
    </g>
  </g>

  <!-- Huellas -->
  <g fill="none" stroke="#4e4e47" stroke-linecap="round">
    <path d="M538,330 C610,324 690,312 790,297" stroke-width="5" stroke-dasharray="3 3"/>
    <path d="M540,321 C612,315 692,305 790,292" stroke-width="4" stroke-dasharray="3 3"/>
  </g>

  <!-- Sombra -->
  <ellipse cx="460" cy="331" rx="170" ry="8" fill="#000" opacity="0.45"/>
  <ellipse cx="625" cy="332" rx="60" ry="5" fill="#000" opacity="0.3"/>

  <!-- Lunojod 1 -->
  <g>
    <!-- Ruedas lejanas -->
    <g opacity="0.55">
      <use href="#wheel" x="338" y="298"/>
      <use href="#wheel" x="400" y="298"/>
      <use href="#wheel" x="462" y="298"/>
      <use href="#wheel" x="524" y="298"/>
    </g>

    <!-- Tapa abierta con celdas solares -->
    <g transform="translate(512,224) rotate(28)">
      <rect x="-40" y="-180" width="80" height="180" rx="36" fill="#cfcfc6" stroke="#8a8a82" stroke-width="2"/>
      <rect x="-33" y="-173" width="66" height="166" rx="30" fill="url(#solar)"/>
      <rect x="-33" y="-173" width="66" height="166" rx="30" fill="url(#cells)"/>
      <rect x="-33" y="-173" width="66" height="166" rx="30" fill="none" stroke="#6f8fd0" stroke-width="1"/>
      <path d="M-20,-160 q20,-8 40,0" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.35"/>
    </g>
    <g stroke="#55554f" stroke-width="2.5" stroke-linecap="round">
      <line x1="504" y1="222" x2="510" y2="214"/>
      <line x1="518" y1="222" x2="524" y2="214"/>
    </g>

    <!-- Bastidor y soportes -->
    <rect x="318" y="290" width="214" height="7" rx="2" fill="#8c8c84"/>
    <g stroke="#a0a098" stroke-width="4" stroke-linecap="round">
      <line x1="330" y1="292" x2="330" y2="305"/>
      <line x1="392" y1="292" x2="392" y2="305"/>
      <line x1="454" y1="292" x2="454" y2="305"/>
      <line x1="516" y1="292" x2="516" y2="305"/>
    </g>

    <!-- Casco (bañera) -->
    <path d="M296,222 L524,222 L516,284 Q514,292 506,292 L314,292 Q306,292 304,284 Z" fill="url(#hull)" stroke="#5e5e57" stroke-width="1.5"/>
    <g stroke="#6e6e66" stroke-width="1" opacity="0.5">
      <line x1="303" y1="242" x2="519" y2="242"/>
      <line x1="305" y1="262" x2="517" y2="262"/>
      <line x1="307" y1="280" x2="515" y2="280"/>
    </g>
    <rect x="292" y="215" width="236" height="9" rx="3" fill="#eeeee6" stroke="#8a8a82" stroke-width="1"/>
    <line x1="296" y1="219.5" x2="524" y2="219.5" stroke="#9a9a92" stroke-width="7" stroke-dasharray="1.2 8.8"/>

    <!-- Detalles del casco -->
    <circle cx="478" cy="254" r="11" fill="#a9a9a1" stroke="#5e5e57" stroke-width="1.2"/>
    <circle cx="478" cy="254" r="7" fill="#8b8b83" stroke="#5e5e57" stroke-width="0.8"/>
    <g fill="#5e5e57">
      <circle cx="478" cy="244.5" r="1"/><circle cx="478" cy="263.5" r="1"/>
      <circle cx="468.5" cy="254" r="1"/><circle cx="487.5" cy="254" r="1"/>
    </g>
    <rect x="392" y="238" width="18" height="12" fill="#c0202e" stroke="#7a1018" stroke-width="1"/>
    <rect x="430" y="250" width="26" height="16" rx="1.5" fill="#9c9c94" stroke="#5e5e57" stroke-width="1"/>
    <circle cx="443" cy="258" r="4" fill="#d8d8d0" stroke="#5e5e57" stroke-width="0.8"/>
    <line x1="443" y1="258" x2="445.5" y2="255.5" stroke="#333" stroke-width="0.8"/>
    <circle cx="335" cy="250" r="8" fill="#4a4a44" stroke="#d0d0c8" stroke-width="1.5"/>
    <circle cx="335" cy="250" r="3" fill="#111"/>
    <circle cx="333.5" cy="248.5" r="1" fill="#fff" opacity="0.8"/>

    <!-- Cámaras y retrorreflector al frente -->
    <rect x="278" y="232" width="22" height="13" rx="2" fill="#6e6e66" stroke="#3a3a36" stroke-width="1"/>
    <circle cx="279" cy="238.5" r="4.5" fill="#15151a" stroke="#c8c8c0" stroke-width="1"/>
    <circle cx="278" cy="237" r="1.2" fill="#fff" opacity="0.8"/>
    <rect x="281" y="252" width="19" height="11" rx="2" fill="#6e6e66" stroke="#3a3a36" stroke-width="1"/>
    <circle cx="282" cy="257.5" r="3.8" fill="#15151a" stroke="#c8c8c0" stroke-width="1"/>
    <circle cx="281" cy="256" r="1" fill="#fff" opacity="0.8"/>
    <rect x="284" y="203" width="14" height="13" fill="#2a2a30" stroke="#c9a84a" stroke-width="1.2"/>
    <g stroke="#c9a84a" stroke-width="0.6" opacity="0.8">
      <line x1="288.7" y1="203" x2="288.7" y2="216"/>
      <line x1="293.3" y1="203" x2="293.3" y2="216"/>
      <line x1="284" y1="209.5" x2="298" y2="209.5"/>
    </g>

    <!-- Antena cónica apuntando a la Tierra -->
    <g transform="rotate(-15 316 216)">
      <line x1="316" y1="216" x2="316" y2="188" stroke="#d0d0c8" stroke-width="2.5"/>
      <polygon points="308,188 324,188 342,150 290,150" fill="#dcdcd4" stroke="#6e6e66" stroke-width="1.2"/>
      <g stroke="#8a8a82" stroke-width="0.8">
        <line x1="300" y1="170" x2="332" y2="170"/>
        <line x1="304" y1="180" x2="328" y2="180"/>
      </g>
      <ellipse cx="316" cy="150" rx="26" ry="6" fill="#3a3a40" stroke="#c0c0b8" stroke-width="1.2"/>
    </g>

    <!-- Antena helicoidal -->
    <line x1="352" y1="216" x2="352" y2="138" stroke="#c0c0b8" stroke-width="1.2"/>
    <line x1="352" y1="214" x2="352" y2="140" stroke="#e6e6de" stroke-width="7" stroke-dasharray="1.6 3.4"/>
    <circle cx="352" cy="136" r="2.5" fill="#f0f0e8"/>

    <!-- Antenas de látigo -->
    <line x1="500" y1="216" x2="548" y2="96" stroke="#e0e0d8" stroke-width="1.2"/>
    <line x1="466" y1="216" x2="458" y2="118" stroke="#e0e0d8" stroke-width="1"/>
    <circle cx="548" cy="96" r="1.5" fill="#fff"/>

    <!-- Calentador de isótopos atrás -->
    <rect x="524" y="248" width="14" height="24" rx="3" fill="#8a8a80" stroke="#55554f" stroke-width="1"/>
    <g stroke="#55554f" stroke-width="0.8">
      <line x1="524" y1="254" x2="538" y2="254"/>
      <line x1="524" y1="260" x2="538" y2="260"/>
      <line x1="524" y1="266" x2="538" y2="266"/>
    </g>

    <!-- Novena rueda (odómetro) -->
    <path d="M518,286 L560,306" stroke="#9a9a92" stroke-width="3" stroke-linecap="round" fill="none"/>
    <use href="#wheel" transform="translate(562,316) scale(0.5)"/>

    <!-- Ruedas cercanas -->
    <use href="#wheel" x="330" y="305"/>
    <use href="#wheel" x="392" y="305"/>
    <use href="#wheel" x="454" y="305"/>
    <use href="#wheel" x="516" y="305"/>

    <!-- Regolito al pie de las ruedas -->
    <g fill="#6b6b64" opacity="0.6">
      <ellipse cx="330" cy="327" rx="14" ry="3"/>
      <ellipse cx="392" cy="327" rx="14" ry="3"/>
      <ellipse cx="454" cy="327" rx="14" ry="3"/>
      <ellipse cx="516" cy="327" rx="14" ry="3"/>
      <ellipse cx="562" cy="327" rx="7" ry="2"/>
    </g>
  </g>
</svg>
