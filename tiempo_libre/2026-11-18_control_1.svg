<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 480" width="240" height="480">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="0.5" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#2b2b2b"/>
    </linearGradient>
  </defs>
  <!-- botones laterales -->
  <rect x="14" y="110" width="4" height="34" rx="2" fill="#333"/>
  <rect x="14" y="156" width="4" height="34" rx="2" fill="#333"/>
  <rect x="222" y="130" width="4" height="50" rx="2" fill="#333"/>
  <!-- cuerpo -->
  <rect x="18" y="8" width="204" height="464" rx="36" fill="url(#body)" stroke="#444" stroke-width="2"/>
  <!-- pantalla -->
  <rect x="28" y="18" width="184" height="444" rx="28" fill="url(#screen)"/>
  <!-- notch -->
  <rect x="88" y="26" width="64" height="18" rx="9" fill="#111"/>
  <circle cx="134" cy="35" r="4" fill="#222" stroke="#444" stroke-width="1"/>
  <!-- barra de estado -->
  <text x="44" y="42" font-family="Arial, sans-serif" font-size="11" fill="#fff" font-weight="bold">9:41</text>
  <rect x="178" y="32" width="18" height="9" rx="2" fill="none" stroke="#fff" stroke-width="1.5"/>
  <rect x="180" y="34" width="12" height="5" rx="1" fill="#fff"/>
  <rect x="197" y="35" width="2" height="3" rx="1" fill="#fff"/>
  <!-- reloj -->
  <text x="120" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" fill="#fff" font-weight="bold">10:24</text>
  <text x="120" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e5e7eb">Miércoles 18 de noviembre</text>
  <!-- iconos de apps -->
  <g fill="#fff" fill-opacity="0.9">
    <rect x="44" y="160" width="32" height="32" rx="8"/>
    <rect x="88" y="160" width="32" height="32" rx="8"/>
    <rect x="132" y="160" width="32" height="32" rx="8"/>
    <rect x="176" y="160" width="20" height="32" rx="8"/>
    <rect x="44" y="208" width="32" height="32" rx="8"/>
    <rect x="88" y="208" width="32" height="32" rx="8"/>
    <rect x="132" y="208" width="32" height="32" rx="8"/>
    <rect x="44" y="256" width="32" height="32" rx="8"/>
    <rect x="88" y="256" width="32" height="32" rx="8"/>
  </g>
  <!-- dock -->
  <rect x="40" y="396" width="160" height="48" rx="16" fill="#fff" fill-opacity="0.25"/>
  <g fill="#fff">
    <rect x="52" y="404" width="32" height="32" rx="8"/>
    <rect x="92" y="404" width="32" height="32" rx="8"/>
    <rect x="132" y="404" width="32" height="32" rx="8"/>
    <rect x="172" y="404" width="20" height="32" rx="8"/>
  </g>
  <!-- barra de inicio -->
  <rect x="80" y="452" width="80" height="4" rx="2" fill="#fff" fill-opacity="0.8"/>
