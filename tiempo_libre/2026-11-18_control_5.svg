<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 480" width="240" height="480">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3f4b"/>
      <stop offset="1" stop-color="#15181f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="0.55" stop-color="#7b5cff"/>
      <stop offset="1" stop-color="#ff6fae"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- sombra -->
  <rect x="26" y="26" width="196" height="440" rx="36" fill="#000" opacity="0.25"/>

  <!-- cuerpo -->
  <rect x="20" y="16" width="200" height="444" rx="36" fill="url(#body)"/>
  <rect x="23" y="19" width="194" height="438" rx="33" fill="none" stroke="#6b7180" stroke-width="1.5"/>

  <!-- botones laterales -->
  <rect x="16" y="110" width="4" height="26" rx="2" fill="#2a2e38"/>
  <rect x="16" y="150" width="4" height="46" rx="2" fill="#2a2e38"/>
  <rect x="16" y="206" width="4" height="46" rx="2" fill="#2a2e38"/>
  <rect x="220" y="170" width="4" height="70" rx="2" fill="#2a2e38"/>

  <!-- pantalla -->
  <rect x="32" y="30" width="176" height="416" rx="26" fill="url(#screen)"/>

  <!-- notch / cámara -->
  <rect x="86" y="38" width="68" height="18" rx="9" fill="#101216"/>
  <circle cx="140" cy="47" r="4" fill="#1f2a44"/>
  <circle cx="141" cy="46" r="1.3" fill="#8ab4ff"/>

  <!-- barra de estado -->
  <text x="48" y="52" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">9:41</text>
  <rect x="170" y="43" width="18" height="9" rx="2" fill="none" stroke="#fff" stroke-width="1.2"/>
  <rect x="172" y="45" width="12" height="5" rx="1" fill="#fff"/>
  <rect x="189" y="46" width="2" height="3" rx="0.5" fill="#fff"/>

  <!-- hora grande -->
  <text x="120" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="300" fill="#fff">9:41</text>
  <text x="120" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#fff" opacity="0.85">Miércoles 18 de noviembre</text>

  <!-- íconos de apps -->
  <g>
    <rect x="48" y="180" width="30" height="30" rx="8" fill="#ff7a59"/>
    <rect x="90" y="180" width="30" height="30" rx="8" fill="#2fd27a"/>
    <rect x="132" y="180" width="30" height="30" rx="8" fill="#ffd33d"/>
    <rect x="174" y="180" width="18" height="30" rx="8" fill="#34c0ff"/>

    <rect x="48" y="222" width="30" height="30" rx="8" fill="#b06bff"/>
    <rect x="90" y="222" width="30" height="30" rx="8" fill="#34c0ff"/>
    <rect x="132" y="222" width="30" height="30" rx="8" fill="#ff5c8a"/>
    <rect x="174" y="222" width="18" height="30" rx="8" fill="#2fd27a"/>

    <rect x="48" y="264" width="30" height="30" rx="8" fill="#ffd33d"/>
    <rect x="90" y="264" width="30" height="30" rx="8" fill="#ff7a59"/>
    <rect x="132" y="264" width="30" height="30" rx="8" fill="#2fd27a"/>
    <rect x="174" y="264" width="18" height="30" rx="8" fill="#b06bff"/>
  </g>

  <!-- dock -->
  <rect x="44" y="372" width="152" height="52" rx="18" fill="#fff" opacity="0.22"/>
  <rect x="56" y="383" width="30" height="30" rx="8" fill="#2fd27a"/>
  <rect x="91" y="383" width="30" height="30" rx="8" fill="#34c0ff"/>
  <rect x="126" y="383" width="30" height="30" rx="8" fill="#ff5c8a"/>
  <rect x="161" y="383" width="24" height="30" rx="8" fill="#ffd33d"/>

  <!-- indicador de inicio -->
  <rect x="88" y="434" width="64" height="4" rx="2" fill="#fff" opacity="0.9"/>

  <!-- brillo del vidrio -->
  <rect x="32" y="30" width="176" height="416" rx="26" fill="url(#shine)"/>
</svg>
