<text x="390.0" y="580" text-anchor="middle">50.000</text>
<line x1="493.3" y1="564" x2="493.3" y2="568" stroke="#c3c2b7"/>
<text x="493.3" y="580" text-anchor="middle">100.000</text>
<line x1="596.7" y1="564" x2="596.7" y2="568" stroke="#c3c2b7"/>
<text x="596.7" y="580" text-anchor="middle">200.000</text>
<line x1="733.3" y1="564" x2="733.3" y2="568" stroke="#c3c2b7"/>
<text x="733.3" y="580" text-anchor="middle">500.000</text>
<line x1="836.6" y1="564" x2="836.6" y2="568" stroke="#c3c2b7"/>
<text x="836.6" y="580" text-anchor="middle">1.000.000</text>
<line x1="940.0" y1="564" x2="940.0" y2="568" stroke="#c3c2b7"/>
