<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Helvetica, Arial, sans-serif">
<title>Cuánta gente: las cifras de 1945 contra lo que entra, y las marchas de 2024-2026</title>
<rect width="1000" height="700" fill="#fcfcfb"/>
<style>text{font-size:11px;fill:#52514e} .t{font-size:13px;fill:#0b0b0b;font-weight:bold} .n{font-size:10.5px;fill:#0b0b0b} .m{font-size:10px;fill:#52514e}</style>
<text x="150" y="28" class="t">A. 17 de octubre de 1945: lo que se dijo y lo que entra</text>
<text x="150" y="44" class="m">bandas: de 2 a 4 personas por m² (Jacobs, en metros); superficies en plazas.py</text>
<rect x="381.8" y="70" width="103.4" height="14" rx="4" fill="#e9e8e3"/>
<text x="375.8" y="81" text-anchor="end" class="m">Plaza de Mayo sola (23.665 m²)</text>
<text x="385.8" y="81" class="m">47.330</text>
<text x="481.1" y="81" text-anchor="end" class="m">94.660</text>
<rect x="540.6" y="92" width="103.4" height="14" rx="4" fill="#e9e8e3"/>
<text x="534.6" y="103" text-anchor="end" class="m">Plaza + Avenida de Mayo (68.665 m²)</text>
<text x="544.6" y="103" class="m">137.330</text>
<text x="640.0" y="103" text-anchor="end" class="m">274.660</text>
<rect x="594.7" y="114" width="103.4" height="14" rx="4" fill="#e9e8e3"/>
<text x="588.7" y="125" text-anchor="end" class="m">Plaza + Avenida + las tres plazas del Congreso (98.665 m²)</text>
<text x="598.7" y="125" class="m">197.330</text>
<text x="694.0" y="125" text-anchor="end" class="m">394.660</text>
<circle cx="210.5" cy="154" r="4.5" fill="#0b0b0b"/>
<text x="219.5" y="158" class="n">"unas 15.000" antes del mediodía (Perfil, 2025)</text>
<line x1="493.3" y1="176" x2="596.7" y2="176" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round"/>
<circle cx="493.3" cy="176" r="4" fill="#0b0b0b"/><circle cx="596.7" cy="176" r="4" fill="#0b0b0b"/>
<text x="605.7" y="180" class="n">"cien o doscientas mil" (Grimson, 2022)</text>
<line x1="596.7" y1="198" x2="657.1" y2="198" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round"/>
<circle cx="596.7" cy="198" r="4" fill="#0b0b0b"/><circle cx="657.1" cy="198" r="4" fill="#0b0b0b"/>
<text x="666.1" y="202" class="n">"tal vez 200.000 o 300.000" (Perfil, 2025)</text>
<circle cx="629.9" cy="220" r="4.5" fill="#0b0b0b"/>
<text x="638.9" y="224" class="n">"más de doscientas cincuenta mil" (Golzman, 2004)</text>
<circle cx="657.1" cy="242" r="4.5" fill="#0b0b0b"/>
<text x="666.1" y="246" class="n">300.000, la cifra que circula</text>
<circle cx="836.6" cy="264" r="4.5" fill="#0b0b0b"/>
<text x="827.6" y="268" text-anchor="end" class="n">"un millón" (La Época, 1945, según Perfil)</text>
<line x1="150" y1="290" x2="940" y2="290" stroke="#c3c2b7" stroke-width="1"/>
<line x1="150.0" y1="290" x2="150.0" y2="294" stroke="#c3c2b7"/>
<text x="150.0" y="306" text-anchor="middle">10.000</text>
<line x1="253.4" y1="290" x2="253.4" y2="294" stroke="#c3c2b7"/>
<text x="253.4" y="306" text-anchor="middle">20.000</text>
<line x1="390.0" y1="290" x2="390.0" y2="294" stroke="#c3c2b7"/>
<text x="390.0" y="306" text-anchor="middle">50.000</text>
<line x1="493.3" y1="290" x2="493.3" y2="294" stroke="#c3c2b7"/>
<text x="493.3" y="306" text-anchor="middle">100.000</text>
<line x1="596.7" y1="290" x2="596.7" y2="294" stroke="#c3c2b7"/>
<text x="596.7" y="306" text-anchor="middle">200.000</text>
<line x1="733.3" y1="290" x2="733.3" y2="294" stroke="#c3c2b7"/>
<text x="733.3" y="306" text-anchor="middle">500.000</text>
<line x1="836.6" y1="290" x2="836.6" y2="294" stroke="#c3c2b7"/>
<text x="836.6" y="306" text-anchor="middle">1.000.000</text>
<line x1="940.0" y1="290" x2="940.0" y2="294" stroke="#c3c2b7"/>
<text x="940.0" y="306" text-anchor="middle">2.000.000</text>
<text x="940" y="320" text-anchor="end" class="m">personas (escala logarítmica)</text>
<text x="150" y="356" class="t">B. Las marchas universitarias al Congreso y a la Plaza de Mayo, 2024-2026</text>
<text x="150" y="372" class="m">Buenos Aires; la cuenta de La Nación es cuadra por cuadra, con 1, 2, 4 (y 5) personas por m²</text>
<text x="142" y="402" text-anchor="end" class="n">23/4/2024</text>
<line x1="150" y1="398" x2="940" y2="398" stroke="#e9e8e3" stroke-width="1"/>
<circle cx="710.8" cy="398" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
