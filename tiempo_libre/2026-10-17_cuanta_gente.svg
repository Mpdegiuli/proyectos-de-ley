<circle cx="803.4" cy="398" r="5" fill="#fcfcfb" stroke="#eb6834" stroke-width="2.5"/>
<text x="803.4" y="416" text-anchor="middle" class="n">organizadores 800.000</text>
<rect x="548.8" y="393" width="10" height="10" rx="2" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/>
<text x="553.8" y="416" text-anchor="middle" class="n">Ciudad 150.000</text>
