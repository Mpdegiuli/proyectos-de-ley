<text x="850.9" y="460" text-anchor="middle" class="n">organizadores 1.100.000</text>
<text x="142" y="490" text-anchor="end" class="n">12/5/2026</text>
<line x1="150" y1="486" x2="940" y2="486" stroke="#e9e8e3" stroke-width="1"/>
<circle cx="520.5" cy="486" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="520.5" y="476" text-anchor="middle" class="n">LN "unas 120.000"</text>
<circle cx="760.5" cy="486" r="5" fill="#fcfcfb" stroke="#eb6834" stroke-width="2.5"/>
<text x="760.5" y="504" text-anchor="middle" class="n">UBA "más de 600 mil"</text>
<text x="142" y="534" text-anchor="end" class="n">15/10/2026</text>
<line x1="150" y1="530" x2="940" y2="530" stroke="#e9e8e3" stroke-width="1"/>
<rect x="152" y="523" width="786" height="14" rx="7" fill="none" stroke="#52514e" stroke-dasharray="4 4"/>
<text x="545.0" y="534" text-anchor="middle" class="n">sin cifra pública al 17/10: "miles", "decenas de miles", "masiva", "multitudinaria"; el acto se adelantó por la lluvia y terminó a las 16.40</text>
<line x1="150" y1="564" x2="940" y2="564" stroke="#c3c2b7" stroke-width="1"/>
