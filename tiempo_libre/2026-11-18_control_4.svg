<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 480" width="240" height="480">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3f4b"/>
      <stop offset="1" stop-color="#15181f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b7cfa"/>
      <stop offset="0.6" stop-color="#8e5cf6"/>
      <stop offset="1" stop-color="#f06292"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Cuerpo del teléfono -->
  <rect x="20" y="20" width="200" height="440" rx="34" ry="34" fill="url(#body)" stroke="#0b0d11" stroke-width="2"/>

  <!-- Botones laterales -->
  <rect x="15" y="120" width="5" height="34" rx="2" fill="#2a2e38"/>
  <rect x="15" y="166" width="5" height="60" rx="2" fill="#2a2e38"/>
  <rect x="220" y="150" width="5" height="80" rx="2" fill="#2a2e38"/>

  <!-- Pantalla -->
  <rect x="32" y="32" width="176" height="416" rx="26" ry="26" fill="url(#screen)"/>

  <!-- Isla de cámara frontal -->
  <rect x="92" y="42" width="56" height="18" rx="9" fill="#0b0d11"/>
  <circle cx="135" cy="51" r="5" fill="#1c2230"/>
  <circle cx="136" cy="50" r="1.5" fill="#4b6cff" opacity="0.8"/>

  <!-- Barra de estado -->
  <text x="48" y="56" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">9:41</text>
  <rect x="166" y="47" width="22" height="10" rx="2.5" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="168" y="49" width="15" height="6" rx="1" fill="#ffffff"/>
  <rect x="189" y="50" width="2" height="4" rx="1" fill="#ffffff"/>
  <rect x="150" y="54" width="2" height="3" fill="#ffffff"/>
  <rect x="153" y="52" width="2" height="5" fill="#ffffff"/>
  <rect x="156" y="50" width="2" height="7" fill="#ffffff"/>
  <rect x="159" y="48" width="2" height="9" fill="#ffffff"/>

  <!-- Hora grande -->
  <text x="120" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="300" fill="#ffffff">14:32</text>
  <text x="120" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" opacity="0.9">miércoles 18 de noviembre</text>

  <!-- Iconos de apps -->
  <g>
    <rect x="52" y="190" width="30" height="30" rx="8" fill="#ffffff" opacity="0.9"/>
    <rect x="98" y="190" width="30" height="30" rx="8" fill="#ffffff" opacity="0.9"/>
    <rect x="144" y="190" width="30" height="30" rx="8" fill="#ffffff" opacity="0.9"/>
    <rect x="52" y="236" width="30" height="30" rx="8" fill="#ffffff" opacity="0.9"/>
    <rect x="98" y="236" width="30" height="30" rx="8" fill="#ffffff" opacity="0.9"/>
    <rect x="144" y="236" width="30" height="30" rx="8" fill="#ffffff" opacity="0.9"/>
    <rect x="52" y="282" width="30" height="30" rx="8" fill="#ffffff" opacity="0.9"/>
    <rect x="98" y="282" width="30" height="30" rx="8" fill="#ffffff" opacity="0.9"/>
    <rect x="144" y="282" width="30" height="30" rx="8" fill="#ffffff" opacity="0.9"/>
  </g>
  <g fill="#6b5cf6">
    <circle cx="67" cy="205" r="7"/>
    <rect x="106" y="198" width="14" height="14" rx="3"/>
    <path d="M152 212 L159 198 L166 212 Z"/>
    <path d="M60 251 h14 v4 h-14 z M60 246 h14 v3 h-14 z M60 257 h14 v3 h-14 z"/>
    <circle cx="113" cy="251" r="7" fill="none" stroke="#6b5cf6" stroke-width="3"/>
    <path d="M159 244 l3 6 l6 1 l-4.5 4 l1 6 l-5.5 -3 l-5.5 3 l1 -6 l-4.5 -4 l6 -1 z"/>
    <path d="M60 297 h14 M67 290 v14" stroke="#6b5cf6" stroke-width="3"/>
    <rect x="106" y="291" width="14" height="10" rx="2"/>
    <path d="M153 304 q6 -14 12 0" fill="none" stroke="#6b5cf6" stroke-width="3"/>
  </g>

  <!-- Dock -->
  <rect x="44" y="384" width="152" height="44" rx="14" fill="#ffffff" opacity="0.25"/>
  <rect x="56" y="391" width="30" height="30" rx="8" fill="#34c759"/>
  <path d="M65 406 a6 6 0 0 0 12 0 M71 400 v-4 M71 410 v4" fill="none" stroke="#ffffff" stroke-width="2"/>
  <rect x="98" y="391" width="30" height="30" rx="8" fill="#ff9f0a"/>
  <rect x="106" y="399" width="14" height="14" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
  <rect x="140" y="391" width="30" height="30" rx="8" fill="#0a84ff"/>
  <circle cx="155" cy="406" r="7" fill="none" stroke="#ffffff" stroke-width="2"/>

  <!-- Indicador de inicio -->
