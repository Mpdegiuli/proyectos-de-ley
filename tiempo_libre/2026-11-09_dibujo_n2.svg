    <circle cx="440" cy="157" r="9"/>
    <circle cx="425" cy="170" r="6"/>
    <circle cx="445" cy="130" r="5"/>
    <circle cx="410" cy="160" r="4"/>
  </g>

  <!-- Thin clouds -->
