    <circle cx="690" cy="320" r="0.9" opacity="0.5"/>
    <circle cx="620" cy="350" r="0.7" opacity="0.4"/>
    <circle cx="500" cy="330" r="0.8" opacity="0.5"/>
    <circle cx="450" cy="380" r="0.6" opacity="0.4"/>
    <circle cx="560" cy="400" r="0.7" opacity="0.4"/>
    <circle cx="60" cy="400" r="0.7" opacity="0.4"/>
    <circle cx="640" cy="390" r="0.6" opacity="0.4"/>
    <circle cx="620" cy="60" r="0.9" opacity="0.6"/>
    <circle cx="660" cy="150" r="0.8" opacity="0.55"/>
    <circle cx="600" cy="230" r="0.7" opacity="0.5"/>
    <circle cx="770" cy="220" r="0.9" opacity="0.6"/>
    <circle cx="30" cy="160" r="0.7" opacity="0.5"/>
    <circle cx="790" cy="30" r="0.8" opacity="0.6"/>
    <circle cx="250" cy="230" r="0.6" opacity="0.4"/>
    <circle cx="700" cy="250" r="0.6" opacity="0.4"/>
    <circle cx="640" cy="20" r="1" opacity="0.7"/>
    <circle cx="590" cy="120" r="0.7" opacity="0.5"/>
    <circle cx="210" cy="10" r="0.7" opacity="0.5"/>
    <circle cx="520" cy="300" r="0.6" opacity="0.4"/>
  </g>

  <!-- Caption -->
  <text x="20" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="2.5" fill="#434a6e">NEW YORK &#8212; 9 NOVEMBER 1965 &#8212; 5:27 P.M.</text>

  <!-- Moon and glow -->
  <circle cx="430" cy="150" r="150" fill="url(#moonGlow)"/>
  <circle cx="430" cy="150" r="46" fill="url(#moonFill)"/>
  <g fill="#bdb9a3" opacity="0.55">
