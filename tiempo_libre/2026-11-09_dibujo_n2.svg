<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>New York City, night of November 9, 1965</title>
  <desc>The Great Northeast Blackout: Manhattan dark under a full moon, candles in a few windows, headlights on the riverside drive, people at the railing looking up at the stars.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03050f"/>
      <stop offset="0.6" stop-color="#080d22"/>
      <stop offset="1" stop-color="#0e1531"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#e9e7d6" stop-opacity="0.5"/>
      <stop offset="0.3" stop-color="#cfcdbb" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9fa0a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonFill" cx="0.4" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#faf8ee"/>
      <stop offset="0.7" stop-color="#e3e0cc"/>
      <stop offset="1" stop-color="#c3c0ab"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131c3d"/>
      <stop offset="1" stop-color="#0a1024"/>
    </linearGradient>
    <linearGradient id="glitter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9d6c4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d9d6c4" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#d9d6c4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff5d0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff5d0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff5d0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff5d0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="candle">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>

