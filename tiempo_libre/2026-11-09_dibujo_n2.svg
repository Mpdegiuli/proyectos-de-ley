    <circle cx="106" cy="435" r="9" fill="url(#candle)"/><rect x="104" y="432" width="4" height="6" fill="#ffc46b"/>
    <circle cx="133" cy="475" r="9" fill="url(#candle)"/><rect x="131" y="472" width="4" height="6" fill="#ffd58a"/>
