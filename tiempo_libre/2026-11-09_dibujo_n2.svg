  <g fill="#0a0d1b">
    <rect x="0" y="430" width="50" height="110"/>
    <rect x="50" y="470" width="40" height="70"/>
    <rect x="90" y="400" width="60" height="140"/>
    <rect x="111" y="388" width="14" height="12"/>
    <polygon points="109,388 125,388 117,382"/>
    <rect x="150" y="450" width="35" height="90"/>
    <rect x="185" y="380" width="70" height="160"/>
    <rect x="255" y="440" width="30" height="100"/>
    <!-- Empire State Building -->
    <rect x="285" y="330" width="80" height="210"/>
    <rect x="300" y="200" width="50" height="130"/>
    <rect x="312" y="150" width="26" height="50"/>
    <rect x="318" y="135" width="14" height="15"/>
    <rect x="322" y="120" width="6" height="15"/>
    <line x1="325" y1="120" x2="325" y2="92" stroke="#0a0d1b" stroke-width="2"/>
    <rect x="365" y="430" width="45" height="110"/>
    <rect x="410" y="390" width="55" height="150"/>
    <!-- Chrysler Building -->
    <rect x="465" y="360" width="60" height="180"/>
    <rect x="478" y="282" width="34" height="78"/>
    <path d="M478 282 L512 282 L512 270 A17 11 0 0 0 478 270 Z"/>
    <path d="M483 270 L507 270 L507 259 A12 9 0 0 0 483 259 Z"/>
    <path d="M487 259 L503 259 L503 250 A8 7 0 0 0 487 250 Z"/>
    <path d="M490 250 L500 250 L500 243 A5 5 0 0 0 490 243 Z"/>
    <line x1="495" y1="243" x2="495" y2="200" stroke="#0a0d1b" stroke-width="2"/>
    <rect x="525" y="450" width="40" height="90"/>
    <rect x="565" y="410" width="75" height="130"/>
    <rect x="640" y="470" width="30" height="70"/>
    <rect x="670" y="420" width="55" height="120"/>
    <rect x="725" y="460" width="40" height="80"/>
    <rect x="765" y="440" width="35" height="100"/>
