    <circle cx="652" cy="493" r="9" fill="url(#candle)"/><rect x="650" y="490" width="4" height="6" fill="#ffae3c"/>
    <circle cx="693" cy="450" r="9" fill="url(#candle)"/><rect x="691" y="447" width="4" height="6" fill="#ffc46b"/>
