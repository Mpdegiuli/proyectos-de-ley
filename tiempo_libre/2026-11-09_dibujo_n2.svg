    <circle cx="300" cy="365" r="9" fill="url(#candle)"/><rect x="298" y="362" width="4" height="6" fill="#ffc46b"/>
    <circle cx="348" cy="425" r="9" fill="url(#candle)"/><rect x="346" y="422" width="4" height="6" fill="#ffae3c"/>
    <circle cx="323" cy="485" r="9" fill="url(#candle)"/><rect x="321" y="482" width="4" height="6" fill="#ffd58a"/>
    <circle cx="312" cy="243" r="9" fill="url(#candle)"/><rect x="310" y="240" width="4" height="6" fill="#ffc46b"/>
    <circle cx="332" cy="303" r="9" fill="url(#candle)"/><rect x="330" y="300" width="4" height="6" fill="#ffd58a"/>
    <circle cx="382" cy="473" r="9" fill="url(#candle)"/><rect x="380" y="470" width="4" height="6" fill="#ffc46b"/>
