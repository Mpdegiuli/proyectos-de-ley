    <circle cx="453" cy="475" r="9" fill="url(#candle)"/><rect x="451" y="472" width="4" height="6" fill="#ffc46b"/>
    <circle cx="483" cy="400" r="9" fill="url(#candle)"/><rect x="481" y="397" width="4" height="6" fill="#ffd58a"/>
