    <ellipse cx="340" cy="205" rx="95" ry="7" fill="#151b3a" opacity="0.75"/>
    <ellipse cx="340" cy="202" rx="95" ry="2" fill="#2a3160" opacity="0.5"/>
    <ellipse cx="520" cy="100" rx="60" ry="5" fill="#151b3a" opacity="0.75"/>
    <ellipse cx="520" cy="98" rx="60" ry="1.5" fill="#2a3160" opacity="0.5"/>
