    <circle cx="70" cy="220" r="0.9" opacity="0.6"/>
    <circle cx="150" cy="260" r="0.7" opacity="0.5"/>
    <circle cx="240" cy="300" r="0.8" opacity="0.5"/>
    <circle cx="20" cy="330" r="0.7" opacity="0.45"/>
    <circle cx="110" cy="350" r="0.8" opacity="0.5"/>
    <circle cx="200" cy="380" r="0.6" opacity="0.4"/>
    <circle cx="290" cy="360" r="0.7" opacity="0.45"/>
    <circle cx="390" cy="330" r="0.8" opacity="0.5"/>
    <circle cx="720" cy="40" r="1" opacity="0.75"/>
    <circle cx="760" cy="110" r="0.8" opacity="0.6"/>
    <circle cx="700" cy="20" r="0.7" opacity="0.5"/>
    <circle cx="780" cy="300" r="0.8" opacity="0.55"/>
