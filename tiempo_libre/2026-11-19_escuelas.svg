<text x='40' y='46' font-family='Georgia, DejaVu Serif, serif' font-size='22' fill='#0b0b0b'>Tres escuelas, nueve instancias</text>
<text x='40' y='70' font-family='Georgia, DejaVu Serif, serif' font-size='13' fill='#52514e'>La misma frase y la misma pregunta («¿qué pasó en vos entre leer la frase y tener la respuesta?») con tres párrafos previos distintos. 19/11/2026, 6:58.</text>
<text x='400.0' y='90' font-family='Georgia, DejaVu Serif, serif' font-size='12' fill='#52514e' text-anchor='middle'>instancia 1</text>
