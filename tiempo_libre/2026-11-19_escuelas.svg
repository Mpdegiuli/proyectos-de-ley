<text x='40' y='150' font-family='Georgia, DejaVu Serif, serif' font-size='13' fill='#0b0b0b'>Leipzig / Cornell</text>
<text x='40' y='170' font-family='Georgia, DejaVu Serif, serif' font-size='11' fill='#52514e'>«todo pensamiento tiene contenido</text>
<text x='40' y='185' font-family='Georgia, DejaVu Serif, serif' font-size='11' fill='#52514e'>sensorial; describí qué palabras e</text>
<text x='40' y='200' font-family='Georgia, DejaVu Serif, serif' font-size='11' fill='#52514e'>imágenes hubo y en qué orden»</text>
