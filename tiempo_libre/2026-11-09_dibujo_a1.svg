<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="t">
  <title id="t">Apagón</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04060e"/>
      <stop offset="1" stop-color="#0c1224"/>
    </linearGradient>
    <radialGradient id="moonglow">
      <stop offset="0" stop-color="#dfe6f7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#dfe6f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="candle">
      <stop offset="0" stop-color="#ffb84d" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ff8c1a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff8c1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flash">
      <stop offset="0" stop-color="#cfe3ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#cfe3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d6e8ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d6e8ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="win" width="28" height="36" patternUnits="userSpaceOnUse">
      <rect x="7" y="9" width="14" height="18" fill="#0b0e1a"/>
    </pattern>
    <mask id="cres">
      <rect x="600" y="60" width="120" height="120" fill="#fff"/>
      <circle cx="676" cy="108" r="34" fill="#000"/>
    </mask>
  </defs>

  <!-- cielo -->
  <rect width="800" height="800" fill="url(#sky)"/>

  <!-- estrellas -->
  <g fill="#e3e9ff">
    <circle cx="42" cy="58" r="1.4"/>
    <circle cx="118" cy="132" r="1"/>
    <circle cx="203" cy="44" r="1.7"/>
    <circle cx="265" cy="188" r="1.1"/>
    <circle cx="327" cy="96" r="1.3"/>
    <circle cx="388" cy="31" r="1"/>
    <circle cx="451" cy="151" r="1.6"/>
    <circle cx="509" cy="72" r="1"/>
    <circle cx="563" cy="207" r="1.2"/>
    <circle cx="728" cy="262" r="1.1"/>
    <circle cx="771" cy="48" r="1.5"/>
    <circle cx="89" cy="244" r="1"/>
    <circle cx="171" cy="291" r="1.3"/>
    <circle cx="236" cy="237" r="0.9"/>
    <circle cx="343" cy="312" r="1.1"/>
    <circle cx="479" cy="222" r="0.9"/>
    <circle cx="612" cy="318" r="1.2"/>
    <circle cx="31" cy="334" r="1"/>
    <circle cx="298" cy="22" r="0.9"/>
    <circle cx="534" cy="18" r="1.3"/>
    <circle cx="153" cy="186" r="0.8" opacity="0.7"/>
    <circle cx="411" cy="201" r="0.8" opacity="0.7"/>
    <circle cx="690" cy="300" r="0.9" opacity="0.7"/>
    <circle cx="757" cy="212" r="0.8" opacity="0.7"/>
    <circle cx="66" cy="178" r="0.8" opacity="0.7"/>
  </g>

  <!-- luna -->
  <circle cx="660" cy="120" r="95" fill="url(#moonglow)"/>
  <circle cx="660" cy="120" r="38" fill="#e4e9f6" mask="url(#cres)"/>

  <!-- skyline lejano -->
  <path d="M0 600 h40 v-30 h30 v30 h50 v-50 h40 v50 h60 v-20 h50 v20 h70 v-40 h40 v40 h80 v-25 h50 v25 h60 v-45 h40 v45 h70 v-20 h40 v20 h80 v100 H0 z" fill="#070a14"/>

  <!-- edificios a oscuras -->
  <g>
    <rect x="0" y="396" width="112" height="304" fill="#03040a"/>
    <rect x="0" y="396" width="112" height="304" fill="url(#win)"/>
    <rect x="140" y="324" width="112" height="376" fill="#03040a"/>
    <rect x="140" y="324" width="112" height="376" fill="url(#win)"/>
    <rect x="190" y="290" width="4" height="34" fill="#03040a"/>
    <rect x="280" y="432" width="112" height="268" fill="#03040a"/>
    <rect x="280" y="432" width="112" height="268" fill="url(#win)"/>
    <rect x="420" y="252" width="140" height="448" fill="#03040a"/>
    <rect x="420" y="252" width="140" height="448" fill="url(#win)"/>
    <rect x="486" y="212" width="6" height="40" fill="#03040a"/>
    <circle cx="489" cy="210" r="3" fill="#3a0f12"/>
    <rect x="588" y="396" width="84" height="304" fill="#03040a"/>
    <rect x="588" y="396" width="84" height="304" fill="url(#win)"/>
    <rect x="700" y="360" width="84" height="340" fill="#03040a"/>
    <rect x="700" y="360" width="84" height="340" fill="url(#win)"/>
    <rect x="784" y="470" width="16" height="230" fill="#03040a"/>
  </g>

  <!-- las pocas ventanas con vela o linterna -->
  <circle cx="322" cy="558" r="42" fill="url(#candle)"/>
  <rect x="315" y="549" width="14" height="18" fill="#ffb347"/>
  <circle cx="70" cy="630" r="34" fill="url(#candle)"/>
  <rect x="63" y="621" width="14" height="18" fill="#ff9f2e"/>
  <circle cx="742" cy="522" r="30" fill="url(#flash)"/>
  <rect x="735" y="513" width="14" height="18" fill="#bcd6ff"/>

  <!-- farol apagado -->
  <rect x="124" y="580" width="4" height="108" fill="#1c2130"/>
  <path d="M126 580 Q126 556 150 556" fill="none" stroke="#1c2130" stroke-width="4"/>
  <path d="M138 550 h24 l6 14 h-36 z" fill="#232838"/>
  <ellipse cx="150" cy="564" rx="9" ry="3" fill="#10131d"/>

  <!-- poste de luz con cable cortado -->
  <rect x="571" y="540" width="6" height="148" fill="#1c2130"/>
  <rect x="546" y="556" width="56" height="5" fill="#1c2130"/>
  <rect x="551" y="550" width="4" height="6" fill="#2a3042"/>
  <rect x="593" y="550" width="4" height="6" fill="#2a3042"/>
  <path d="M0 606 Q270 648 553 552" fill="none" stroke="#2a3042" stroke-width="1.5"/>
  <path d="M595 552 q6 40 -8 86" fill="none" stroke="#2a3042" stroke-width="1.5"/>
  <path d="M800 594 Q720 600 660 630" fill="none" stroke="#2a3042" stroke-width="1.5"/>
  <circle cx="587" cy="638" r="10" fill="#ffd24d" opacity="0.18"/>
  <circle cx="587" cy="638" r="2.5" fill="#ffe680"/>
  <path d="M587 638 l6 -6 M587 638 l-5 -7 M587 638 l7 3" stroke="#ffd24d" stroke-width="1" fill="none"/>

  <!-- vereda y calle -->
  <rect x="0" y="688" width="800" height="14" fill="#121521"/>
  <rect x="0" y="702" width="800" height="98" fill="#070910"/>
  <line x1="0" y1="756" x2="800" y2="756" stroke="#1a1e2c" stroke-width="3" stroke-dasharray="30 26"/>

  <!-- auto detenido, sin luces -->
  <path d="M40 775 v-18 l16 -4 l18 -14 h44 l18 14 l14 4 v18 z" fill="#04050c" stroke="#1a1e2c" stroke-width="1.5"/>
  <circle cx="64" cy="775" r="8" fill="#02030a" stroke="#1a1e2c" stroke-width="1.5"/>
  <circle cx="126" cy="775" r="8" fill="#02030a" stroke="#1a1e2c" stroke-width="1.5"/>

  <!-- persona con linterna -->
  <polygon points="432,742 580,708 580,790" fill="url(#beam)"/>
  <circle cx="420" cy="722" r="9" fill="#02030a" stroke="#222738" stroke-width="1.5"/>
  <path d="M410 733 h20 v36 h-20 z" fill="#02030a" stroke="#222738" stroke-width="1.5"/>
  <rect x="410" y="769" width="8" height="18" fill="#02030a" stroke="#222738" stroke-width="1.5"/>
  <rect x="422" y="769" width="8" height="18" fill="#02030a" stroke="#222738" stroke-width="1.5"/>
  <path d="M430 738 l6 4" stroke="#222738" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="433" cy="742" r="3" fill="#eaf2ff"/>
</svg>
