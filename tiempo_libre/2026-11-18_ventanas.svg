<text x="90" y="596" font-size="11" fill="#444">Cuadrado: ventana de ±2 %. Punteado: ±(2 % + 10 Hz), la del extremo a extremo.</text>
<text x="90" y="612" font-size="11" fill="#444">Rojo: pares de frecuencias en razón simple, los que forman los armónicos de una vocal.</text>
