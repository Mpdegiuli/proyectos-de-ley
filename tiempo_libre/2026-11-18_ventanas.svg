<text x="90" y="780" font-size="11" fill="#444">Cada raya de la regla es un semitono (100 cents). El paso entre tonos vecinos del teclado es 21:19, 173 cents:</text>
<text x="90" y="796" font-size="11" fill="#444">ni un semitono ni un tono. Solo dos tonos caen sobre una tecla del piano, 697 (Fa5) y 1.477 (Fa#6), a 4 cents;</text>
<text x="90" y="812" font-size="11" fill="#444">los otros seis quedan entre dos teclas.</text>
<text x="90" y="844" font-size="11" fill="#777">Cuentas: teclado.py. Ventanas y diagonales: L. Schenker, "Pushbutton Calling with a Two-Group</text>
<text x="90" y="860" font-size="11" fill="#777">Voice-Frequency Code", Bell System Technical Journal 39(1), enero de 1960, fig. 5.</text>
