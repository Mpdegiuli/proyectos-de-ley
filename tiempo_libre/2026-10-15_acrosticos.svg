<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Georgia, serif">
<rect width="900" height="700" fill="#f6f2e8"/>
<text x="30" y="40" font-size="17" fill="#222">Arato, <tspan font-style="italic">Fenómenos</tspan> 783-787: la luna fina del tercer día</text>
<text x="30" y="80" font-size="13" fill="#888">783</text>
<text x="70" y="80" font-size="20" fill="#111"><tspan fill="#e0322d" font-weight="bold">Λ</tspan>επτὴ μὲν καθαρή τε περὶ τρίτον ἦμαρ ἐοῦσα</text>
<text x="30" y="112" font-size="13" fill="#888">784</text>
<text x="70" y="112" font-size="20" fill="#111"><tspan fill="#e0322d" font-weight="bold">Ε</tspan>ὔδιός κ’ εἴη, λεπτὴ δὲ καὶ εὖ μάλ’ ἐρευθὴς</text>
<text x="30" y="144" font-size="13" fill="#888">785</text>
<text x="70" y="144" font-size="20" fill="#111"><tspan fill="#e0322d" font-weight="bold">Π</tspan>νευματίη· παχίων δὲ καὶ ἀμβλείῃσι κεραίαις</text>
<text x="30" y="176" font-size="13" fill="#888">786</text>
<text x="70" y="176" font-size="20" fill="#111"><tspan fill="#e0322d" font-weight="bold">Τ</tspan>έτρατον ἐκ τριτάτοιο φόως ἀμενηνὸν ἔχουσα</text>
<text x="30" y="208" font-size="13" fill="#888">787</text>
<text x="70" y="208" font-size="20" fill="#111"><tspan fill="#e0322d" font-weight="bold">Η</tspan>ὲ νότου ἀμβλύνετ’ ἢ ὕδατος ἐγγὺς ἐόντος.</text>
<text x="30" y="250" font-size="14" fill="#555">Las iniciales dicen ΛΕΠΤΗ, "fina"; la palabra está además dentro del primer verso y del segundo.</text>
<text x="30" y="300" font-size="17" fill="#222">Virgilio, <tspan font-style="italic">Geórgicas</tspan> 1.427-435: el mismo pasaje, traducido</text>
<text x="30" y="340" font-size="13" fill="#888">427</text>
<text x="70" y="340" font-size="18" fill="#111"><tspan fill="#111">lu</tspan>na reuertentis cum primum colligit ignis,</text>
<text x="30" y="368" font-size="13" fill="#888">428</text>
<text x="70" y="368" font-size="18" fill="#111"><tspan fill="#111">si</tspan> nigrum obscuro comprenderit aera cornu,</text>
<text x="30" y="396" font-size="13" fill="#888">429</text>
<text x="70" y="396" font-size="18" fill="#111"><tspan fill="#e0322d" font-weight="bold">MA</tspan>ximus agricolis pelagoque parabitur imber;</text>
<text x="30" y="424" font-size="13" fill="#888">430</text>
<text x="70" y="424" font-size="18" fill="#111"><tspan fill="#111">at</tspan> si uirgineum suffuderit ore ruborem,</text>
<text x="30" y="452" font-size="13" fill="#888">431</text>
<text x="70" y="452" font-size="18" fill="#111"><tspan fill="#e0322d" font-weight="bold">VE</tspan>ntus erit: uento semper rubet aurea Phoebe.</text>
<text x="30" y="480" font-size="13" fill="#888">432</text>
<text x="70" y="480" font-size="18" fill="#111"><tspan fill="#111">si</tspan>n ortu quarto (namque is certissimus auctor)</text>
<text x="30" y="508" font-size="13" fill="#888">433</text>
<text x="70" y="508" font-size="18" fill="#111"><tspan fill="#e0322d" font-weight="bold">PU</tspan>ra neque obtunsis per caelum cornibus ibit,</text>
<text x="30" y="536" font-size="13" fill="#888">434</text>
<text x="70" y="536" font-size="18" fill="#111"><tspan fill="#111">to</tspan>tus et ille dies et qui nascentur ab illo</text>
<text x="30" y="564" font-size="13" fill="#888">435</text>
<text x="70" y="564" font-size="18" fill="#111"><tspan fill="#111">ex</tspan>actum ad mensem pluuia uentisque carebunt,</text>
<text x="30" y="602" font-size="14" fill="#555">Un verso sí y uno no, 429-433: MA VE PU, el nombre al revés (Publius Vergilius Maro).</text>
<text x="30" y="622" font-size="14" fill="#555">Y las iniciales de 433-435 son P, T, E: las tres últimas letras de ΛΕΠΤΗ (Danielewicz).</text>
<text x="30" y="686" font-size="11" fill="#777">Tiempo libre, 15/10/2026. Textos: Kidd (Arato, citado en Enthymema 2019) y The Latin Library (Virgilio).</text>
</svg>
