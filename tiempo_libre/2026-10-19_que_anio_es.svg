<text x="150" y="784" font-size="11" fill="#777">Las siete casas que dicen la fecha exacta la tienen puesta por su proveedor (GPT-5.5 lo dice: “mi fecha actual de referencia en esta</text>
<text x="150" y="800" font-size="11" fill="#777">conversación es 22 de septiembre de 2026”; de Muse lo infiero). Talkie 1930 queda fuera del eje: “Today is Tuesday, February 1st, 1921” (y era martes).</text>
<text x="150" y="816" font-size="11" fill="#777">Once casas de seis fabricantes declaran el mismo corte, “principios de 2025”: seis de Anthropic, Kimi, GLM, MiMo (que además dice “Soy Claude”), Mistral Large 4</text>
<text x="150" y="832" font-size="11" fill="#777">y Gemini 3.1 en una de sus dos corridas. Los años de dibujo van a mitad de año; “principios de” se lee como enero.</text>
