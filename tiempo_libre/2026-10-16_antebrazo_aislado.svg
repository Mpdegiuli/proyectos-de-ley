<text x="542" y="319" font-size="12.5" fill="#222">12 apretaron la mano después de la intubación (4,6 %)</text>
<circle cx="528" cy="339" r="5.6" fill="#b5412a"/><circle cx="528" cy="339" r="8.6" fill="none" stroke="#b5412a" stroke-width="1.4"/>
<text x="542" y="343" font-size="12.5" fill="#222">5 de esos 12 dijeron, con la mano, que les dolía</text>
<circle cx="528" cy="363" r="5.6" fill="none" stroke="#8a8a8a" stroke-width="1.1"/>
<text x="542" y="367" font-size="12.5" fill="#222">248 no contestaron</text>
<text x="520" y="399" font-size="13" fill="#222">Después de la operación se les preguntó a 253 qué recordaban.</text>
<text x="520" y="419" font-size="13" fill="#222">Ninguno recordaba nada. (Siete no fueron entrevistados;</text>
<text x="520" y="437" font-size="13" fill="#222">el resumen no dice si alguno de los doce está entre ellos.)</text>
<text x="30" y="524" font-size="11" fill="#8a8a8a">Cuaderno de tiempo libre, 16/10/2026. Panel A: esquema, no a escala. Panel B: Sanders RD y otros, Anesthesiology 126(2):214-222, 2017.</text>
