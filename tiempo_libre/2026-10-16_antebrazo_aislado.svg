<text x="30" y="36" font-size="15" fill="#222">A. El antebrazo aislado (Tunstall, 1977)</text>
<rect x="40" y="300" width="420" height="10" fill="#8a8a8a"/>
<rect x="60" y="310" width="8" height="60" fill="#8a8a8a"/>
<rect x="420" y="310" width="8" height="60" fill="#8a8a8a"/>
<circle cx="95" cy="255" r="26" fill="#e9e4d8" stroke="#222" stroke-width="2"/>
<path d="M84 254 q6 4 12 0 M98 254 q6 4 12 0" stroke="#222" stroke-width="1.6" fill="none"/>
<path d="M122 240 h150 q20 0 30 12 l100 0 q12 0 12 12 l0 20 q0 16 -16 16 h-276 z" fill="#e9e4d8" stroke="#222" stroke-width="2"/>
<path d="M150 262 q-8 40 10 70 q14 24 46 30" stroke="#222" stroke-width="18" stroke-linecap="round" fill="#e9e4d8"/>
<path d="M150 262 q-8 40 10 70 q14 24 46 30" stroke="#e9e4d8" stroke-width="14" stroke-linecap="round" fill="none"/>
<rect x="131" y="282" width="38" height="18" rx="3" fill="#b5412a" transform="rotate(-6 150 291)"/>
<path d="M150 282 q-20 -40 20 -58 l60 0" stroke="#b5412a" stroke-width="1.6" fill="none"/>
<text x="236" y="228" font-size="12" fill="#b5412a">manguito inflado antes del relajante</text>
<g transform="translate(206 362)">
<ellipse cx="14" cy="0" rx="18" ry="13" fill="#e9e4d8" stroke="#222" stroke-width="2"/>
<rect x="0" y="-9" width="8" height="12" rx="3.5" fill="#e9e4d8" stroke="#222" stroke-width="1.6"/>
<rect x="10" y="-12" width="8" height="12" rx="3.5" fill="#e9e4d8" stroke="#222" stroke-width="1.6"/>
<rect x="20" y="-11" width="8" height="12" rx="3.5" fill="#e9e4d8" stroke="#222" stroke-width="1.6"/>
<rect x="29" y="-7" width="8" height="12" rx="3.5" fill="#e9e4d8" stroke="#222" stroke-width="1.6"/>
<path d="M-2 4 q10 10 24 8" stroke="#222" stroke-width="1.6" fill="none"/>
</g>
<path d="M80 150 h260 q10 0 10 10 v44 q0 10 -10 10 h-170 l-22 18 l4 -18 h-72 q-10 0 -10 -10 v-44 q0 -10 10 -10 z" fill="#fff" stroke="#2f5d8a" stroke-width="1.6"/>
<text x="96" y="176" font-size="14" fill="#2f5d8a">«Si me oís, apretame la mano.»</text>
<text x="96" y="198" font-size="12" fill="#8a8a8a">(el resto del cuerpo no puede moverse)</text>
<text x="40" y="468" font-size="12.5" fill="#222">El relajante muscular paraliza todo lo que la sangre alcanza. El manguito dejó un brazo sin circulación antes de la dosis.</text>
<text x="40" y="488" font-size="12.5" fill="#222">Ese brazo es el único que puede contestar. Si aprieta, hay alguien que oye. Lo que ese alguien recuerde después es otra cuenta.</text>
<text x="520" y="36" font-size="15" fill="#222">B. 260 pacientes (Sanders y otros, 2017)</text>
