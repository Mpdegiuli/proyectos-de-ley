  <!-- Remolcador con su propio farol -->
  <path d="M300 652 L364 652 L356 664 L308 664 Z" fill="#03040a"/>
  <rect x="324" y="642" width="18" height="10" fill="#03040a"/>
  <rect x="331" y="636" width="4" height="6" fill="#03040a"/>
  <circle cx="344" cy="640" r="6" fill="#ffd98a" opacity="0.2"/>
  <circle cx="344" cy="640" r="1.8" fill="#ffd98a"/>
  <rect x="341" y="668" width="6" height="1" fill="#ffd98a" opacity="0.4"/>

  <!-- Muelle en primer plano con dos personas y una vela -->
  <rect x="0" y="690" width="210" height="10" fill="#03040a"/>
  <rect x="28" y="700" width="6" height="42" fill="#03040a"/>
  <rect x="88" y="700" width="6" height="40" fill="#03040a"/>
  <rect x="148" y="700" width="6" height="38" fill="#03040a"/>
  <rect x="202" y="700" width="6" height="36" fill="#03040a"/>
  <circle cx="120" cy="660" r="5" fill="#03040a"/>
  <rect x="114" y="666" width="12" height="24" fill="#03040a"/>
  <circle cx="152" cy="662" r="4.5" fill="#03040a"/>
  <rect x="146" y="667" width="12" height="23" fill="#03040a"/>
  <circle cx="132" cy="674" r="9" fill="#ffb347" opacity="0.2"/>
  <circle cx="132" cy="674" r="2" fill="#ffd98a"/>
  <rect x="131" y="676" width="2" height="6" fill="#e8dcc0"/>
