    <rect x="606" y="552" width="28" height="2" opacity="0.7"/>
    <rect x="600" y="562" width="40" height="2" opacity="0.6"/>
    <rect x="609" y="574" width="22" height="2" opacity="0.6"/>
    <rect x="596" y="588" width="48" height="2" opacity="0.5"/>
    <rect x="604" y="604" width="32" height="2" opacity="0.45"/>
    <rect x="592" y="622" width="56" height="2" opacity="0.4"/>
    <rect x="606" y="642" width="30" height="2" opacity="0.35"/>
    <rect x="588" y="664" width="64" height="2" opacity="0.3"/>
    <rect x="600" y="690" width="40" height="2" opacity="0.25"/>
    <rect x="584" y="720" width="72" height="2" opacity="0.2"/>
    <rect x="596" y="755" width="48" height="2" opacity="0.15"/>
