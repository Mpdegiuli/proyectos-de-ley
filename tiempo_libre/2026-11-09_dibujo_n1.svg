<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>Nueva York, noche del 9 de noviembre de 1965: el Gran Apagón</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02030a"/>
      <stop offset="0.55" stop-color="#0a1024"/>
      <stop offset="1" stop-color="#1d2650"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8e6d8" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#b9bfd8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0a1024" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121a3a"/>
      <stop offset="1" stop-color="#03050c"/>
    </linearGradient>
  </defs>

