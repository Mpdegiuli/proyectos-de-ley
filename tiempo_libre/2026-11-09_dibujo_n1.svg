    <circle cx="400" cy="110" r="1.1"/><circle cx="440" cy="80" r="0.7"/><circle cx="470" cy="160" r="1"/>
    <circle cx="500" cy="30" r="1.2"/><circle cx="520" cy="120" r="0.8"/><circle cx="545" cy="60" r="0.9"/>
    <circle cx="700" cy="40" r="1"/><circle cx="740" cy="100" r="0.8"/><circle cx="770" cy="60" r="1.2"/>
    <circle cx="720" cy="180" r="0.7"/><circle cx="780" cy="150" r="0.9"/><circle cx="50" cy="200" r="0.9"/>
    <circle cx="100" cy="240" r="0.7"/><circle cx="140" cy="300" r="0.8"/><circle cx="190" cy="230" r="1"/>
    <circle cx="230" cy="190" r="0.7"/><circle cx="280" cy="260" r="0.9"/><circle cx="320" cy="300" r="0.7"/>
    <circle cx="360" cy="220" r="0.8"/><circle cx="480" cy="260" r="1"/><circle cx="520" cy="230" r="0.7"/>
    <circle cx="560" cy="280" r="0.8"/><circle cx="600" cy="250" r="0.6"/><circle cx="650" cy="300" r="0.9"/>
    <circle cx="690" cy="240" r="0.8"/><circle cx="740" cy="290" r="0.7"/><circle cx="770" cy="340" r="0.9"/>
    <circle cx="20" cy="340" r="0.7"/><circle cx="70" cy="370" r="0.8"/><circle cx="120" cy="400" r="0.6"/>
    <circle cx="300" cy="360" r="0.7"/><circle cx="340" cy="390" r="0.6"/><circle cx="470" cy="350" r="0.8"/>
    <circle cx="560" cy="360" r="0.6"/><circle cx="690" cy="380" r="0.7"/><circle cx="410" cy="20" r="0.7"/>
    <circle cx="620" cy="30" r="0.9"/><circle cx="660" cy="70" r="0.7"/><circle cx="180" cy="90" r="0.6"/>
