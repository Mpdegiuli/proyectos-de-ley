    <rect x="84" y="492" width="26" height="56"/>
    <rect x="114" y="402" width="36" height="146"/>
    <rect x="122" y="384" width="20" height="20"/>
    <rect x="154" y="460" width="42" height="88"/>
    <!-- Edificio Chrysler -->
    <rect x="200" y="345" width="60" height="203"/>
    <rect x="204" y="325" width="52" height="22"/>
    <rect x="210" y="305" width="40" height="22"/>
    <rect x="216" y="287" width="28" height="20"/>
    <rect x="221" y="271" width="18" height="18"/>
    <rect x="226" y="256" width="8" height="17"/>
    <line x1="230" y1="256" x2="230" y2="205" stroke="#05060d" stroke-width="2"/>
    <rect x="266" y="452" width="32" height="96"/>
    <rect x="302" y="412" width="38" height="136"/>
    <rect x="344" y="472" width="32" height="76"/>
    <!-- Empire State -->
    <rect x="380" y="445" width="80" height="103"/>
    <rect x="392" y="300" width="56" height="150"/>
    <rect x="404" y="232" width="32" height="72"/>
    <rect x="413" y="205" width="14" height="30"/>
    <line x1="420" y1="205" x2="420" y2="150" stroke="#05060d" stroke-width="3"/>
    <rect x="466" y="462" width="34" height="86"/>
    <rect x="504" y="422" width="42" height="126"/>
    <rect x="550" y="482" width="26" height="66"/>
    <rect x="580" y="442" width="40" height="106"/>
    <rect x="624" y="404" width="40" height="144"/>
    <rect x="668" y="470" width="32" height="78"/>
    <rect x="704" y="432" width="36" height="116"/>
    <rect x="744" y="462" width="56" height="86"/>
  </g>
  <!-- Arcos de la corona del Chrysler, apenas insinuados por la luna -->
  <g fill="none" stroke="#1a2140" stroke-width="1.2">
