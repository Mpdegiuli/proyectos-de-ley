    <rect x="66" y="500" width="3" height="4"/><rect x="130" y="430" width="3" height="4"/>
    <rect x="170" y="500" width="3" height="4"/><rect x="218" y="420" width="3" height="4"/>
    <rect x="240" y="470" width="3" height="4"/><rect x="290" y="500" width="3" height="4"/>
    <rect x="318" y="450" width="3" height="4"/><rect x="326" y="500" width="3" height="4"/>
    <rect x="410" y="350" width="3" height="4"/><rect x="426" y="400" width="3" height="4"/>
    <rect x="400" y="480" width="3" height="4"/><rect x="480" y="500" width="3" height="4"/>
    <rect x="520" y="460" width="3" height="4"/><rect x="530" y="510" width="3" height="4"/>
    <rect x="560" y="510" width="3" height="4"/><rect x="596" y="480" width="3" height="4"/>
    <rect x="640" y="440" width="3" height="4"/><rect x="650" y="500" width="3" height="4"/>
    <rect x="690" y="510" width="3" height="4"/><rect x="716" y="470" width="3" height="4"/>
