  <!-- Reflejos de velas -->
  <g fill="#f2a648" opacity="0.3">
    <rect x="57" y="560" width="5" height="1"/><rect x="239" y="565" width="5" height="1"/>
    <rect x="409" y="558" width="5" height="1"/><rect x="649" y="556" width="5" height="1"/>
    <rect x="119" y="552" width="8" height="1"/><rect x="469" y="552" width="8" height="1"/>
