    <circle cx="120" cy="541" r="1.5"/><circle cx="126" cy="541" r="1.5"/>
    <circle cx="300" cy="541" r="1.5"/><circle cx="306" cy="541" r="1.5"/>
    <circle cx="470" cy="541" r="1.5"/><circle cx="476" cy="541" r="1.5"/>
    <circle cx="700" cy="541" r="1.5"/><circle cx="706" cy="541" r="1.5"/>
  </g>
  <g fill="#ff5a3c">
    <circle cx="200" cy="541" r="1.3"/><circle cx="206" cy="541" r="1.3"/>
    <circle cx="560" cy="541" r="1.3"/><circle cx="566" cy="541" r="1.3"/>
  </g>

  <!-- East River -->
  <rect x="0" y="545" width="800" height="255" fill="url(#river)"/>
  <g stroke="#2b3670" stroke-width="1" opacity="0.6">
    <line x1="40" y1="575" x2="160" y2="575"/><line x1="220" y1="600" x2="330" y2="600"/>
    <line x1="420" y1="585" x2="540" y2="585"/><line x1="90" y1="630" x2="230" y2="630"/>
    <line x1="400" y1="655" x2="520" y2="655"/><line x1="680" y1="610" x2="790" y2="610"/>
    <line x1="260" y1="700" x2="420" y2="700"/><line x1="500" y1="730" x2="660" y2="730"/>
    <line x1="700" y1="680" x2="800" y2="680"/><line x1="300" y1="760" x2="470" y2="760"/>
