<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1120" width="1040" height="1120" role="img" aria-label="Las tres letras de Claudio hechas con tres operaciones de SVG">
<rect width="1040" height="1120" fill="#f6f2e9"/>
<defs><path id="A" d="M0,100 L30,0 L60,100 M11,64 H49"/><path id="C" d="M76,20 A42,50 0 1 0 76,80"/><path id="D" d="M0,0 V100 M0,0 H12 A46,50 0 0 1 12,100 H0"/><path id="E" d="M48,0 H0 V100 H48 M0,50 H38"/><path id="F" d="M48,0 H0 V100 M0,50 H38"/><path id="G" d="M76,20 A42,50 0 1 0 76,80 M76,80 V56 H56"/><path id="H" d="M0,0 V100 M56,0 V100 M0,50 H56"/><path id="I" d="M4,0 V100"/><path id="L" d="M0,0 V100 H44"/><path id="M" d="M0,100 V0 L36,72 L72,0 V100"/><path id="N" d="M0,100 V0 L56,100 V0"/><path id="O" d="M34,0 A34,50 0 1 0 34,100 A34,50 0 1 0 34,0"/><path id="P" d="M0,100 V0 H24 A25,25 0 0 1 24,50 H0"/><path id="Q" d="M34,0 A34,50 0 1 0 34,100 A34,50 0 1 0 34,0 M44,78 L70,106"/><path id="R" d="M0,100 V0 H24 A25,25 0 0 1 24,50 H0 M24,50 L54,100"/><path id="S" d="M48,16 C38,-5 2,-3 2,26 C2,50 50,48 50,76 C50,105 10,103 2,84"/><path id="T" d="M0,0 H58 M29,0 V100"/><path id="V" d="M0,0 L30,100 L60,0"/><clipPath id="mitad"><rect x="-10" y="-10" width="38" height="120"/></clipPath></defs>
<text x="40" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2b2a28" text-anchor="start" font-weight="bold">Tres letras, tres operaciones</text>
<text x="40" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#8a8478" text-anchor="start">Las letras que Claudio agregó al alfabeto (47/48–54), hechas con las de siempre y una operación de SVG cada una.</text>
<g transform="translate(70.0 105.0) scale(1)" fill="none" stroke="#2b2a28" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><use href="#F" x="0"/></g>
<g transform="translate(220.0 105.0) scale(1)" fill="none" stroke="#b23a2a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 0)" stroke="#b23a2a"><use href="#F" transform="rotate(180 24 50)"/></g></g>
<path d="M148,155 H198" stroke="#8a8478" stroke-width="2" fill="none"/><path d="M198,155 l-9,-5 v10 z" fill="#8a8478"/>
<text x="70" y="237" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#2b2a28" text-anchor="start">transform="rotate(180)"</text>
<text x="70" y="261" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#b23a2a" text-anchor="start" font-weight="bold">digamma inversum</text>
<text x="70" y="281" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#2b2a28" text-anchor="start">para la u consonante (VIR, ARVALES)</text>
<text x="70" y="301" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#8a8478" text-anchor="start" font-style="italic">en las piedras: 55 veces en 18 inscripciones</text>
<g transform="translate(400.0 105.0) scale(1)" fill="none" stroke="#2b2a28" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><use href="#C" x="0"/></g>
<g transform="translate(550.0 105.0) scale(1)" fill="none" stroke="#b23a2a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 0)" stroke="#b23a2a"><use href="#C" transform="translate(74 0) scale(-1 1)"/></g></g>
<path d="M478,155 H528" stroke="#8a8478" stroke-width="2" fill="none"/><path d="M528,155 l-9,-5 v10 z" fill="#8a8478"/>
<text x="400" y="237" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#2b2a28" text-anchor="start">transform="scale(-1,1)"</text>
<text x="400" y="261" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#b23a2a" text-anchor="start" font-weight="bold">antisigma</text>
<text x="400" y="281" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#2b2a28" text-anchor="start">para bs y ps, como la psi griega</text>
<text x="400" y="301" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#8a8478" text-anchor="start" font-style="italic">en las piedras: ninguna vez</text>
<g transform="translate(730.0 105.0) scale(1)" fill="none" stroke="#2b2a28" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><use href="#H" x="0"/></g>
<g transform="translate(880.0 105.0) scale(1)" fill="none" stroke="#b23a2a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 0)" stroke="#b23a2a"><use href="#H" clip-path="url(#mitad)"/></g></g>
<path d="M808,155 H858" stroke="#8a8478" stroke-width="2" fill="none"/><path d="M858,155 l-9,-5 v10 z" fill="#8a8478"/>
<text x="730" y="237" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#2b2a28" text-anchor="start">clip-path (la mitad izquierda)</text>
<text x="730" y="261" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#b23a2a" text-anchor="start" font-weight="bold">media H</text>
<text x="730" y="281" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#2b2a28" text-anchor="start">para la ípsilon griega (y)</text>
<text x="730" y="301" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#8a8478" text-anchor="start" font-style="italic">en las piedras: 12 ejemplos seguros</text>
<line x1="40" y1="325" x2="1000" y2="325" stroke="#8a8478" stroke-width="0.8"/>
<text x="40" y="356" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#2b2a28" text-anchor="start" font-weight="bold">Lo que está grabado</text>
<g transform="translate(40.0 380.0) scale(0.44)" fill="none" stroke="#2b2a28" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><use href="#A" x="0"/><use href="#M" x="77"/><use href="#P" x="166"/><use href="#L" x="233"/><use href="#I" x="294"/><use href="#A" x="319"/><g transform="translate(396 0)" stroke="#b23a2a"><use href="#F" transform="rotate(180 24 50)"/></g><use href="#I" x="461"/><use href="#T" x="486"/><use href="#T" x="595"/><use href="#E" x="670"/><use href="#R" x="735"/><use href="#M" x="806"/><use href="#I" x="895"/><use href="#N" x="920"/><use href="#A" x="993"/><g transform="translate(1070 0)" stroke="#b23a2a"><use href="#F" transform="rotate(180 24 50)"/></g><use href="#I" x="1135"/><use href="#T" x="1160"/><use href="#Q" x="1235"/></g>
<text x="635.32" y="400" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#2b2a28" text-anchor="start">cipos del pomerio de Roma, año 49</text>
<text x="635.32" y="418" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#8a8478" text-anchor="start">(CIL VI 1231)</text>
<g transform="translate(40.0 464.0) scale(0.4)" fill="none" stroke="#2b2a28" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 0)" stroke="#b23a2a"><use href="#F" transform="rotate(180 24 50)"/></g><use href="#O" x="65"/><g transform="translate(150 0)" stroke="#b23a2a"><use href="#F" transform="rotate(180 24 50)"/></g><use href="#E" x="215"/><use href="#M" x="280"/><use href="#V" x="369"/><use href="#S" x="446"/><use href="#V" x="583"/><use href="#O" x="660"/><g transform="translate(745 0)" stroke="#b23a2a"><use href="#F" transform="rotate(180 24 50)"/></g><use href="#I" x="810"/><use href="#M" x="835"/><use href="#V" x="924"/><use href="#S" x="1001"/><use href="#V" x="1138"/><use href="#O" x="1215"/><use href="#V" x="1300"/><use href="#I" x="1377"/><use href="#M" x="1402"/><use href="#V" x="1491"/><use href="#S" x="1568"/></g>
<text x="710.0" y="484" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#2b2a28" text-anchor="start">actas de los hermanos Arvales:</text>
<text x="710.0" y="502" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#8a8478" text-anchor="start">tres grafías en una piedra (CIL VI 2034)</text>
<g transform="translate(40.0 548.0) scale(0.44)" fill="none" stroke="#2b2a28" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><use href="#A" x="0"/><use href="#E" x="77"/><use href="#G" x="142"/><g transform="translate(235 0)" stroke="#b23a2a"><use href="#H" clip-path="url(#mitad)"/></g><use href="#P" x="280"/><use href="#T" x="347"/><use href="#I" x="422"/></g>
<text x="251.2" y="568" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#2b2a28" text-anchor="start">dedicatoria del prefecto de Egipto, 47-48 (CIL VI 918)</text>
<text x="251.2" y="586" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#8a8478" text-anchor="start">la media H solo aparece en palabras griegas con ípsilon</text>
<line x1="40" y1="626" x2="1000" y2="626" stroke="#8a8478" stroke-width="0.8"/>
<text x="40" y="658" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#2b2a28" text-anchor="start" font-weight="bold">Lo que no está grabado</text>
<text x="40" y="680" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#8a8478" text-anchor="start">El discurso de Claudio del año 48 en el bronce de Lyon, y el mismo renglón con sus letras (reconstrucción mía).</text>
<g transform="translate(40.0 704.0) scale(0.36)" fill="none" stroke="#2b2a28" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><use href="#Q" x="0"/><use href="#V" x="85"/><use href="#A" x="162"/><use href="#S" x="239"/><use href="#I" x="308"/><use href="#N" x="367"/><use href="#O" x="440"/><use href="#V" x="525"/><use href="#A" x="602"/><use href="#M" x="679"/><use href="#I" x="802"/><use href="#S" x="827"/><use href="#T" x="896"/><use href="#A" x="971"/><use href="#M" x="1048"/><use href="#R" x="1171"/><use href="#E" x="1242"/><use href="#M" x="1307"/><use href="#I" x="1430"/><use href="#N" x="1455"/><use href="#T" x="1528"/><use href="#R" x="1603"/><use href="#O" x="1674"/><use href="#D" x="1759"/><use href="#V" x="1834"/><use href="#C" x="1911"/><use href="#I" x="2002"/></g>
<text x="785.6" y="727" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#2b2a28" text-anchor="start">así está en el bronce</text>
<rect x="28" y="762" width="743.28" height="60" fill="none" stroke="#8a8478" stroke-width="1" stroke-dasharray="5 4"/>
<g transform="translate(40.0 774.0) scale(0.36)" fill="none" stroke="#2b2a28" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><use href="#Q" x="0"/><use href="#V" x="85"/><use href="#A" x="162"/><use href="#S" x="239"/><use href="#I" x="308"/><use href="#N" x="367"/><use href="#O" x="440"/><g transform="translate(525 0)" stroke="#b23a2a"><use href="#F" transform="rotate(180 24 50)"/></g><use href="#A" x="590"/><use href="#M" x="667"/><use href="#I" x="790"/><use href="#S" x="815"/><use href="#T" x="884"/><use href="#A" x="959"/><use href="#M" x="1036"/><use href="#R" x="1159"/><use href="#E" x="1230"/><use href="#M" x="1295"/><use href="#I" x="1418"/><use href="#N" x="1443"/><use href="#T" x="1516"/><use href="#R" x="1591"/><use href="#O" x="1662"/><use href="#D" x="1747"/><use href="#V" x="1822"/><use href="#C" x="1899"/><use href="#I" x="1990"/></g>
<text x="781.28" y="797" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#b23a2a" text-anchor="start">así no está en ningún lado</text>
<g transform="translate(40.0 858.0) scale(0.4)" fill="none" stroke="#2b2a28" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"><use href="#I" x="0"/><use href="#P" x="25"/><use href="#S" x="92"/><use href="#I" x="161"/><use href="#V" x="186"/><use href="#S" x="263"/></g>
<path d="M184.0,878 h40" stroke="#8a8478" stroke-width="2"/><path d="M224.0,878 l-9,-5 v10 z" fill="#8a8478"/>
<rect x="232.0" y="846" width="132.0" height="64" fill="none" stroke="#8a8478" stroke-width="1" stroke-dasharray="5 4"/>
<g transform="translate(244.0 858.0) scale(0.4)" fill="none" stroke="#2b2a28" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"><use href="#I" x="0"/><g transform="translate(25 0)" stroke="#b23a2a"><use href="#C" transform="translate(74 0) scale(-1 1)"/></g><use href="#I" x="116"/><use href="#V" x="141"/><use href="#S" x="218"/></g>
<text x="382.0" y="874" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#2b2a28" text-anchor="start">conjetura: si el antisigma era una C al revés y valía dentro de palabra.</text>
<g transform="translate(382.0 883.0) scale(0.13)" fill="none" stroke="#8a8478" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 0)" stroke="#8a8478"><use href="#C" transform="translate(74 0) scale(-1 1)"/></g><use href="#L" x="125"/></g>
<text x="411.97" y="895" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#8a8478" text-anchor="start">ya estaba en las piedras con otro oficio: «liberto de una mujer».</text>
<line x1="40" y1="934" x2="1000" y2="934" stroke="#8a8478" stroke-width="0.8"/>
<text x="40" y="958" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#2b2a28" text-anchor="start" font-weight="bold">Cuánta falta hacían (por cada mil letras de latín corrido)</text>
<text x="230" y="993" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#2b2a28" text-anchor="end">u consonante</text>
<rect x="244" y="980" width="593.4" height="16" fill="#b23a2a"/>
<text x="845.4" y="993" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#2b2a28" text-anchor="start">12,9 ‰</text>
<text x="230" y="1019" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#2b2a28" text-anchor="end">x, que ya tenía letra</text>
<rect x="244" y="1006" width="225.4" height="16" fill="#2b2a28"/>
<text x="477.4" y="1019" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#2b2a28" text-anchor="start">4,9 ‰</text>
<text x="230" y="1045" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#2b2a28" text-anchor="end">ps + bs</text>
<rect x="244" y="1032" width="64.4" height="16" fill="#b23a2a"/>
<text x="316.4" y="1045" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#2b2a28" text-anchor="start">1,4 ‰</text>
<text x="230" y="1071" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#2b2a28" text-anchor="end">y griega</text>
<rect x="244" y="1058" width="16.6" height="16" fill="#b23a2a"/>
<text x="268.56" y="1071" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#2b2a28" text-anchor="start">0,4 ‰</text>
<text x="40" y="1102" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#8a8478" text-anchor="start">Anales de Tácito, unas 559.000 letras, copia de The Latin Library (letras.py). En el discurso de Lyon, 3.858 letras: 50, 4 y ninguna.</text>
</svg>