<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>停电</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03050c"/>
      <stop offset="0.55" stop-color="#0a0f24"/>
      <stop offset="1" stop-color="#1a2250"/>
    </linearGradient>
    <radialGradient id="moonglow">
      <stop offset="0" stop-color="#d9d7c2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d9d7c2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="candleglow">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="phoneglow">
      <stop offset="0" stop-color="#8fc1ff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8fc1ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sparkglow">
      <stop offset="0" stop-color="#bfe7ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#bfe7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spill">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="640" y1="661" x2="280" y2="745">
      <stop offset="0" stop-color="#fff3d0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff3d0" stop-opacity="0.06"/>
