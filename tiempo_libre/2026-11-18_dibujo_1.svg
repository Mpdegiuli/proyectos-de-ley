<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" width="400" height="330">
  <defs>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3d3d"/>
      <stop offset="1" stop-color="#161616"/>
    </linearGradient>
    <linearGradient id="tubo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#222"/>
    </linearGradient>
  </defs>

  <!-- sombra en el piso -->
  <ellipse cx="200" cy="300" rx="150" ry="12" fill="#000" opacity="0.2"/>

  <!-- cable enrulado -->
  <path d="M78 245 Q60 252 70 264 Q82 276 64 286 Q48 296 60 308 Q72 318 55 326"
        fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- cuerpo del aparato -->
  <path d="M88 288 L70 182 Q70 152 100 152 L300 152 Q330 152 330 182 L312 288 Z"
        fill="url(#cuerpo)" stroke="#0e0e0e" stroke-width="3"/>

  <!-- horquilla (soporte del tubo) -->
  <rect x="108" y="128" width="32" height="32" rx="7" fill="#2a2a2a" stroke="#0e0e0e" stroke-width="2"/>
  <rect x="260" y="128" width="32" height="32" rx="7" fill="#2a2a2a" stroke="#0e0e0e" stroke-width="2"/>

  <!-- tubo (auricular + micrófono) -->
  <path d="M85 110 Q200 55 315 110 L300 134 Q200 92 100 134 Z"
        fill="url(#tubo)" stroke="#0e0e0e" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="94" cy="122" rx="33" ry="21" fill="#333" stroke="#0e0e0e" stroke-width="3"/>
  <ellipse cx="306" cy="122" rx="33" ry="21" fill="#333" stroke="#0e0e0e" stroke-width="3"/>
  <!-- agujeritos del auricular -->
  <circle cx="94" cy="122" r="3" fill="#0e0e0e"/>
  <circle cx="84" cy="116" r="2.5" fill="#0e0e0e"/>
  <circle cx="104" cy="116" r="2.5" fill="#0e0e0e"/>
  <circle cx="84" cy="128" r="2.5" fill="#0e0e0e"/>
  <circle cx="104" cy="128" r="2.5" fill="#0e0e0e"/>
  <!-- agujeritos del micrófono -->
  <circle cx="306" cy="122" r="3" fill="#0e0e0e"/>
  <circle cx="296" cy="116" r="2.5" fill="#0e0e0e"/>
  <circle cx="316" cy="116" r="2.5" fill="#0e0e0e"/>
  <circle cx="296" cy="128" r="2.5" fill="#0e0e0e"/>
  <circle cx="316" cy="128" r="2.5" fill="#0e0e0e"/>

  <!-- disco de marcar -->
  <circle cx="200" cy="215" r="54" fill="#e9e5d9" stroke="#0e0e0e" stroke-width="3"/>
  <circle cx="200" cy="215" r="18" fill="#cfc9b8" stroke="#0e0e0e" stroke-width="2"/>

  <!-- agujeros con números -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#111" text-anchor="middle">
    <circle cx="218" cy="183.8" r="7.5" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="218" y="187">1</text>
    <circle cx="200" cy="179" r="7.5" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="200" y="182.2">2</text>
    <circle cx="182" cy="183.8" r="7.5" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="182" y="187">3</text>
    <circle cx="168.8" cy="197" r="7.5" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="168.8" y="200.2">4</text>
    <circle cx="164" cy="215" r="7.5" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="164" y="218.2">5</text>
    <circle cx="168.8" cy="233" r="7.5" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="168.8" y="236.2">6</text>
    <circle cx="182" cy="246.2" r="7.5" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="182" y="249.4">7</text>
    <circle cx="200" cy="251" r="7.5" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="200" y="254.2">8</text>
    <circle cx="218" cy="246.2" r="7.5" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="218" y="249.4">9</text>
    <circle cx="231.2" cy="233" r="7.5" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="231.2" y="236.2">0</text>
  </g>

  <!-- tope para el dedo -->
  <path d="M238 207 L252 203 L254 212 L240 216 Z" fill="#8a8a8a" stroke="#0e0e0e" stroke-width="1.5"/>

  <!-- placa con el número de abonado -->
  <rect x="172" y="268" width="56" height="12" rx="2" fill="#f4f1e8" stroke="#0e0e0e" stroke-width="1"/>
  <text x="200" y="277" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#333" text-anchor="middle">47-2318</text>
</svg>
