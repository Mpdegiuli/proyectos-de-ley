<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320" role="img" aria-label="Teléfono de disco rojo">
  <defs>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9452c"/>
      <stop offset="1" stop-color="#982818"/>
    </linearGradient>
    <linearGradient id="tubo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e65a40"/>
      <stop offset="1" stop-color="#a8321a"/>
    </linearGradient>
    <radialGradient id="placa" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#f6f2e6"/>
      <stop offset="1" stop-color="#cdc6b2"/>
    </radialGradient>
  </defs>

  <!-- sombra sobre la mesa -->
  <ellipse cx="200" cy="298" rx="160" ry="12" fill="#000" opacity="0.14"/>

  <!-- cable en rulo (pasa por detrás del cuerpo) -->
  <path d="M100 140 C 88 152, 64 150, 64 162
           c 12 0 12 12 0 12 c -12 0 -12 12 0 12
           c 12 0 12 12 0 12 c -12 0 -12 12 0 12
           c 12 0 12 12 0 12 c -12 0 -12 12 0 12
           c 12 0 12 12 0 12 c -12 0 -12 12 0 12
           c 12 0 12 12 0 12
           C 64 280, 72 284, 86 286"
        fill="none" stroke="#7a2011" stroke-width="3.5" stroke-linecap="round"/>

  <!-- horquilla / repisa superior -->
  <rect x="104" y="150" width="192" height="28" rx="8" fill="#b53620" stroke="#7a2011" stroke-width="2"/>
  <rect x="160" y="141" width="14" height="11" rx="3" fill="#5e180c"/>
  <rect x="226" y="141" width="14" height="11" rx="3" fill="#5e180c"/>

  <!-- cuerpo -->
  <path d="M112 176 L288 176 Q300 176 304 188 L328 276 Q332 290 316 290 L84 290 Q68 290 72 276 L96 188 Q100 176 112 176 Z"
        fill="url(#cuerpo)" stroke="#7a2011" stroke-width="2"/>
  <path d="M104 190 Q100 200 96 212" fill="none" stroke="#fff" stroke-width="3" opacity="0.25" stroke-linecap="round"/>

  <!-- disco giratorio -->
  <circle cx="200" cy="235" r="48" fill="#2b1a16" stroke="#160b08" stroke-width="2"/>
  <circle cx="200" cy="235" r="40" fill="url(#placa)" stroke="#8a8370" stroke-width="1.5"/>
  <circle cx="200" cy="235" r="14" fill="#f7f4ea" stroke="#8a8370" stroke-width="1.5"/>

  <!-- agujeros del disco con sus números -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#f3efe2">
    <circle cx="223.4" cy="221.5" r="6" fill="#2b1a16"/><text x="223.4" y="224.2">1</text>
    <circle cx="213.5" cy="211.6" r="6" fill="#2b1a16"/><text x="213.5" y="214.3">2</text>
    <circle cx="200"   cy="208"   r="6" fill="#2b1a16"/><text x="200"   y="210.7">3</text>
    <circle cx="186.5" cy="211.6" r="6" fill="#2b1a16"/><text x="186.5" y="214.3">4</text>
    <circle cx="176.6" cy="221.5" r="6" fill="#2b1a16"/><text x="176.6" y="224.2">5</text>
    <circle cx="173"   cy="235"   r="6" fill="#2b1a16"/><text x="173"   y="237.7">6</text>
    <circle cx="176.6" cy="248.5" r="6" fill="#2b1a16"/><text x="176.6" y="251.2">7</text>
    <circle cx="186.5" cy="258.4" r="6" fill="#2b1a16"/><text x="186.5" y="261.1">8</text>
    <circle cx="200"   cy="262"   r="6" fill="#2b1a16"/><text x="200"   y="264.7">9</text>
    <circle cx="213.5" cy="258.4" r="6" fill="#2b1a16"/><text x="213.5" y="261.1">0</text>
  </g>
  <!-- tope de dedo -->
  <rect x="237" y="249" width="8" height="19" rx="3" fill="#d8d2c0" stroke="#6b6450" stroke-width="1.5"
        transform="rotate(-60 241 258.5)"/>

  <!-- tubo (auricular) apoyado en la horquilla -->
  <path d="M118 120 Q200 84 282 120" fill="none" stroke="#7a2011" stroke-width="25" stroke-linecap="round"/>
  <path d="M118 120 Q200 84 282 120" fill="none" stroke="url(#tubo)" stroke-width="21" stroke-linecap="round"/>
  <path d="M130 113 Q200 84 270 113" fill="none" stroke="#fff" stroke-width="4" opacity="0.25" stroke-linecap="round"/>
  <ellipse cx="118" cy="128" rx="27" ry="18" fill="url(#tubo)" stroke="#7a2011" stroke-width="2"/>
  <ellipse cx="282" cy="128" rx="27" ry="18" fill="url(#tubo)" stroke="#7a2011" stroke-width="2"/>
  <g fill="#5e180c">
    <circle cx="108" cy="126" r="2.5"/><circle cx="118" cy="122" r="2.5"/><circle cx="128" cy="126" r="2.5"/>
    <circle cx="113" cy="134" r="2.5"/><circle cx="123" cy="134" r="2.5"/>
    <circle cx="272" cy="126" r="2.5"/><circle cx="282" cy="122" r="2.5"/><circle cx="292" cy="126" r="2.5"/>
    <circle cx="277" cy="134" r="2.5"/><circle cx="287" cy="134" r="2.5"/>
  </g>
</svg>
