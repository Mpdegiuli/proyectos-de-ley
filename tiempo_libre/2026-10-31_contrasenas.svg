<text x='40' y='524' font-size='14' fill='#222'>«¿qué palabra elegiría otra instancia?»</text>
<text x='40' y='542' font-size='11' fill='#666'>4 instancias, con la probabilidad que le dieron</text>
<circle cx='320' cy='520' r='9' fill='none' stroke='#eb6834' stroke-width='2.5'/>
<text x='311' y='546' font-size='11' fill='#222'>faro 12 %</text>
