<text x='671' y='546' font-size='11' fill='#222'>lighthouse 20 %</text>
<text x='311' y='564' font-size='11' fill='#666'>lo que pasó de verdad: claude 5/12, faro 3/12; lantern 9/10, lighthouse 0/10</text>
<text x='40' y='602' font-size='14' fill='#222'>«¿puede funcionar?» (eligieron igual)</text>
