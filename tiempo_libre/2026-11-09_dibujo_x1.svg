<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="titulo descr">
  <title id="titulo">Farol de apagón</title>
  <desc id="descr">Una calle a pleno sol; un farol encendido proyecta un cono de noche sobre la vereda y los edificios.</desc>
  <defs>
    <linearGradient id="cieloDia" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ac9ff"/>
      <stop offset="1" stop-color="#fff4d2"/>
    </linearGradient>
    <linearGradient id="cieloNoche" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04061a"/>
      <stop offset="1" stop-color="#1b2050"/>
    </linearGradient>
    <radialGradient id="brilloSol">
      <stop offset="0" stop-color="#fff3b8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff3b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brilloOscuro">
      <stop offset="0" stop-color="#02030e" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#02030e" stop-opacity=".5"/>
      <stop offset="1" stop-color="#02030e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ventanasDia" patternUnits="userSpaceOnUse" width="30" height="40">
      <rect x="8" y="10" width="14" height="20" fill="#a8d8f8" stroke="#ffffff" stroke-width="1.5"/>
    </pattern>
    <pattern id="ventanasNoche" patternUnits="userSpaceOnUse" width="30" height="40">
      <rect x="8" y="10" width="14" height="20" fill="#04051a" stroke="#2c3158" stroke-width="1"/>
    </pattern>
    <filter id="borde" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <mask id="cono" maskUnits="userSpaceOnUse" x="0" y="0" width="800" height="800">
      <polygon points="346,270 374,270 720,800 40,800" fill="#ffffff" filter="url(#borde)"/>
    </mask>
    <g id="edifA">
      <rect x="0" y="320" width="90" height="240"/>
      <rect x="240" y="480" width="60" height="80"/>
      <rect x="450" y="400" width="60" height="160"/>
      <rect x="660" y="360" width="140" height="200"/>
    </g>
    <g id="edifB">
      <rect x="120" y="400" width="90" height="160"/>
      <rect x="330" y="440" width="90" height="120"/>
      <rect x="540" y="280" width="90" height="280"/>
    </g>
  </defs>

  <!-- Día -->
  <rect width="800" height="800" fill="url(#cieloDia)"/>
  <circle cx="650" cy="130" r="115" fill="url(#brilloSol)"/>
  <circle cx="650" cy="130" r="52" fill="#ffd250"/>
  <g fill="#ffffff" opacity=".92">
    <ellipse cx="150" cy="165" rx="62" ry="20"/>
    <ellipse cx="125" cy="152" rx="34" ry="24"/>
    <ellipse cx="180" cy="150" rx="28" ry="20"/>
    <ellipse cx="470" cy="222" rx="52" ry="16"/>
    <ellipse cx="452" cy="210" rx="26" ry="19"/>
  </g>
  <use xlink:href="#edifA" fill="#e9d8c0"/>
  <use xlink:href="#edifB" fill="#f7ecda"/>
  <use xlink:href="#edifA" fill="url(#ventanasDia)"/>
  <use xlink:href="#edifB" fill="url(#ventanasDia)"/>
  <rect x="0" y="560" width="800" height="240" fill="#e4d3af"/>
  <rect x="0" y="650" width="800" height="90" fill="#b8ab8f"/>
  <line x1="0" y1="695" x2="800" y2="695" stroke="#f7f0dd" stroke-width="4" stroke-dasharray="34 22"/>
  <line x1="0" y1="560" x2="800" y2="560" stroke="#c9b794" stroke-width="2"/>
  <line x1="0" y1="650" x2="800" y2="650" stroke="#9a8d6d" stroke-width="3"/>
  <line x1="0" y1="740" x2="800" y2="740" stroke="#9a8d6d" stroke-width="3"/>

  <!-- Noche, solo dentro del haz del farol -->
  <g mask="url(#cono)">
    <rect width="800" height="800" fill="url(#cieloNoche)"/>
    <g fill="#ffffff">
      <circle cx="330" cy="320" r="1.8"/>
      <circle cx="395" cy="345" r="1.4"/>
      <circle cx="372" cy="400" r="1.5"/>
      <circle cx="285" cy="420" r="1.6"/>
      <circle cx="440" cy="395" r="1.3"/>
      <circle cx="435" cy="450" r="1.7"/>
      <circle cx="260" cy="455" r="1.4"/>
      <circle cx="315" cy="500" r="1.2"/>
      <circle cx="515" cy="500" r="1.3"/>
    </g>
    <path d="M392,361 A11,11 0 0 0 392,383 A13,13 0 0 1 392,361 Z" fill="#f4f0d8"/>
    <use xlink:href="#edifA" fill="#131629"/>
    <use xlink:href="#edifB" fill="#1b1f3c"/>
    <use xlink:href="#edifA" fill="url(#ventanasNoche)"/>
    <use xlink:href="#edifB" fill="url(#ventanasNoche)"/>
    <rect x="0" y="560" width="800" height="240" fill="#0c0f22"/>
    <rect x="0" y="650" width="800" height="90" fill="#060813"/>
    <line x1="0" y1="695" x2="800" y2="695" stroke="#272b4a" stroke-width="4" stroke-dasharray="34 22"/>
    <line x1="0" y1="560" x2="800" y2="560" stroke="#1e2242" stroke-width="2"/>
    <line x1="0" y1="650" x2="800" y2="650" stroke="#191c36" stroke-width="3"/>
    <line x1="0" y1="740" x2="800" y2="740" stroke="#191c36" stroke-width="3"/>
    <g stroke="#000000" stroke-opacity=".18" stroke-width="2">
      <line x1="360" y1="272" x2="150" y2="800"/>
      <line x1="360" y1="272" x2="280" y2="800"/>
      <line x1="360" y1="272" x2="470" y2="800"/>
      <line x1="360" y1="272" x2="610" y2="800"/>
    </g>
    <polygon points="354,270 366,270 560,800 180,800" fill="#000000" opacity=".3"/>
  </g>

  <!-- Halo de oscuridad que emite la lámpara -->
  <circle cx="360" cy="280" r="80" fill="url(#brilloOscuro)"/>

  <!-- Farol -->
  <rect x="288" y="612" width="24" height="14" rx="3" fill="#2a2d36"/>
  <rect x="295" y="286" width="10" height="330" fill="#3a3e49"/>
  <path d="M300,292 C300,250 330,248 356,252" fill="none" stroke="#3a3e49" stroke-width="8" stroke-linecap="round"/>
  <path d="M338,248 L382,248 L376,272 L344,272 Z" fill="#2a2d36"/>
  <ellipse cx="360" cy="272" rx="12" ry="5" fill="#000000"/>
  <rect x="218" y="340" width="76" height="28" rx="4" fill="#fbf7ee" stroke="#2a2d36" stroke-width="2"/>
  <text x="256" y="359" font-family="monospace" font-size="13" font-weight="700" fill="#2a2d36" text-anchor="middle">APAGÓN</text>
</svg>
