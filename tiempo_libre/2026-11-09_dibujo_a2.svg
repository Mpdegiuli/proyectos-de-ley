<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03040a"/>
      <stop offset="0.55" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#1c2340"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0b10"/>
      <stop offset="1" stop-color="#030305"/>
    </linearGradient>
    <radialGradient id="candle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ff9a2e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff9a2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="315" y1="626" x2="740" y2="700">
      <stop offset="0" stop-color="#fff4d6" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#fff0c8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fff0c8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff1cc" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff1cc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="win" width="22" height="30" patternUnits="userSpaceOnUse">
      <rect x="6" y="7" width="10" height="15" fill="#0d1019"/>
    </pattern>
    <pattern id="win2" width="18" height="26" patternUnits="userSpaceOnUse">
      <rect x="5" y="6" width="8" height="12" fill="#111524"/>
    </pattern>
    <mask id="moonmask">
      <rect width="800" height="800" fill="white"/>
      <circle cx="658" cy="118" r="40" fill="black"/>
    </mask>
  </defs>

  <!-- sky -->
  <rect width="800" height="800" fill="url(#sky)"/>
  <ellipse cx="400" cy="180" rx="520" ry="70" fill="#ffffff" opacity="0.035" transform="rotate(-18 400 180)"/>

  <!-- stars, visible now that the city is dark -->
  <g fill="#ffffff">
    <circle cx="40" cy="60" r="1.3" opacity="0.9"/>
    <circle cx="95" cy="140" r="0.9" opacity="0.6"/>
    <circle cx="150" cy="45" r="1.1" opacity="0.8"/>
    <circle cx="210" cy="110" r="0.8" opacity="0.5"/>
    <circle cx="260" cy="30" r="1.4" opacity="0.9"/>
    <circle cx="300" cy="170" r="0.9" opacity="0.6"/>
    <circle cx="345" cy="80" r="1.2" opacity="0.85"/>
    <circle cx="410" cy="40" r="0.8" opacity="0.5"/>
    <circle cx="450" cy="150" r="1.1" opacity="0.7"/>
    <circle cx="500" cy="70" r="1.5" opacity="0.95"/>
    <circle cx="540" cy="200" r="0.8" opacity="0.5"/>
    <circle cx="590" cy="35" r="1.0" opacity="0.7"/>
    <circle cx="720" cy="60" r="1.2" opacity="0.8"/>
    <circle cx="760" cy="150" r="0.9" opacity="0.6"/>
    <circle cx="70" cy="230" r="1.0" opacity="0.6"/>
    <circle cx="180" cy="200" r="1.3" opacity="0.8"/>
    <circle cx="240" cy="250" r="0.8" opacity="0.5"/>
    <circle cx="330" cy="230" r="1.0" opacity="0.6"/>
    <circle cx="390" cy="190" r="0.7" opacity="0.45"/>
    <circle cx="470" cy="240" r="1.2" opacity="0.7"/>
    <circle cx="560" cy="270" r="0.8" opacity="0.5"/>
    <circle cx="620" cy="220" r="1.0" opacity="0.6"/>
    <circle cx="700" cy="250" r="1.3" opacity="0.75"/>
    <circle cx="770" cy="300" r="0.8" opacity="0.5"/>
    <circle cx="120" cy="300" r="0.9" opacity="0.5"/>
    <circle cx="30" cy="330" r="0.8" opacity="0.4"/>
    <circle cx="280" cy="320" r="0.8" opacity="0.4"/>
    <circle cx="430" cy="300" r="0.9" opacity="0.5"/>
    <circle cx="520" cy="330" r="0.7" opacity="0.4"/>
    <circle cx="680" cy="340" r="0.8" opacity="0.4"/>
    <circle cx="20" cy="120" r="0.7" opacity="0.5"/>
    <circle cx="130" cy="90" r="0.7" opacity="0.5"/>
    <circle cx="370" cy="130" r="0.7" opacity="0.5"/>
    <circle cx="610" cy="110" r="0.8" opacity="0.6"/>
    <circle cx="780" cy="20" r="1.0" opacity="0.7"/>
    <circle cx="480" cy="20" r="0.7" opacity="0.5"/>
    <circle cx="240" cy="160" r="0.7" opacity="0.4"/>
    <circle cx="640" cy="290" r="0.7" opacity="0.4"/>
  </g>

  <!-- crescent moon -->
  <circle cx="640" cy="130" r="80" fill="url(#moonglow)"/>
  <circle cx="640" cy="130" r="42" fill="#e9e5d6" mask="url(#moonmask)"/>

  <!-- power pole and sagging wires -->
  <line x1="50" y1="670" x2="50" y2="380" stroke="#0d0f16" stroke-width="8"/>
  <line x1="20" y1="400" x2="80" y2="400" stroke="#0d0f16" stroke-width="5"/>
  <line x1="24" y1="430" x2="76" y2="430" stroke="#0d0f16" stroke-width="5"/>
  <path d="M50 400 Q420 480 800 420" fill="none" stroke="#141720" stroke-width="1.5"/>
  <path d="M50 430 Q420 505 800 450" fill="none" stroke="#141720" stroke-width="1.5"/>

  <!-- back row of buildings -->
  <g fill="#0b0e18">
    <rect x="0" y="390" width="70" height="260"/>
    <rect x="62" y="330" width="52" height="320"/>
    <rect x="124" y="410" width="88" height="240"/>
    <rect x="206" y="290" width="62" height="360"/>
    <rect x="276" y="370" width="80" height="280"/>
    <rect x="364" y="262" width="68" height="390"/>
    <rect x="440" y="350" width="104" height="300"/>
    <rect x="552" y="400" width="58" height="250"/>
    <rect x="616" y="300" width="80" height="350"/>
    <rect x="704" y="380" width="96" height="270"/>
    <rect x="470" y="330" width="24" height="20"/>
    <rect x="474" y="322" width="16" height="8"/>
  </g>
  <line x1="398" y1="262" x2="398" y2="212" stroke="#0b0e18" stroke-width="2"/>
  <g fill="url(#win2)">
    <rect x="62" y="330" width="52" height="320"/>
    <rect x="206" y="290" width="62" height="360"/>
    <rect x="364" y="262" width="68" height="390"/>
    <rect x="440" y="350" width="104" height="300"/>
    <rect x="616" y="300" width="80" height="350"/>
    <rect x="704" y="380" width="96" height="270"/>
  </g>

  <!-- front row of buildings -->
  <g fill="#06070c">
    <rect x="20" y="470" width="130" height="200"/>
    <rect x="170" y="440" width="96" height="230"/>
    <rect x="290" y="490" width="150" height="180"/>
    <rect x="470" y="450" width="116" height="220"/>
    <rect x="610" y="480" width="136" height="190"/>
    <rect x="756" y="510" width="44" height="160"/>
  </g>
  <g fill="url(#win)">
    <rect x="20" y="470" width="130" height="200"/>
    <rect x="170" y="440" width="96" height="230"/>
    <rect x="290" y="490" width="150" height="180"/>
    <rect x="470" y="450" width="116" height="220"/>
    <rect x="610" y="480" width="136" height="190"/>
    <rect x="756" y="510" width="44" height="160"/>
  </g>

  <!-- ground / street -->
  <rect x="0" y="650" width="800" height="150" fill="url(#ground)"/>
  <line x1="0" y1="668" x2="800" y2="668" stroke="#15171f" stroke-width="2"/>
  <line x1="0" y1="740" x2="800" y2="740" stroke="#0f1117" stroke-width="2" stroke-dasharray="40 30"/>

  <!-- a few candlelit windows -->
  <g>
    <circle cx="77" cy="524" r="28" fill="url(#candle)"/>
    <rect x="72" y="517" width="10" height="15" fill="#f2a243"/>
    <circle cx="209" cy="494" r="28" fill="url(#candle)"/>
    <rect x="204" y="487" width="10" height="15" fill="#ffb558"/>
    <circle cx="341" cy="554" r="28" fill="url(#candle)"/>
    <rect x="336" y="547" width="10" height="15" fill="#e8923a"/>
    <circle cx="517" cy="494" r="28" fill="url(#candle)"/>
    <rect x="512" y="487" width="10" height="15" fill="#f5a742"/>
    <circle cx="561" cy="584" r="28" fill="url(#candle)"/>
    <rect x="556" y="577" width="10" height="15" fill="#ffb558"/>
    <circle cx="671" cy="584" r="28" fill="url(#candle)"/>
    <rect x="666" y="577" width="10" height="15" fill="#f2a243"/>
    <circle cx="657" cy="376" r="22" fill="url(#candle)"/>
    <rect x="653" y="370" width="8" height="12" fill="#e8923a"/>
  </g>

  <!-- dead streetlamp -->
  <line x1="130" y1="670" x2="130" y2="440" stroke="#14161e" stroke-width="7" stroke-linecap="round"/>
  <path d="M130 440 Q130 400 175 400" fill="none" stroke="#14161e" stroke-width="5" stroke-linecap="round"/>
  <rect x="165" y="392" width="36" height="16" rx="3" fill="#0e1016"/>
  <rect x="170" y="406" width="28" height="5" fill="#050508"/>

  <!-- dead traffic light -->
  <line x1="700" y1="670" x2="700" y2="540" stroke="#14161e" stroke-width="6"/>
  <rect x="686" y="470" width="28" height="72" rx="4" fill="#0f1118"/>
  <circle cx="700" cy="486" r="8" fill="#07080c" stroke="#1a1d26" stroke-width="1"/>
  <circle cx="700" cy="506" r="8" fill="#07080c" stroke="#1a1d26" stroke-width="1"/>
  <circle cx="700" cy="526" r="8" fill="#07080c" stroke="#1a1d26" stroke-width="1"/>

  <!-- flashlight beam and lit patch of road -->
  <polygon points="315,623 740,665 680,760 315,630" fill="url(#beam)"/>
  <ellipse cx="660" cy="712" rx="110" ry="26" fill="url(#spot)"/>

  <!-- lone figure with flashlight -->
  <g fill="#020203">
    <circle cx="272" cy="596" r="11"/>
    <path d="M258 612 L286 612 L290 650 L284 650 L283 672 L274 672 L272 652 L270 672 L261 672 L260 650 L254 650 Z"/>
    <path d="M284 618 L306 627 L304 633 L282 626 Z"/>
    <rect x="302" y="621" width="14" height="8" rx="2" transform="rotate(14 309 625)"/>
  </g>
</svg>
