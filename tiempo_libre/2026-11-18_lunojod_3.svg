<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="Lunojod 1 sobre la Luna">
  <defs>
    <radialGradient id="sky" cx="50%" cy="110%" r="95%">
      <stop offset="0" stop-color="#121a33"/>
      <stop offset="0.5" stop-color="#05070f"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a9a94"/>
      <stop offset="0.35" stop-color="#7c7c76"/>
      <stop offset="1" stop-color="#3f3f3c"/>
    </linearGradient>
    <radialGradient id="earth" cx="35%" cy="32%" r="75%">
      <stop offset="0" stop-color="#a9e2ff"/>
      <stop offset="0.55" stop-color="#2f7fd8"/>
      <stop offset="1" stop-color="#0a2a63"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e6e1"/>
      <stop offset="0.45" stop-color="#b3b3ae"/>
      <stop offset="1" stop-color="#6a6a66"/>
    </linearGradient>
    <linearGradient id="metalH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d8d88"/>
      <stop offset="0.5" stop-color="#dcdcd7"/>
      <stop offset="1" stop-color="#7f7f7a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#244a9a"/>
      <stop offset="1" stop-color="#0c1f4e"/>
    </linearGradient>
    <pattern id="cells" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(65)">
      <rect width="12" height="12" fill="none" stroke="#7fa8ff" stroke-width="0.9"/>
    </pattern>
    <pattern id="mesh" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0L4 4M4 0L0 4" stroke="#cfcfca" stroke-width="0.6"/>
    </pattern>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="earthClip"><circle cx="745" cy="105" r="46"/></clipPath>
    <g id="wheel">
      <circle r="24" fill="#34342f"/>
      <circle r="24" fill="url(#mesh)"/>
      <circle r="24" fill="none" stroke="#dededa" stroke-width="3"/>
      <circle r="17" fill="none" stroke="#b9b9b4" stroke-width="1.2"/>
      <g stroke="#e4e4df" stroke-width="2" stroke-linecap="round">
        <line x1="0" y1="-22" x2="0" y2="22"/>
        <line x1="-22" y1="0" x2="22" y2="0"/>
        <line x1="-15.5" y1="-15.5" x2="15.5" y2="15.5"/>
        <line x1="-15.5" y1="15.5" x2="15.5" y2="-15.5"/>
      </g>
      <g stroke="#f4f4f0" stroke-width="2.2">
        <line x1="0" y1="-27" x2="0" y2="-21" transform="rotate(15)"/>
        <line x1="0" y1="-27" x2="0" y2="-21" transform="rotate(45)"/>
        <line x1="0" y1="-27" x2="0" y2="-21" transform="rotate(75)"/>
        <line x1="0" y1="-27" x2="0" y2="-21" transform="rotate(105)"/>
        <line x1="0" y1="-27" x2="0" y2="-21" transform="rotate(135)"/>
        <line x1="0" y1="-27" x2="0" y2="-21" transform="rotate(165)"/>
        <line x1="0" y1="-27" x2="0" y2="-21" transform="rotate(195)"/>
        <line x1="0" y1="-27" x2="0" y2="-21" transform="rotate(225)"/>
        <line x1="0" y1="-27" x2="0" y2="-21" transform="rotate(255)"/>
        <line x1="0" y1="-27" x2="0" y2="-21" transform="rotate(285)"/>
        <line x1="0" y1="-27" x2="0" y2="-21" transform="rotate(315)"/>
        <line x1="0" y1="-27" x2="0" y2="-21" transform="rotate(345)"/>
      </g>
      <circle r="6.5" fill="#9a9a95" stroke="#f2f2ee" stroke-width="1.5"/>
      <circle r="2" fill="#44443f"/>
    </g>
  </defs>

  <!-- Cielo -->
  <rect width="900" height="560" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="40" cy="30" r="1.3"/><circle cx="95" cy="80" r="0.9"/><circle cx="150" cy="22" r="1.1"/>
    <circle cx="210" cy="120" r="0.8"/><circle cx="260" cy="60" r="1.4"/><circle cx="320" cy="150" r="0.9"/>
    <circle cx="380" cy="35" r="1"/><circle cx="430" cy="100" r="0.7"/><circle cx="480" cy="180" r="0.9"/>
    <circle cx="520" cy="55" r="1.3"/><circle cx="570" cy="140" r="0.8"/><circle cx="610" cy="25" r="1"/>
    <circle cx="660" cy="200" r="0.9"/><circle cx="700" cy="50" r="0.8"/><circle cx="820" cy="40" r="1.2"/>
    <circle cx="860" cy="120" r="0.9"/><circle cx="880" cy="210" r="0.8"/><circle cx="130" cy="200" r="0.9"/>
    <circle cx="70" cy="260" r="0.7"/><circle cx="240" cy="230" r="1"/><circle cx="350" cy="250" r="0.8"/>
    <circle cx="560" cy="240" r="0.7"/><circle cx="640" cy="290" r="0.9"/><circle cx="760" cy="260" r="1"/>
    <circle cx="830" cy="300" r="0.7"/><circle cx="20" cy="150" r="0.8"/><circle cx="180" cy="290" r="0.7"/>
    <circle cx="420" cy="220" r="1.1"/><circle cx="500" cy="300" r="0.6"/><circle cx="300" cy="300" r="0.6"/>
    <circle cx="730" cy="20" r="0.9"/><circle cx="890" cy="60" r="0.6"/><circle cx="600" cy="90" r="0.6"/>
    <circle cx="460" cy="20" r="0.7"/><circle cx="10" cy="320" r="0.5"/><circle cx="110" cy="130" r="0.6"/>
    <circle cx="590" cy="310" r="0.6"/><circle cx="800" cy="180" r="0.7"/><circle cx="360" cy="90" r="0.6"/>
  </g>
  <g stroke="#fff" stroke-width="0.8" opacity="0.8">
    <path d="M260 52 v16 M252 60 h16"/>
    <path d="M520 48 v14 M513 55 h14"/>
  </g>

  <!-- Tierra -->
  <circle cx="745" cy="105" r="49" fill="none" stroke="#7cc4ff" stroke-width="2" opacity="0.3"/>
  <circle cx="745" cy="105" r="46" fill="url(#earth)"/>
  <g clip-path="url(#earthClip)">
    <path d="M712 92 c10 -12 28 -10 36 -2 c6 7 2 16 -8 18 c-10 2 -14 10 -24 6 c-8 -4 -10 -14 -4 -22z" fill="#2f8f46" opacity="0.85"/>
    <path d="M740 120 c8 -4 18 2 20 10 c2 8 -8 12 -16 8 c-6 -3 -8 -12 -4 -18z" fill="#2f8f46" opacity="0.85"/>
    <ellipse cx="745" cy="64" rx="16" ry="4.5" fill="#fff" opacity="0.8"/>
    <path d="M705 110 q14 -6 28 2 q12 6 26 0" stroke="#fff" stroke-width="4" fill="none" opacity="0.55" stroke-linecap="round"/>
    <path d="M715 134 q12 -5 24 1 q10 5 22 -1" stroke="#fff" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M745 59 A46 46 0 0 1 745 151 A26 46 0 0 0 745 59 Z" fill="#000" opacity="0.62"/>
  </g>

  <!-- Horizonte lejano -->
  <path d="M0 332 Q90 318 190 329 T400 322 T620 331 T820 320 L900 326 L900 345 L0 345 Z" fill="#787872"/>
  <!-- Suelo lunar -->
  <rect x="0" y="336" width="900" height="224" fill="url(#ground)"/>
  <g fill="#5e5e59" opacity="0.45">
    <ellipse cx="60" cy="380" rx="6" ry="1.5"/><ellipse cx="420" cy="470" rx="9" ry="2"/>
    <ellipse cx="700" cy="520" rx="7" ry="1.8"/><ellipse cx="250" cy="395" rx="5" ry="1.2"/>
    <ellipse cx="840" cy="470" rx="10" ry="2.2"/><ellipse cx="520" cy="420" rx="6" ry="1.5"/>
    <ellipse cx="880" cy="540" rx="8" ry="2"/><ellipse cx="30" cy="500" rx="7" ry="1.6"/>
  </g>
  <g fill="#b2b2ac" opacity="0.5">
    <ellipse cx="90" cy="372" rx="5" ry="1.2"/><ellipse cx="460" cy="455" rx="7" ry="1.5"/>
    <ellipse cx="620" cy="540" rx="6" ry="1.4"/><ellipse cx="300" cy="480" rx="4" ry="1"/>
    <ellipse cx="780" cy="360" rx="5" ry="1.1"/>
  </g>

  <!-- Cráteres -->
  <g>
    <ellipse cx="150" cy="445" rx="85" ry="22" fill="#a4a49e"/>
    <ellipse cx="150" cy="448" rx="74" ry="16" fill="#4c4c48"/>
    <ellipse cx="150" cy="453" rx="58" ry="9" fill="#6b6b66"/>
    <path d="M68 442 Q150 418 232 442" stroke="#c7c7c2" stroke-width="3" fill="none" opacity="0.7"/>
  </g>
  <g>
    <ellipse cx="770" cy="432" rx="62" ry="15" fill="#a0a09a"/>
    <ellipse cx="770" cy="434" rx="53" ry="11" fill="#4c4c48"/>
    <ellipse cx="770" cy="437" rx="40" ry="6" fill="#696964"/>
    <path d="M712 430 Q770 414 828 430" stroke="#c7c7c2" stroke-width="2.5" fill="none" opacity="0.7"/>
  </g>
  <g>
    <ellipse cx="560" cy="507" rx="42" ry="10" fill="#9e9e98"/>
    <ellipse cx="560" cy="509" rx="35" ry="7" fill="#4a4a46"/>
    <ellipse cx="560" cy="511" rx="25" ry="4" fill="#67675f"/>
  </g>
  <g>
    <ellipse cx="330" cy="532" rx="30" ry="7.5" fill="#9e9e98"/>
    <ellipse cx="330" cy="534" rx="24" ry="5" fill="#4a4a46"/>
  </g>
  <g>
    <ellipse cx="660" cy="382" rx="19" ry="4.5" fill="#9e9e98"/>
    <ellipse cx="660" cy="383" rx="15" ry="3" fill="#505049"/>
  </g>
  <!-- Rocas -->
  <g stroke="#2e2e2b" stroke-width="1">
    <polygon points="610,452 626,446 640,452 636,462 614,462" fill="#8c8c86"/>
    <polygon points="614,462 636,462 640,452 644,463 612,466" fill="#50504b"/>
    <polygon points="250,470 262,463 272,470 268,477 252,477" fill="#8c8c86"/>
    <polygon points="840,500 858,492 876,502 870,512 844,512" fill="#8c8c86"/>
    <polygon points="844,512 870,512 876,502 880,514 842,516" fill="#50504b"/>
    <polygon points="60,420 70,414 78,420 74,426 62,426" fill="#8c8c86"/>
  </g>

  <!-- Huellas -->
  <path d="M40 336 C140 340 255 345 380 352" stroke="#4e4e49" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M40 336 C140 340 255 345 380 352" stroke="#8f8f89" stroke-width="4" fill="none" stroke-dasharray="2.5 4.5"/>
  <path d="M40 340 C130 346 250 352 372 360" stroke="#4e4e49" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M40 340 C130 346 250 352 372 360" stroke="#8f8f89" stroke-width="5" fill="none" stroke-dasharray="3 5"/>

  <!-- Lunojod 1 -->
  <g transform="translate(470 360) scale(0.85)">
    <ellipse cx="-10" cy="3" rx="200" ry="13" fill="url(#shadow)"/>

    <!-- Ruedas lado lejano -->
    <g opacity="0.72">
      <use xlink:href="#wheel" href="#wheel" x="-92" y="-32"/>
      <use xlink:href="#wheel" href="#wheel" x="-25" y="-32"/>
      <use xlink:href="#wheel" href="#wheel" x="41" y="-32"/>
      <use xlink:href="#wheel" href="#wheel" x="108" y="-32"/>
    </g>
    <rect x="-114" y="-54" width="228" height="12" fill="#2b2b28"/>

    <!-- Tapa abierta con celdas solares -->
    <polygon points="-132,-100 -216,-281 -193,-292 -109,-111" fill="url(#panel)" stroke="#2b2b28" stroke-width="1.5"/>
    <polygon points="-132,-100 -216,-281 -193,-292 -109,-111" fill="url(#cells)"/>
    <line x1="-132" y1="-100" x2="-216" y2="-281" stroke="#d8d8d3" stroke-width="5" stroke-linecap="round"/>
    <line x1="-70" y1="-100" x2="-142" y2="-184" stroke="#b8b8b3" stroke-width="3"/>
    <circle cx="-132" cy="-100" r="4.5" fill="#8a8a85" stroke="#3a3a37" stroke-width="1"/>
    <circle cx="-142" cy="-184" r="3" fill="#8a8a85"/>

    <!-- Calentador de radioisótopos (atrás) -->
    <rect x="-156" y="-94" width="24" height="36" rx="5" fill="url(#metal)" stroke="#3a3a37" stroke-width="1.5"/>
    <path d="M-152 -86 h16 M-152 -78 h16 M-152 -70 h16" stroke="#55554f" stroke-width="1"/>

    <!-- Cuerpo tipo bañera -->
    <path d="M-134 -100 L134 -100 L121 -50 Q119 -44 112 -44 L-112 -44 Q-119 -44 -121 -50 Z" fill="url(#metal)" stroke="#3a3a37" stroke-width="2"/>
    <rect x="-138" y="-106" width="276" height="9" rx="3" fill="url(#metalH)" stroke="#3a3a37" stroke-width="1.5"/>
    <line x1="-126" y1="-74" x2="126" y2="-74" stroke="#55554f" stroke-width="1"/>
    <line x1="-120" y1="-60" x2="120" y2="-60" stroke="#f0f0ec" stroke-width="1.5" stroke-dasharray="1.5 10"/>
    <line x1="-124" y1="-90" x2="124" y2="-90" stroke="#f0f0ec" stroke-width="1" stroke-dasharray="1.5 10" opacity="0.7"/>

    <!-- Banderín -->
    <rect x="-70" y="-92" width="30" height="15" fill="#c8102e" stroke="#7a0a1c" stroke-width="0.8"/>
    <text x="-55" y="-81" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" fill="#f6d64a" text-anchor="middle">СССР</text>

    <!-- Cámara panorámica lateral -->
    <rect x="30" y="-96" width="12" height="28" rx="6" fill="#4a4a46" stroke="#cfcfca" stroke-width="1"/>
    <circle cx="36" cy="-88" r="2.5" fill="#9fd3ff"/>

    <!-- Antena cónica -->
    <line x1="-20" y1="-106" x2="-20" y2="-152" stroke="#9a9a95" stroke-width="4"/>
    <polygon points="-26,-152 -14,-152 10,-204 -50,-204" fill="url(#metalH)" stroke="#3a3a37" stroke-width="1.5"/>
    <path d="M-20 -152 L-20 -200 M-16 -152 L0 -200 M-24 -152 L-40 -200" stroke="#6f6f6a" stroke-width="0.8"/>
    <ellipse cx="-20" cy="-204" rx="30" ry="5.5" fill="#c9c9c4" stroke="#3a3a37" stroke-width="1.5"/>
    <ellipse cx="-20" cy="-204" rx="22" ry="3.5" fill="#55554f"/>

    <!-- Antena helicoidal -->
    <rect x="74" y="-142" width="16" height="4" fill="#9a9a95"/>
    <line x1="82" y1="-106" x2="82" y2="-212" stroke="#8d8d88" stroke-width="2"/>
    <g fill="none" stroke="#e2e2dd" stroke-width="1.6">
      <ellipse cx="82" cy="-146" rx="9" ry="3.2"/><ellipse cx="82" cy="-154" rx="9" ry="3.2"/>
      <ellipse cx="82" cy="-162" rx="9" ry="3.2"/><ellipse cx="82" cy="-170" rx="9" ry="3.2"/>
      <ellipse cx="82" cy="-178" rx="9" ry="3.2"/><ellipse cx="82" cy="-186" rx="9" ry="3.2"/>
      <ellipse cx="82" cy="-194" rx="9" ry="3.2"/><ellipse cx="82" cy="-202" rx="9" ry="3.2"/>
    </g>
    <circle cx="82" cy="-214" r="3" fill="#e2e2dd"/>

    <!-- Cámaras de TV frontales -->
    <rect x="96" y="-132" width="40" height="27" rx="3" fill="url(#metal)" stroke="#3a3a37" stroke-width="1.5"/>
    <rect x="94" y="-136" width="44" height="5" fill="#55554f"/>
    <circle cx="107" cy="-118" r="5.5" fill="#1a1a1a" stroke="#dcdcd7" stroke-width="1.5"/>
    <circle cx="125" cy="-118" r="5.5" fill="#1a1a1a" stroke="#dcdcd7" stroke-width="1.5"/>
    <circle cx="105" cy="-120" r="1.5" fill="#fff" opacity="0.8"/>
    <circle cx="123" cy="-120" r="1.5" fill="#fff" opacity="0.8"/>

    <!-- Retrorreflector láser -->
    <polygon points="124,-96 142,-96 138,-72 120,-72" fill="#dcdcd7" stroke="#3a3a37" stroke-width="1.2"/>
    <path d="M127 -92 l11 0 l-5.5 7z M126 -83 l11 0 l-5.5 7z" fill="#8fb4ff" stroke="#3a3a37" stroke-width="0.6"/>

    <!-- Chasis y suspensión -->
    <rect x="-118" y="-50" width="236" height="6" fill="#8a8a85"/>
    <g stroke="#a3a39e" stroke-width="5" stroke-linecap="round">
      <line x1="-100" y1="-46" x2="-100" y2="-24"/>
      <line x1="-33" y1="-46" x2="-33" y2="-24"/>
      <line x1="33" y1="-46" x2="33" y2="-24"/>
      <line x1="100" y1="-46" x2="100" y2="-24"/>
    </g>

    <!-- Ruedas lado cercano -->
    <use xlink:href="#wheel" href="#wheel" x="-100" y="-24"/>
    <use xlink:href="#wheel" href="#wheel" x="-33" y="-24"/>
    <use xlink:href="#wheel" href="#wheel" x="33" y="-24"/>
    <use xlink:href="#wheel" href="#wheel" x="100" y="-24"/>

    <!-- Novena rueda (odómetro) -->
    <line x1="-120" y1="-48" x2="-166" y2="-16" stroke="#a3a39e" stroke-width="4" stroke-linecap="round"/>
    <g transform="translate(-170 -12) scale(0.5)"><use xlink:href="#wheel" href="#wheel"/></g>

    <!-- Penetrómetro -->
    <line x1="122" y1="-48" x2="156" y2="-20" stroke="#a3a39e" stroke-width="4" stroke-linecap="round"/>
    <rect x="148" y="-26" width="18" height="5" fill="#b3b3ae"/>
    <polygon points="150,-22 164,-22 157,0" fill="#6a6a66" stroke="#3a3a37" stroke-width="1"/>

    <!-- Polvo bajo las ruedas -->
    <g fill="#3c3c38" opacity="0.6">
      <ellipse cx="-100" cy="1" rx="26" ry="3"/><ellipse cx="-33" cy="1" rx="26" ry="3"/>
      <ellipse cx="33" cy="1" rx="26" ry="3"/><ellipse cx="100" cy="1" rx="26" ry="3"/>
    </g>
  </g>

  <text x="24" y="536" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#d8d8d3" opacity="0.85">Луноход-1 · Mare Imbrium · 1970</text>
</svg>
