<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Lunojod 1 sobre la Luna">
  <defs>
    <radialGradient id="sky" cx="0.72" cy="0.1" r="1.1">
      <stop offset="0" stop-color="#0d1226"/>
      <stop offset="1" stop-color="#000004"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d8d88"/>
      <stop offset="0.3" stop-color="#6e6e6a"/>
      <stop offset="1" stop-color="#3a3a38"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcdcd6"/>
      <stop offset="0.55" stop-color="#a8a8a3"/>
      <stop offset="1" stop-color="#666662"/>
    </linearGradient>
    <linearGradient id="sideShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.38"/>
      <stop offset="0.65" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lidBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecece6"/>
      <stop offset="1" stop-color="#9a9a95"/>
    </linearGradient>
    <linearGradient id="cells" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#162d66"/>
      <stop offset="0.5" stop-color="#2b52a3"/>
      <stop offset="1" stop-color="#132757"/>
    </linearGradient>
    <radialGradient id="earth" cx="0.38" cy="0.35" r="0.72">
      <stop offset="0" stop-color="#86caff"/>
      <stop offset="0.65" stop-color="#2271d3"/>
      <stop offset="1" stop-color="#0b2a66"/>
    </radialGradient>
    <clipPath id="earthClip"><circle cx="668" cy="92" r="34"/></clipPath>

    <g id="wheel">
      <circle r="22" fill="#262626" stroke="#cfcfca" stroke-width="3"/>
      <circle r="23.5" fill="none" stroke="#f2f2ec" stroke-width="1" stroke-dasharray="3 3"/>
      <circle r="17" fill="none" stroke="#9a9a95" stroke-width="1.2" stroke-dasharray="2 2"/>
      <circle r="12" fill="none" stroke="#9a9a95" stroke-width="1" stroke-dasharray="2 2"/>
      <g stroke="#d9d9d3" stroke-width="1.5">
        <line x1="0" y1="-22" x2="0" y2="22"/>
        <line x1="-22" y1="0" x2="22" y2="0"/>
        <line x1="-15.6" y1="-15.6" x2="15.6" y2="15.6"/>
        <line x1="-15.6" y1="15.6" x2="15.6" y2="-15.6"/>
      </g>
      <circle r="5" fill="#e6e6e0" stroke="#777777" stroke-width="1"/>
    </g>

    <g id="crater">
      <ellipse rx="40" ry="13" fill="#8e8e89"/>
      <ellipse cy="1" rx="34" ry="10" fill="#5a5a57"/>
      <path d="M8 -8 Q32 -4 33 1 Q32 7 8 10 Q22 1 8 -8 Z" fill="#2d2d2b" opacity="0.85"/>
      <path d="M10 -12 Q38 -8 40 0" fill="none" stroke="#b6b6b1" stroke-width="1.5"/>
      <path d="M-40 0 Q-38 -9 -14 -12" fill="none" stroke="#454543" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- Cielo -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="40" cy="60" r="1.2"/>
    <circle cx="95" cy="130" r="0.8"/>
    <circle cx="150" cy="40" r="1"/>
    <circle cx="210" cy="95" r="1.4"/>
    <circle cx="260" cy="30" r="0.9"/>
    <circle cx="320" cy="110" r="1.1"/>
    <circle cx="370" cy="55" r="0.8"/>
    <circle cx="420" cy="140" r="1.2"/>
    <circle cx="470" cy="25" r="1"/>
    <circle cx="520" cy="85" r="0.9"/>
    <circle cx="560" cy="170" r="1.3"/>
    <circle cx="610" cy="40" r="0.8"/>
    <circle cx="730" cy="150" r="1.1"/>
    <circle cx="770" cy="60" r="1.4"/>
    <circle cx="60" cy="210" r="1"/>
    <circle cx="130" cy="250" r="0.8"/>
    <circle cx="700" cy="230" r="1"/>
    <circle cx="760" cy="200" r="0.8"/>
    <circle cx="590" cy="120" r="0.7"/>
    <circle cx="240" cy="180" r="0.9"/>
    <circle cx="690" cy="20" r="0.9"/>
    <circle cx="20" cy="150" r="0.7"/>
    <circle cx="455" cy="200" r="0.8"/>
    <circle cx="640" cy="180" r="0.7"/>
    <circle cx="340" cy="20" r="0.7"/>
    <circle cx="110" cy="85" r="0.6"/>
    <circle cx="500" cy="230" r="0.7"/>
    <circle cx="200" cy="230" r="0.6"/>
    <circle cx="580" cy="260" r="0.6"/>
    <circle cx="30" cy="280" r="0.7"/>
  </g>

  <!-- Tierra -->
  <g>
    <circle cx="668" cy="92" r="34" fill="url(#earth)"/>
    <g clip-path="url(#earthClip)" fill="#3f9b4a" opacity="0.75">
      <path d="M652 92 q6 -16 20 -12 q6 10 -2 20 q-12 6 -18 -8z"/>
      <path d="M680 108 q10 -6 16 2 q-2 8 -14 8 q-6 -4 -2 -10z"/>
    </g>
    <g clip-path="url(#earthClip)" fill="#f4f7fb" opacity="0.85">
      <path d="M638 78 q14 -10 30 -4 q12 6 28 -2 q-6 14 -24 12 q-18 -2 -34 -6z"/>
      <path d="M646 110 q10 -8 24 -3 q10 4 20 -4 q-4 12 -18 12 q-14 0 -26 -5z"/>
      <ellipse cx="690" cy="68" rx="8" ry="3.5"/>
    </g>
    <path d="M668 58 a34 34 0 0 0 0 68 a18 34 0 0 1 0 -68 z" fill="#000000" opacity="0.5"/>
    <circle cx="668" cy="92" r="34" fill="none" stroke="#9fd0ff" stroke-width="1" opacity="0.45"/>
  </g>

  <!-- Suelo lunar -->
  <path d="M0 322 Q400 298 800 322 L800 500 L0 500 Z" fill="url(#ground)"/>
  <path d="M0 322 Q400 298 800 322" fill="none" stroke="#c2c2bd" stroke-width="1.2" opacity="0.5"/>

  <!-- Cráteres -->
  <use href="#crater" transform="translate(560 330) scale(0.6 0.5)"/>
  <use href="#crater" transform="translate(190 352) scale(0.6 0.5)"/>
  <use href="#crater" transform="translate(640 372) scale(1.1 1)"/>
  <use href="#crater" transform="translate(110 400) scale(1.6 1.4)"/>
  <use href="#crater" transform="translate(470 420) scale(0.8 0.7)"/>
  <use href="#crater" transform="translate(720 450) scale(1.9 1.5)"/>
  <use href="#crater" transform="translate(300 460) scale(1.3 1.1)"/>

  <!-- Regolito -->
  <g fill="#a3a39e" opacity="0.45">
    <circle cx="180" cy="372" r="1"/>
    <circle cx="250" cy="395" r="0.8"/>
    <circle cx="390" cy="380" r="1"/>
    <circle cx="520" cy="360" r="0.8"/>
    <circle cx="600" cy="430" r="1"/>
    <circle cx="430" cy="470" r="0.9"/>
    <circle cx="150" cy="450" r="0.8"/>
    <circle cx="690" cy="330" r="0.7"/>
    <circle cx="40" cy="350" r="0.8"/>
    <circle cx="760" cy="400" r="0.9"/>
  </g>

  <!-- Rocas -->
  <g>
    <path d="M580 395 l14 -8 l16 4 l6 10 l-30 4z" fill="#7a7a76"/>
    <path d="M580 395 l14 -8 l16 4 l-10 6z" fill="#a0a09b"/>
    <path d="M60 470 l18 -12 l22 6 l8 14 l-40 6z" fill="#6c6c68"/>
    <path d="M60 470 l18 -12 l22 6 l-14 8z" fill="#959590"/>
    <path d="M420 365 l8 -5 l9 3 l3 6 l-18 2z" fill="#777773"/>
    <path d="M420 365 l8 -5 l9 3 l-6 3z" fill="#9b9b96"/>
    <path d="M700 320 l5 -3 l6 2 l2 4 l-12 1z" fill="#80807c"/>
  </g>

  <!-- Huellas de las ruedas -->
  <g fill="none" stroke="#45453f" stroke-width="6" stroke-dasharray="5 4" stroke-linecap="round" opacity="0.85">
    <path d="M318 338 C 240 338, 150 330, 30 320"/>
    <path d="M330 327 C 250 328, 160 322, 70 316"/>
  </g>

  <!-- Sombra -->
  <ellipse cx="370" cy="338" rx="175" ry="11" fill="#000000" opacity="0.4"/>

  <!-- Lunojod 1 -->
  <g>
    <!-- Ruedas del lado lejano -->
    <g opacity="0.75">
      <use href="#wheel" transform="translate(339 306) scale(0.9)"/>
      <use href="#wheel" transform="translate(397 306) scale(0.9)"/>
      <use href="#wheel" transform="translate(455 306) scale(0.9)"/>
      <use href="#wheel" transform="translate(513 306) scale(0.9)"/>
    </g>

    <!-- Chasis y suspensión -->
    <rect x="304" y="296" width="212" height="6" rx="2" fill="#4c4c49"/>
    <g stroke="#8d8d89" stroke-width="4" stroke-linecap="round">
      <line x1="325" y1="300" x2="325" y2="314"/>
      <line x1="383" y1="300" x2="383" y2="314"/>
      <line x1="441" y1="300" x2="441" y2="314"/>
      <line x1="499" y1="300" x2="499" y2="314"/>
    </g>

    <!-- Novena rueda (odómetro) -->
    <line x1="306" y1="299" x2="282" y2="321" stroke="#8d8d89" stroke-width="3" stroke-linecap="round"/>
    <use href="#wheel" transform="translate(280 325) scale(0.5)"/>

    <!-- Cuerpo (bañera presurizada) -->
    <path d="M300 245 H520 L512 300 Q410 318 308 300 Z" fill="url(#body)" stroke="#5a5a57" stroke-width="1.2"/>
    <path d="M300 245 H520 L512 300 Q410 318 308 300 Z" fill="url(#sideShade)"/>
    <line x1="306" y1="272" x2="514" y2="272" stroke="#7d7d79" stroke-width="0.8" opacity="0.7"/>
    <g stroke="#8a8a86" stroke-width="0.8" opacity="0.5">
      <line x1="370" y1="252" x2="370" y2="296"/>
      <line x1="440" y1="252" x2="440" y2="296"/>
    </g>
    <g fill="#6f6f6b">
      <circle cx="320" cy="258" r="1.5"/>
      <circle cx="360" cy="258" r="1.5"/>
      <circle cx="400" cy="258" r="1.5"/>
      <circle cx="440" cy="258" r="1.5"/>
      <circle cx="480" cy="258" r="1.5"/>
      <circle cx="340" cy="286" r="1.5"/>
      <circle cx="400" cy="288" r="1.5"/>
      <circle cx="460" cy="286" r="1.5"/>
    </g>
    <rect x="298" y="242" width="224" height="7" rx="1.5" fill="#cfcfca" stroke="#6b6b67" stroke-width="0.8"/>

    <!-- Calefactor isotópico (parte trasera) -->
    <rect x="285" y="262" width="15" height="28" rx="5" fill="#3b3b3a" stroke="#9a9a95" stroke-width="1"/>
    <g stroke="#7a7a76" stroke-width="1">
      <line x1="287" y1="268" x2="298" y2="268"/>
      <line x1="287" y1="274" x2="298" y2="274"/>
      <line x1="287" y1="280" x2="298" y2="280"/>
      <line x1="287" y1="286" x2="298" y2="286"/>
    </g>

    <!-- Tapa abierta con paneles solares -->
    <g transform="translate(300 245) rotate(-130)">
      <rect x="0" y="-6" width="210" height="6" fill="url(#lidBack)" stroke="#6b6b67" stroke-width="0.8"/>
      <rect x="0" y="0" width="210" height="34" fill="url(#cells)" stroke="#8c8c87" stroke-width="1.5"/>
      <path d="M15 0V34M30 0V34M45 0V34M60 0V34M75 0V34M90 0V34M105 0V34M120 0V34M135 0V34M150 0V34M165 0V34M180 0V34M195 0V34M0 17H210" fill="none" stroke="#9db5e8" stroke-width="0.6" opacity="0.8"/>
      <line x1="0" y1="34" x2="210" y2="34" stroke="#d4e3ff" stroke-width="1.2" opacity="0.6"/>
      <rect x="206" y="-6" width="4" height="40" fill="#b9b9b4"/>
    </g>
    <circle cx="300" cy="245" r="4" fill="#8c8c87" stroke="#3b3b3a" stroke-width="1"/>

    <!-- Antena cónica helicoidal -->
    <polygon points="339,245 351,245 361,183 329,183" fill="#c9c9c4" stroke="#6b6b67" stroke-width="1"/>
    <g stroke="#55554f" stroke-width="1" fill="none">
      <path d="M330.6 194 L359.4 192"/>
      <path d="M332.2 204 L357.8 202"/>
      <path d="M333.8 214 L356.2 212"/>
      <path d="M335.5 224 L354.5 222"/>
      <path d="M337.1 234 L352.9 232"/>
    </g>
    <ellipse cx="345" cy="183" rx="16" ry="3" fill="#8c8c87" stroke="#6b6b67" stroke-width="0.8"/>

    <!-- Antena omnidireccional -->
    <line x1="415" y1="245" x2="415" y2="160" stroke="#e0e0da" stroke-width="1.5"/>
    <line x1="407" y1="172" x2="423" y2="172" stroke="#e0e0da" stroke-width="1.2"/>
    <circle cx="415" cy="159" r="2.5" fill="#f0f0ea"/>
    <rect x="411" y="240" width="8" height="6" fill="#55554f"/>

    <!-- Antena direccional (hacia la Tierra) -->
    <line x1="480" y1="245" x2="480" y2="204" stroke="#c9c9c4" stroke-width="2.5"/>
    <g transform="translate(480 203) rotate(60)">
      <ellipse rx="15" ry="5" fill="#dcdcd6" stroke="#6b6b67" stroke-width="1"/>
      <ellipse rx="10" ry="3" fill="#a8a8a3"/>
      <line x1="0" y1="0" x2="0" y2="-10" stroke="#55554f" stroke-width="1.2"/>
      <circle cy="-11" r="2" fill="#3b3b3a"/>
    </g>

    <!-- Cámara panorámica -->
    <rect x="498" y="224" width="9" height="22" rx="3" fill="#565652" stroke="#9a9a95" stroke-width="0.8"/>
    <rect x="500" y="229" width="5" height="6" fill="#111111"/>

    <!-- Cámaras de TV frontales -->
    <rect x="516" y="252" width="22" height="13" rx="2" fill="#3a3a39" stroke="#9a9a95" stroke-width="0.8"/>
    <circle cx="539" cy="258.5" r="4.5" fill="#101010" stroke="#c8c8c3" stroke-width="1"/>
    <circle cx="540.5" cy="257" r="1.2" fill="#9ec9ff" opacity="0.8"/>
    <rect x="514" y="270" width="18" height="10" rx="2" fill="#3a3a39" stroke="#9a9a95" stroke-width="0.8"/>
    <circle cx="533" cy="275" r="3.5" fill="#101010" stroke="#c8c8c3" stroke-width="1"/>

    <!-- Retrorreflector láser -->
    <rect x="507" y="284" width="22" height="13" rx="1.5" fill="#2a2a2a" stroke="#c0c0bb" stroke-width="1"/>
    <path d="M510 295 L514 287 L518 295 Z M518 295 L522 287 L526 295 Z" fill="#d7d7d1" opacity="0.9"/>
    <path d="M514 287 L518 295 L522 287 Z" fill="#8ab4ff" opacity="0.7"/>

    <!-- Ruedas del lado cercano -->
    <use href="#wheel" transform="translate(325 314)"/>
    <use href="#wheel" transform="translate(383 314)"/>
    <use href="#wheel" transform="translate(441 314)"/>
    <use href="#wheel" transform="translate(499 314)"/>
  </g>
</svg>
