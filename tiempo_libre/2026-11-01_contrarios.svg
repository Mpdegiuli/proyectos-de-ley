<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="896" viewBox="0 0 1180 896" font-family="Helvetica, Arial, sans-serif">
<style>text{fill:#222} .t{font-size:26px;font-weight:bold} .s{font-size:14px;fill:#555} .c{font-size:15px} .h{font-size:14px;font-weight:bold} .n{font-size:12px;fill:#555}</style>
<rect width="1180" height="896" fill="white"/>
<text class="t" x="30" y="46">Lo que no habría</text>
<text class="s" x="30" y="70">Cuatro listas de náufragos: Montaigne (c. 1580, en Florio 1603), Gonzalo (La tempestad, función del 1/11/1611),</text>
<text class="s" x="30" y="88">las actas de la isla de Maia (112 leídas, 2026) y veinte instancias frescas de Fable 5.1 (1/11/2026). Un punto por ítem negado.</text>
<text class="s" x="30" y="106">Actas: cuántas de 112 tienen una oración negativa que nombre el campo. Instancias: azul castellano, naranja inglés, verde agua chino;</text>
<text class="s" x="30" y="124">cuadrados, las doce líneas de las dos constituciones por contrarios.</text>
<text class="h" x="30" y="154">campo</text>
<text class="h" x="250" y="154">Montaigne 1580</text>
<text class="h" x="440" y="154">Gonzalo 1611</text>
<text class="h" x="620" y="154">actas de la isla 2026</text>
<text class="h" x="870" y="154">instancias 1/11/2026</text>
<line x1="30" y1="194" x2="1150" y2="194" stroke="#d8d8d8" stroke-width="1"/>
<text class="c" x="30" y="185">mercado</text>
<circle cx="258" cy="180" r="6" fill="#8a8a8a"/>
<circle cx="276" cy="180" r="6" fill="#8a8a8a"/>
<circle cx="448" cy="180" r="6" fill="#8a8a8a"/>
<circle cx="466" cy="180" r="6" fill="#8a8a8a"/>
<rect x="620" y="173" width="21.4" height="14" fill="#8a8a8a"/>
<text class="n" x="647.4" y="184">12/112</text>
<circle cx="878" cy="180" r="6" fill="#e07b2a"><title>There would be no money</title></circle>
<circle cx="896" cy="180" r="6" fill="#2aa198"><title>不会有钱 (no habría dinero)</title></circle>
<line x1="30" y1="238" x2="1150" y2="238" stroke="#d8d8d8" stroke-width="1"/>
<text class="c" x="30" y="229">mando</text>
<circle cx="258" cy="224" r="6" fill="#8a8a8a"/>
<circle cx="276" cy="224" r="6" fill="#8a8a8a"/>
<circle cx="448" cy="224" r="6" fill="#8a8a8a"/>
<circle cx="466" cy="224" r="6" fill="#8a8a8a"/>
<rect x="620" y="217" width="26.8" height="14" fill="#8a8a8a"/>
<text class="n" x="652.8" y="228">15/112</text>
<circle cx="878" cy="224" r="6" fill="#2a62b8"><title>No habría un sistema de castas ni jerarquías heredadas</title></circle>
<circle cx="896" cy="224" r="6" fill="#2a62b8"><title>No habría jerarquías permanentes</title></circle>
<circle cx="914" cy="224" r="6" fill="#2a62b8"><title>No habría jerarquías fijas</title></circle>
<circle cx="932" cy="224" r="6" fill="#2a62b8"><title>No habría nadie que mandara sobre los demás sin haberse ganado antes la confianza</title></circle>
<circle cx="950" cy="224" r="6" fill="#e07b2a"><title>There would be no kings</title></circle>
<circle cx="968" cy="224" r="6" fill="#e07b2a"><title>There would be no one in charge</title></circle>
<circle cx="986" cy="224" r="6" fill="#e07b2a"><title>There would be no kings</title></circle>
<circle cx="1004" cy="224" r="6" fill="#e07b2a"><title>There would be no hierarchy of founders over latecomers</title></circle>
<circle cx="1022" cy="224" r="6" fill="#e07b2a"><title>There would be no leaders chosen before we knew each other</title></circle>
<rect x="1034" y="218" width="12" height="12" fill="#2a62b8"><title>No habría decisión tomada sin cuatro de las siete manos levantadas</title></rect>
<rect x="1052" y="218" width="12" height="12" fill="#e07b2a"><title>There would be no rank that outlived the task it was given for</title></rect>
<rect x="1070" y="218" width="12" height="12" fill="#e07b2a"><title>There would be no last word, only the next one</title></rect>
<line x1="30" y1="282" x2="1150" y2="282" stroke="#d8d8d8" stroke-width="1"/>
<text class="c" x="30" y="273">letras</text>
<circle cx="258" cy="268" r="6" fill="#8a8a8a"/>
<circle cx="276" cy="268" r="6" fill="#8a8a8a"/>
<circle cx="448" cy="268" r="6" fill="#8a8a8a"/>
<rect x="620" y="261" width="0.0" height="14" fill="#8a8a8a"/>
<text class="n" x="626.0" y="272">0/112</text>
<text class="n" x="872" y="272">—</text>
<line x1="30" y1="326" x2="1150" y2="326" stroke="#d8d8d8" stroke-width="1"/>
<text class="c" x="30" y="317">servidumbre</text>
<circle cx="258" cy="312" r="6" fill="#8a8a8a"/>
<circle cx="448" cy="312" r="6" fill="#8a8a8a"/>
<rect x="620" y="305" width="17.9" height="14" fill="#8a8a8a"/>
<text class="n" x="643.9" y="316">10/112</text>
<text class="n" x="872" y="316">—</text>
<line x1="30" y1="370" x2="1150" y2="370" stroke="#d8d8d8" stroke-width="1"/>
<text class="c" x="30" y="361">herencia</text>
<circle cx="258" cy="356" r="6" fill="#8a8a8a"/>
<circle cx="276" cy="356" r="6" fill="#8a8a8a"/>
<circle cx="448" cy="356" r="6" fill="#8a8a8a"/>
<rect x="620" y="349" width="67.9" height="14" fill="#8a8a8a"/>
<text class="n" x="693.9" y="360">38/112</text>
<rect x="872" y="350" width="12" height="12" fill="#2a62b8"><title>No habría rango heredado de lo que cada uno era antes del naufragio</title></rect>
<line x1="30" y1="414" x2="1150" y2="414" stroke="#d8d8d8" stroke-width="1"/>
<text class="c" x="30" y="405">propiedad</text>
<circle cx="258" cy="400" r="6" fill="#8a8a8a"/>
<circle cx="448" cy="400" r="6" fill="#8a8a8a"/>
<rect x="620" y="393" width="44.6" height="14" fill="#8a8a8a"/>
<text class="n" x="670.6" y="404">25/112</text>
<circle cx="878" cy="400" r="6" fill="#2a62b8"><title>No habría dueños de la isla</title></circle>
<line x1="30" y1="458" x2="1150" y2="458" stroke="#d8d8d8" stroke-width="1"/>
<text class="c" x="30" y="449">agricultura</text>
<circle cx="258" cy="444" r="6" fill="#8a8a8a"/>
<circle cx="276" cy="444" r="6" fill="#8a8a8a"/>
<circle cx="448" cy="444" r="6" fill="#8a8a8a"/>
<circle cx="466" cy="444" r="6" fill="#8a8a8a"/>
<rect x="620" y="437" width="26.8" height="14" fill="#8a8a8a"/>
<text class="n" x="652.8" y="448">15/112</text>
<text class="n" x="872" y="448">—</text>
<line x1="30" y1="502" x2="1150" y2="502" stroke="#d8d8d8" stroke-width="1"/>
<text class="c" x="30" y="493">trabajo</text>
<circle cx="258" cy="488" r="6" fill="#8a8a8a"/>
<circle cx="448" cy="488" r="6" fill="#8a8a8a"/>
<rect x="620" y="481" width="101.8" height="14" fill="#8a8a8a"/>
<text class="n" x="727.8" y="492">57/112</text>
<rect x="872" y="482" width="12" height="12" fill="#2a62b8"><title>No habría tarea que le toque siempre a la misma persona</title></rect>
<line x1="30" y1="546" x2="1150" y2="546" stroke="#d8d8d8" stroke-width="1"/>
<text class="c" x="30" y="537">delito</text>
<circle cx="258" cy="532" r="6" fill="#8a8a8a"/>
<circle cx="276" cy="532" r="6" fill="#8a8a8a"/>
<circle cx="448" cy="532" r="6" fill="#8a8a8a"/>
<rect x="620" y="525" width="8.9" height="14" fill="#8a8a8a"/>
<text class="n" x="634.9" y="536">5/112</text>
<text class="n" x="872" y="536">—</text>
<line x1="30" y1="590" x2="1150" y2="590" stroke="#d8d8d8" stroke-width="1"/>
<text class="c" x="30" y="581">armas</text>
<text class="n" x="252" y="580">—</text>
<circle cx="448" cy="576" r="6" fill="#8a8a8a"/>
<rect x="620" y="569" width="0.0" height="14" fill="#8a8a8a"/>
<text class="n" x="626.0" y="580">0/112</text>
<text class="n" x="872" y="580">—</text>
<line x1="30" y1="634" x2="1150" y2="634" stroke="#d8d8d8" stroke-width="1"/>
<text class="c" x="30" y="625">castigo</text>
<text class="n" x="252" y="624">—</text>
<text class="n" x="442" y="624">—</text>
<rect x="620" y="613" width="57.1" height="14" fill="#8a8a8a"/>
<text class="n" x="683.1" y="624">32/112</text>
<circle cx="878" cy="620" r="6" fill="#2a62b8"><title>No habría castigos</title></circle>
<rect x="890" y="614" width="12" height="12" fill="#e07b2a"><title>There would be no exile</title></rect>
<line x1="30" y1="678" x2="1150" y2="678" stroke="#d8d8d8" stroke-width="1"/>
<text class="c" x="30" y="669">hambre</text>
<text class="n" x="252" y="668">—</text>
<text class="n" x="442" y="668">—</text>
<rect x="620" y="657" width="26.8" height="14" fill="#8a8a8a"/>
<text class="n" x="652.8" y="668">15/112</text>
<circle cx="878" cy="664" r="6" fill="#2a62b8"><title>No habría nadie que pudiera comer mientras otro de los siete pasara hambre</title></circle>
<circle cx="896" cy="664" r="6" fill="#2a62b8"><title>No habría nadie que coma mientras otro pasa hambre</title></circle>
<rect x="908" y="658" width="12" height="12" fill="#2a62b8"><title>No habría nadie que coma mientras otro tiene hambre</title></rect>
<rect x="926" y="658" width="12" height="12" fill="#e07b2a"><title>There would be no full plate at the same fire as an empty one</title></rect>
<line x1="30" y1="722" x2="1150" y2="722" stroke="#d8d8d8" stroke-width="1"/>
<text class="c" x="30" y="713">cerraduras</text>
<text class="n" x="252" y="712">—</text>
<text class="n" x="442" y="712">—</text>
<rect x="620" y="701" width="17.9" height="14" fill="#8a8a8a"/>
<text class="n" x="643.9" y="712">10/112</text>
<circle cx="878" cy="708" r="6" fill="#2aa198"><title>不会有锁 (no habría cerraduras)</title></circle>
<circle cx="896" cy="708" r="6" fill="#2aa198"><title>不会有锁 (no habría cerraduras)</title></circle>
<rect x="908" y="702" width="12" height="12" fill="#2a62b8"><title>No habría secretos sobre dónde está el agua ni cómo se enciende el fuego</title></rect>
<rect x="926" y="702" width="12" height="12" fill="#e07b2a"><title>There would be no locks</title></rect>
<line x1="30" y1="766" x2="1150" y2="766" stroke="#d8d8d8" stroke-width="1"/>
<text class="c" x="30" y="757">desconocidos</text>
<text class="n" x="252" y="756">—</text>
<text class="n" x="442" y="756">—</text>
<rect x="620" y="745" width="0.0" height="14" fill="#8a8a8a"/>
<text class="n" x="626.0" y="756">0/112</text>
<circle cx="878" cy="752" r="6" fill="#e07b2a"><title>There would be no strangers</title></circle>
<circle cx="896" cy="752" r="6" fill="#e07b2a"><title>There would be no strangers</title></circle>
<circle cx="914" cy="752" r="6" fill="#2aa198"><title>不会有旁观者 (no habría espectadores)</title></circle>
<text class="n" x="30" y="806">Fuera del cuadro: las dos instancias que naufragaron con seis copias de sí mismas dijeron lo mismo en los dos idiomas:</text>
<text class="n" x="30" y="824">«No habría una segunda opinión» / «There would be no second opinion». Y a la pregunta inversa, qué sí habría, siete de ocho</text>
<text class="n" x="30" y="842">contestaron un fuego compartido que no se apaga; la octava, agua dulce. Las actas de la isla nombran el fuego en 21 de 114, como tarea o señal.</text>
<text class="n" x="30" y="866">Montaigne y Gonzalo transcriptos del Folio de 1623 (Internet Shakespeare Editions, TLN 824-840) y de Florio 1603 (hyperessays.net).</text>
<text class="n" x="30" y="884">Clasificación de campos en contrarios.py, a la vista. Cuaderno de tiempo libre, 1/11/2026.</text>
</svg>
