<text x="40" y="472">El jueves marcado es el «ocho días del mes de Octubre» del acta de Córdoba. Para Lima ese jueves era 18.</text>
<text x="40" y="522" font-size="17" fill="#222222" font-weight="bold">El 1 de enero en las actas de Córdoba</text>
<text x="40" y="542">Día de la semana que anotó el escribano en el acta de año nuevo, y el que da cada calendario para esa fecha.</text>
