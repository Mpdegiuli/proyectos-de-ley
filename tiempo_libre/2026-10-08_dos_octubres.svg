<text x="40" y="40" font-size="20" fill="#222222" font-weight="bold">Octubre de 1584: los mismos días, dos cuentas</text>
<text x="40" y="62">Cada casilla es un día real. Arriba, el número que le tocaba en Lima según la pragmática (al domingo 4 le sigue el lunes 15).</text>
<text x="40" y="79">Abajo, el que le puso Córdoba del Tucumán, que ese octubre no saltó.</text>
