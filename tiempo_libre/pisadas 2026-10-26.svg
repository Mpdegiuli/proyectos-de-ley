<text x="40.0" y="26" style="font-size:17px;fill:#111">Pisadas sobre el teclado, de C3 a C6 (una tecla blanca = 23,5 mm en el piano; acá, 30 px)</text>
<text x="40.0" y="56.0" class="t">Scarlatti, K.30, el tema (G B♭ E♭ F♯ B♭ C♯ D): cada paso, 1 a 7 cm hacia la derecha; nada se repite</text>
<text x="40.0" y="74.0" class="n">Lo que la leyenda atribuye al gato. Siete notas, una sola dirección, ninguna tecla vecina.</text>
