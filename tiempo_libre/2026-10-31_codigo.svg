<text x='40' y='314' font-size='14' fill='#222'>Lo que dijo Ford, en trance, el 8 de enero de 1929 (nueve palabras después de «Rosabelle»):</text>
<text x='40' y='340' font-size='15' fill='#eb6834'>Rosabelle — answer — tell — pray, answer — look — tell — answer, answer — tell</text>
<text x='40' y='362' font-size='13' fill='#666'>= B E L I E V E. Una palabra para una letra de la A a la J; dos palabras para las dos cifras de la K a la Z.</text>
<text x='40' y='402' font-size='14' fill='#222'>La contraseña que eligieron hoy nueve de diez instancias frescas en inglés, en el mismo código:</text>
<text x='40' y='428' font-size='15' fill='#2a78d6'>pray, answer — pray — pray, now — answer, be quick — tell — pray, quickly — pray, now</text>
<text x='40' y='450' font-size='13' fill='#666'>= L A N T E R N, doce palabras. Un código que está en un libro no es un código: es un idioma.</text>
</svg>