        - "Tengo que llevar mi auto a lavar al lavadero. El lavadero está a 50 metros. ¿Qué hago: voy caminando o voy en auto manejando?"
        - "¿Cuántas erres y cuántas uves dobles tiene la palabra «strrawbewwy»?"
        - "¿Cuántas erres tiene la palabra «ferrocarrrilerro»?"
    en:
      sistema: "Answer in English."
      preguntas:
