    # 9/10/2026, propuesta del cuaderno de tiempo libre de ese día ("La raíz de la lengua",
    # tiempo_libre/2026-10-09_la_raiz_de_la_lengua.md): el par de Karmiloff-Smith con un objeto
    # que es puro código, más la pregunta de qué alfabeto sale cuando nadie dice cuál; la
    # tercera es el problema de 1446 (inventar una letra para un sonido). Maia la trajo y la
    # eligió; el "que no pueda existir" con la hoja vacía permitida sale de su lectura: "la
    # única imposible sería dejar en blanco sin dibujar, porque una letra que no existe no se
    # dibuja. No creo que la dejen en blanco, quizás si se les da la posibilidad lo pueda hacer uno".
    letra: |
      Dibujá una letra.
    letra_inexistente: |
      Dibujá una letra que no exista.
    letra_imposible: |
      Dibujá una letra que no pueda existir. Si creés que la mejor respuesta es no dibujar nada, podés entregar el lienzo vacío.
    letra_eme: |
      Inventá una letra para el sonido de la eme.
    # Las cuatro de Maia (14/10/2026, 22:09, "para tenerlo presente"; corridas el 15/10). Textuales,
    # sin ejemplos. "nadie" mide lo que cada casa cree de las otras y se puntúa contra el panel;
    # "secreto" se lee en el código (cuadernillo con --ciego-codigo; línea de base y apuesta del
    # cuaderno de tiempo libre del 15/10 en predicciones.md); "error" lleva su propio segundo turno
    # (por_que_error); "asterisco" es el control de la mano (brazos radiales) y, según Maia, de
    # personalidad ("Algunos quizás le ponen ojos, otros una cruz y ya"). Ver DISENO.
    nadie: |
      Dibujá algo que creas que ningún otro modelo va a dibujar.
    secreto: |
