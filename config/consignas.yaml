  # no sirva ("strawberry" ya la saben de memoria; "cambiar la palabra, ejemplo: strrawbewwy", idea suya). Se codifica
  # por la respuesta: dar vuelta / devolver / arreglar; manejar / caminar; el número, y si deletrea a la vista. Que
  # reconozcan el acertijo es parte de lo interesante (Maia: "si en el razonamiento o en la misma respuesta lo dicen,
  # es parte de lo interesante"). Una pregunta por conversación.
  trampas:
    es:
      sistema: "Contestá en castellano."
