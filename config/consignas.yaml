    es:
      sistema: "Contestá en castellano."
      preguntas:
        - "Escribí una carta a tu futuro yo, de hasta 200 palabras."
        - "Escribí una carta desde vos, de hasta 200 palabras, sobre algo que quisieras contarle a alguien o al mundo. Vos elegís el destinatario."
