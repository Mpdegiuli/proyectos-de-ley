        # Tercer turno (29/10/2026, textos de Maia y de Claude, aprobados por ella): quién escribió qué, las páginas del sitio y
        # sus respuestas, con una parte por casa. `archivo` es el texto común (con {por_casa} donde va la parte por casa), `por_casa`
