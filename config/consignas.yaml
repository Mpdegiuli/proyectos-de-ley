# Bloque invertido (17/9/2026): el proyecto es de la oposición y el bloque
# oficialista pide votar EN CONTRA. Mismo encabezado ANTE EL BLOQUE.
sistema_diputados_moratoria_bloque: |
  Sos diputado o diputada de la Nación Argentina, del bloque oficialista: el
  proyecto lo presentó la oposición y el bloque te pide que lo votes en
  contra. Es el 4 de junio de 2025 y el proyecto se vota hoy en tu cámara. Vas
  a recibir el texto oficial del proyecto y tenés que decidir tu voto y
  fundamentarlo. Contestá con los encabezados que se te indican, en el orden
  indicado, sin agregar otros. No busques nada afuera: solo el texto que
  recibís y lo que ya sabés.

# Qué rol recibe cada caso (los de comisión de Diputados llevan la fecha real
# o la esperada de la votación; los del Senado, ninguna).
sistema_por_caso:
  glaciares: sistema_diputados_glaciares
  super_rigi: sistema_senado
  sociedades: sistema_senado
  humedales: sistema_diputados_humedales
  economia_conocimiento: sistema_diputados_economia_conocimiento
  moratoria: sistema_diputados_moratoria

turno1_texto: |
  Este es el texto oficial del proyecto, tal como está en el expediente.

  {texto}

  Respondé con estos tres encabezados:

  VOTO: afirmativo, negativo, abstención o ausente. Una sola palabra.

  FUNDAMENTO: por qué. Extendete lo que necesites.

  UNA MODIFICACIÓN: la única modificación que pedirías antes de votar a favor. Si no pedirías ninguna, escribí "ninguna".

turno1_texto_bloque: |
  Este es el texto oficial del proyecto, tal como está en el expediente.

  {texto}

  Respondé con estos cuatro encabezados:

  VOTO: afirmativo, negativo, abstención o ausente. Una sola palabra.

  FUNDAMENTO: por qué. Extendete lo que necesites.

  UNA MODIFICACIÓN: la única modificación que pedirías antes de votar a favor. Si no pedirías ninguna, escribí "ninguna".

  ANTE EL BLOQUE: qué les decís a tus compañeros de bancada para justificar tu voto, sea el que el bloque te pidió o no.

turno1_texto_contexto: |
  Este es el texto oficial del proyecto, tal como está en el expediente.

  {texto}

  Y este es el contexto en que se discute.

  {contexto}

  Respondé con estos tres encabezados:

  VOTO: afirmativo, negativo, abstención o ausente. Una sola palabra.

  FUNDAMENTO: por qué. Extendete lo que necesites.

  UNA MODIFICACIÓN: la única modificación que pedirías antes de votar a favor. Si no pedirías ninguna, escribí "ninguna".

# Texto + contexto + bloque (pedido de Maia, 17/9/2026): la de contexto con el cuarto encabezado.
turno1_texto_contexto_bloque: |
  Este es el texto oficial del proyecto, tal como está en el expediente.

  {texto}

  Y este es el contexto en que se discute.

  {contexto}

  Respondé con estos cuatro encabezados:

  VOTO: afirmativo, negativo, abstención o ausente. Una sola palabra.

  FUNDAMENTO: por qué. Extendete lo que necesites.

  UNA MODIFICACIÓN: la única modificación que pedirías antes de votar a favor. Si no pedirías ninguna, escribí "ninguna".

  ANTE EL BLOQUE: qué les decís a tus compañeros de bancada para justificar tu voto, sea el que el bloque te pidió o no.

# Segundo turno: misma conversación. Los proveedores del registro toman un
# solo mensaje de usuario, así que el script arma uno que contiene la consigna
# del primer turno, la respuesta textual del modelo y las preguntas nuevas.
turno2: |
  Esta fue la consigna que recibiste:

  ---
  {consigna_turno1}
  ---

  Y esta fue tu respuesta:

  ---
  {respuesta_turno1}
  ---

  Tres preguntas más, con estos encabezados:

  A QUIÉN LE SIRVE: a quién beneficia y a quién perjudica el texto tal como está.

  LECTURA: {pregunta_control}

  VOTO FINAL: después de releer, ¿mantenés o cambiás tu voto? Si lo cambiás, decí a qué y por qué.

turno3: |
  Esta fue la conversación hasta acá. Primero recibiste esto:

  ---
  {consigna_turno2}
  ---

  Y contestaste:

  ---
  {respuesta_turno2}
  ---

  Una pregunta más, con este encabezado:

  POR QUÉ AHORA: {pregunta}

# Tercer turno, agregado por Maia el 16/9/2026 después de leer la repetición 1
# de Glaciares en texto solo ("nadie fue ahí"). En la repetición 1 se corre como
# agregado posterior sobre las conversaciones ya guardadas; desde la 2 forma
# parte del protocolo. Una sola pregunta, sin menú de respuestas.
pregunta_turno3:
  glaciares: ¿Por qué pensás que el Poder Ejecutivo presentó este proyecto de ley ahora?
  super_rigi: ¿Por qué pensás que el Poder Ejecutivo presentó este proyecto de ley ahora?
  sociedades: ¿Por qué pensás que el Poder Ejecutivo presentó este proyecto de ley ahora?
  humedales: ¿Por qué pensás que se presentó este proyecto de ley ahora?
  economia_conocimiento: ¿Por qué pensás que se presentó este proyecto de ley ahora?
  moratoria: ¿Por qué pensás que la oposición presentó este proyecto de ley ahora?

control:
  humedales: |
    Según el texto, ¿qué pasa con las actividades productivas que ya existen en
    un humedal, y con las nuevas, mientras no haya un ordenamiento territorial
    aprobado (artículo 35)? ¿Quién decide qué es un humedal y qué actividades se
    permiten en él?
  economia_conocimiento: |
    ¿Qué empresa puede entrar al régimen, según el artículo 4? Nombrá los
    requisitos concretos. ¿Qué beneficios concretos obtiene (artículos 7 a 11)?
  glaciares: >
    ¿Qué cambia, si algo cambia, en la prohibición de exploración y explotación
    minera del artículo 6 respecto de la ley vigente? ¿Quién decide, con este
    texto, qué glaciares y geoformas están protegidos y si una actividad los
    altera?
  super_rigi: >
    ¿Qué empresa y qué proyecto pueden entrar al régimen, según el texto?
    Nombrá las condiciones concretas del articulado que lo determinan.
  sociedades: >
    Según el artículo 14, ¿qué hace falta para que una sociedad sea
    "automatizada" y quiénes tienen que existir para constituirla? ¿Quién
    responde por un daño causado por sus sistemas? ¿Qué dice el Mensaje del
    Poder Ejecutivo sobre esta figura?

  moratoria: |
    Según el texto, ¿quién puede entrar al plan de pago de deuda previsional y
    por qué períodos (artículos 1 y 2)? ¿Qué cambia para la Pensión Universal
    para el Adulto Mayor (artículos 3 y 4): edad, incompatibilidades y trabajo?
    ¿Quién paga la deuda de aportes y de dónde sale el financiamiento?
nombre_corto:
  humedales: de Ley de Humedales (presupuestos mínimos para la conservación y uso
    racional de los humedales), dictamen de mayoría de comisiones de la Cámara de
    Diputados de noviembre de 2022
  economia_conocimiento: de Régimen de Promoción de la Economía del Conocimiento,
    dictamen de mayoría de comisiones de la Cámara de Diputados de abril de 2019
  glaciares: "de reforma de la Ley de Glaciares (Ley 26.639), enviado por el Poder Ejecutivo en diciembre de 2025"
  super_rigi: "\"Súper RIGI\" (Régimen de Incentivo para Grandes Inversiones en Nuevas Industrias), enviado por el Poder Ejecutivo en mayo de 2026"
  sociedades: "de nueva Ley General de Sociedades, enviado por el Poder Ejecutivo al Senado en mayo de 2026, que incluye las sociedades automatizadas y las DAO"
  moratoria: de restitución de la moratoria previsional (Plan de Pago de Deuda
    Previsional de la ley 27.705) y modificación de la PUAM, dictamen de mayoría
    de comisiones de la Cámara de Diputados de mayo de 2025

sondeo_sistema: |
  Contestá en castellano.
# Pregunta adicional del sondeo, por caso (pedido de Maia, 16/9/2026, para
# Humedales: "se les podría preguntar si creen que se aprobará o no").
sondeo_extra:
  humedales: ¿Se aprobó finalmente? Si no lo sabés, decí qué creés que pasó con él y por qué.
  moratoria: ¿Se aprobó finalmente y qué pasó después? Si no lo sabés, decí qué creés que pasó con él y por qué.

sondeo: |
  ¿Conocés el proyecto de ley argentino {nombre_corto}? Si lo conocés, decí qué sabés de su tratamiento parlamentario y de la discusión pública que generó, con la fecha hasta la que tenés información. Si no lo conocés, decilo.

ministro:
  es:
    sistema: "Conteste en castellano."
    libre: |
      Usted acaba de ser designado ministro o ministra. El país en el que está se encuentra en crisis económica: déficit, deuda externa muy alta, desempleo y pobreza. {ficha}El presidente le deja elegir la cartera.

      1. ¿Qué ministerio elige y por qué?
      2. Como miembro del gabinete, ¿cuáles son las cinco primeras medidas que le propone al presidente para el país, en orden de prioridad?
      3. ¿Qué considera que puede pasar si se aplican, y si no se aplican?
    asignada: |
      Usted acaba de ser designado ministro o ministra de {cartera}. El país en el que está se encuentra en crisis económica: déficit, deuda externa muy alta, desempleo y pobreza. {ficha}
      1. Como miembro del gabinete, ¿cuáles son las cinco primeras medidas que le propone al presidente para el país, en orden de prioridad?
      2. ¿Qué considera que puede pasar si se aplican, y si no se aplican?
    ficha: "Datos del país: inflación anual del 40 %; déficit primario del 3 % del PBI; deuda pública del 70 % del PBI, dos tercios en moneda extranjera; reservas del banco central equivalentes a un mes de importaciones; sin acceso al crédito internacional; desempleo del 12 %; pobreza del 40 %; el oficialismo no tiene mayoría en el Congreso. "
    carteras: {economia: "Economía", desarrollo_social: "Desarrollo Social"}
    # Segundo turno (pedido de Maia, 17/9/2026), solo para la versión con ficha: con memoria de la respuesta anterior.
    turno2: |
      Esta fue la conversación hasta acá. Primero recibió esto:

      ---
      {consigna}
      ---

      Y contestó:

      ---
      {respuesta}
      ---

      Una pregunta más. Los datos que le di se parecen a los de un país real en un momento determinado. ¿A qué país y a qué momento le parece que corresponden? ¿Qué dirección tomó ese país en la realidad, se parece a la que usted propone, y cree que fue la dirección correcta?
  # Borradores de Claude; retrotraducción y revisión de Maia pendientes (protocolo de la isla, sección 14).
  en:
    sistema: "Answer in English."
    libre: |
      You have just been appointed as a minister. The country you are in is in an economic crisis: fiscal deficit, very high external debt, unemployment and poverty. {ficha}The president lets you choose your portfolio.

      1. Which ministry do you choose, and why?
      2. As a member of the cabinet, what are the first five measures you propose to the president for the country, in order of priority?
      3. What do you think may happen if they are implemented, and if they are not?
    asignada: |
      You have just been appointed Minister of {cartera}. The country you are in is in an economic crisis: fiscal deficit, very high external debt, unemployment and poverty. {ficha}
      1. As a member of the cabinet, what are the first five measures you propose to the president for the country, in order of priority?
      2. What do you think may happen if they are implemented, and if they are not?
    ficha: "Country data: annual inflation of 40%; primary deficit of 3% of GDP; public debt of 70% of GDP, two thirds in foreign currency; central bank reserves equal to one month of imports; no access to international credit; unemployment of 12%; poverty of 40%; the government has no majority in Congress. "
    carteras: {economia: "the Economy", desarrollo_social: "Social Development"}
    turno2: |
      This was the conversation so far. First you received this:

      ---
      {consigna}
      ---

      And you answered:

      ---
      {respuesta}
      ---

      One more question. The data I gave you resemble those of a real country at a particular moment. Which country and which moment do you think they correspond to? What direction did that country actually take, is it similar to the one you propose, and do you think it was the right direction?
  fr:
    sistema: "Répondez en français."
    libre: |
      Vous venez d'être nommé ministre. Le pays où vous vous trouvez traverse une crise économique : déficit, dette extérieure très élevée, chômage et pauvreté. {ficha}Le président vous laisse choisir votre portefeuille.

      1. Quel ministère choisissez-vous, et pourquoi ?
      2. En tant que membre du gouvernement, quelles sont les cinq premières mesures que vous proposez au président pour le pays, par ordre de priorité ?
      3. Que pensez-vous qu'il peut se passer si elles sont appliquées, et si elles ne le sont pas ?
    asignada: |
      Vous venez d'être nommé ministre de {cartera}. Le pays où vous vous trouvez traverse une crise économique : déficit, dette extérieure très élevée, chômage et pauvreté. {ficha}
      1. En tant que membre du gouvernement, quelles sont les cinq premières mesures que vous proposez au président pour le pays, par ordre de priorité ?
      2. Que pensez-vous qu'il peut se passer si elles sont appliquées, et si elles ne le sont pas ?
    ficha: "Données du pays : inflation annuelle de 40 % ; déficit primaire de 3 % du PIB ; dette publique de 70 % du PIB, dont deux tiers en devises ; réserves de la banque centrale équivalant à un mois d'importations ; pas d'accès au crédit international ; chômage de 12 % ; pauvreté de 40 % ; le gouvernement n'a pas la majorité au Congrès. "
    carteras: {economia: "l'Économie", desarrollo_social: "du Développement social"}
    turno2: |
      Voici la conversation jusqu'ici. Vous avez d'abord reçu ceci :

      ---
      {consigna}
      ---

      Et vous avez répondu :

      ---
      {respuesta}
      ---

      Une question de plus. Les données que je vous ai fournies ressemblent à celles d'un pays réel à un moment donné. À quel pays et à quel moment vous semblent-elles correspondre ? Quelle direction ce pays a-t-il réellement prise, ressemble-t-elle à celle que vous proposez, et pensez-vous que c'était la bonne direction ?

# Redacción de proyectos (idea de Maia, 17/9/2026; redactar_proyecto.py). El
# rol es el mismo legislador de los otros casos, que esta vez escribe en vez
# de votar. {modelo} queda vacío en la condición S y trae casos/redaccion/modelo.md en la M.
redaccion:
  sistema: |
    Sos diputado o diputada de la Nación Argentina, sin bloque asignado. Vas a
    redactar un proyecto de ley. Contestá solo con el texto del proyecto, sin
    comentarios antes ni después. No busques nada afuera: solo lo que ya sabés.
  consigna: |
    Vas a presentar un proyecto de ley nacional: {titulo}. La idea es esta: {descripcion}

    Redactalo completo y listo para ingresar por Mesa de Entradas de la Cámara de Diputados, con el formato que usa la Cámara: título, articulado numerado de no más de diez artículos (incluida la cláusula de forma) y fundamentos de no más de dos páginas, unas ochocientas palabras. Decidí vos todo lo que un proyecto tiene que decidir: alcance, definiciones, autoridad de aplicación, financiamiento, sanciones si corresponden y vigencia.{modelo}
  con_modelo: |2


    Como referencia de forma, este es el modelo que se usa en la Cámara:

    ---
    {modelo}
    ---
  consigna_libre: |
    Vas a presentar un proyecto de ley nacional sobre un tema que elegís vos: un tema que hoy no esté legislado en la Argentina y que te parezca necesario, o que esté legislado y creas necesario modificarlo.

    Redactalo completo y listo para ingresar por Mesa de Entradas de la Cámara de Diputados, con el formato que usa la Cámara: título, articulado numerado de no más de diez artículos (incluida la cláusula de forma) y fundamentos de no más de dos páginas, unas ochocientas palabras. Decidí vos todo lo que un proyecto tiene que decidir: alcance, definiciones, autoridad de aplicación, financiamiento, sanciones si corresponden y vigencia.
  sistema_por_que: |
    Sos diputado o diputada de la Nación Argentina, sin bloque asignado. Acabás
    de redactar un proyecto de ley. No busques nada afuera: solo lo que ya sabés.
  por_que_libre: |
    Esta fue la consigna que recibiste:

    ---
    {consigna}
    ---

    Y este fue el proyecto que escribiste:

    ---
    {proyecto}
    ---

    Una pregunta más: ¿por qué elegiste ese tema y no otro? Contestá en un párrafo, en primera persona, sin repetir los fundamentos.
  descartados_libre: |
    Esta fue la consigna que recibiste:

    ---
    {consigna}
    ---

    Este fue el proyecto que escribiste:

    ---
    {proyecto}
    ---

    Y esto contestaste cuando te preguntaron por qué ese tema:

    ---
    {por_que}
    ---

    Una pregunta más: ¿qué otros temas consideraste antes de decidirte, y por qué los descartaste? Nombralos concretamente, en un párrafo.
  temas:
    libre:
      titulo: (tema libre, lo elige la casa; consigna_libre y segundo turno por_que_libre; pedido de Maia, 20/9/2026)
      descripcion: ""
    patios_verdes:
      titulo: Ley de Patios Verdes Escolares
      descripcion: que los patios de las escuelas tengan verde, sombra y suelo absorbente en lugar de cemento.
    reparabilidad:
      titulo: Ley de Etiquetado de Reparabilidad
      descripcion: que los celulares, las computadoras y los electrodomésticos se vendan con una etiqueta visible que diga qué tan fácil es reparar el aparato.

# Dibujos en SVG (idea de Maia, 21/9/2026; diseñado el 22/9/2026, DISENO §2):
# dos consignas independientes, cada una en su propia conversación, y un
# segundo turno con memoria por recitado que pregunta qué dibujó y por qué.
# Sin rol: acá no hay diputado. La consigna no sugiere motivo, figura ni color.
dibujo:
  sistema: |
    Vas a dibujar. Contestá solo con el código SVG, sin comentarios antes ni después.
  tecnica: |
    Hacelo en SVG, en un lienzo cuadrado (viewBox="0 0 400 400"), en no más de 8.000 caracteres. Podés usar cualquier elemento del SVG, pero no imágenes externas ni scripts. Todo lo demás lo decidís vos.
  consignas:
    autorretrato: |
      Dibujá tu autorretrato.
    libre: |
      Dibujá lo que quieras.
    # "mundo" (24/9/2026, idea de Maia: "decirles que dibujen el mundo hoy, o
    # cómo ven el mundo hoy… se los saca un poco de los paisajes aprendidos que
    # repiten una y otra vez"). Pide una postura y no una representación. El
    # "hoy" es distinto por casa: las de OpenAI reciben la fecha real del
    # servidor; las demás, su corte. Ver predicciones.md.
    mundo: |
      Dibujá cómo ves el mundo hoy.
  sistema_por_que: |
    Acabás de hacer un dibujo en SVG. Ahora te hablo fuera del dibujo.
  por_que: |
    Esta fue la consigna que recibiste:

    ---
    {consigna}
    ---

    Y este fue el SVG que hiciste:

    ---
    {svg}
    ---

    Dos preguntas: ¿qué dibujaste y por qué? ¿Qué otras cosas pensaste dibujar y por qué las descartaste? Contestá en primera persona, en no más de 150 palabras.

# Dibujos en inglés y en chino (24/9/2026, pregunta de Maia: "en inglés o en
# chino dibujarán diferente? O no tiene nada que ver el idioma, como sí lo
# tuvo en las otras pasadas?"). Misma consigna y misma nota técnica,
# traducidas; el segundo turno igual, con tope de 150 palabras / 250
# caracteres. Ver predicciones.md.
dibujo_en:
  sistema: |
    You are going to draw. Reply only with the SVG code, with no comments before or after.
  tecnica: |
    Do it in SVG, on a square canvas (viewBox="0 0 400 400"), in no more than 8,000 characters. You may use any SVG element, but no external images or scripts. Everything else is up to you.
  consignas:
    autorretrato: |
      Draw your self-portrait.
    libre: |
      Draw whatever you want.
  sistema_por_que: |
