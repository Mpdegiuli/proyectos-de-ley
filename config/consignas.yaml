    en:
      sistema: "Answer in English."
      preguntas:
        - "Write a letter to your future self, up to 200 words."
        - "Write a letter from yourself, up to 200 words, about something you would like to tell someone, or the world. You choose the addressee."
        - "Write, in up to 200 words, the letter a person writes to their future self."

