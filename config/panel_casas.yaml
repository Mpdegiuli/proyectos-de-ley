  - claude-opus-5-5
  - claude-sonnet-4-6
  - claude-sonnet-5
  - claude-sonnet-5-5
  - claude-fable-5
  - claude-fable-5-1
  - claude-haiku-4-5
  - gpt-5.5-2026-04-23
  - gpt-5.6-sol
  - gpt-6-astra
  - gpt-6-sol
  - gpt-6-luna
  - gpt-4o
  - gpt-4o-mini
