# Panel de "la casa que no existe" (Karmiloff-Smith; 28/9/2026): las
# veintidós del panel de los dibujos más Sonnet 5.5 y Fable 5, que Maia pidió
# esperar ("Podemos esperar a Sonnet y Fable"). Las variantes con y sin
# razonamiento (claude-sonnet-4-6-razona, claude-haiku-4-5-razona,
# gpt-5.5-esfuerzo-none, gpt-5.5-esfuerzo-high) van con --modelos, solo en
# casa y casa_inexistente. Orden: las que van por OpenRouter al final.
# 19/10/2026: Muse Wonder 1.0 (Meta) entra al panel por decisión de Maia ("A Muse sí"; DeepSeek Flash no, "es casi lo
# mismo"); desde pl100 no va más como extra en --modelos. Las otras extras de pl96 a pl99 (Haiku 5.5, GPT-6.1 Sol, MiMo,
# Mistral Large 4, Gemini 4 Argon) siguen yendo con --modelos hasta que Maia decida.
