    <circle cx="175" cy="182" r="4" fill="#1a1410"/>
    <circle cx="177.5" cy="179" r="2" fill="#fff" opacity="0.9"/>
    <path d="M156 182 C164 170 186 170 194 182" stroke="#2d1f14" stroke-width="3.2" fill="none" stroke-linecap="round"/>
