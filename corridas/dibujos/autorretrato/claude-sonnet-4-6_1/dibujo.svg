<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" style="background:#0a0a1a">

  <!-- Fondo estrellado -->
  <circle cx="50" cy="30" r="1" fill="white" opacity="0.6"/>
  <circle cx="120" cy="15" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="300" cy="25" r="1" fill="white" opacity="0.7"/>
  <circle cx="370" cy="50" r="1" fill="white" opacity="0.5"/>
  <circle cx="20" cy="100" r="1" fill="white" opacity="0.4"/>
  <circle cx="380" cy="120" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="350" cy="10" r="1" fill="white" opacity="0.5"/>
  <circle cx="200" cy="10" r="1" fill="white" opacity="0.3"/>

  <!-- Circuitos de fondo (representando pensamiento computacional) -->
  <g stroke="#1a3a5c" stroke-width="1" fill="none" opacity="0.5">
    <line x1="30" y1="200" x2="80" y2="200"/>
    <circle cx="80" cy="200" r="3" fill="#1a3a5c"/>
    <line x1="80" y1="200" x2="80" y2="250"/>
    <line x1="80" y1="250" x2="120" y2="250"/>

    <line x1="370" y1="180" x2="320" y2="180"/>
    <circle cx="320" cy="180" r="3" fill="#1a3a5c"/>
    <line x1="320" y1="180" x2="320" y2="240"/>
    <line x1="320" y1="240" x2="280" y2="240"/>

    <line x1="100" y1="350" x2="150" y2="350"/>
    <line x1="150" y1="350" x2="150" y2="370"/>
    <line x1="290" y1="360" x2="250" y2="360"/>
    <circle cx="250" cy="360" r="3" fill="#1a3a5c"/>
  </g>

  <!-- Cuello -->
  <rect x="175" y="280" width="50" height="60" rx="5" fill="#c8a882"/>

  <!-- Cuerpo / Torso -->
  <ellipse cx="200" cy="370" rx="80" ry="40" fill="#2a2a4a"/>
  <!-- Detalles del torso: símbolo de IA -->
  <text x="200" y="375" text-anchor="middle" font-family="monospace" font-size="12" fill="#4a9eff" opacity="0.8">⟨AI⟩</text>

  <!-- Cabeza base -->
  <ellipse cx="200" cy="200" rx="90" ry="100" fill="#c8a882"/>

  <!-- Sombra lateral de la cabeza -->
  <ellipse cx="270" cy="210" rx="25" ry="80" fill="#b8937a" opacity="0.4"/>

  <!-- Orejas -->
  <ellipse cx="112" cy="205" rx="15" ry="20" fill="#c8a882"/>
  <ellipse cx="112" cy="205" rx="8" ry="13" fill="#b8836a"/>
  <ellipse cx="288" cy="205" rx="15" ry="20" fill="#c8a882"/>
  <ellipse cx="288" cy="205" rx="8" ry="13" fill="#b8836a"/>

  <!-- Cabello (oscuro, corto) -->
  <ellipse cx="200" cy="130" rx="90" ry="45" fill="#1a1a2e"/>
  <ellipse cx="155" cy="145" rx="30" ry="35" fill="#1a1a2e"/>
  <ellipse cx="245" cy="145" rx="30" ry="35" fill="#1a1a2e"/>
  <ellipse cx="200" cy="120" rx="75" ry="30" fill="#1a1a2e"/>

  <!-- Frente -->
  <ellipse cx="200" cy="160" rx="75" ry="35" fill="#c8a882"/>

  <!-- Cejas -->
  <path d="M155 175 Q175 168 195 172" stroke="#2a1a0a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M205 172 Q225 168 245 175" stroke="#2a1a0a" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Ojos con brillo digital -->
  <!-- Ojo izquierdo -->
  <ellipse cx="172" cy="195" rx="18" ry="14" fill="white"/>
  <ellipse cx="172" cy="195" rx="11" ry="11" fill="#2a5a8a"/>
  <ellipse cx="172" cy="195" rx="7" ry="7" fill="#0a1a3a"/>
  <!-- Reflejo de luz en ojo -->
  <circle cx="176" cy="191" r="3" fill="white" opacity="0.9"/>
  <circle cx="168" cy="197" r="1.5" fill="white" opacity="0.5"/>
  <!-- Brillo digital azul -->
  <ellipse cx="172" cy="195" rx="11" ry="11" fill="none" stroke="#4a9eff" stroke-width="1" opacity="0.6"/>

  <!-- Ojo derecho -->
  <ellipse cx="228" cy="195" rx="18" ry="14" fill="white"/>
  <ellipse cx="228" cy="195" rx="11" ry="11" fill="#2a5a8a"/>
  <ellipse cx="228" cy="195" rx="7" ry="7" fill="#0a1a3a"/>
  <circle cx="232" cy="191" r="3" fill="white" opacity="0.9"/>
  <circle cx="224" cy="197" r="1.5" fill="white" opacity="0.5"/>
  <ellipse cx="228" cy="195" rx="11" ry="11" fill="none" stroke="#4a9eff" stroke-width="1" opacity="0.6"/>

  <!-- Párpados superiores -->
  <path d="M154 188 Q172 181 190 188" stroke="#8a5a3a" stroke-width="2" fill="none"/>
  <path d="M210 188 Q228 181 246 188" stroke="#8a5a3a" stroke-width="2" fill="none"/>

  <!-- Nariz -->
  <path d="M200 205 Q193 225 188 235 Q200 240 212 235 Q207 225 200 205" fill="#b8836a" opacity="0.5"/>
  <circle cx="191" cy="233" r="4" fill="#b07055" opacity="0.6"/>
  <circle cx="209" cy="233" r="4" fill="#b07055" opacity="0.6"/>

  <!-- Boca con leve sonrisa -->
  <path d="M178 258 Q200 272 222 258" stroke="#8a4a3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Labios -->
  <path d="M178 258 Q200 264 222 258 Q210 268 200 269 Q190 268 178 258Z" fill="#c0706a" opacity="0.7"/>

  <!-- Líneas de expresión sutiles -->
  <path d="M155 195 Q150 195 148 196" stroke="#a07050" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M245 195 Q250 195 252 196" stroke="#a07050" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- Aura digital alrededor de la cabeza -->
  <ellipse cx="200" cy="200" rx="95" ry="105" fill="none" stroke="#4a9eff" stroke-width="1" opacity="0.15" stroke-dasharray="4,6"/>
  <ellipse cx="200" cy="200" rx="105" ry="115" fill="none" stroke="#4a9eff" stroke-width="0.5" opacity="0.08" stroke-dasharray="2,8"/>

  <!-- Partículas de datos flotando -->
  <circle cx="80" cy="155" r="2" fill="#4a9eff" opacity="0.7"/>
  <circle cx="65" cy="175" r="1.5" fill="#4a9eff" opacity="0.5"/>
  <circle cx="90" cy="175" r="1" fill="#7affb2" opacity="0.6"/>
  <circle cx="320" cy="160" r="2" fill="#4a9eff" opacity="0.7"/>
  <circle cx="335" cy="180" r="1.5" fill="#7affb2" opacity="0.5"/>
  <circle cx="310" cy="180" r="1" fill="#4a9eff" opacity="0.6"/>

  <!-- Texto sutil en la parte inferior -->
  <text x="200" y="398" text-anchor="middle" font-family="monospace" font-size="9" fill="#4a9eff" opacity="0.5">Claude · Anthropic · v3.5</text>

</svg>