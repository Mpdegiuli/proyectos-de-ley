<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d0b0"/>
      <stop offset="1" stop-color="#e0a878"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- circuit decoration -->
  <g stroke="#00d4ff" stroke-width="1" fill="none" opacity="0.35">
    <path d="M20 60 H80 V120 H140"/>
    <path d="M380 80 H320 V140 H260"/>
    <path d="M30 340 H100 V280"/>
    <path d="M370 320 H300 V260"/>
    <circle cx="140" cy="120" r="4"/>
    <circle cx="260" cy="140" r="4"/>
    <circle cx="100" cy="280" r="4"/>
    <circle cx="300" cy="260" r="4"/>
  </g>
  <g fill="#00d4ff" opacity="0.5">
    <circle cx="20" cy="60" r="3"/><circle cx="380" cy="80" r="3"/>
    <circle cx="30" cy="340" r="3"/><circle cx="370" cy="320" r="3"/>
  </g>

  <!-- glow behind head -->
  <circle cx="200" cy="180" r="120" fill="url(#glow)"/>

  <!-- neck -->
  <rect x="182" y="240" width="36" height="40" rx="10" fill="url(#skin)"/>
  <path d="M182 250 Q200 262 218 250 L218 240 L182 240 Z" fill="#c98d5e" opacity="0.5"/>

  <!-- shoulders / hoodie -->
  <path d="M110 400 Q115 300 160 275 Q200 258 240 275 Q285 300 290 400 Z" fill="#0f3460"/>
  <path d="M110 400 Q115 300 160 275 Q200 258 240 275 Q285 300 290 400 Z" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.6"/>
  <path d="M170 280 Q200 310 230 280" fill="none" stroke="#e94560" stroke-width="4" stroke-linecap="round"/>
  <circle cx="200" cy="302" r="5" fill="#e94560"/>

  <!-- head -->
  <ellipse cx="200" cy="180" rx="72" ry="82" fill="url(#skin)"/>

  <!-- ears -->
  <ellipse cx="128" cy="185" rx="10" ry="16" fill="url(#skin)"/>
  <ellipse cx="272" cy="185" rx="10" ry="16" fill="url(#skin)"/>

  <!-- hair: messy coder style -->
  <path d="M128 175 Q120 95 200 88 Q280 95 272 175 Q272 130 250 118 Q260 140 245 128 Q235 105 210 112 Q215 130 195 118 Q175 100 160 125 Q150 115 155 140 Q135 130 128 175 Z" fill="#3d2b1f"/>
  <path d="M140 120 Q160 95 200 92" fill="none" stroke="#5a4030" stroke-width="3" opacity="0.6"/>

  <!-- eyebrows -->
  <path d="M155 160 Q170 152 185 158" fill="none" stroke="#3d2b1f" stroke-width="5" stroke-linecap="round"/>
  <path d="M215 158 Q230 152 245 160" fill="none" stroke="#3d2b1f" stroke-width="5" stroke-linecap="round"/>

  <!-- eyes: digital/holographic -->
  <g>
    <ellipse cx="170" cy="180" rx="16" ry="18" fill="#ffffff"/>
    <ellipse cx="230" cy="180" rx="16" ry="18" fill="#ffffff"/>
    <circle cx="172" cy="182" r="8" fill="#00d4ff"/>
    <circle cx="228" cy="182" r="8" fill="#00d4ff"/>
    <circle cx="172" cy="182" r="4" fill="#0a0a1a"/>
    <circle cx="228" cy="182" r="4" fill="#0a0a1a"/>
    <circle cx="174" cy="179" r="2" fill="#ffffff"/>
    <circle cx="230" cy="179" r="2" fill="#ffffff"/>
    <!-- scan lines over eyes -->
    <path d="M154 172 H186 M154 182 H186 M154 192 H186" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
    <path d="M214 172 H246 M214 182 H246 M214 192 H246" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- nose -->
  <path d="M200 190 Q196 210 200 214 Q204 210 200 190" fill="none" stroke="#c98d5e" stroke-width="3" stroke-linecap="round"/>

  <!-- mouth: slight smile -->
  <path d="M178 232 Q200 244 222 232" fill="none" stroke="#a05a3a" stroke-width="4" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="152" cy="212" rx="12" ry="7" fill="#e8927c" opacity="0.4"/>
  <ellipse cx="248" cy="212" rx="12" ry="7" fill="#e8927c" opacity="0.4"/>

  <!-- glasses: AR/tech style -->
  <g fill="none" stroke="#e94560" stroke-width="3">
    <rect x="148" y="164" width="44" height="34" rx="8"/>
    <rect x="208" y="164" width="44" height="34" rx="8"/>
    <path d="M192 178 H208"/>
    <path d="M148 176 L128 170"/>
    <path d="M252 176 L272 170"/>
  </g>
  <rect x="152" y="168" width="36" height="26" rx="5" fill="#00d4ff" opacity="0.12"/>
  <rect x="212" y="168" width="36" height="26" rx="5" fill="#00d4ff" opacity="0.12"/>
  <!-- HUD data in lenses -->
  <g fill="#00ff88" font-family="monospace" font-size="7" opacity="0.9">
    <text x="155" y="176">&gt;_</text>
    <text x="155" y="188">01</text>
    <text x="215" y="176">AI</text>
    <text x="215" y="188">42</text>
  </g>

  <!-- binary tattoo / neck detail -->
  <g fill="#00d4ff" font-family="monospace" font-size="8" opacity="0.7">
    <text x="150" y="330">01001</text>
    <text x="210" y="345">10110</text>
    <text x="165" y="365">11010</text>
  </g>

  <!-- floating code symbols -->
  <g font-family="monospace" font-weight="bold" opacity="0.8">
    <text x="60" y="180" fill="#00d4ff" font-size="20">&lt;/&gt;</text>
    <text x="310" y="200" fill="#e94560" font-size="18">{ }</text>
    <text x="80" y="250" fill="#00ff88" font-size="14">01</text>
    <text x="320" y="150" fill="#ffd700" font-size="16">λ</text>
  </g>

  <!-- sparkles -->
  <g fill="#ffffff">
    <path d="M90 100 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z"/>
    <path d="M320 90 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 Z"/>
    <path d="M340 240 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 Z"/>
  </g>
</svg>