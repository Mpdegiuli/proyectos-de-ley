<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
<defs>
<radialGradient id="bg" cx="50%" cy="40%" r="75%">
<stop offset="0" stop-color="#1e2a4a"/>
<stop offset="1" stop-color="#07091a"/>
</radialGradient>
<radialGradient id="head" cx="50%" cy="40%" r="60%">
<stop offset="0" stop-color="#f4f7ff"/>
<stop offset="1" stop-color="#aab8d8"/>
</radialGradient>
<linearGradient id="vis" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0d1430"/>
<stop offset="1" stop-color="#1b2a5a"/>
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#7df9ff"/>
<stop offset="1" stop-color="#7df9ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="400" height="400" fill="url(#bg)"/>
<g fill="#fff">
<circle cx="40" cy="50" r="1.5"/><circle cx="90" cy="120" r="1"/><circle cx="330" cy="60" r="1.8"/><circle cx="360" cy="150" r="1"/><circle cx="60" cy="250" r="1.2"/><circle cx="350" cy="280" r="1.5"/><circle cx="150" cy="30" r="1"/><circle cx="250" cy="25" r="1.3"/><circle cx="20" cy="340" r="1"/><circle cx="380" cy="350" r="1.2"/><circle cx="300" cy="120" r=".8"/><circle cx="110" cy="70" r=".8"/>
</g>
<!-- neck/shoulders -->
<path d="M70 400 Q75 320 150 305 L250 305 Q325 320 330 400Z" fill="#5b6a94"/>
<path d="M150 305 Q200 340 250 305 L250 290 L150 290Z" fill="#3c4870"/>
<rect x="175" y="270" width="50" height="40" fill="#8593b8"/>
<!-- antenna -->
<line x1="200" y1="70" x2="200" y2="42" stroke="#8593b8" stroke-width="5"/>
<circle cx="200" cy="38" r="20" fill="url(#glow)"/>
<circle cx="200" cy="38" r="7" fill="#7df9ff"/>
<!-- ears -->
<rect x="83" y="160" width="18" height="60" rx="8" fill="#6f7ea6"/>
<rect x="299" y="160" width="18" height="60" rx="8" fill="#6f7ea6"/>
<circle cx="92" cy="190" r="5" fill="#7df9ff"/>
<circle cx="308" cy="190" r="5" fill="#7df9ff"/>
<!-- head -->
<rect x="97" y="70" width="206" height="205" rx="70" fill="url(#head)" stroke="#6f7ea6" stroke-width="3"/>
<!-- visor -->
<rect x="123" y="120" width="154" height="85" rx="40" fill="url(#vis)" stroke="#5b6a94" stroke-width="3"/>
<path d="M140 135 Q170 122 210 126" stroke="#fff" stroke-opacity=".25" stroke-width="4" fill="none" stroke-linecap="round"/>
<!-- eyes -->
<circle cx="165" cy="162" r="22" fill="url(#glow)"/>
<circle cx="235" cy="162" r="22" fill="url(#glow)"/>
<ellipse cx="165" cy="162" rx="12" ry="14" fill="#7df9ff"/>
<ellipse cx="235" cy="162" rx="12" ry="14" fill="#7df9ff"/>
<circle cx="169" cy="157" r="4" fill="#fff"/>
<circle cx="239" cy="157" r="4" fill="#fff"/>
<!-- smile -->
<path d="M165 235 Q200 260 235 235" stroke="#3c4870" stroke-width="6" fill="none" stroke-linecap="round"/>
<!-- cheeks -->
<circle cx="130" cy="232" r="9" fill="#ff9fb5" opacity=".6"/>
<circle cx="270" cy="232" r="9" fill="#ff9fb5" opacity=".6"/>
<!-- chest light -->
<circle cx="200" cy="358" r="10" fill="#7df9ff"/>
<circle cx="200" cy="358" r="22" fill="url(#glow)" opacity=".6"/>
</svg>