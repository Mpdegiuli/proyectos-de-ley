  <rect x="67" y="170" width="35" height="72" rx="15" fill="#47759b" stroke="#a9e4e4" stroke-width="4"/>
  <rect x="298" y="170" width="35" height="72" rx="15" fill="#47759b" stroke="#a9e4e4" stroke-width="4"/>
  <path d="M83 190v32m234-32v32" stroke="#8bf6df" stroke-width="4" stroke-linecap="round"/>

