  <circle cx="200" cy="361" r="25" fill="#132c52" stroke="#98f9e7" stroke-width="2"/>
  <path d="m193 351-9 10 9 10m14-20 9 10-9 10m-4-24-6 28" fill="none" stroke="#9dfce6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

