  <rect x="93" y="94" width="214" height="206" rx="54" fill="url(#metal)" stroke="#d0fff1" stroke-width="5"/>
  <path d="M117 132q10-19 34-23h97q26 3 36 23" fill="none" stroke="#f1fffb" stroke-width="4" opacity=".5"/>
  <rect x="108" y="124" width="184" height="149" rx="35" fill="url(#pantalla)" stroke="#66a9c1" stroke-width="3"/>
  <path d="M127 143q12-12 32-12h82" fill="none" stroke="#99f8e3" stroke-width="2" stroke-linecap="round" opacity=".35"/>

  <!-- Ojos -->
  <ellipse cx="153" cy="187" rx="22" ry="26" fill="#6cfbe3" opacity=".5" filter="url(#brillo)"/>
  <ellipse cx="247" cy="187" rx="22" ry="26" fill="#6cfbe3" opacity=".5" filter="url(#brillo)"/>
  <ellipse cx="153" cy="187" rx="19" ry="23" fill="#8afde7"/>
  <ellipse cx="247" cy="187" rx="19" ry="23" fill="#8afde7"/>
  <circle cx="160" cy="179" r="6" fill="#f4fffa"/>
  <circle cx="254" cy="179" r="6" fill="#f4fffa"/>
  <path d="M130 159q20-15 43-2m54 0q23-13 43 2" fill="none" stroke="#7fe8d9" stroke-width="3" stroke-linecap="round" opacity=".65"/>

