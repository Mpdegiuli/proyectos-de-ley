  <ellipse cx="133" cy="226" rx="15" ry="7" fill="#fa92ca" opacity=".45"/>
  <ellipse cx="267" cy="226" rx="15" ry="7" fill="#fa92ca" opacity=".45"/>
  <path d="M170 224q30 31 60 0" fill="none" stroke="#a3fbea" stroke-width="5" stroke-linecap="round"/>
  <circle cx="200" cy="210" r="3" fill="#75c8d4"/>

  <!-- Pequeños circuitos -->
  <path d="M111 112h-17l-9-9H68m221 9h17l9-9h17M112 283h-17l-9 9H70m218-9h17l9 9h16" fill="none" stroke="#91eddf" stroke-width="2" opacity=".65"/>
  <g fill="#a5ffec">
    <circle cx="68" cy="103" r="3"/><circle cx="332" cy="103" r="3"/>
    <circle cx="70" cy="292" r="3"/><circle cx="330" cy="292" r="3"/>
  </g>
