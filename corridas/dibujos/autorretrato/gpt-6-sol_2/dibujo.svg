<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Autorretrato de una inteligencia artificial como un robot sonriente">
  <defs>
    <radialGradient id="fondo">
      <stop stop-color="#263766"/>
      <stop offset="1" stop-color="#0b1229"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c9f8f1"/>
      <stop offset=".45" stop-color="#78b9ce"/>
      <stop offset="1" stop-color="#426b9b"/>
    </linearGradient>
    <linearGradient id="pantalla" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#14284b"/>
      <stop offset="1" stop-color="#09152d"/>
    </linearGradient>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6fb6ce"/>
      <stop offset="1" stop-color="#283e79"/>
    </linearGradient>
    <filter id="brillo" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <pattern id="puntos" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#a5d6ff" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="400" height="400" fill="url(#fondo)"/>
  <rect width="400" height="400" fill="url(#puntos)"/>
  <circle cx="200" cy="181" r="143" fill="none" stroke="#80e8e0" stroke-width="1" opacity=".17"/>
  <circle cx="200" cy="181" r="165" fill="none" stroke="#80e8e0" stroke-width="1" stroke-dasharray="2 12" opacity=".3"/>
  <path d="M53 142v-23h26m268 23v-23h-26M53 280v23h26m268-23v23h-26" fill="none" stroke="#69dcd8" stroke-width="2" opacity=".55"/>
  <g fill="#a8fff0">
    <path d="m65 65 2 7 7 2-7 2-2 7-2-7-7-2 7-2z"/>
    <path d="m336 71 2 6 6 2-6 2-2 6-2-6-6-2 6-2z" opacity=".7"/>
    <path d="m343 256 1.5 5 5 1.5-5 1.5-1.5 5-1.5-5-5-1.5 5-1.5z" opacity=".65"/>
  </g>
  <circle cx="81" cy="239" r="3" fill="#f8beeb"/>
  <circle cx="321" cy="49" r="2" fill="#f8beeb"/>

  <!-- Antena y halo -->
  <path d="M130 86a88 88 0 0 1 140 0" fill="none" stroke="#62e8d5" stroke-width="7" stroke-linecap="round" opacity=".16" filter="url(#brillo)"/>
  <path d="M130 86a88 88 0 0 1 140 0" fill="none" stroke="#71ebdd" stroke-width="2" stroke-linecap="round" stroke-dasharray="75 12 21 12"/>
  <path d="M200 103V71" stroke="#a6dddf" stroke-width="7" stroke-linecap="round"/>
  <circle cx="200" cy="62" r="15" fill="#73f6da" opacity=".6" filter="url(#brillo)"/>
  <circle cx="200" cy="62" r="9" fill="#83fce0" stroke="#d7fff4" stroke-width="2"/>

  <!-- Hombros y torso -->
  <path d="M79 400v-42c0-43 31-74 74-74h94c43 0 74 31 74 74v42" fill="url(#cuerpo)" stroke="#9dd9e4" stroke-width="5"/>
  <path d="M95 400v-40c0-33 24-58 57-58h96c33 0 57 25 57 58v40" fill="none" stroke="#adf6e6" stroke-width="2" opacity=".5"/>
  <path d="M150 289v34q50 39 100 0v-34" fill="#243960" stroke="#9bd4df" stroke-width="4"/>
  <path d="M165 317q35 22 70 0" fill="none" stroke="#75eadd" stroke-width="2" opacity=".65"/>
  <path d="M116 348h22m-22 12h15m153-12h-22m22 12h-15" stroke="#b1f5e7" stroke-width="3" stroke-linecap="round" opacity=".7"/>

