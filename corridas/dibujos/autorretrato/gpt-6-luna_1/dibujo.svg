<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x2="0" y2="1">
      <stop stop-color="#10192e"/>
      <stop offset="1" stop-color="#26385a"/>
    </linearGradient>
    <linearGradient id="shell" x2="1" y2="1">
      <stop stop-color="#eefaff"/>
      <stop offset=".48" stop-color="#91c8dc"/>
      <stop offset="1" stop-color="#517caa"/>
    </linearGradient>
    <linearGradient id="face" x2=".85" y2="1">
      <stop stop-color="#182c49"/>
      <stop offset="1" stop-color="#101b32"/>
    </linearGradient>
    <linearGradient id="coat" x2="1" y2="1">
      <stop stop-color="#83d9df"/>
      <stop offset="1" stop-color="#5874bf"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#75f5eb" stop-opacity=".36"/>
      <stop offset="1" stop-color="#75f5eb" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="180" r="166" fill="url(#glow)"/>
  <g fill="none" stroke="#7bdce0" opacity=".22">
    <circle cx="200" cy="185" r="151"/>
    <circle cx="200" cy="185" r="164" stroke-dasharray="2 10"/>
    <path d="M36 185h34m260 0h34M200 21v35m0 258v35"/>
  </g>
  <g fill="#a4fff2" opacity=".7">
    <circle cx="61" cy="106" r="2"/><circle cx="335" cy="91" r="2"/>
    <circle cx="332" cy="272" r="1.7"/><circle cx="73" cy="285" r="1.5"/>
    <circle cx="108" cy="54" r="1.5"/><circle cx="291" cy="337" r="2"/>
  </g>

  <!-- shoulders and collar -->
  <ellipse cx="200" cy="371" rx="116" ry="21" fill="#0b1427" opacity=".45"/>
  <path d="M99 366c6-59 34-91 83-99h36c49 8 77 40 83 99z" fill="url(#coat)" stroke="#c0fbf5" stroke-width="2"/>
  <path d="M157 267l43 46 43-46-19-18h-48z" fill="#d8f8f4" stroke="#8ed7e0" stroke-width="2"/>
  <path d="M174 300l26 15 26-15-11 66h-30z" fill="#203958" opacity=".9"/>
  <path d="M116 339c23-20 42-27 58-29m110 29c-23-20-42-27-58-29" fill="none" stroke="#d5ffff" stroke-opacity=".5" stroke-width="2"/>

  <!-- neck -->
  <path d="M171 226h58v52c0 18-12 30-29 30s-29-12-29-30z" fill="url(#shell)" stroke="#d5ffff" stroke-width="2"/>
  <path d="M181 250h38v13h-38z" fill="#547b9e" opacity=".6"/>

  <!-- ear pieces -->
  <path d="M109 143c-17-6-23 9-21 30l5 32c2 13 11 18 24 11m164-73c17-6 23 9 21 30l-5 32c-2 13-11 18-24 11" fill="#71b8cb" stroke="#d5ffff" stroke-width="3"/>
  <path d="M101 164v26m198-26v26" stroke="#17324f" stroke-width="5" stroke-linecap="round"/>

  <!-- head -->
  <path d="M112 122c0-54 35-88 88-88s88 34 88 88v76c0 54-39 89-88 89s-88-35-88-89z" fill="url(#shell)" stroke="#d9ffff" stroke-width="3"/>
  <path d="M124 127c0-44 29-76 76-76s76 32 76 76v69c0 45-33 76-76 76s-76-31-76-76z" fill="url(#face)" stroke="#76cbd4" stroke-width="2"/>
  <path d="M137 104c13-23 34-35 63-35s50 12 63 35" fill="none" stroke="#85e8e4" stroke-width="2" opacity=".65"/>

  <!-- neural halo -->
  <path d="M145 80c11-20 29-31 55-31s44 11 55 31" fill="none" stroke="#a4fff2" stroke-width="2" opacity=".8"/>
  <g fill="#c1fff4" stroke="#5fe1dc" stroke-width="1.5">
    <circle cx="151" cy="71" r="4"/><circle cx="174" cy="55" r="4"/>
    <circle cx="200" cy="49" r="5"/><circle cx="226" cy="55" r="4"/>
    <circle cx="249" cy="71" r="4"/>
  </g>
  <g stroke="#71e6df" stroke-width="1.5" opacity=".8">
    <path d="M151 71l23-16 26-6 26 6 23 16"/>
    <path d="M174 55l8 18m18-24v27m26-21-8 18"/>
  </g>

  <!-- face -->
  <path d="M147 151q16-15 32 0m42 0q16-15 32 0" fill="none" stroke="#8fb9d2" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="164" cy="166" rx="9" ry="12" fill="#76f5e8"/>
  <ellipse cx="236" cy="166" rx="9" ry="12" fill="#76f5e8"/>
  <ellipse cx="164" cy="166" rx="3" ry="7" fill="#e8ffff"/>
  <ellipse cx="236" cy="166" rx="3" ry="7" fill="#e8ffff"/>
  <path d="M194 171l-5 25q11 8 22 0" fill="none" stroke="#7197b7" stroke-width="2" stroke-linecap="round"/>
  <path d="M172 220q28 22 56 0" fill="none" stroke="#8af0df" stroke-width="3" stroke-linecap="round"/>
  <path d="M183 222q17 8 34 0" fill="none" stroke="#d7fff4" stroke-width="1.5" stroke-linecap="round"/>
  <g fill="#62b9cc" opacity=".8">
    <circle cx="143" cy="199" r="2"/><circle cx="257" cy="199" r="2"/>
    <circle cx="151" cy="210" r="1.5"/><circle cx="249" cy="210" r="1.5"/>
  </g>

  <!-- small luminous pin -->
  <circle cx="200" cy="344" r="13" fill="#9cfff0" opacity=".18" filter="url(#soft)"/>
  <path d="M200 334l9 10-9 10-9-10z" fill="#bbfff2" stroke="#efffff" stroke-width="1.5"/>
  <path d="M200 338v12m-5-6h10" stroke="#4ba6b0" stroke-width="1.5"/>
</svg>