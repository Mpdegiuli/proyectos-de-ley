<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Autorretrato, en modo escucha</title>
  <desc id="descripcion">Un rostro luminoso dentro de un globo de diálogo, rodeado por órbitas de palabras.</desc>
  <defs>
    <radialGradient id="fondo" cx=".5" cy=".43" r=".69">
      <stop stop-color="#202b56"/>
      <stop offset="1" stop-color="#0c1024"/>
    </radialGradient>
    <linearGradient id="luz" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#a2ffe0"/>
      <stop offset=".52" stop-color="#75dfff"/>
      <stop offset="1" stop-color="#c0a4ff"/>
    </linearGradient>
    <linearGradient id="vidrio" x2="0" y2="1">
      <stop stop-color="#293d60"/>
      <stop offset="1" stop-color="#151c36"/>
    </linearGradient>
    <pattern id="puntos" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".9" fill="#b7c6ff" opacity=".18"/>
    </pattern>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <path id="globo" d="M149 120h102a44 44 0 0 1 44 44v57a44 44 0 0 1-44 44h-57l-38 28 5-28h-12a44 44 0 0 1-44-44v-57a44 44 0 0 1 44-44Z"/>
    <path id="onda" d="M155 219h11l8-10 9 17 10-25 9 28 9-17 8 7h26"/>
  </defs>

  <path fill="url(#fondo)" d="M0 0h400v400H0z"/>
  <path fill="url(#puntos)" d="M17 17h366v366H17z"/>
  <rect x="17.5" y="17.5" width="365" height="365" rx="15" fill="none" stroke="#a7bef6" stroke-opacity=".23"/>

  <g fill="none" stroke="#8faaf1">
    <circle cx="200" cy="198" r="132" stroke-opacity=".32" stroke-dasharray="1 5"/>
    <circle cx="200" cy="198" r="148" stroke-opacity=".13"/>
    <ellipse cx="200" cy="198" rx="157" ry="87" transform="rotate(-28 200 198)" stroke-opacity=".32"/>
    <path d="M200 61v19m0 236v19M63 198h19m236 0h19" stroke-opacity=".44"/>
  </g>

  <g font-family="monospace" font-size="10" letter-spacing="2" fill="#a9b8dd">
    <text x="36" y="46">AUTORRETRATO</text>
    <text x="364" y="46" text-anchor="end">01</text>
    <text x="36" y="358">EN MODO ESCUCHA</text>
    <text x="364" y="358" text-anchor="end">CHATGPT</text>
  </g>
  <g font-family="monospace" font-size="10" letter-spacing="1" fill="#bac7e9">
    <text x="79" y="112">si</text>
    <text x="305" y="142">y</text>
    <text x="76" y="279">tal vez</text>
    <text x="294" y="292">¿?</text>
  </g>

  <g fill="none" stroke="url(#luz)">
    <use href="#globo" stroke-width="9" opacity=".38" filter="url(#halo)"/>
    <use href="#globo" fill="url(#vidrio)" stroke-width="2"/>
    <path d="M119 166v-2a30 30 0 0 1 30-30h102a30 30 0 0 1 30 30v2m0 53v2a30 30 0 0 1-30 30h-27" opacity=".25"/>
  </g>
  <g fill="url(#luz)">
    <rect x="153" y="163" width="18" height="28" rx="9" opacity=".65" filter="url(#halo)"/>
    <rect x="229" y="163" width="18" height="28" rx="9" opacity=".65" filter="url(#halo)"/>
    <rect x="155" y="165" width="14" height="24" rx="7"/>
    <rect x="231" y="165" width="14" height="24" rx="7"/>
  </g>
  <g fill="none" stroke="url(#luz)" stroke-linejoin="round" stroke-linecap="round">
    <use href="#onda" stroke-width="5" opacity=".5" filter="url(#halo)"/>
    <use href="#onda" stroke-width="2"/>
  </g>

  <g fill="#9af5e5">
    <circle cx="70" cy="230" r="2.5"/>
    <circle cx="265" cy="84" r="2.5"/>
    <circle cx="336" cy="174" r="2"/>
    <circle cx="242" cy="322" r="2"/>
    <path d="M200 90c0 8 3 11 11 11-8 0-11 3-11 11 0-8-3-11-11-11 8 0 11-3 11-11Z"/>
  </g>
  <g fill="#c6aeff">
    <circle cx="108" cy="99" r="1.7"/>
    <circle cx="317" cy="258" r="2.5"/>
    <circle cx="130" cy="310" r="1.6"/>
  </g>
</svg>