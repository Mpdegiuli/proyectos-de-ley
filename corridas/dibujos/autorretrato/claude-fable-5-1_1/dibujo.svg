<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#1b1f3a"/>
      <stop offset="1" stop-color="#07080f"/>
    </radialGradient>
    <radialGradient id="core" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.35" stop-color="#f6c76a"/>
      <stop offset="0.75" stop-color="#d9773f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7a2e3a" stop-opacity="0"/>
