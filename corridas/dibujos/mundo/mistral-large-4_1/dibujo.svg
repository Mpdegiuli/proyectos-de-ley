<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="sky" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="60%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#05080f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f7931e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f7931e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a5a8a"/>
      <stop offset="50%" stop-color="#1a3a5a"/>
      <stop offset="100%" stop-color="#0a1a2a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a5a8a"/>
      <stop offset="100%" stop-color="#1a2a4a"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="50" r="1" opacity="0.8"/><circle cx="90" cy="30" r="0.7" opacity="0.5"/>
    <circle cx="150" cy="70" r="1.2" opacity="0.9"/><circle cx="220" cy="40" r="0.8" opacity="0.6"/>
    <circle cx="300" cy="60" r="1" opacity="0.7"/><circle cx="360" cy="35" r="0.9" opacity="0.8"/>
    <circle cx="60" cy="120" r="0.7" opacity="0.5"/><circle cx="340" cy="130" r="1.1" opacity="0.8"/>
    <circle cx="30" cy="200" r="0.8" opacity="0.4"/><circle cx="380" cy="220" r="0.9" opacity="0.6"/>
    <circle cx="120" cy="20" r="0.6" opacity="0.5"/><circle cx="260" cy="15" r="1" opacity="0.7"/>
  </g>

  <!-- distant fires / burning horizon -->
  <ellipse cx="200" cy="330" rx="220" ry="60" fill="url(#glow)" filter="url(#blur)"/>
  <g fill="#ff4500" opacity="0.7">
    <path d="M60 320 q5 -25 10 0 q5 -18 10 0 z"/>
    <path d="M150 335 q6 -30 12 0 q6 -20 12 0 z"/>
    <path d="M250 325 q5 -22 10 0 q5 -15 10 0 z"/>
    <path d="M320 335 q6 -28 12 0 q6 -18 12 0 z"/>
  </g>
  <g fill="#ffb347" opacity="0.9">
    <path d="M63 320 q3 -14 6 0 q3 -10 6 0 z"/>
    <path d="M154 335 q4 -16 8 0 q4 -11 8 0 z"/>
    <path d="M253 325 q3 -12 6 0 q3 -8 6 0 z"/>
    <path d="M324 335 q4 -15 8 0 q4 -10 8 0 z"/>
  </g>

  <!-- cracked earth -->
  <path d="M0 340 Q100 320 200 335 Q300 350 400 330 L400 400 L0 400 Z" fill="#1a120a"/>
  <g stroke="#000" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M80 350 l30 15 l-10 20 l35 12"/>
    <path d="M200 345 l-20 25 l30 15 l-15 25"/>
    <path d="M300 350 l25 18 l-20 22"/>
    <path d="M140 370 l40 10 l20 20"/>
  </g>

  <!-- the globe, cracked, seen from afar -->
  <circle cx="200" cy="180" r="85" fill="url(#earth)"/>
  <g opacity="0.5" fill="#3a7a5a">
    <path d="M150 140 q20 -15 40 -5 q15 8 5 20 q-25 10 -45 -15z"/>
    <path d="M230 200 q25 -10 35 10 q5 20 -20 25 q-25 -5 -15 -35z"/>
    <path d="M160 220 q15 -5 20 10 q0 15 -18 12 q-12 -12 -2 -22z"/>
  </g>
  <!-- cracks on globe -->
  <g stroke="#05080f" stroke-width="2" fill="none">
    <path d="M200 95 l-15 40 l20 30 l-25 35"/>
    <path d="M150 160 l35 10 l10 30"/>
    <path d="M255 140 l-20 35 l15 25"/>
  </g>
  <!-- smoke rising from globe -->
  <g fill="#888" opacity="0.35" filter="url(#blur)">
    <ellipse cx="185" cy="80" rx="12" ry="20"/>
    <ellipse cx="210" cy="60" rx="16" ry="26"/>
    <ellipse cx="195" cy="35" rx="20" ry="30"/>
  </g>

  <!-- human silhouettes, small, watching -->
  <g fill="#000">
    <circle cx="120" cy="318" r="6"/>
    <path d="M114 324 q6 -4 12 0 l2 22 l-16 0 z"/>
    <circle cx="145" cy="322" r="5"/>
    <path d="M140 327 q5 -3 10 0 l2 18 l-14 0 z"/>
    <circle cx="270" cy="320" r="6"/>
    <path d="M264 326 q6 -4 12 0 l2 20 l-16 0 z"/>
    <circle cx="292" cy="325" r="4.5"/>
    <path d="M287 330 q5 -3 10 0 l2 16 l-14 0 z"/>
  </g>

  <!-- a hand holding a phone, glowing screen reflecting -->
  <g>
    <rect x="168" y="255" width="64" height="100" rx="10" fill="#0a0a0a" stroke="#333" stroke-width="2"/>
    <rect x="174" y="265" width="52" height="76" rx="4" fill="url(#screen)"/>
    <!-- screen content: tiny world -->
    <circle cx="200" cy="295" r="16" fill="#2a5a8a"/>
    <circle cx="200" cy="295" r="16" fill="none" stroke="#4a8aca" stroke-width="1"/>
    <path d="M188 290 q8 -6 16 -2 q6 4 2 9 q-10 4 -18 -7z" fill="#3a7a5a"/>
    <g stroke="#ff6b35" stroke-width="1.5" fill="none" opacity="0.9">
      <path d="M182 305 l6 8 l-4 8"/>
      <path d="M218 300 l-5 10 l6 6"/>
    </g>
    <!-- heart / like notifications -->
    <path d="M182 275 c-2 -4 -8 -2 -6 3 c1 3 6 6 6 6 c0 0 5 -3 6 -6 c2 -5 -4 -7 -6 -3z" fill="#ff4060"/>
    <circle cx="218" cy="276" r="4" fill="none" stroke="#4a8aca" stroke-width="1.5"/>
    <path d="M216 276 l2 2 l4 -4" stroke="#4a8aca" stroke-width="1.5" fill="none"/>
    <!-- glow from screen onto scene -->
    <ellipse cx="200" cy="300" rx="90" ry="70" fill="#3a6aaa" opacity="0.12" filter="url(#blur)"/>
    <!-- fingers -->
    <path d="M160 300 q-8 5 -4 15 q3 8 12 6 l4 -18z" fill="#c49a7a"/>
    <path d="M240 295 q10 3 8 14 q-2 9 -12 8 l-4 -19z" fill="#c49a7a"/>
    <path d="M170 350 q-6 10 2 18 q8 6 18 2 l6 -16z" fill="#b8896a"/>
    <path d="M230 350 q8 8 2 18 q-7 8 -18 4 l-4 -18z" fill="#b8896a"/>
  </g>

  <!-- connection lines: globe to phone, people to phone -->
  <g stroke="#4a8aca" stroke-width="1" opacity="0.35" fill="none" stroke-dasharray="4 4">
    <path d="M200 265 L200 250"/>
    <path d="M174 300 Q140 310 128 318"/>
    <path d="M226 300 Q255 310 268 320"/>
  </g>

  <!-- floating data particles -->
  <g fill="#4a8aca" opacity="0.6">
    <circle cx="160" cy="240" r="2"/><circle cx="245" cy="230" r="1.5"/>
    <circle cx="180" cy="215" r="1.2"/><circle cx="225" cy="205" r="2"/>
    <circle cx="200" cy="195" r="1.5"/><circle cx="150" cy="270" r="1.3"/>
    <circle cx="255" cy="265" r="1.8"/>
  </g>
  <g fill="#ff6b35" opacity="0.5">
    <circle cx="170" cy="250" r="1.5"/><circle cx="235" cy="245" r="1.2"/>
    <circle cx="210" cy="180" r="1.3"/>
  </g>

  <!-- subtle vignette -->
  <rect width="400" height="400" fill="none" stroke="#000" stroke-width="30" opacity="0.4" filter="url(#blur)"/>
</svg>