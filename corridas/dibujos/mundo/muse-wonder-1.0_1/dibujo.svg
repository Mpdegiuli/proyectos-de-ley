<circle cx="148" cy="252" r="17" fill="#4ade80"/><circle cx="166" cy="236" r="14" fill="#22c55e"/><circle cx="132" cy="236" r="11" fill="#86efac"/>
<circle cx="172" cy="262" r="11" fill="#16a34a"/><circle cx="152" cy="222" r="9" fill="#bbf7d0"/>
</g>
<g fill="#fb923c"><circle cx="248" cy="256" r="2.4"/><circle cx="240" cy="238" r="1.8"/><circle cx="256" cy="272" r="1.5"/></g>
<path d="M238 244 q10 2 8 12 q-10 -2 -8 -12Z" fill="#84cc16"/>

<!-- brote de esperanza -->
<circle cx="200" cy="356" r="28" fill="url(#glow)"/>
<path d="M200 372 V354" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
<path d="M200 360 Q184 362 180 348 Q196 346 200 360Z" fill="#4ade80"/>
<path d="M200 358 Q216 360 220 346 Q204 344 200 358Z" fill="#86efac"/>

