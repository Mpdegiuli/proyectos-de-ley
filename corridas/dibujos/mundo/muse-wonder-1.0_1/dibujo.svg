<circle cx="112" cy="334" r="6" fill="#030708" stroke="none"/>
<path d="M112 340 V358 M112 346 L126 340 M112 358 L104 374 M112 358 L121 374" fill="none" stroke-width="4"/>
</g>
<rect x="86" y="342" width="7" height="11" rx="1.5" fill="#7ee7ff" transform="rotate(-12 89 347)"/>
<circle cx="89" cy="347" r="10" fill="#7ee7ff" opacity=".18"/>
<path d="M126 340 q2 -8 9 -9 q0 8 -9 9Z" fill="#4ade80"/>

