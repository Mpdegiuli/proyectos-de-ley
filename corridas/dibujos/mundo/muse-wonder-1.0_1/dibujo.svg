<path d="M310 244 q10 -20 2 -34 q16 12 10 34 q-4 12 -12 0Z" fill="#ff6b35"/>
<path d="M312 246 q5 -10 1 -18 q9 7 5 18 q-3 6 -6 0Z" fill="#ffd166"/>
