<g fill="#1e293b"><rect x="84" y="168" width="7" height="16"/><rect x="94" y="160" width="8" height="24"/><rect x="105" y="172" width="6" height="12"/></g>
<g fill="#fde68a"><rect x="87" y="173" width="2" height="2"/><rect x="97" y="166" width="2" height="2"/><rect x="98" y="174" width="2" height="2"/><rect x="107" y="176" width="2" height="2"/></g>
