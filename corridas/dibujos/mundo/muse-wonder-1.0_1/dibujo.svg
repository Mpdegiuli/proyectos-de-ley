<path d="M42 118l-6 14M68 130l-6 14M92 112l-6 14M54 158l-6 14M118 142l-6 14"/>
</g>
<g fill="#ffb35c">
<circle cx="332" cy="150" r="2.4"/><circle cx="352" cy="182" r="1.8"/><circle cx="318" cy="196" r="1.5"/><circle cx="362" cy="132" r="1.6"/><circle cx="342" cy="222" r="2"/>
</g>
<g fill="#ff7b33" opacity=".85"><circle cx="326" cy="168" r="1.3"/><circle cx="356" cy="204" r="1.2"/><circle cx="308" cy="222" r="1.1"/></g>

<!-- LA TIERRA -->
<g clip-path="url(#earth)">
<circle cx="200" cy="225" r="126" fill="url(#sea)"/>
<!-- continente vivo -->
<path d="M72 196 Q92 152 138 158 Q176 164 178 198 Q192 228 164 250 Q168 288 128 292 Q92 288 86 252 Q60 228 72 196Z" fill="url(#landL)"/>
