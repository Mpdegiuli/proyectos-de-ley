<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
<title>El mundo hoy</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0a0f26"/><stop offset=".42" stop-color="#35395e"/>
<stop offset=".7" stop-color="#c96a45"/><stop offset="1" stop-color="#17251f"/>
</linearGradient>
<radialGradient id="sun"><stop offset="0" stop-color="#fff0a8"/><stop offset=".45" stop-color="#ffb45e"/><stop offset=".78" stop-color="#ff6b57"/><stop offset="1" stop-color="#ff6b57" stop-opacity="0"/></radialGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#b8ff9e" stop-opacity=".9"/><stop offset="1" stop-color="#b8ff9e" stop-opacity="0"/></radialGradient>
<linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#2a9d8f"/><stop offset=".48" stop-color="#277da1"/><stop offset=".55" stop-color="#7a4a3a"/><stop offset="1" stop-color="#8a3b2e"/>
</linearGradient>
<linearGradient id="landL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93d977"/><stop offset="1" stop-color="#27865a"/></linearGradient>
<linearGradient id="landR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eec96f"/><stop offset="1" stop-color="#ac5426"/></linearGradient>
<clipPath id="earth"><circle cx="200" cy="225" r="126"/></clipPath>
<filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
</defs>

<rect width="400" height="400" fill="url(#sky)"/>

<!-- estrellas / polvo -->
<g fill="#fff">
<circle cx="28" cy="38" r="1.4" opacity=".8"/><circle cx="72" cy="20" r="1" opacity=".5"/><circle cx="126" cy="48" r="1.2" opacity=".65"/>
<circle cx="312" cy="28" r="1.3" opacity=".7"/><circle cx="356" cy="62" r="1" opacity=".5"/><circle cx="262" cy="18" r="1" opacity=".45"/>
<circle cx="182" cy="30" r="1" opacity=".55"/><circle cx="48" cy="92" r="1" opacity=".4"/><circle cx="368" cy="118" r="1.1" opacity=".5"/>
</g>

<!-- sol enfermo -->
<circle cx="200" cy="210" r="148" fill="url(#sun)"/>
<circle cx="200" cy="210" r="76" fill="#ffd479" opacity=".75"/>

<!-- humo -->
<g fill="#0b0d18" opacity=".68" filter="url(#blur)">
<ellipse cx="52" cy="58" rx="62" ry="20"/><ellipse cx="110" cy="42" rx="48" ry="16"/>
<ellipse cx="338" cy="50" rx="66" ry="21"/><ellipse cx="282" cy="34" rx="42" ry="14"/>
</g>

<!-- red digital que une y vigila -->
<g fill="none" stroke="#7ee7ff" stroke-width="1.1" opacity=".55" stroke-dasharray="3 5">
<path d="M35 145 Q140 55 250 78 T382 130"/>
<path d="M18 108 Q170 150 382 82"/>
<path d="M70 178 Q210 105 335 168"/>
</g>
<g fill="#aef4ff">
<circle cx="35" cy="145" r="3"/><circle cx="148" cy="83" r="2.5"/><circle cx="250" cy="78" r="3"/><circle cx="382" cy="130" r="2.5"/>
<circle cx="112" cy="126" r="2"/><circle cx="283" cy="112" r="2"/><circle cx="335" cy="168" r="2.5"/><circle cx="70" cy="178" r="2"/>
</g>
<!-- satélite -->
<g transform="translate(322 58) rotate(-18)" fill="#dbeafe" stroke="#7ee7ff">
<rect x="-9" y="-6" width="18" height="12" rx="2" fill="#94a3b8"/>
<rect x="-34" y="-4" width="22" height="8" fill="#2563eb"/><rect x="12" y="-4" width="22" height="8" fill="#2563eb"/>
</g>

<!-- lluvia a la izquierda, brasas a la derecha -->
