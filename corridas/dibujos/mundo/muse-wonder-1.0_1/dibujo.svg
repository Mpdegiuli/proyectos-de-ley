<circle cx="200" cy="225" r="126" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/>

<!-- fractura central -->
<path d="M202 100 L191 142 L209 178 L190 218 L207 256 L193 302 L203 350" fill="none" stroke="#ff8c42" stroke-width="7" opacity=".55" stroke-linejoin="round"/>
<path d="M202 100 L191 142 L209 178 L190 218 L207 256 L193 302 L203 350" fill="none" stroke="#0a0a0f" stroke-width="3.2" stroke-linejoin="round"/>

<!-- aves que aún migran -->
<g fill="none" stroke="#e2e8f0" stroke-width="1.6" stroke-linecap="round" opacity=".8">
<path d="M46 82 q6 -6 12 0 q6 -6 12 0"/><path d="M82 66 q5 -5 10 0 q5 -5 10 0"/>
</g>

<!-- suelo -->
<path d="M0 346 Q70 326 140 340 Q200 350 268 336 Q340 324 400 342 V400 H0Z" fill="#081112"/>

