<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="sky" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1a2b4a"/>
      <stop offset="60%" stop-color="#0d1530"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>
    <radialGradient id="globe" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="55%" stop-color="#2b5f9e"/>
      <stop offset="100%" stop-color="#123456"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9a5a"/>
      <stop offset="100%" stop-color="#ff5a7a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- estrellas -->
  <g fill="#ffffff">
    <circle cx="30" cy="40" r="1.2" opacity="0.8"/>
    <circle cx="70" cy="90" r="0.8" opacity="0.5"/>
    <circle cx="120" cy="30" r="1" opacity="0.7"/>
    <circle cx="180" cy="60" r="0.7" opacity="0.4"/>
    <circle cx="250" cy="25" r="1.1" opacity="0.8"/>
    <circle cx="310" cy="70" r="0.9" opacity="0.6"/>
    <circle cx="360" cy="35" r="1.3" opacity="0.9"/>
    <circle cx="375" cy="120" r="0.8" opacity="0.5"/>
    <circle cx="20" cy="160" r="0.9" opacity="0.6"/>
    <circle cx="380" cy="200" r="0.7" opacity="0.4"/>
    <circle cx="15" cy="260" r="1" opacity="0.6"/>
    <circle cx="45" cy="330" r="0.8" opacity="0.4"/>
    <circle cx="370" cy="310" r="1" opacity="0.7"/>
    <circle cx="340" cy="370" r="0.9" opacity="0.5"/>
    <circle cx="90" cy="370" r="0.7" opacity="0.4"/>
  </g>

  <!-- planeta tierra -->
  <circle cx="200" cy="210" r="130" fill="url(#globe)"/>

  <!-- continentes estilizados -->
  <g fill="#3f9e5c" opacity="0.9">
    <path d="M120 150 q20 -25 55 -20 q25 5 20 30 q-5 25 -30 30 q-30 5 -45 -10 q-10 -15 0 -30z"/>
    <path d="M230 130 q30 -10 50 10 q20 18 5 40 q-15 20 -40 10 q-25 -12 -25 -32 q0 -20 10 -28z"/>
    <path d="M150 240 q35 -15 60 5 q20 18 5 45 q-15 25 -45 20 q-28 -6 -32 -32 q-2 -25 12 -38z"/>
    <path d="M255 215 q20 -5 30 12 q8 15 -5 28 q-15 13 -30 2 q-13 -12 -8 -27 q3 -11 13 -15z"/>
    <path d="M95 220 q15 -5 22 8 q6 12 -4 22 q-12 10 -24 2 q-9 -9 -6 -20 q2 -8 12 -12z"/>
  </g>
  <!-- hielo polar -->
  <ellipse cx="215" cy="92" rx="34" ry="14" fill="#e8f4ff" opacity="0.9"/>
  <ellipse cx="185" cy="330" rx="28" ry="12" fill="#dff0fa" opacity="0.85"/>

  <!-- redes de conexión -->
  <g stroke="#8fd0ff" stroke-width="1" fill="none" opacity="0.65">
    <path d="M140 165 Q200 120 265 150"/>
    <path d="M150 250 Q230 210 290 240"/>
    <path d="M135 230 Q180 290 190 305"/>
    <path d="M265 160 Q300 200 285 235"/>
    <path d="M125 235 Q90 200 118 165"/>
    <path d="M250 120 Q300 100 335 145"/>
    <path d="M230 130 Q170 105 125 145"/>
  </g>
  <g fill="#bfe6ff">
    <circle cx="140" cy="165" r="2.4"/>
    <circle cx="265" cy="150" r="2.4"/>
    <circle cx="150" cy="250" r="2.4"/>
    <circle cx="290" cy="240" r="2.4"/>
    <circle cx="190" cy="305" r="2.4"/>
    <circle cx="285" cy="235" r="2"/>
    <circle cx="335" cy="145" r="2"/>
    <circle cx="118" cy="165" r="2"/>
  </g>

  <!-- humo / conflicto: nubes grises sobre una zona -->
  <g fill="#6b6f7a" opacity="0.55">
    <ellipse cx="248" cy="196" rx="20" ry="9"/>
    <ellipse cx="262" cy="188" rx="13" ry="7"/>
  </g>
  <!-- llama de conflicto -->
  <g opacity="0.85">
    <path d="M244 210 q4 -12 8 -14 q2 6 6 8 q4 4 2 10 q-3 8 -10 6 q-7 -2 -6 -10z" fill="#ff7a3c"/>
    <path d="M247 211 q3 -7 5 -8 q1 4 3 5 q2 2 1 5 q-2 5 -6 4 q-4 -1 -3 -6z" fill="#ffd166"/>
  </g>

  <!-- atardecer / amanecer detrás del planeta: esperanza -->
  <circle cx="200" cy="210" r="165" fill="url(#glow)" opacity="0.35"/>
  <path d="M60 330 A150 150 0 0 1 340 330" fill="none" stroke="url(#dawn)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- hojas brotando: futuro que crece -->
  <g stroke="#5cc47a" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M200 355 q0 -18 0 -30"/>
    <path d="M200 340 q-12 -4 -16 -16 q12 0 16 8"/>
    <path d="M200 340 q12 -4 16 -16 q-12 0 -16 8"/>
    <path d="M200 327 q-10 -3 -13 -12 q10 0 13 6"/>
    <path d="M200 327 q10 -3 13 -12 q-10 0 -13 6"/>
  </g>
  <circle cx="200" cy="352" r="5" fill="#5cc47a" opacity="0.25"/>

  <!-- satélite -->
  <g transform="translate(320 95) rotate(-20)">
    <rect x="-8" y="-5" width="16" height="10" rx="2" fill="#cdd6e4"/>
    <rect x="-26" y="-4" width="14" height="8" fill="#3b6ea5"/>
    <rect x="12" y="-4" width="14" height="8" fill="#3b6ea5"/>
    <line x1="0" y1="-5" x2="0" y2="-12" stroke="#cdd6e4" stroke-width="1.5"/>
    <circle cx="0" cy="-14" r="2" fill="#8fd0ff"/>
  </g>

  <!-- luna pequeña -->
  <circle cx="70" cy="85" r="10" fill="#e9eef5"/>
  <circle cx="66" cy="82" r="2" fill="#c4ccd8"/>
  <circle cx="74" cy="88" r="1.5" fill="#c4ccd8"/>
</svg>