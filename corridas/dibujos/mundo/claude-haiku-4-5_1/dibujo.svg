<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB6C1;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#skyGradient)"/>
  
  <!-- Sun with glow -->
  <circle cx="320" cy="80" r="45" fill="url(#sunGlow)"/>
  <circle cx="320" cy="80" r="35" fill="#FFD700"/>
  
  <!-- Clouds -->
  <ellipse cx="80" cy="60" rx="40" ry="25" fill="rgba(255,255,255,0.7)"/>
  <ellipse cx="110" cy="65" rx="35" ry="20" fill="rgba(255,255,255,0.7)"/>
  <ellipse cx="50" cy="70" rx="30" ry="18" fill="rgba(255,255,255,0.6)"/>
  
  <!-- Ground -->
  <rect y="250" width="400" height="150" fill="#90EE90"/>
  
  <!-- Trees -->
  <rect x="40" y="200" width="15" height="60" fill="#8B4513"/>
  <polygon points="47,200 20,160 74,160" fill="#228B22"/>
  <polygon points="47,180 30,150 64,150" fill="#32CD32"/>
  
  <rect x="300" y="210" width="12" height="50" fill="#8B4513"/>
  <polygon points="306,210 285,175 327,175" fill="#228B22"/>
  <polygon points="306,195 290,165 322,165" fill="#32CD32"/>
  
  <!-- House -->
  <rect x="150" y="200" width="100" height="80" fill="#CD853F"/>
  <polygon points="150,200 200,140 250,200" fill="#A0522D"/>
  
  <!-- Door -->
  <rect x="190" y="240" width="20" height="40" fill="#654321"/>
  <circle cx="208" cy="260" r="2" fill="#FFD700"/>
  
  <!-- Windows -->
  <rect x="160" y="210" width="15" height="15" fill="#87CEEB"/>
  <line x1="167.5" y1="210" x2="167.5" y2="225" stroke="#654321" stroke-width="1"/>
  <line x1="160" y1="217.5" x2="175" y2="217.5" stroke="#654321" stroke-width="1"/>
  
  <rect x="225" y="210" width="15" height="15" fill="#87CEEB"/>
  <line x1="232.5" y1="210" x2="232.5" y2="225" stroke="#654321" stroke-width="1"/>
  <line x1="225" y1="217.5" x2="240" y2="217.5" stroke="#654321" stroke-width="1"/>
  
  <!-- People figures -->
  <circle cx="100" cy="260" r="8" fill="#FFD7A8"/>
  <rect x="96" y="270" width="8" height="15" fill="#FF6B9D"/>
  <rect x="88" y="275" width="24" height="8" fill="#FF6B9D"/>
  <rect x="96" y="285" width="5" height="15" fill="#4169E1"/>
  <rect x="103" y="285" width="5" height="15" fill="#4169E1"/>
  
  <circle cx="280" cy="255" r="7" fill="#FFD7A8"/>
  <rect x="277" y="263" width="6" height="12" fill="#FF1493"/>
  <rect x="271" y="267" width="18" height="6" fill="#FF1493"/>
  <rect x="277" y="275" width="4" height="12" fill="#228B22"/>
  <rect x="283" y="275" width="4" height="12" fill="#228B22"/>
  
  <!-- Birds in sky -->
  <g stroke="#333" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 50 100 Q 55 95 60 100"/>
    <path d="M 60 100 Q 65 95 70 100"/>
    <path d="M 280 120 Q 285 115 290 120"/>
    <path d="M 290 120 Q 295 115 300 120"/>
  </g>
  
  <!-- Flowers in grass -->
  <circle cx="130" cy="330" r="3" fill="#FF69B4"/>
  <line x1="130" y1="333" x2="130" y2="340" stroke="#32CD32" stroke-width="1"/>
  
  <circle cx="180" cy="340" r="3" fill="#FFB6C1"/>
  <line x1="180" y1="343" x2="180" y2="350" stroke="#32CD32" stroke-width="1"/>
  
  <circle cx="320" cy="320" r="3" fill="#FF69B4"/>
  <line x1="320" y1="323" x2="320" y2="330" stroke="#32CD32" stroke-width="1"/>
  
  <!-- Water reflection of sun (lake) -->
  <ellipse cx="320" cy="350" rx="50" ry="15" fill="rgba(255,215,0,0.3)"/>
</svg>