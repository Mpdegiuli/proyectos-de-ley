<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <filter id="tinta" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <radialGradient id="papel" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#fbf6e9"/>
      <stop offset="1" stop-color="#ecdfc2"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#papel)"/>

  <!-- renglones -->
  <g stroke="#9fb8d6" stroke-width="1">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="280" x2="400" y2="280"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="0" y1="360" x2="400" y2="360"/>
  </g>
  <line x1="52" y1="0" x2="52" y2="400" stroke="#e08a8a" stroke-width="1.5"/>

  <!-- consigna -->
  <text x="64" y="64" font-family="Brush Script MT, Segoe Script, cursive" font-size="22" fill="#7a4b3a">repetir la "o" prolijamente</text>

  <g fill="none" stroke="#1f3a6e" stroke-width="2.2" stroke-linecap="round" filter="url(#tinta)">
    <!-- fila 1 -->
    <g>
      <ellipse cx="80" cy="108" rx="9" ry="11"/>
      <ellipse cx="112" cy="108" rx="9" ry="11"/>
      <ellipse cx="144" cy="108" rx="9" ry="11"/>
      <ellipse cx="176" cy="108" rx="9" ry="11"/>
      <ellipse cx="208" cy="108" rx="9" ry="11"/>
      <ellipse cx="240" cy="108" rx="9" ry="11"/>
      <ellipse cx="272" cy="108" rx="9" ry="11"/>
      <ellipse cx="304" cy="108" rx="9" ry="11"/>
      <ellipse cx="336" cy="108" rx="9" ry="11"/>
    </g>
    <!-- fila 2 -->
    <g>
      <ellipse cx="80" cy="148" rx="9" ry="11"/>
      <ellipse cx="112" cy="148" rx="9" ry="11"/>
      <ellipse cx="144" cy="148" rx="9" ry="11"/>
      <ellipse cx="176" cy="148" rx="9" ry="11"/>
      <ellipse cx="208" cy="148" rx="9" ry="11"/>
      <ellipse cx="240" cy="148" rx="9" ry="11"/>
      <ellipse cx="272" cy="148" rx="9" ry="11"/>
      <ellipse cx="304" cy="148" rx="9" ry="11"/>
      <ellipse cx="336" cy="148" rx="9" ry="11"/>
    </g>
    <!-- fila 3 -->
    <g>
      <ellipse cx="80" cy="188" rx="9" ry="11"/>
      <ellipse cx="112" cy="188" rx="9" ry="11"/>
      <ellipse cx="144" cy="188" rx="9" ry="11"/>
      <ellipse cx="176" cy="188" rx="9" ry="11"/>
      <ellipse cx="208" cy="188" rx="9" ry="11"/>
      <ellipse cx="240" cy="188" rx="9" ry="11"/>
    </g>

    <!-- la "o" que se escapó -->
    <path stroke-width="2.4" d="
      M281 188
      C281 180 272 177 268 184
      C262 194 270 202 279 198
      C300 188 296 150 322 140
      C352 128 372 160 352 178
      C332 196 310 170 330 158
      C350 146 380 168 368 205
      C356 240 300 236 280 220
      C255 200 230 232 250 252
      C268 270 300 250 290 236
      C282 224 262 240 272 258
      C285 282 330 270 340 300
      C348 325 320 340 300 330"/>
  </g>

  <!-- pájaros que salieron del trazo -->
  <g fill="none" stroke="#1f3a6e" stroke-width="1.8" stroke-linecap="round">
    <path d="M300 96 q6 -7 12 0 q6 -7 12 0"/>
    <path d="M336 72 q4 -5 8 0 q4 -5 8 0"/>
    <path d="M362 50 q3 -4 6 0 q3 -4 6 0"/>
  </g>

  <!-- mancha de tinta -->
  <g fill="#1f3a6e">
    <path d="M300 330 C286 322 270 334 278 346 C270 356 290 366 300 356 C312 368 330 354 320 344 C330 334 314 322 300 330 Z" opacity="0.92"/>
    <circle cx="268" cy="330" r="3"/>
    <circle cx="332" cy="362" r="2.5"/>
    <circle cx="262" cy="352" r="1.8"/>
    <circle cx="326" cy="326" r="1.6"/>
  </g>

  <!-- corrección de la maestra -->
  <g font-family="Brush Script MT, Segoe Script, cursive" fill="#c0392b">
    <text x="70" y="270" font-size="26" transform="rotate(-6 70 270)">¡Muy bien!</text>
  </g>
  <path d="M72 278 q60 -14 118 -12" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round"/>
</svg>