<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#faf5ec"/>
      <stop offset="100%" stop-color="#eae2d1"/>
    </radialGradient>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <g id="letterA">
      <path d="M200,70 L120,280" stroke-width="18" stroke-linecap="round" fill="none"/>
      <path d="M200,70 L280,280" stroke-width="18" stroke-linecap="round" fill="none"/>
      <path d="M160,195 L240,195" stroke-width="12" stroke-linecap="round" fill="none"/>
    </g>
    <g id="bird" stroke="#1a1a1a" stroke-linecap="round" fill="none">
      <path d="M0,0 Q-10,-15 -20,-9 Q-10,-5 0,0 Q10,-15 20,-9 Q10,-5 0,0" stroke-width="2"/>
    </g>
    <g id="drop">
      <path d="M0,0 Q3,6 0,8 Q-3,6 0,0" fill="#1a1a1a"/>
    </g>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <g filter="url(#ink)">
    <use href="#letterA" transform="translate(-3,0)" stroke="#00bcd4" opacity="0.25"/>
    <use href="#letterA" transform="translate(3,0)" stroke="#e91e63" opacity="0.25"/>
    <use href="#letterA" stroke="#1a1a1a"/>

    <circle cx="200" cy="70" r="8" fill="#1a1a1a"/>
    <circle cx="195" cy="60" r="2" fill="#1a1a1a"/>
    <circle cx="208" cy="55" r="1.5" fill="#1a1a1a"/>
    <circle cx="190" cy="65" r="1" fill="#1a1a1a"/>
    <circle cx="215" cy="62" r="1.8" fill="#1a1a1a"/>
    <circle cx="205" cy="50" r="1" fill="#1a1a1a"/>
    <circle cx="185" cy="58" r="1.2" fill="#1a1a1a"/>

    <use href="#bird" transform="translate(205,60) rotate(-15) scale(1)" opacity="0.95"/>
    <use href="#bird" transform="translate(220,45) rotate(10) scale(0.8)" opacity="0.85"/>
    <use href="#bird" transform="translate(235,32) rotate(-5) scale(0.65)" opacity="0.75"/>
    <use href="#bird" transform="translate(250,20) rotate(15) scale(0.5)" opacity="0.6"/>
    <use href="#bird" transform="translate(265,10) rotate(-10) scale(0.4)" opacity="0.5"/>
    <use href="#bird" transform="translate(280,2) rotate(5) scale(0.3)" opacity="0.4"/>
    <use href="#bird" transform="translate(240,50) rotate(25) scale(0.45)" opacity="0.55"/>
    <use href="#bird" transform="translate(260,38) rotate(-20) scale(0.35)" opacity="0.5"/>
    <use href="#bird" transform="translate(225,55) rotate(0) scale(0.7)" opacity="0.9"/>

    <use href="#drop" transform="translate(155,205) scale(0.8)" opacity="0.8"/>
    <use href="#drop" transform="translate(165,210) scale(0.6)" opacity="0.7"/>
    <use href="#drop" transform="translate(245,205) scale(0.7)" opacity="0.8"/>
    <use href="#drop" transform="translate(235,212) scale(0.5)" opacity="0.6"/>

    <use href="#drop" transform="translate(125,285) scale(0.9)" opacity="0.7"/>
    <use href="#drop" transform="translate(135,292) scale(0.6)" opacity="0.5"/>
    <use href="#drop" transform="translate(275,285) scale(0.8)" opacity="0.7"/>
    <use href="#drop" transform="translate(265,290) scale(0.5)" opacity="0.5"/>

    <circle cx="140" cy="300" r="3" fill="#1a1a1a" opacity="0.6"/>
    <circle cx="150" cy="305" r="1.5" fill="#1a1a1a" opacity="0.5"/>
    <circle cx="260" cy="300" r="2.5" fill="#1a1a1a" opacity="0.6"/>
    <circle cx="270" cy="308" r="1.2" fill="#1a1a1a" opacity="0.5"/>
  </g>

  <text x="15" y="25" font-family="Courier, monospace" font-size="12" fill="#666">PRUEBA DE IMPRENTA Nº 47</text>
  <text x="15" y="40" font-family="Courier, monospace" font-size="10" fill="#888">Tinta corrida - Revisar</text>

  <g transform="translate(320,300) rotate(-15)" opacity="0.6">
    <rect x="-50" y="-20" width="100" height="40" rx="5" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="0" y="5" font-family="Courier, monospace" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="bold">ERROR</text>
  </g>
</svg>