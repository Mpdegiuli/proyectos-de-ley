  <circle cx="338" cy="288" r="4" fill="#f6b84f" stroke="#d98a2b" stroke-width="2"/>

  <!-- cara contenta -->
  <path d="M 212 192 C 216 186, 224 186, 228 192" fill="none" stroke="#7a4a1d" stroke-width="4" stroke-linecap="round"/>
  <path d="M 264 190 C 268 184, 276 184, 280 190" fill="none" stroke="#7a4a1d" stroke-width="4" stroke-linecap="round"/>
