    <circle cx="88" cy="301" r="6"/>
    <circle cx="104" cy="301" r="6"/>
    <circle cx="92" cy="309" r="6"/>
    <circle cx="101" cy="309" r="6"/>
  </g>
  <circle cx="96" cy="303" r="4" fill="#f6b84f"/>
  <g fill="#8aa7d6">
    <circle cx="331" cy="301" r="5"/>
    <circle cx="324" cy="306" r="5"/>
    <circle cx="338" cy="306" r="5"/>
    <circle cx="327" cy="313" r="5"/>
    <circle cx="335" cy="313" r="5"/>
  </g>
  <circle cx="331" cy="307" r="3.5" fill="#f6b84f"/>
  <circle cx="55" cy="320" r="5" fill="#e07a9a"/>

  <!-- pasto -->
  <g stroke="#7fae68" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 40 356 C 42 348, 40 344, 43 338"/>
    <path d="M 70 356 C 68 349, 71 345, 69 339"/>
    <path d="M 120 356 C 122 349, 120 344, 123 340"/>
    <path d="M 290 356 C 292 349, 290 344, 293 339"/>
