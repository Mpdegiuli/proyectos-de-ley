  <path d="M 20 358 C 120 352, 280 352, 380 358" fill="none" stroke="#9fbe8a" stroke-width="3" stroke-linecap="round"/>

  <!-- firma -->
  <text x="200" y="388" font-family="Georgia, serif" font-size="19" fill="#7a4a1d" text-anchor="middle" font-style="italic">el error — me gusta más así ♥</text>
</svg>