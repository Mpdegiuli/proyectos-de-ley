  <circle cx="200" cy="214" r="8" fill="#ef8f6a" opacity="0.6"/>
  <circle cx="292" cy="212" r="8" fill="#ef8f6a" opacity="0.6"/>

  <!-- del error crecen cosas -->
  <g stroke="#6e9a5b" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 95 352 C 95 330, 100 318, 96 300"/>
    <path d="M 95 330 C 86 326, 82 320, 80 312"/>
    <path d="M 330 352 C 332 334, 326 322, 331 306"/>
    <path d="M 55 352 C 54 340, 58 332, 55 324"/>
