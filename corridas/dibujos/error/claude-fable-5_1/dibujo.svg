  <line x1="48" y1="115" x2="122" y2="41" stroke="#c45b4e" stroke-width="4" stroke-linecap="round"/>
  <line x1="48" y1="41" x2="122" y2="115" stroke="#c45b4e" stroke-width="4" stroke-linecap="round"/>
  <text x="85" y="140" font-family="Georgia, serif" font-size="13" fill="#9a9183" text-anchor="middle" font-style="italic">la versión correcta</text>

  <!-- flecha de arrepentimiento feliz -->
  <path d="M 130 95 C 160 130, 150 160, 170 175" fill="none" stroke="#9a9183" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round"/>
  <path d="M 162 168 L 172 178 L 158 180" fill="none" stroke="#9a9183" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

