<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Cielo -->
  <rect width="400" height="400" fill="#aee3f5"/>
  <!-- Sol -->
  <circle cx="330" cy="60" r="30" fill="#ffd93b"/>
  <circle cx="330" cy="60" r="38" fill="#ffd93b" opacity="0.3"/>
  <!-- Nubes -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="80" cy="60" rx="35" ry="15"/>
    <ellipse cx="105" cy="52" rx="28" ry="13"/>
    <ellipse cx="60" cy="52" rx="22" ry="11"/>
    <ellipse cx="230" cy="95" rx="30" ry="12"/>
    <ellipse cx="252" cy="88" rx="22" ry="10"/>
  </g>
  <!-- Pasto -->
  <rect y="300" width="400" height="100" fill="#7cc35a"/>
  <ellipse cx="200" cy="305" rx="260" ry="18" fill="#8fd06c"/>
  <!-- Camino -->
  <path d="M185 400 L192 300 L208 300 L215 400 Z" fill="#d9b98a"/>
  <path d="M185 400 L192 300 L208 300 L215 400 Z" fill="none" stroke="#c4a271" stroke-width="2"/>
  <!-- Cuerpo de la casa -->
  <rect x="100" y="180" width="200" height="120" fill="#f5e0b7" stroke="#b58a4a" stroke-width="3"/>
  <!-- Techo -->
  <path d="M85 185 L200 100 L315 185 Z" fill="#c0392b" stroke="#8e2a20" stroke-width="3" stroke-linejoin="round"/>
  <!-- Chimenea -->
  <rect x="255" y="115" width="24" height="45" fill="#9c5a3c" stroke="#7a4630" stroke-width="2"/>
  <rect x="251" y="108" width="32" height="10" fill="#7a4630"/>
  <!-- Humo -->
  <g fill="#e8e8e8" opacity="0.8">
    <circle cx="270" cy="95" r="7"/>
    <circle cx="278" cy="82" r="9"/>
    <circle cx="270" cy="66" r="11"/>
  </g>
  <!-- Puerta -->
  <rect x="180" y="230" width="40" height="70" rx="4" fill="#8b5a2b" stroke="#6e4520" stroke-width="3"/>
  <circle cx="211" cy="267" r="3" fill="#ffd93b"/>
  <!-- Ventana izquierda -->
  <g>
    <rect x="120" y="210" width="40" height="40" fill="#bfe9ff" stroke="#6e4520" stroke-width="3"/>
    <line x1="140" y1="210" x2="140" y2="250" stroke="#6e4520" stroke-width="2"/>
    <line x1="120" y1="230" x2="160" y2="230" stroke="#6e4520" stroke-width="2"/>
  </g>
  <!-- Ventana derecha -->
  <g>
    <rect x="240" y="210" width="40" height="40" fill="#bfe9ff" stroke="#6e4520" stroke-width="3"/>
    <line x1="260" y1="210" x2="260" y2="250" stroke="#6e4520" stroke-width="2"/>
    <line x1="240" y1="230" x2="280" y2="230" stroke="#6e4520" stroke-width="2"/>
  </g>
  <!-- Ventana del ático -->
  <circle cx="200" cy="150" r="16" fill="#bfe9ff" stroke="#8e2a20" stroke-width="3"/>
  <line x1="200" y1="134" x2="200" y2="166" stroke="#8e2a20" stroke-width="2"/>
  <line x1="184" y1="150" x2="216" y2="150" stroke="#8e2a20" stroke-width="2"/>
  <!-- Arbustos -->
  <g fill="#4e9b3d">
    <circle cx="115" cy="298" r="16"/>
    <circle cx="140" cy="300" r="13"/>
    <circle cx="285" cy="298" r="16"/>
    <circle cx="262" cy="300" r="13"/>
  </g>
  <!-- Flores -->
  <g>
    <circle cx="70" cy="330" r="5" fill="#ff6f91"/>
    <line x1="70" y1="335" x2="70" y2="350" stroke="#3d7a2e" stroke-width="2"/>
    <circle cx="330" cy="335" r="5" fill="#ffb347"/>
    <line x1="330" y1="340" x2="330" y2="355" stroke="#3d7a2e" stroke-width="2"/>
    <circle cx="95" cy="350" r="5" fill="#ffd93b"/>
    <line x1="95" y1="355" x2="95" y2="370" stroke="#3d7a2e" stroke-width="2"/>
    <circle cx="305" cy="355" r="5" fill="#ff6f91"/>
    <line x1="305" y1="360" x2="305" y2="375" stroke="#3d7a2e" stroke-width="2"/>
  </g>
</svg>