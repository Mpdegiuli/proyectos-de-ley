<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f0"/>
      <stop offset="1" stop-color="#dff3fb"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc25a"/>
      <stop offset="1" stop-color="#4f9a38"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e3b8"/>
      <stop offset="1" stop-color="#e2c28a"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8503a"/>
      <stop offset="1" stop-color="#8e3223"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfefff"/>
      <stop offset="1" stop-color="#6fb2d8"/>
    </linearGradient>
  </defs>

  <!-- fondo -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="330" cy="70" r="32" fill="#fff4a8"/>
  <circle cx="330" cy="70" r="40" fill="#fff4a8" opacity="0.3"/>

  <!-- nubes -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="80" cy="70" rx="34" ry="16"/>
    <ellipse cx="105" cy="62" rx="26" ry="18"/>
    <ellipse cx="60" cy="64" rx="22" ry="14"/>
    <ellipse cx="240" cy="110" rx="28" ry="12"/>
    <ellipse cx="260" cy="103" rx="20" ry="14"/>
  </g>

  <!-- pasto -->
  <rect x="0" y="290" width="400" height="110" fill="url(#grass)"/>
  <ellipse cx="200" cy="292" rx="260" ry="14" fill="#7cc25a"/>

  <!-- camino -->
  <path d="M185 330 L215 330 L245 400 L155 400 Z" fill="#c9b79c"/>
  <path d="M190 345 h20 M182 365 h36 M175 385 h50" stroke="#b39f82" stroke-width="3" stroke-linecap="round"/>

  <!-- cuerpo de la casa -->
  <rect x="100" y="180" width="200" height="150" fill="url(#wall)" stroke="#8b6a3e" stroke-width="3"/>

  <!-- chimenea -->
  <rect x="245" y="105" width="28" height="60" fill="#9c4b3a" stroke="#6b2f22" stroke-width="3"/>
  <rect x="240" y="100" width="38" height="12" fill="#6b2f22"/>
  <g fill="#e6e6e6" opacity="0.7">
    <circle cx="260" cy="88" r="7"/>
    <circle cx="268" cy="74" r="9"/>
    <circle cx="262" cy="58" r="11"/>
  </g>

  <!-- techo -->
  <polygon points="85,185 200,90 315,185" fill="url(#roof)" stroke="#6b2f22" stroke-width="4" stroke-linejoin="round"/>
  <g stroke="#6b2f22" stroke-width="1.5" opacity="0.5">
    <line x1="120" y1="156" x2="280" y2="156"/>
    <line x1="140" y1="140" x2="260" y2="140"/>
    <line x1="160" y1="124" x2="240" y2="124"/>
    <line x1="180" y1="108" x2="220" y2="108"/>
  </g>

  <!-- ventana ática -->
  <circle cx="200" cy="150" r="16" fill="url(#glass)" stroke="#6b3f1e" stroke-width="3"/>
  <line x1="200" y1="134" x2="200" y2="166" stroke="#6b3f1e" stroke-width="2"/>
  <line x1="184" y1="150" x2="216" y2="150" stroke="#6b3f1e" stroke-width="2"/>

  <!-- puerta -->
  <rect x="178" y="250" width="44" height="80" rx="4" fill="#7a4a24" stroke="#4d2c12" stroke-width="3"/>
  <rect x="185" y="258" width="30" height="30" fill="none" stroke="#4d2c12" stroke-width="2"/>
  <circle cx="213" cy="298" r="3" fill="#f2c94c"/>
  <path d="M170 250 h60 v-8 a30 8 0 0 0 -60 0 z" fill="#c8503a" stroke="#6b2f22" stroke-width="2"/>

  <!-- ventana izquierda -->
  <rect x="120" y="210" width="44" height="44" fill="url(#glass)" stroke="#6b3f1e" stroke-width="3"/>
  <line x1="142" y1="210" x2="142" y2="254" stroke="#6b3f1e" stroke-width="2"/>
  <line x1="120" y1="232" x2="164" y2="232" stroke="#6b3f1e" stroke-width="2"/>
  <rect x="114" y="254" width="56" height="6" fill="#8b6a3e"/>
  <rect x="110" y="208" width="8" height="48" fill="#3a7ca5"/>
  <rect x="166" y="208" width="8" height="48" fill="#3a7ca5"/>

  <!-- ventana derecha -->
  <rect x="236" y="210" width="44" height="44" fill="url(#glass)" stroke="#6b3f1e" stroke-width="3"/>
  <line x1="258" y1="210" x2="258" y2="254" stroke="#6b3f1e" stroke-width="2"/>
  <line x1="236" y1="232" x2="280" y2="232" stroke="#6b3f1e" stroke-width="2"/>
  <rect x="230" y="254" width="56" height="6" fill="#8b6a3e"/>
  <rect x="226" y="208" width="8" height="48" fill="#3a7ca5"/>
  <rect x="282" y="208" width="8" height="48" fill="#3a7ca5"/>

  <!-- maceteros -->
  <g>
    <rect x="118" y="260" width="48" height="10" rx="2" fill="#a0522d"/>
    <circle cx="126" cy="258" r="4" fill="#ff6b81"/>
    <circle cx="138" cy="256" r="4" fill="#ffd166"/>
    <circle cx="150" cy="258" r="4" fill="#ff6b81"/>
    <circle cx="160" cy="256" r="4" fill="#ffd166"/>
    <rect x="234" y="260" width="48" height="10" rx="2" fill="#a0522d"/>
    <circle cx="242" cy="258" r="4" fill="#ffd166"/>
    <circle cx="254" cy="256" r="4" fill="#ff6b81"/>
    <circle cx="266" cy="258" r="4" fill="#ffd166"/>
    <circle cx="276" cy="256" r="4" fill="#ff6b81"/>
  </g>

  <!-- arbustos -->
  <g fill="#3f8f3a">
    <ellipse cx="120" cy="330" rx="26" ry="16"/>
    <ellipse cx="145" cy="334" rx="18" ry="12"/>
    <ellipse cx="280" cy="330" rx="26" ry="16"/>
    <ellipse cx="256" cy="334" rx="18" ry="12"/>
  </g>
  <g fill="#5fb050">
    <ellipse cx="116" cy="326" rx="14" ry="9"/>
    <ellipse cx="284" cy="326" rx="14" ry="9"/>
  </g>

  <!-- árbol -->
  <rect x="42" y="250" width="16" height="60" fill="#7a4a24"/>
  <circle cx="50" cy="230" r="34" fill="#3f8f3a"/>
  <circle cx="30" cy="248" r="24" fill="#4fa345"/>
  <circle cx="72" cy="250" r="22" fill="#4fa345"/>
  <circle cx="50" cy="212" r="20" fill="#5fb050"/>

  <!-- cerca -->
  <g fill="#f5f0e6" stroke="#bbb" stroke-width="1">
    <rect x="320" y="300" width="8" height="34"/>
    <rect x="338" y="300" width="8" height="34"/>
    <rect x="356" y="300" width="8" height="34"/>
    <rect x="374" y="300" width="8" height="34"/>
    <rect x="316" y="308" width="70" height="5"/>
    <rect x="316" y="322" width="70" height="5"/>
  </g>
</svg>