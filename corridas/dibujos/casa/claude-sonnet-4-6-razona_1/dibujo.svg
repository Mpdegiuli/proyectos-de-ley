  <rect x="356" y="255" width="12" height="52" fill="#6D4C41"/>
  <circle cx="362" cy="238" r="32" fill="#2E7D32"/>
  <circle cx="347" cy="252" r="22" fill="#388E3C"/>
  <circle cx="378" cy="253" r="20" fill="#33691E"/>

