    <use href="#tr" transform="translate(118,278) scale(.72)"/>
    <use href="#tr" transform="translate(66,306) scale(1.05)"/>
    <use href="#tr" transform="translate(312,262) scale(.9)"/>
    <use href="#tr" transform="translate(342,278) scale(.68)"/>
    <use href="#tr" transform="translate(326,312) scale(.82)"/>
