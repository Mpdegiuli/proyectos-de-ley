<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1033"/>
      <stop offset="0.6" stop-color="#2a1a4f"/>
      <stop offset="1" stop-color="#4b2a6e"/>
    </linearGradient>
    <radialGradient id="luna" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7d9"/>
      <stop offset="0.6" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tronco" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3b1f4e"/>
      <stop offset="0.5" stop-color="#6b3fa0"/>
      <stop offset="1" stop-color="#9b6fd4"/>
    </linearGradient>
    <radialGradient id="fruta" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#7df9ff"/>
      <stop offset="1" stop-color="#1899a8"/>
    </radialGradient>
    <radialGradient id="fruta2" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff0ff"/>
      <stop offset="0.4" stop-color="#ff8ad8"/>
      <stop offset="1" stop-color="#b0308a"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="suelo" cx="0.5" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#3d2b63"/>
      <stop offset="1" stop-color="#1a1035"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#cielo)"/>

  <!-- estrellas -->
  <g fill="#fff">
    <circle cx="40" cy="40" r="1.4"/><circle cx="90" cy="70" r="1"/>
    <circle cx="150" cy="30" r="1.2"/><circle cx="330" cy="50" r="1.5"/>
    <circle cx="370" cy="110" r="1"/><circle cx="300" cy="25" r="1"/>
    <circle cx="25" cy="140" r="1.1"/><circle cx="210" cy="18" r="1.3"/>
    <circle cx="60" cy="210" r="0.9"/><circle cx="360" cy="190" r="1.1"/>
  </g>

  <circle cx="320" cy="75" r="55" fill="url(#luna)" opacity="0.9"/>
  <circle cx="320" cy="75" r="26" fill="#fff3c4"/>

  <!-- suelo flotante -->
  <ellipse cx="200" cy="345" rx="150" ry="32" fill="url(#suelo)"/>
  <ellipse cx="200" cy="340" rx="140" ry="24" fill="#4a3576"/>
  <path d="M70 352 Q90 385 120 378 M330 352 Q320 388 285 380 M200 369 Q200 395 180 392" stroke="#3a2a5e" stroke-width="5" fill="none" stroke-linecap="round"/>

