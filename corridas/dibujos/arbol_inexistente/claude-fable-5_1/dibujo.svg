    <path d="M84 56 A15 15 0 0 1 114 56 Q114 63 99 63 Q84 63 84 56Z" fill="#8fe8ff" opacity="0.85"/>
    <path d="M90 62 q-2 11 2 18 M99 63 q0 13 -2 19 M108 62 q3 10 0 17" stroke="#aef" stroke-width="2" fill="none" opacity="0.7"/>

    <circle cx="300" cy="102" r="18" fill="url(#halo)"/>
    <path d="M288 102 A12 12 0 0 1 312 102 Q312 108 300 108 Q288 108 288 102Z" fill="#ffb3e6" opacity="0.85"/>
    <path d="M293 107 q-1 9 2 14 M300 108 q0 10 -1 15 M307 107 q2 8 0 13" stroke="#fdf" stroke-width="1.8" fill="none" opacity="0.7"/>

