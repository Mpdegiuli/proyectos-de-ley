    <path d="M206 105 Q230 85 265 80" stroke-width="7"/>
    <path d="M206 110 Q175 88 140 92" stroke-width="7"/>
    <path d="M208 100 Q210 70 200 50" stroke-width="6"/>
    <path d="M265 80 Q290 72 305 55" stroke-width="4"/>
    <path d="M265 80 Q280 95 300 100" stroke-width="4"/>
