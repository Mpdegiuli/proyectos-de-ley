    <path d="M140 128 q-1 8 2 13 M147 129 q0 9 -1 14 M154 128 q2 7 0 12" stroke="#aef" stroke-width="1.8" fill="none" opacity="0.7"/>
  </g>

  <!-- frutas burbuja colgantes -->
  <g>
    <line x1="235" y1="88" x2="235" y2="118" stroke="#b9e" stroke-width="1.5"/>
    <circle cx="235" cy="126" r="9" fill="url(#fruta)"/>
    <line x1="165" y1="92" x2="165" y2="126" stroke="#b9e" stroke-width="1.5"/>
    <circle cx="165" cy="134" r="9" fill="url(#fruta2)"/>
    <line x1="222" y1="152" x2="222" y2="178" stroke="#b9e" stroke-width="1.5"/>
    <circle cx="222" cy="186" r="8" fill="url(#fruta2)"/>
    <line x1="178" y1="148" x2="178" y2="170" stroke="#b9e" stroke-width="1.5"/>
    <circle cx="178" cy="178" r="8" fill="url(#fruta)"/>
  </g>

  <!-- esporas luminosas -->
  <g fill="#bffcff" opacity="0.8">
    <circle cx="245" cy="210" r="2.5"/>
    <circle cx="160" cy="225" r="2"/>
    <circle cx="270" cy="260" r="2.2"/>
    <circle cx="130" cy="270" r="1.8"/>
    <circle cx="235" cy="300" r="2"/>
    <circle cx="300" cy="180" r="1.8"/>
    <circle cx="108" cy="175" r="2"/>
