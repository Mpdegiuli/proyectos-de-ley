  <path d="M185 340 C170 300 215 285 200 245 C188 212 212 195 202 160 C195 135 208 120 204 100
           L212 100 C218 128 203 140 211 164 C220 196 196 214 208 246 C219 282 178 300 196 340 Z"
        fill="url(#tronco)" stroke="#2b1540" stroke-width="2"/>
  <path d="M190 330 C180 305 210 290 200 260 M198 230 C192 210 210 200 204 178"
