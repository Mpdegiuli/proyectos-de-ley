    <path d="M182 48 A18 18 0 0 1 218 48 Q218 56 200 56 Q182 56 182 48Z" fill="#8fe8ff" opacity="0.85"/>
    <path d="M188 55 q-2 14 3 22 M200 56 q0 16 -2 24 M212 55 q3 13 -1 22" stroke="#aef" stroke-width="2" fill="none" opacity="0.7"/>

