    <path d="M83 110 A12 12 0 0 1 107 110 Q107 116 95 116 Q83 116 83 110Z" fill="#ffb3e6" opacity="0.85"/>
    <path d="M88 115 q-1 9 2 14 M95 116 q0 10 -1 15 M102 115 q2 8 0 13" stroke="#fdf" stroke-width="1.8" fill="none" opacity="0.7"/>

