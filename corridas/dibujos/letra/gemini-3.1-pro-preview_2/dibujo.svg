<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0B2E24"/>
      <stop offset="60%" stop-color="#051712"/>
      <stop offset="100%" stop-color="#010403"/>
    </radialGradient>

    <linearGradient id="g_light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#FDEBAE"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#F8E192"/>
    </linearGradient>

    <linearGradient id="g_dark" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="20%" stop-color="#AA771C"/>
      <stop offset="50%" stop-color="#664210"/>
      <stop offset="80%" stop-color="#3D2608"/>
      <stop offset="100%" stop-color="#8B5A14"/>
    </linearGradient>

    <linearGradient id="g_mid" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#AA771C"/>
      <stop offset="50%" stop-color="#FDEBAE"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.9"/>
    </filter>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <g id="corner">
      <path d="M 15,60 L 60,60 L 60,15 M 15,75 L 75,75 L 75,15 M 15,90 L 90,90 L 90,15" fill="none" stroke="url(#g_light)" stroke-width="1.5" opacity="0.6"/>
    </g>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <rect x="15" y="15" width="370" height="370" fill="none" stroke="url(#g_light)" stroke-width="1.5" opacity="0.8"/>
  <rect x="22" y="22" width="356" height="356" fill="none" stroke="url(#g_dark)" stroke-width="1" opacity="0.5"/>

  <use href="#corner"/>
  <use href="#corner" transform="rotate(90 200 200)"/>
  <use href="#corner" transform="rotate(180 200 200)"/>
  <use href="#corner" transform="rotate(270 200 200)"/>

  <path d="M 200,260 L 0,60 M 200,260 L 30,20 M 200,260 L 100,0 M 200,260 L 200,0 M 200,260 L 300,0 M 200,260 L 370,20 M 200,260 L 400,60 M 200,260 L 0,140 M 200,260 L 400,140 M 200,260 L 0,220 M 200,260 L 400,220" stroke="url(#g_mid)" stroke-width="1.5" opacity="0.15" fill="none"/>

  <path d="M 60,80 L 50,100 L 60,120 L 70,100 Z M 340,80 L 330,100 L 340,120 L 350,100 Z" fill="url(#g_light)" opacity="0.4"/>
  <path d="M 100,150 L 95,160 L 100,170 L 105,160 Z M 300,150 L 295,160 L 300,170 L 305,160 Z" fill="url(#g_dark)" opacity="0.5"/>

  <line x1="20" y1="340" x2="380" y2="340" stroke="url(#g_mid)" stroke-width="2" opacity="0.6"/>
  <line x1="40" y1="350" x2="360" y2="350" stroke="url(#g_mid)" stroke-width="1" opacity="0.3"/>

  <path d="M 120,385 A 80,80 0 0,1 280,385" fill="none" stroke="url(#g_dark)" stroke-width="2"/>
  <path d="M 150,385 A 50,50 0 0,1 250,385" fill="none" stroke="url(#g_light)" stroke-width="2"/>
  <path d="M 175,385 A 25,25 0 0,1 225,385" fill="none" stroke="url(#g_dark)" stroke-width="2"/>

  <g filter="url(#shadow)">
    <path d="M 125,210 L 275,210 L 285,230 L 115,230 Z" fill="url(#g_mid)"/>
    <path d="M 100,260 L 300,260 L 305,270 L 95,270 Z" fill="url(#g_dark)"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M 200,60 L 60,340 L 100,340 L 200,140 Z" fill="url(#g_light)"/>
    <path d="M 200,60 L 340,340 L 300,340 L 200,140 Z" fill="url(#g_dark)"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M 200,180 L 120,340 L 130,340 L 200,200 Z" fill="url(#g_light)"/>
    <path d="M 200,180 L 280,340 L 270,340 L 200,200 Z" fill="url(#g_dark)"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M 200,240 L 150,340 L 160,340 L 200,260 Z" fill="url(#g_light)"/>
    <path d="M 200,240 L 250,340 L 240,340 L 200,260 Z" fill="url(#g_dark)"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M 200,290 L 130,280 L 135,270 L 200,275 Z" fill="url(#g_light)"/>
    <path d="M 200,290 L 270,280 L 265,270 L 200,275 Z" fill="url(#g_dark)"/>
  </g>

  <circle cx="200" cy="40" r="22" fill="#FFEA8C" filter="url(#blur)" opacity="0.5"/>

  <g filter="url(#shadow)">
    <path d="M 200,15 L 185,40 L 200,65 Z" fill="url(#g_light)"/>
    <path d="M 200,15 L 215,40 L 200,65 Z" fill="url(#g_dark)"/>

    <path d="M 200,65 L 194,140 L 200,360 Z" fill="url(#g_light)"/>
    <path d="M 200,65 L 206,140 L 200,360 Z" fill="url(#g_dark)"/>

    <path d="M 200,265 L 190,275 L 200,285 Z" fill="url(#g_light)"/>
    <path d="M 200,265 L 210,275 L 200,285 Z" fill="url(#g_dark)"/>

    <path d="M 200,350 L 190,360 L 200,370 Z" fill="url(#g_light)"/>
    <path d="M 200,350 L 210,360 L 200,370 Z" fill="url(#g_dark)"/>
  </g>
</svg>