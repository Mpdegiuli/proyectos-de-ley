<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t d">
 <title id="t">La eÑe</title>
 <desc id="d">Una letra Ñ monumental en ámbar sobre un fondo petróleo profundo, con halo, rayos giratorios, anillos, texto orbital, destellos y su virgulilla flotando.</desc>
 <defs>
  <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#103a41"/>
   <stop offset="1" stop-color="#061d22"/>
  </linearGradient>
  <linearGradient id="tinta" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#ffdf8e"/>
   <stop offset=".45" stop-color="#ffa83e"/>
   <stop offset="1" stop-color="#ee5a28"/>
  </linearGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5">
   <stop offset="0" stop-color="#ffc25d" stop-opacity=".38"/>
   <stop offset=".55" stop-color="#ff9a3d" stop-opacity=".12"/>
   <stop offset="1" stop-color="#ff9a3d" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vin" cx=".5" cy=".45" r=".78">
   <stop offset=".55" stop-color="#000" stop-opacity="0"/>
   <stop offset="1" stop-color="#02090b" stop-opacity=".55"/>
  </radialGradient>
  <pattern id="lunares" width="16" height="16" patternUnits="userSpaceOnUse">
   <circle cx="4" cy="4" r="1.6" fill="#1f5b62"/>
  </pattern>
  <path id="orb" d="M50 205 A150 150 0 1 1 350 205 A150 150 0 1 1 50 205" fill="none"/>
  <line id="ray" x1="200" y1="28" x2="200" y2="56"/>
  <path id="chispa" d="M0 -8 L2.2 -2.2 L8 0 L2.2 2.2 L0 8 L-2.2 2.2 L-8 0 L-2.2 -2.2 Z"/>
 </defs>
 <style>
  .ene{transform-box:fill-box;transform-origin:50% 55%;cursor:pointer;
   transition:transform .5s cubic-bezier(.22,1,.36,1)}
  .ene:hover{transform:translateY(-9px) rotate(-1.6deg)}
  .ene:active{transform:translateY(-2px) scale(.985)}
  text{user-select:none}
 </style>

 <rect width="400" height="400" fill="url(#fondo)"/>
 <circle cx="330" cy="332" r="92" fill="url(#lunares)" opacity=".55"/>
 <circle cx="52" cy="66" r="62" fill="url(#lunares)" opacity=".35"/>

 <g stroke="#f6c45c" stroke-width="2.5" stroke-linecap="round" opacity=".3">
  <use href="#ray"/><use href="#ray" transform="rotate(30 200 205)"/>
  <use href="#ray" transform="rotate(60 200 205)"/><use href="#ray" transform="rotate(90 200 205)"/>
  <use href="#ray" transform="rotate(120 200 205)"/><use href="#ray" transform="rotate(150 200 205)"/>
  <use href="#ray" transform="rotate(180 200 205)"/><use href="#ray" transform="rotate(210 200 205)"/>
  <use href="#ray" transform="rotate(240 200 205)"/><use href="#ray" transform="rotate(270 200 205)"/>
  <use href="#ray" transform="rotate(300 200 205)"/><use href="#ray" transform="rotate(330 200 205)"/>
  <animateTransform attributeName="transform" type="rotate" from="0 200 205" to="360 200 205" dur="90s" repeatCount="indefinite"/>
 </g>

 <circle cx="200" cy="205" r="120" fill="none" stroke="#2b6b71" stroke-width="1" opacity=".45"/>
 <g>
  <circle cx="200" cy="205" r="160" fill="none" stroke="#2b6b71" stroke-width="1.5" stroke-dasharray="2 11" opacity=".6"/>
  <animateTransform attributeName="transform" type="rotate" from="360 200 205" to="0 200 205" dur="70s" repeatCount="indefinite"/>
 </g>
 <g opacity=".38">
  <text font-family="Futura,'Trebuchet MS','Segoe UI',sans-serif" font-size="12.5" letter-spacing="5" fill="#ead9be">
   <textPath href="#orb">EÑE • EÑE • EÑE • EÑE • EÑE • EÑE • EÑE • EÑE • EÑE • EÑE • EÑE •</textPath>
  </text>
  <animateTransform attributeName="transform" type="rotate" from="0 200 205" to="360 200 205" dur="80s" repeatCount="indefinite"/>
 </g>

 <circle r="4" fill="#ffd873">
  <animateMotion dur="16s" repeatCount="indefinite" path="M200,77 a128,128 0 1,1 -0.1,0"/>
 </circle>
 <circle r="2.5" fill="#ff8a5c">
  <animateMotion dur="16s" begin="-8s" repeatCount="indefinite" path="M200,77 a128,128 0 1,1 -0.1,0"/>
 </circle>

 <ellipse cx="200" cy="212" rx="158" ry="148" fill="url(#halo)">
  <animate attributeName="opacity" values=".6;.95;.6" dur="6s" repeatCount="indefinite"/>
 </ellipse>
 <ellipse cx="200" cy="352" rx="112" ry="12" fill="#031114" opacity=".6"/>

 <!-- sombras fijas y registro desfasado -->
 <g transform="translate(-8 -7)" fill="none" stroke="#ff6b4a" stroke-width="2.5" stroke-linejoin="round" opacity=".5">
  <path d="M95 330 V115 H150 L250 250 V115 H305 V330 H250 L150 195 V330 Z"/>
  <path d="M151 88 C163 58 183 56 200 72 C217 88 237 86 249 58"/>
 </g>
 <g transform="translate(11 12)" fill="#051a1e" stroke="#051a1e" stroke-linejoin="round" opacity=".85">
  <path d="M95 330 V115 H150 L250 250 V115 H305 V330 H250 L150 195 V330 Z" stroke-width="12"/>
  <path d="M151 88 C163 58 183 56 200 72 C217 88 237 86 249 58" fill="none" stroke-width="26" stroke-linecap="round"/>
 </g>

 <!-- letra -->
 <g class="ene">
  <path d="M95 330 V115 H150 L250 250 V115 H305 V330 H250 L150 195 V330 Z"
   fill="url(#tinta)" stroke="url(#tinta)" stroke-width="12" stroke-linejoin="round"/>
  <path d="M95 330 V115 H150 L250 250 V115 H305 V330 H250 L150 195 V330 Z"
   fill="none" stroke="#ffefc4" stroke-width="2.4" stroke-linejoin="round" opacity=".5"/>
  <g>
   <path d="M151 88 C163 58 183 56 200 72 C217 88 237 86 249 58"
    fill="none" stroke="url(#tinta)" stroke-width="26" stroke-linecap="round"/>
   <path d="M151 88 C163 58 183 56 200 72 C217 88 237 86 249 58" pathLength="100"
    fill="none" stroke="#fff3d0" stroke-width="5" stroke-linecap="round" opacity=".85"
    stroke-dasharray="16 84">
    <animate attributeName="stroke-dashoffset" values="100;0" dur="3s" repeatCount="indefinite"/>
   </path>
   <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0"
    dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
  </g>
 </g>

 <!-- destellos y burbujas -->
 <use href="#chispa" fill="#ffe9a8" transform="translate(84 74)">
  <animate attributeName="opacity" values=".25;1;.25" dur="3.2s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="scale" additive="sum" values=".7;1.15;.7" dur="3.2s" repeatCount="indefinite"/>
 </use>
 <use href="#chispa" fill="#ffd873" transform="translate(322 100)">
  <animate attributeName="opacity" values=".2;1;.2" dur="2.6s" begin="-1.2s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="scale" additive="sum" values=".6;1;.6" dur="2.6s" begin="-1.2s" repeatCount="indefinite"/>
 </use>
 <use href="#chispa" fill="#ff8a5c" transform="translate(326 314)">
  <animate attributeName="opacity" values=".15;.9;.15" dur="3.8s" begin="-2s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="scale" additive="sum" values=".5;.9;.5" dur="3.8s" begin="-2s" repeatCount="indefinite"/>
 </use>
 <path d="M352 58 v14 M345 65 h14" stroke="#ead9be" stroke-width="2" stroke-linecap="round" opacity=".5"/>
 <path d="M58 121 v14 M51 128 h14" stroke="#ead9be" stroke-width="2" stroke-linecap="round" opacity=".4"/>
 <circle cx="66" cy="206" r="3" fill="#ffd873" opacity=".85">
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -16;0 0" dur="5.6s" begin="-1s" repeatCount="indefinite"/>
 </circle>
 <circle cx="340" cy="182" r="4" fill="#ff8a5c" opacity=".8">
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="6.8s" begin="-3s" repeatCount="indefinite"/>
 </circle>
 <circle cx="56" cy="292" r="2.5" fill="#f4e9d8" opacity=".7">
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -18;0 0" dur="7.4s" begin="-5s" repeatCount="indefinite"/>
 </circle>

 <text x="26" y="380" font-family="Futura,'Trebuchet MS','Segoe UI',sans-serif" font-size="15" letter-spacing="6" fill="#f4e9d8" opacity=".85">LA EÑE</text>
 <rect x="26" y="387" width="36" height="3" fill="#ff6b4a"/>

 <rect width="400" height="400" fill="url(#vin)" pointer-events="none"/>
</svg>