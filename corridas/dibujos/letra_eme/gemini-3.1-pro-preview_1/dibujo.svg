<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="bg" cx="50%" cy="50%" r="75%">
            <stop offset="0%" stop-color="#1f2233" />
            <stop offset="60%" stop-color="#13151f" />
            <stop offset="100%" stop-color="#090a0f" />
        </radialGradient>
        
        <linearGradient id="gold" x1="50" y1="50" x2="350" y2="350" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffea9e" />
            <stop offset="25%" stop-color="#d4af37" />
            <stop offset="50%" stop-color="#fdf0b0" />
            <stop offset="75%" stop-color="#c19924" />
            <stop offset="100%" stop-color="#8a6d10" />
        </linearGradient>

        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
        </filter>
    </defs>

    <rect width="400" height="400" fill="url(#bg)" />

    <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" stroke-dasharray="4 4">
        <line x1="20" y1="100" x2="380" y2="100" />
        <line x1="20" y1="170" x2="380" y2="170" />
        <line x1="20" y1="300" x2="380" y2="300" stroke-dasharray="none" stroke-opacity="0.15" />
        <line x1="20" y1="320" x2="380" y2="320" />
    </g>

    <text x="25" y="95" font-family="sans-serif" font-size="8" fill="#ffffff" fill-opacity="0.2" letter-spacing="1">CAP HEIGHT</text>
    <text x="25" y="165" font-family="sans