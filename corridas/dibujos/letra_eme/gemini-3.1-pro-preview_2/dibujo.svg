<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
    <defs>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
        </filter>
        <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#e3dfd3"/>
        </linearGradient>
    </defs>

    <rect width="400" height="400" fill="#0d0e12"/>

    <g stroke="#2a2d35" stroke-width="1" stroke-dasharray="3 4">
        <line x1="200" y1="20" x2="200" y2="380"/>
        <line x1="20" y1="100" x2="380" y2="100"/>
        <line x1="20" y1="280" x2="380" y2="280"/>
        <line x1="80" y1="20" x2="80" y2="380"/>
        <line x1="320" y1="20" x2="320" y2="380"/>
        <line x1="160" y1="20" x2="160" y2="380"/>
        <line x1="240" y1="20" x2="240" y2="380"/>
    </g>

    <g stroke="#2a2d35" stroke-width="1" fill="none" opacity="0.6">
        <circle cx="140" cy="225" r="65"/>
        <circle cx="260" cy="225" r="65"/>
        <circle cx="200" cy="190" r="110"/>
    </g>

    <text x="20" y="30" fill="#5c606f" font-family="monospace" font-size="9" letter-spacing="1">PHONEME: /m/ (BILABIAL NASAL)</text>
    <text x="380" y="30" fill="#5c606f" font-family="monospace" font-size="9" text-anchor="end">CHARACTER: MŪ</text>
    <text x="20" y="380" fill="#5c606f" font-family="monospace" font-size="9">VOCAL RESONANCE</text>

    <g fill="#f2efe9" opacity="0.6">
        <rect x="150" y="348" width="4" height="4" rx="2"/>
        <rect x="160" y="344" width="4" height="12" rx="2"/>
        <rect x="170" y="338" width="4" height="24" rx="2"/>
        <rect x="180" y="330" width="4" height="40" rx="2"/>
        <rect x="190" y="324" width="4" height="52" rx="2"/>
        <rect x="200" y="320" width="4" height="60" rx="2"/>
        <rect x="210" y="324" width="4" height="52" rx="2"/>
        <rect x="220" y="330" width="4" height="40" rx="2"/>
        <rect x="230" y="338" width="4" height="24" rx="2"/>
        <rect x="240" y="344" width="4" height="12" rx="2"/>
        <rect x="250" y="348" width="4" height="4" rx="2"/>
    </g>

    <path d="M 120,100 L 280,100
             M 200,100 L 200,280
             M 200,280 C 200,330 80,320 80,230 C 80,140 160,140 160,220
             M 200,280 C 200,330 320,320 320,230 C 320,140 240,140 240,220"
          fill="none" stroke="url(#glow)" stroke-width="22"
          stroke-linecap="round" stroke-linejoin="round"
          filter="url(#shadow)"/>

    <g fill="#0d0e12" stroke="#f2efe9" stroke-width="2">
        <circle cx="120" cy="100" r="5"/>
        <circle cx="280" cy="100" r="5"/>
        <circle cx="200" cy="100" r="5"/>
        <circle cx="200" cy="280" r="5"/>
        <circle cx="160" cy="220" r="5"/>
        <circle cx="240" cy="220" r="5"/>
    </g>

    <g fill="#5c606f" font-family="monospace" font-size="8" text-anchor="middle">
        <text x="120" y="85">T1</text>
        <text x="280" y="85">T2</text>
        <text x="200" y="85">AX</text>
        <text x="220" y="295">B0</text>
        <text x="160" y="205">L1</text>
        <text x="240" y="205">L2</text>
    </g>
</svg>