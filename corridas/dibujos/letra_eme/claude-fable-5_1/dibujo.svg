<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- fondo -->
  <rect width="400" height="400" fill="#f6f1e7"/>
  <rect x="14" y="14" width="372" height="372" rx="18" fill="none" stroke="#d8cdb8" stroke-width="2"/>

  <!-- líneas de pauta caligráfica -->
  <line x1="40" y1="316" x2="360" y2="316" stroke="#c9bda4" stroke-width="2"/>
  <line x1="40" y1="160" x2="360" y2="160" stroke="#d8cdb8" stroke-width="1.5" stroke-dasharray="6 7"/>
  <line x1="40" y1="110" x2="360" y2="110" stroke="#e4dbc8" stroke-width="1" stroke-dasharray="3 8"/>

  <!-- el glifo: una letra inventada para /m/ -->
  <!-- entra con un rulo (los labios que se cierran), baja, y hace dos ondas
       como el zumbido nasal, terminando en un coletazo hacia afuera -->
  <g fill="none" stroke="#2b2b35" stroke-width="27" stroke-linecap="round" stroke-linejoin="round">
    <!-- rulo de entrada + primer trazo vertical -->
    <path d="M 92 196
             C 92 142, 140 126, 138 176
             L 138 316"/>
    <!-- primera onda -->
    <path d="M 138 236
             C 138 164, 218 164, 218 236
             L 218 316"/>
    <!-- segunda onda con cola -->
    <path d="M 218 236
             C 218 164, 298 164, 298 236
             L 298 296
             C 298 328, 330 328, 338 306"/>
  </g>

  <!-- marca diacrítica: la vibración del zumbido sobre la letra -->
  <path d="M 160 92
           C 180 74, 200 74, 220 92
           C 240 110, 260 110, 280 92"
        fill="none" stroke="#b5452e" stroke-width="11" stroke-linecap="round"/>

  <!-- punto de resonancia bajo la panza central -->
  <circle cx="178" cy="282" r="11" fill="#b5452e"/>

  <!-- ficha de la letra -->
  <g font-family="Georgia, serif" fill="#6b6050">
    <text x="48" y="362" font-size="20" font-style="italic">«mun»</text>
    <text x="352" y="362" font-size="16" text-anchor="end">/m/ · nasal bilabial</text>
  </g>
</svg>