<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0d0618"/>
    </radialGradient>
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e040fb"/>
      <stop offset="40%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#40c4ff"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e040fb" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#40c4ff" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Partículas de fondo -->
  <circle cx="60" cy="60" r="1.5" fill="#7c4dff" opacity="0.5"/>
  <circle cx="340" cy="80" r="1" fill="#e040fb" opacity="0.4"/>
  <circle cx="30" cy="300" r="2" fill="#40c4ff" opacity="0.3"/>
  <circle cx="370" cy="320" r="1.5" fill="#7c4dff" opacity="0.5"/>
  <circle cx="200" cy="30" r="1" fill="#e040fb" opacity="0.4"/>
  <circle cx="150" cy="370" r="1.5" fill="#40c4ff" opacity="0.3"/>
  <circle cx="320" cy="180" r="1" fill="#e040fb" opacity="0.3"/>
  <circle cx="80" cy="200" r="1.5" fill="#7c4dff" opacity="0.4"/>

  <!-- Aura exterior suave -->
  <ellipse cx="200" cy="210" rx="130" ry="140" fill="url(#glowGrad)" filter="url(#softglow)" opacity="0.5"/>

  <!-- 
    LA NUEVA LETRA: "Eme vibrante"
    Forma: dos colinas gemelas nacen de una raíz curvada,
    con una espina dorsal ondulante central y terminaciones
    en espiral que evocan resonancia y vibración del sonido M.
    El trazo es continuo, fluido, con un centro que se hunde
    como un valle y se eleva como olas.
  -->

  <!-- Sombra / halo de la letra -->
  <path d="
    M 110 310
    C 110 310, 108 240, 120 200
    C 132 160, 155 145, 170 130
    C 185 115, 195 108, 200 100
    C 205 108, 215 115, 230 130
    C 245 145, 268 160, 280 200
    C 292 240, 290 310, 290 310
    M 200 100
    C 200 120, 198 155, 200 185
    M 160 200
    C 175 195, 185 190, 200 185
    C 215 190, 225 195, 240 200
    M 120 200
    C 135 205, 148 202, 160 200
    M 240 200
    C 252 202, 265 205, 280 200
  "
  fill="none"
  stroke="url(#glowGrad)"
  stroke-width="22"
  stroke-linecap="round"
  stroke-linejoin="round"
  opacity="0.4"
  filter="url(#softglow)"/>

  <!-- Cuerpo principal de la letra -->
  <g filter="url(#glow)">

    <!-- Pilar izquierdo con curva superior izquierda -->
    <path d="
      M 110 315
      C 110 315, 106 255, 116 210
      C 122 185, 135 165, 152 145
      C 165 130, 180 118, 200 104
    "
    fill="none"
    stroke="url(#glyphGrad)"
    stroke-width="11"
    stroke-linecap="round"/>

    <!-- Pilar derecho con curva superior derecha -->
    <path d="
      M 290 315
      C 290 315, 294 255, 284 210
      C 278 185, 265 165, 248 145
      C 235 130, 220 118, 200 104
    "
    fill="none"
    stroke="url(#glyphGrad)"
    stroke-width="11"
    stroke-linecap="round"/>

    <!-- Valle central - espina que baja y sube -->
    <path d="
      M 200 104
      C 200 125, 199 148, 200 178
    "
    fill="none"
    stroke="url(#glyphGrad)"
    stroke-width="9"
    stroke-linecap="round"/>

    <!-- Travesaño izquierdo curvo -->
    <path d="
      M 118 208
      C 132 200, 148 194, 163 196
      C 178 198, 190 188, 200 178
    "
    fill="none"
    stroke="url(#glyphGrad)"
    stroke-width="9"
    stroke-linecap="round"/>

    <!-- Travesaño derecho curvo -->
    <path d="
      M 282 208
      C 268 200, 252 194, 237 196
      C 222 198, 210 188, 200 178
    "
    fill="none"
    stroke="url(#glyphGrad)"
    stroke-width="9"
    stroke-linecap="round"/>

    <!-- Espiral izquierda inferior - resonancia -->
    <path d="
      M 110 315
      C 105 330, 100 340, 108 348
      C 116 356, 128 350, 126 338
      C 124 328, 115 325, 110 315
    "
    fill="none"
    stroke="url(#glyphGrad)"
    stroke-width="7"
    stroke-linecap="round"/>

    <!-- Espiral derecha inferior - resonancia -->
    <path d="
      M 290 315
      C 295 330, 300 340, 292 348
      C 284 356, 272 350, 274 338
      C 276 328, 285 325, 290 315
    "
    fill="none"
    stroke="url(#glyphGrad)"
    stroke-width="7"
    stroke-linecap="round"/>

    <!-- Punto corona superior - cima de la letra -->
    <circle cx="200" cy="98" r="7" fill="url(#glyphGrad)"/>
    <circle cx="200" cy="98" r="11" fill="none" stroke="url(#glyphGrad)" stroke-width="2" opacity="0.5"/>

    <!-- Puntos de anclaje en los valles -->
    <circle cx="200" cy="178" r="5" fill="#e040fb" opacity="0.8"/>

    <!-- Líneas de vibración horizontales - ondas sonoras -->
    <path d="M 68 210 Q 78 205, 88 210 Q 98 215, 108 210"
      fill="none" stroke="#7c4dff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 52 230 Q 65 224, 78 230 Q 91 236, 104 230"
      fill="none" stroke="#7c4dff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M 292 210 Q 302 205, 312 210 Q 322 215, 332 210"
      fill="none" stroke="#40c4ff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 296 230 Q 309 224, 322 230 Q 335 236, 348 230"
      fill="none" stroke="#40c4ff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  </g>

  <!-- Marco decorativo sutil -->
  <rect x="20" y="20" width="360" height="360" rx="18" ry="18"
    fill="none" stroke="#7c4dff" stroke-width="1" opacity="0.3"/>
  <rect x="28" y="28" width="344" height="344" rx="14" ry="14"
    fill="none" stroke="#e040fb" stroke-width="0.5" opacity="0.2"/>

  <!-- Pequeño texto identificador abajo -->
  <text x="200" y="388" text-anchor="middle"
    font-family="Georgia, serif" font-size="11"
    fill="#7c4dff" opacity="0.6" letter-spacing="4">
    /m/
  </text>

</svg>