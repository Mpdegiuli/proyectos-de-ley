<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="fondo" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#fff3e6"/>
      <stop offset="1" stop-color="#f4cfae"/>
    </radialGradient>
    <linearGradient id="trazo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3265a"/>
      <stop offset="1" stop-color="#6d1a4a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#fondo)"/>
  <rect x="20" y="20" width="360" height="360" rx="28" fill="none" stroke="#6d1a4a" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- vibración (zumbido) -->
  <g fill="none" stroke="#d9567f" stroke-width="7" stroke-linecap="round" opacity="0.85">
    <path d="M172 112 Q200 92 228 112"/>
    <path d="M150 90 Q200 52 250 90" opacity="0.65"/>
    <path d="M128 68 Q200 14 272 68" opacity="0.35"/>
  </g>

  <!-- arco de la letra -->
  <path d="M135 305 V195 A65 65 0 0 1 265 195 V305" fill="none" stroke="url(#trazo)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- labios cerrados -->
  <path d="M135 248 Q167 224 200 244 Q233 224 265 248" fill="none" stroke="#fff3e6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M148 256 Q200 296 252 256" fill="none" stroke="#fff3e6" stroke-width="10" stroke-linecap="round"/>

  <!-- punto resonante -->
  <circle cx="200" cy="348" r="13" fill="#b3265a"/>
</svg>