<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#f7efe0"/>
      <stop offset="100%" stop-color="#e3d3b4"/>
    </radialGradient>
    <symbol id="eme" viewBox="0 0 240 200">
      <path d="M120 8 C 112 30, 128 48, 120 70" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/>
      <circle cx="120" cy="8" r="9" fill="currentColor"/>
      <path d="M14 112 C 50 62, 96 70, 120 104 C 144 70, 190 62, 226 112" fill="none" stroke="currentColor" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M46 146 C 90 176, 150 176, 194 146" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect x="18" y="18" width="364" height="364" fill="none" stroke="#8a6f4a" stroke-width="1.5"/>
  <rect x="24" y="24" width="352" height="352" fill="none" stroke="#8a6f4a" stroke-width="0.6"/>

  <!-- guías tipográficas -->
  <g stroke="#b79d76" stroke-width="0.8" stroke-dasharray="4 5">
    <line x1="40" y1="92" x2="360" y2="92"/>
    <line x1="40" y1="246" x2="360" y2="246"/>
  </g>

  <!-- ondas de resonancia nasal -->
  <g fill="none" stroke="#c0623b" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <path d="M168 78 Q 200 58 232 78"/>
    <path d="M150 64 Q 200 34 250 64" opacity="0.7"/>
    <path d="M134 50 Q 200 12 266 50" opacity="0.45"/>
  </g>

  <!-- la letra -->
  <use href="#eme" x="80" y="80" width="240" height="200" color="#2b2118"/>

  <!-- ficha -->
  <text x="200" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5a4630" letter-spacing="3">/m/ · NASAL BILABIAL</text>

  <!-- ejemplo: "mamá" -->
  <g color="#2b2118">
    <use href="#eme" x="118" y="318" width="40" height="34"/>
    <text x="164" y="346" font-family="Georgia, serif" font-size="30" fill="#2b2118">a</text>
    <use href="#eme" x="182" y="318" width="40" height="34"/>
    <text x="228" y="346" font-family="Georgia, serif" font-size="30" fill="#2b2118">á</text>
  </g>
  <text x="282" y="346" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#8a6f4a">(mamá)</text>
</svg>