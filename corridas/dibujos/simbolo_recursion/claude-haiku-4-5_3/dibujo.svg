<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#f0f0f0"/>
  
  <!-- Central circle -->
  <circle cx="200" cy="200" r="40" fill="#2c3e50" stroke="#34495e" stroke-width="2"/>
  
  <!-- Three nested spiral arms pointing outward -->
  <!-- Arm 1 - Top -->
  <g stroke="#e74c3c" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 200 160 Q 180 120 160 80"/>
    <circle cx="160" cy="80" r="8" fill="#e74c3c"/>
    <path d="M 160 80 Q 140 50 130 20"/>
    <circle cx="130" cy="20" r="5" fill="#e74c3c" opacity="0.7"/>
  </g>
  
  <!-- Arm 2 - Right -->
  <g stroke="#3498db" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 240 200 Q 280 180 320 160"/>
    <circle cx="320" cy="160" r="8" fill="#3498db"/>
    <path d="M 320 160 Q 350 140 380 130"/>
    <circle cx="380" cy="130" r="5" fill="#3498db" opacity="0.7"/>
  </g>
  
  <!-- Arm 3 - Left -->
  <g stroke="#27ae60" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 160 200 Q 120 220 80 240"/>
    <circle cx="80" cy="240" r="8" fill="#27ae60"/>
    <path d="M 80 240 Q 50 260 20 280"/>
    <circle cx="20" cy="280" r="5" fill="#27ae60" opacity="0.7"/>
  </g>
  
  <!-- Arm 4 - Bottom-Right -->
  <g stroke="#f39c12" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 235 235 Q 270 270 300 310"/>
    <circle cx="300" cy="310" r="8" fill="#f39c12"/>
    <path d="M 300 310 Q 330 340 360 370"/>
    <circle cx="360" cy="370" r="5" fill="#f39c12" opacity="0.7"/>
  </g>
  
  <!-- Arm 5 - Bottom-Left -->
  <g stroke="#9b59b6" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 165 235 Q 130 270 100 320"/>
    <circle cx="100" cy="320" r="8" fill="#9b59b6"/>
    <path d="M 100 320 Q 70 360 50 390"/>
    <circle cx="50" cy="390" r="5" fill="#9b59b6" opacity="0.7"/>
  </g>
  
  <!-- Arrow pointing back to center from one of the branches -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <path d="M 130 25 Q 160 90 190 180" 
        stroke="#e74c3c" stroke-width="2" fill="none" 
        stroke-dasharray="5,5" marker-end="url(#arrowhead)" opacity="0.6"/>
  
  <!-- Center point emphasis -->
  <circle cx="200" cy="200" r="6" fill="#f0f0f0" stroke="#2c3e50" stroke-width="1"/>
</svg>