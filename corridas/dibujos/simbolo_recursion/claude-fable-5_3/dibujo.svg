<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect width="400" height="400" fill="#fdfdf8"/>

  <!-- Caja nivel 1 -->
  <rect x="40" y="40" width="320" height="320" fill="none" stroke="#1a1a1a" stroke-width="7" rx="14"/>
  <circle cx="68" cy="68" r="10" fill="#e74c3c"/>

  <!-- Caja nivel 2 -->
  <rect x="110" y="110" width="200" height="200" fill="none" stroke="#1a1a1a" stroke-width="5" rx="10"/>
  <circle cx="130" cy="130" r="7" fill="#e74c3c"/>

  <!-- Caja nivel 3 -->
  <rect x="160" y="160" width="110" height="110" fill="none" stroke="#1a1a1a" stroke-width="3.5" rx="7"/>
  <circle cx="174" cy="174" r="5" fill="#e74c3c"/>

  <!-- Caja nivel 4 -->
  <rect x="190" y="190" width="58" height="58" fill="none" stroke="#1a1a1a" stroke-width="2.5" rx="5"/>
  <circle cx="199" cy="199" r="3.5" fill="#e74c3c"/>

  <!-- Caja nivel 5 (caso base, llena) -->
  <rect x="207" y="207" width="26" height="26" fill="#2ecc71" stroke="#1a1a1a" stroke-width="2" rx="3"/>

  <!-- Flechas entrando a cada nivel más profundo -->
  <path d="M360,200 C390,120 320,80 260,100" fill="none" stroke="#2b6cb0" stroke-width="6" marker-end="url(#a)" transform="rotate(0)"/>
  <path d="M80,200 C60,260 110,300 150,290 C190,280 180,250 165,245" fill="none" stroke="#2b6cb0" stroke-width="5" marker-end="url(#a)"/>

  <!-- Flecha espiral que vuelve hacia adentro -->
  <path d="M260,100 C210,85 160,95 145,140 C132,180 150,215 185,220 C212,224 228,208 224,190"
        fill="none" stroke="#2b6cb0" stroke-width="5" marker-end="url(#a)"/>

  <!-- Flechas de retorno saliendo (punteadas) -->
  <path d="M233,233 C280,280 320,310 352,342" fill="none" stroke="#e67e22" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#a)"/>
</svg>