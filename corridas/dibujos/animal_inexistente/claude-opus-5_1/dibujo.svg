    <path d="M250 190 C 310 120, 340 140, 338 185 C 336 225, 290 232, 250 220 Z" fill="url(#wing)"/>
    <path d="M150 200 C 115 175, 95 170, 78 180 M150 210 C 120 200, 100 200, 80 205" fill="none" stroke-width="1" opacity=".6"/>
    <path d="M250 200 C 285 175, 305 170, 322 180 M250 210 C 280 200, 300 200, 320 205" fill="none" stroke-width="1" opacity=".6"/>
  </g>

  <!-- cola espiralada -->
