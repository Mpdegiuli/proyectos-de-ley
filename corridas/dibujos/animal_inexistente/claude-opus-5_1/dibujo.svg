<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1b2a4a"/>
      <stop offset="60%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#070d1a"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ce0c8"/>
      <stop offset="45%" stop-color="#3fb0a5"/>
      <stop offset="100%" stop-color="#1e5f74"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#f2a65a"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8a6ff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#63d9ff" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffef9f" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffef9f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <g fill="#ffffff" opacity=".5">
