    <circle cx="150" cy="60" r="1.2"/><circle cx="330" cy="45" r="1.5"/>
    <circle cx="370" cy="110" r="1"/><circle cx="270" cy="25" r="1.1"/>
    <circle cx="30" cy="150" r="1"/><circle cx="360" cy="200" r="1.3"/>
    <circle cx="60" cy="300" r="1"/><circle cx="340" cy="330" r="1.2"/>
    <circle cx="200" cy="20" r="1"/><circle cx="20" cy="230" r="1.2"/>
  </g>
  <ellipse cx="200" cy="352" rx="120" ry="16" fill="#000" opacity=".35"/>

  <!-- alas -->
  <g stroke="#a98cff" stroke-width="1.5" opacity=".9">
