  <path d="M220 62 C 228 34, 248 28, 252 14" fill="none" stroke="#7ce0c8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="148" cy="12" r="10" fill="url(#glow)"/>
  <circle cx="252" cy="12" r="10" fill="url(#glow)"/>
  <circle cx="148" cy="12" r="5" fill="#fff3b0"/>
  <circle cx="252" cy="12" r="5" fill="#fff3b0"/>

