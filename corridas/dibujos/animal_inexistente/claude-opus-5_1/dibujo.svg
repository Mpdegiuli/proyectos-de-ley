    <ellipse cx="228" cy="104" rx="17" ry="19" fill="#fff"/>
    <ellipse cx="200" cy="76" rx="12" ry="13" fill="#fff"/>
    <circle cx="175" cy="107" r="9" fill="#17303f"/>
    <circle cx="225" cy="107" r="9" fill="#17303f"/>
