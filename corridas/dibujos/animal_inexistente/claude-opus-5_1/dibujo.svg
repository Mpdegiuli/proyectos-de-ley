  <ellipse cx="200" cy="132" rx="14" ry="10" fill="#f8c98a"/>
  <path d="M193 128 q 7 -7 14 0 q -7 8 -14 0 z" fill="#c9683f"/>
  <path d="M200 138 q -12 14 -24 4 M200 138 q 12 14 24 4" fill="none" stroke="#c9683f" stroke-width="3.5" stroke-linecap="round"/>
