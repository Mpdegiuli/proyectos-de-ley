<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="sky">
      <stop stop-color="#34477b"/>
      <stop offset="1" stop-color="#11172f"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a0f5df"/>
      <stop offset=".55" stop-color="#55c9c5"/>
      <stop offset="1" stop-color="#3785af"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe6a3" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#f59dc4" stop-opacity=".65"/>
      <stop offset="1" stop-color="#aa9ef3" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="belly">
      <stop stop-color="#fff3d5"/>
      <stop offset="1" stop-color="#b6e8d5"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

