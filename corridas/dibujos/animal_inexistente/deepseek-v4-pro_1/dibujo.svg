<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1D2B64" />
      <stop offset="100%" stop-color="#0D1321" />
    </radialGradient>
    <radialGradient id="bodyGrad" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#1D2B64" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0D1321" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="carapaceGrad" cx="50%" cy="80%" r="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#1D2B64" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0D1321" stop-opacity="0.7"/>
    </radialGradient>
    <linearGradient id="wingGradUpper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#4FACFE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF0844" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="wingGradLower" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FF0844" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4FACFE" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="130" fill="#4FACFE" opacity="0.1" filter="url(#glow-heavy)" />
  <circle cx="200" cy="200" r="80" fill="#00F2FE" opacity="0.15" filter="url(#glow-heavy)" />

  <!-- Background Bioluminescent Particles -->
  <g fill="#00F2FE" opacity="0.5" filter="url(#glow)">
    <circle cx="50" cy="60" r="1.5" />
    <circle cx="340" cy="80" r="2.5" />
    <circle cx="30" cy="250" r="1.5" />
    <circle cx="370" cy="300" r="2" />
    <circle cx="80" cy="350" r="2" />
    <circle cx="320" cy="360" r="1.5" />
    <circle cx="150" cy="40" r="1" />
    <circle cx="280" cy="30" r="2" />
    <circle cx="360" cy="180" r="1.5" />
    <circle cx="40" cy="120" r="2" />
  </g>

  <!-- Aura Behind Creature -->
  <g filter="url(#glow-heavy)">
    <ellipse cx="200" cy="220" rx="40" ry="60" fill="#FF0844" opacity="0.15" />
  </g>

  <!-- WINGS (Left and Right) -->
  <g>
    <!-- Left Upper Wing -->
    <path d="M 190 160 C 120 100, 40 110, 30 180 C 40 220, 80 240, 100 210 C 80 200, 70 180, 90 170 C 110 160, 150 180, 170 190 Z" fill="url(#wingGradUpper)" opacity="0.8" stroke="#00F2FE" stroke-width="1.5" />
    <!-- Left Upper Wing Veins -->
    <g stroke="#00F2FE" stroke-width="1" fill="none" opacity="0.7">
      <path d="M 190 160 Q 100 140 30 180" />
      <path d="M 170 170 Q 100 180 50 210" />
      <path d="M 150 180 Q 120 200 90 190" />
      <path d="M 110 165 Q 80 180 60 195" />
      <path d="M 180 170 Q 90 150 50 190" />
    </g>
    <!-- Left Upper Wing Bioluminescent Nodes -->
    <g fill="#FFD700" filter="url(#glow)">
      <circle cx="60" cy="160" r="2.5" />
      <circle cx="110" cy="150" r="1.5" />
      <circle cx="45" cy="200" r="2" />
      <circle cx="85" cy="185" r="1.5" />
    </g>

    <!-- Right Upper Wing -->
    <path d="M 210 160 C 280 100, 360 110, 370 180 C 360 220, 320 240, 300 210 C 320 200, 330 180, 310 170 C 290 160, 250 180, 230 190 Z" fill="url(#wingGradUpper)" opacity="0.8" stroke="#00F2FE" stroke-width="1.5" />
    <!-- Right Upper Wing Veins -->
    <g stroke="#00F2FE" stroke-width="1" fill="none" opacity="0.7">
      <path d="M 210 160 Q 300 140 370 180" />
      <path d="M 230 170 Q 300 180 350 210" />
      <path d="M 250 180 Q 280 200 310 190" />
      <path d="M 290 165 Q 320 180 340 195" />
      <path d="M 220 170 Q 310 150 350 190" />
    </g>
    <!-- Right Upper Wing Bioluminescent Nodes -->
    <g fill="#FFD700" filter="url(#glow)">
      <circle cx="340" cy="160" r="2.5" />
      <circle cx="290" cy="150" r="1.5" />
      <circle cx="355" cy="200" r="2" />
      <circle cx="315" cy="185" r="1.5" />
    </g>

    <!-- Left Lower Wing -->
    <path d="M 180 180 C 130 200, 80 250, 90 300 C 110 280, 140 270, 160 240 C 150 260, 140 290, 130 310 C 150 290, 170 260, 175 220 Z" fill="url(#wingGradLower)" opacity="0.8" stroke="#FF0844" stroke-width="1.5" />
    <!-- Left Lower Wing Veins -->
    <g stroke="#FF0844" stroke-width="1" fill="none" opacity="0.7">
      <path d="M 180 180 Q 120 220 90 300" />
      <path d="M 175 220 Q 140 260 130 310" />
      <path d="M 170 195 Q 140 230 120 280" />
      <path d="M 160 210 Q 120 250 110 290" />
    </g>
    <!-- Left Lower Wing Bioluminescent Nodes -->
    <g fill="#00F2FE" filter="url(#glow)">
      <circle cx="100" cy="280" r="2" />
      <circle cx="140" cy="250" r="1.5" />
      <circle cx="115" cy="310" r="2" />
    </g>

    <!-- Right Lower Wing -->
    <path d="M 220 180 C 270 200, 320 250, 310 300 C 290 280, 260 270, 240 240 C 250 260, 260 290, 270 310 C 250 290, 230 260, 225 220 Z" fill="url(#wingGradLower)" opacity="0.8" stroke="#FF0844" stroke-width="1.5" />
    <!-- Right Lower Wing Veins -->
    <g stroke="#FF0844" stroke-width="1" fill="none" opacity="0.7">
      <path d="M 220 180 Q 280 220 310 300" />
      <path d="M 225 220 Q 260 260 270 310" />
      <path d="M 230 195 Q 260 230 280 280" />
      <path d="M 240 210 Q 280 250 290 290" />
    </g>
    <!-- Right Lower Wing Bioluminescent Nodes -->
    <g fill="#00F2FE" filter="url(#glow)">
      <circle cx="300" cy="280" r="2" />
      <circle cx="260" cy="250" r="1.5" />
      <circle cx="285" cy="310" r="2" />
    </g>
  </g>

  <!-- LEGS (Isopod style, left and right) -->
  <g stroke="#00F2FE" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Left Legs -->
    <path d="M 180 225 L 140 240 L 120 260" />
    <path d="M 178 265 L 135 290 L 115 315" />
    <path d="M 166 295 L 125 320 L 110 340" />
    <!-- Right Legs -->
    <path d="M 220 225 L 260 240 L 280 260" />
    <path d="M 217 265 L 260 290 L 280 315" />
    <path d="M 194 295 L 235 320 L 250 340" />
  </g>
  <!-- Leg Joints -->
  <g fill="#FF0844" filter="url(#glow)">
    <circle cx="140" cy="240" r="2.5" />
    <circle cx="135" cy="290" r="2.5" />
    <circle cx="125" cy="320" r="2.5" />
    <circle cx="260" cy="240" r="2.5" />
    <circle cx="260" cy="290" r="2.5" />
    <circle cx="235" cy="320" r="2.5" />
  </g>

  <!-- ABDOMEN SEGMENTS (Isopod/Centipede hybrid) -->
  <!-- Segment 6 (Bottom) plus Tail Fins -->
  <path d="M 135 315 C 100 320, 90 305, 80 290 C 95 300, 110 290, 125 300" fill="url(#wingGradLower)" opacity="0.9" stroke="#00F2FE" stroke-width="1.5" />
  <path d="M 130 325 C 110 340, 100 355, 95 370 C 110 365, 120 350, 140 335" fill="url(#wingGradLower)" opacity="0.9" stroke="#00F2FE" stroke-width="1.5" />
  <ellipse cx="140" cy="320" rx="10" ry="12" fill="url(#bodyGrad)" stroke="#00F2FE" stroke-width="1.5" />
  <circle cx="140" cy="320" r="3" fill="#FFD700" filter="url(#glow)" />
  <circle cx="130" cy="315" r="2" fill="#0D1321" />

  <!-- Segment 5 -->
  <ellipse cx="160" cy="310" rx="12" ry="15" fill="url(#bodyGrad)" stroke="#00F2FE" stroke-width="1.5" />
  <circle cx="160" cy="310" r="3" fill="#FFD700" filter="url(#glow)" />
  <circle cx="150" cy="305" r="2" fill="#0D1321" />

  <!-- Segment 4 -->
  <ellipse cx="180" cy="290" rx="14" ry="18" fill="url(#bodyGrad)" stroke="#00F2FE" stroke-width="1.5" />
  <circle cx="180" cy="290" r="4" fill="#FFD700" filter="url(#glow)" />
  <circle cx="170" cy="285" r="2" fill="#0D1321" />
  <!-- Spikes on Segments -->
  <polygon points="178,272 165,250 180,272" fill="#1D2B64" stroke="#00F2FE" stroke-width="1" />

  <!-- Segment 3 -->
  <ellipse cx="195" cy="260" rx="17" ry="22" fill="url(#bodyGrad)" stroke="#00F2FE" stroke-width="1.5" />
  <circle cx="195" cy="260" r="4" fill="#FFD700" filter="url(#glow)" />
  <circle cx="185" cy="255" r="2" fill="#0D1321" />
  <!-- Spikes on Segments -->
  <polygon points="192,235 180,215 195,235" fill="#1D2B64" stroke="#00F2FE" stroke-width="1" />

  <!-- Segment 2 -->
  <ellipse cx="200" cy="220" rx="20" ry="25" fill="url(#bodyGrad)" stroke="#00F2FE" stroke-width="2" />
  <circle cx="200" cy="220" r="5" fill="#FFD700" filter="url(#glow)" />
  <circle cx="190" cy="215" r="2" fill="#0D1321" />
  <!-- Spikes on Segments -->
  <polygon points="195,195 185,180 205,195" fill="#1D2B64" stroke="#00F2FE" stroke-width="1" />

  <!-- Segment 1 (Thorax) -->
  <ellipse cx="200" cy="180" rx="25" ry="30" fill="url(#bodyGrad)" stroke="#00F2FE" stroke-width="2.5" />
  <circle cx="200" cy="180" r="6" fill="#FFD700" filter="url(#glow)" />

  <!-- THORAX APPENDAGES (Mantis-like arms) -->
  <g stroke="#FFD700" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M 175 180 L 130 160 L 110 170 L 100 160" />
    <path d="M 225 180 L 270 160 L 290 170 L 300 160" />
  </g>

  <!-- CARAPACE (Translucent Jellyfish Dome) -->
  <path d="M 150 180 C 150 80, 250 80, 250 180 C 230 165, 170 165, 150 180 Z" fill="url(#carapaceGrad)" stroke="#00F2FE" stroke-width="2" />
  <path d="M 150 180 C 170 195, 230 195, 250 180" fill="none" stroke="#00F2FE" stroke-width="3" filter="url(#glow)" />

  <!-- EYES (Bioluminescent Cluster inside Carapace) -->
  <g filter="url(#glow)">
    <!-- Primary Eyes -->
    <circle cx="180" cy="150" r="7" fill="#FF5733" />
    <circle cx="220" cy="150" r="7" fill="#FF5733" />
    <!-- Secondary Eyes -->
    <circle cx="165" cy="165" r="5" fill="#FFC300" />
    <circle cx="235" cy="165" r="5" fill="#FFC300" />
    <!-- Tertiary Eyes -->
    <circle cx="200" cy="140" r="4" fill="#FFFFFF" />
    <circle cx="185" cy="180" r="3" fill="#FFC300" />
    <circle cx="215" cy="180" r="3" fill="#FFC300" />
    <circle cx="200" cy="165" r="2" fill="#FF0844" />
  </g>
  <!-- Eye Bright Cores (Highlights) -->
  <g>
    <circle cx="180" cy="150" r="3" fill="#FFFFFF" />
    <circle cx="220" cy="150" r="3" fill="#FFFFFF" />
    <circle cx="165" cy="165" r="2" fill="#FFFFFF" />
    <circle cx="235" cy="165" r="2" fill="#FFFFFF" />
    <circle cx="200" cy="140" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- CROWN / SENSORY STRUCTURE (on top of Carapace) -->
  <g filter="url(#glow)">
    <path d="M 200 90 L 190 60 L 200 70 L 210 60 Z" fill="#FFD700" stroke="#FF0844" stroke-width="1.5" />
    <circle cx="200" cy="65" r="2" fill="#FFFFFF" />
  </g>

  <!-- ANTENNAE / TENDRILS (Sweeping from the head) -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <!-- Left Tendrils -->
    <path d="M 160 110 C 130 40, 80 40, 50 20" stroke="#00F2FE" stroke-width="2" />
    <path d="M 180 90 C 160 20, 120 30, 100 10" stroke="#FF0844" stroke-width="1.5" />
    <!-- Right Tendrils -->
    <path d="M 240 110 C 270 40, 320 40, 350 20" stroke="#00F2FE" stroke-width="2" />
    <path d="M 220 90 C 240 20, 280 30, 300 10" stroke="#FF0844" stroke-width="1.5" />
  </g>
  <!-- Tendril Bulbs -->
  <g filter="url(#glow)">
    <circle cx="50" cy="20" r="4" fill="#00F2FE" />
    <circle cx="350" cy="20" r="4" fill="#00F2FE" />
    <circle cx="100" cy="10" r="3" fill="#FF0844" />
    <circle cx="300" cy="10" r="3" fill="#FF0844" />
  </g>

  <!-- MOUTH / MANDIBLES -->
  <g filter="url(#glow)">
    <path d="M 190 195 L 180 210 L 195 205 Z" fill="#FF0844" />
    <path d="M 210 195 L 220 210 L 205 205 Z" fill="#FF0844" />
  </g>

  <!-- DELICATE CILIA / HAIRS around Thorax -->
  <g stroke="#00F2FE" stroke-width="1" fill="none" opacity="0.6">
    <line x1="177" y1="175" x2="165" y2="170" />
    <line x1="175" y1="185" x2="160" y2="185" />
    <line x1="177" y1="195" x2="165" y2="200" />
    <line x1="223" y1="175" x2="235" y2="170" />
    <line x1="225" y1="185" x2="240" y2="185" />
    <line x1="223" y1="195" x2="235" y2="200" />
  </g>
</svg>