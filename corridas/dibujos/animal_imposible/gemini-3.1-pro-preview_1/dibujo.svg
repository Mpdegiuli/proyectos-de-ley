<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#F4F1EA" />
  
  <g stroke="#1A1A1A" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ground / Pedestals -->
    <path d="M 90 342 L 140 342 M 150 342 L 200 342 M 210 342 L 260 342 M 270 342 L 320 342" fill="none" stroke-width="3" stroke="#88827C" />

    <!-- Main Outer Silhouette -->
    <path d="M 70 310 L 70 220 C 70 140, 100 100, 160 100 C 240 100, 310 100, 330 130 C 340 140, 340 170, 340 190 L 340 280 C 340 310, 310 310, 310 280" fill="none" stroke-width="4" />
    
    <!-- Gap 1 / Foot 1 -->
    <path d="M 100 340 L 100 220 C 105 190, 125 190, 130 220 L 130 340" fill="none" stroke-width="4" />
    <path d="M 100 340 C 100 335, 110 335, 110 340 C 110 335, 120 335, 120 340 C 120 335, 130 335, 130 340" fill="none" stroke-width="4" />

    <!-- Gap 2 / Foot 2 -->
    <path d="M 160 340 L 160 220 C 165 190, 185 190, 190 220 L 190 340" fill="none" stroke-width="4" />
    <path d="M 160 340 C 160 335, 170 335, 170 340 C 170 335, 180 335, 180 340 C 180 335, 190 335, 190 340" fill="none" stroke-width="4" />

    <!-- Gap 3 / Foot 3 -->
    <path d="M 220 340 L 220 220 C 225 190, 245 190, 250 220 L 250 340" fill="none" stroke-width="4" />
    <path d="M 220 340 C 220 335, 230 335, 230 340 C 230 335, 240 335, 240 340 C 240 335, 250 335, 250 340" fill="none" stroke-width="4" />

    <!-- Gap 4 / Foot 4 -->
    <path d="M 280 340 L 280 220 C 285 190, 305 190, 310 220 L 310 340" fill="none" stroke-width="4" />
    <path d="M 280 340 C 280 335, 290 335, 290 340 C 290 335, 300 335, 300 340 C 300 335, 310 335, 310 340" fill="none" stroke-width="4" />

    <!-- Details -->
    <g stroke-width="2" fill="none">
      <!-- Ear -->
      <path d="M 260 130 C 300 110, 320 150, 290 190 C 270 220, 240 200, 240 170 C 240 150, 250 140, 260 130 Z" />
      <path d="M 255 145 C 270 135, 285 155, 275 175" />

      <!-- Eye -->
      <path d="M 310 135 C 315 133, 320 133, 325 137" />
      <circle cx="317" cy="142" r="2.5" fill="#1A1A1A" />
      <circle cx="316" cy="141" r="0.75" fill="#FFFFFF" stroke="none" />

      <!-- Tail -->
      <path d="M 70 160 C 50 170, 40 190, 45 220" />
      <path d="M 45 220 L 35 235 M 45 220 L 45 240 M 45 220 L 55 235" />

      <!-- Knees -->
      <path d="M 105 280 C 115 282, 125 282, 130 280 M 105 290 C 115 292, 125 292, 130 290" />
      <path d="M 165 280 C 175 282, 185 282, 190 280 M 165 290 C 175 292, 185 292, 190 290" />
      <path d="M 225 280 C 235 282, 245 282, 250 280 M 225 290 C 235 292, 245 292, 250 290" />
      <path d="M 285 280 C 295 282, 305 282, 310 280 M 285 290 C 295 292, 305 292, 310 290" />

      <!-- Trunk Wrinkles -->
      <path d="M 315 230 C 320 232, 330 232, 335 230" />
      <path d="M 315 250 C 320 252, 330 252, 335 250" />
      <path d="M 315 270 C 320 272, 330 272, 335 270" />

      <!-- Subtle Body Contours -->
      <path d="M 120 120 C 150 140, 200 140, 250 120" stroke-dasharray="4 6" stroke="#88827C" />
      <path d="M 100 150 C 120 170, 160 180, 220 160" stroke-dasharray="4 6" stroke="#88827C" />
    </g>

    <!-- Tusk -->
    <path d="M 310 190 C 330 200, 350 190, 360 170 C 345 185, 330 180, 310 175 Z" fill="#FFFFFF" stroke-width="2" />
  </g>
</svg>