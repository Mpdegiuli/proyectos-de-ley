<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2a1a4a"/>
      <stop offset="100%" stop-color="#0a0520"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fe8d4"/>
      <stop offset="100%" stop-color="#5a8fd8"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb3e6"/>
      <stop offset="100%" stop-color="#b366ff"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- estrellas -->
  <g fill="#fff">
    <circle cx="60" cy="50" r="1.5"/>
    <circle cx="340" cy="80" r="2"/>
    <circle cx="300" cy="40" r="1"/>
    <circle cx="90" cy="120" r="1.2"/>
    <circle cx="360" cy="200" r="1.5"/>
    <circle cx="40" cy="260" r="1.3"/>
    <circle cx="370" cy="330" r="1.8"/>
    <circle cx="150" cy="30" r="1"/>
  </g>

  <!-- cola de pez/serpiente -->
  <path d="M200 260 Q150 320 120 360 Q160 340 180 330 Q140 380 170 390 Q210 360 220 300 Z"
        fill="url(#body)" stroke="#3a6ab0" stroke-width="2"/>
  <path d="M120 360 Q100 350 85 365 Q110 360 125 368 Z" fill="#5a8fd8"/>

  <!-- alas de mariposa -->
  <g>
    <path d="M200 180 Q90 100 70 200 Q100 260 200 220 Z" fill="url(#wing)" opacity="0.9" stroke="#8a2be2" stroke-width="2"/>
    <path d="M200 180 Q310 100 330 200 Q300 260 200 220 Z" fill="url(#wing)" opacity="0.9" stroke="#8a2be2" stroke-width="2"/>
    <circle cx="120" cy="180" r="14" fill="#fff6a0" opacity="0.8"/>
    <circle cx="280" cy="180" r="14" fill="#fff6a0" opacity="0.8"/>
    <circle cx="120" cy="180" r="6" fill="#ff4d6d"/>
    <circle cx="280" cy="180" r="6" fill="#ff4d6d"/>
  </g>

  <!-- cuerpo -->
  <ellipse cx="200" cy="210" rx="40" ry="55" fill="url(#body)" stroke="#3a6ab0" stroke-width="2"/>

  <!-- cabeza de gato -->
  <circle cx="200" cy="130" r="45" fill="url(#body)" stroke="#3a6ab0" stroke-width="2"/>
  <!-- orejas -->
  <path d="M165 100 L155 60 L190 90 Z" fill="url(#body)" stroke="#3a6ab0" stroke-width="2"/>
  <path d="M235 100 L245 60 L210 90 Z" fill="url(#body)" stroke="#3a6ab0" stroke-width="2"/>
  <path d="M165 95 L160 72 L182 90 Z" fill="#ffb3e6"/>
  <path d="M235 95 L240 72 L218 90 Z" fill="#ffb3e6"/>

  <!-- ojos -->
  <ellipse cx="183" cy="128" rx="11" ry="15" fill="#fff"/>
  <ellipse cx="217" cy="128" rx="11" ry="15" fill="#fff"/>
  <ellipse cx="183" cy="130" rx="4" ry="11" fill="#1a1a2e"/>
  <ellipse cx="217" cy="130" rx="4" ry="11" fill="#1a1a2e"/>
  <circle cx="181" cy="124" r="2" fill="#fff"/>
  <circle cx="215" cy="124" r="2" fill="#fff"/>

  <!-- nariz y boca -->
  <path d="M195 145 L205 145 L200 152 Z" fill="#ff4d6d"/>
  <path d="M200 152 Q190 160 182 155" stroke="#3a6ab0" stroke-width="2" fill="none"/>
  <path d="M200 152 Q210 160 218 155" stroke="#3a6ab0" stroke-width="2" fill="none"/>

  <!-- bigotes -->
  <g stroke="#cceeff" stroke-width="1.5">
    <line x1="160" y1="140" x2="120" y2="135"/>
    <line x1="160" y1="147" x2="120" y2="150"/>
    <line x1="240" y1="140" x2="280" y2="135"/>
    <line x1="240" y1="147" x2="280" y2="150"/>
  </g>

  <!-- patitas delanteras -->
  <ellipse cx="175" cy="255" rx="12" ry="20" fill="url(#body)" stroke="#3a6ab0" stroke-width="2"/>
  <ellipse cx="225" cy="255" rx="12" ry="20" fill="url(#body)" stroke="#3a6ab0" stroke-width="2"/>

  <!-- escamas en cuerpo -->
  <g fill="none" stroke="#3a6ab0" stroke-width="1" opacity="0.5">
    <path d="M185 200 Q200 210 215 200"/>
    <path d="M185 220 Q200 230 215 220"/>
    <path d="M185 240 Q200 250 215 240"/>
  </g>
</svg>