<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ecfff"/>
      <stop offset="100%" stop-color="#1a6fa0"/>
    </radialGradient>
    <radialGradient id="eyeGrad" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ff6600"/>
    </radialGradient>
    <radialGradient id="fireGrad" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#fff700"/>
      <stop offset="50%" stop-color="#ff6600"/>
      <stop offset="100%" stop-color="#cc0000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background: deep space -->
  <rect width="400" height="400" fill="#0a0a1a"/>
  <circle cx="30" cy="20" r="1" fill="white" opacity="0.8"/>
  <circle cx="80" cy="50" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="150" cy="15" r="1" fill="white" opacity="0.9"/>
  <circle cx="320" cy="30" r="1" fill="white" opacity="0.7"/>
  <circle cx="370" cy="80" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="360" cy="15" r="1" fill="white" opacity="0.8"/>
  <circle cx="50" cy="350" r="1" fill="white" opacity="0.6"/>
  <circle cx="390" cy="300" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="10" cy="200" r="1" fill="white" opacity="0.4"/>
  <circle cx="300" cy="380" r="1" fill="white" opacity="0.6"/>

  <!-- CREATURE: A fish with wings, 8 legs, and fire coming from mouth, all floating upside-down -->

  <!-- Fire breath from mouth (bottom since upside down) -->
  <ellipse cx="200" cy="310" rx="12" ry="30" fill="url(#fireGrad)" opacity="0.9" filter="url(#glow)"/>
  <ellipse cx="190" cy="320" rx="7" ry="20" fill="#ffdd00" opacity="0.7" filter="url(#glow)"/>
  <ellipse cx="210" cy="325" rx="6" ry="15" fill="#ff8800" opacity="0.6" filter="url(#glow)"/>
  <polygon points="200,340 190,370 200,360 210,375 205,345" fill="#ff4400" opacity="0.5" filter="url(#glow)"/>

  <!-- 8 spindly spider-like legs (4 each side) going UP since creature is upside-down fish -->
  <!-- Left legs -->
  <line x1="160" y1="220" x2="110" y2="175" stroke="#4488aa" stroke-width="3" stroke-linecap="round"/>
  <line x1="110" y1="175" x2="75" y2="150" stroke="#4488aa" stroke-width="2" stroke-linecap="round"/>
  
  <line x1="155" y1="235" x2="95" y2="210" stroke="#4488aa" stroke-width="3" stroke-linecap="round"/>
  <line x1="95" y1="210" x2="55" y2="195" stroke="#4488aa" stroke-width="2" stroke-linecap="round"/>

  <line x1="155" y1="250" x2="90" y2="255" stroke="#4488aa" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="255" x2="50" y2="245" stroke="#4488aa" stroke-width="2" stroke-linecap="round"/>

  <line x1="160" y1="265" x2="100" y2="285" stroke="#4488aa" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="285" x2="60" y2="300" stroke="#4488aa" stroke-width="2" stroke-linecap="round"/>

  <!-- Right legs -->
  <line x1="240" y1="220" x2="290" y2="175" stroke="#4488aa" stroke-width="3" stroke-linecap="round"/>
  <line x1="290" y1="175" x2="325" y2="150" stroke="#4488aa" stroke-width="2" stroke-linecap="round"/>

  <line x1="245" y1="235" x2="305" y2="210" stroke="#4488aa" stroke-width="3" stroke-linecap="round"/>
  <line x1="305" y1="210" x2="345" y2="195" stroke="#4488aa" stroke-width="2" stroke-linecap="round"/>

  <line x1="245" y1="250" x2="310" y2="255" stroke="#4488aa" stroke-width="3" stroke-linecap="round"/>
  <line x1="310" y1="255" x2="350" y2="245" stroke="#4488aa" stroke-width="2" stroke-linecap="round"/>

  <line x1="240" y1="265" x2="300" y2="285" stroke="#4488aa" stroke-width="3" stroke-linecap="round"/>
  <line x1="300" y1="285" x2="340" y2="300" stroke="#4488aa" stroke-width="2" stroke-linecap="round"/>

  <!-- Leg joints (small circles) -->
  <circle cx="75" cy="150" r="4" fill="#88ccee"/>
  <circle cx="55" cy="195" r="4" fill="#88ccee"/>
  <circle cx="50" cy="245" r="4" fill="#88ccee"/>
  <circle cx="60" cy="300" r="4" fill="#88ccee"/>
  <circle cx="325" cy="150" r="4" fill="#88ccee"/>
  <circle cx="345" cy="195" r="4" fill="#88ccee"/>
  <circle cx="350" cy="245" r="4" fill="#88ccee"/>
  <circle cx="340" cy="300" r="4" fill="#88ccee"/>

  <!-- Fish body (upside down, tail pointing up) -->
  <ellipse cx="200" cy="240" rx="55" ry="80" fill="url(#bodyGrad)" filter="url(#glow)"/>
  
  <!-- Fish scales pattern -->
  <ellipse cx="200" cy="220" rx="30" ry="15" fill="none" stroke="#5bb8e8" stroke-width="1" opacity="0.5"/>
  <ellipse cx="200" cy="240" rx="38" ry="18" fill="none" stroke="#5bb8e8" stroke-width="1" opacity="0.5"/>
  <ellipse cx="200" cy="260" rx="44" ry="16" fill="none" stroke="#5bb8e8" stroke-width="1" opacity="0.5"/>
  <ellipse cx="185" cy="230" rx="15" ry="10" fill="none" stroke="#5bb8e8" stroke-width="1" opacity="0.4"/>
  <ellipse cx="215" cy="230" rx="15" ry="10" fill="none" stroke="#5bb8e8" stroke-width="1" opacity="0.4"/>

  <!-- Tail (top, since upside down) -->
  <polygon points="200,155 155,100 175,155 225,155 245,100" fill="#1a6fa0"/>
  <polygon points="200,155 155,100 175,140" fill="#2a8fc0" opacity="0.6"/>
  <polygon points="200,155 245,100 225,140" fill="#2a8fc0" opacity="0.6"/>

  <!-- Bird wings (large, feathered) -->
  <!-- Left wing -->
  <path d="M155,235 Q100,180 60,160 Q90,200 80,230 Q110,215 130,240 Z" fill="#cc8800" opacity="0.9"/>
  <path d="M155,235 Q80,195 40,185 Q70,215 65,240 Q100,228 130,242 Z" fill="#ffaa00" opacity="0.7"/>
  <!-- Wing feather lines -->
  <line x1="155" y1="235" x2="65" y2="170" stroke="#996600" stroke-width="1" opacity="0.6"/>
  <line x1="150" y1="238" x2="55" y2="190" stroke="#996600" stroke-width="1" opacity="0.6"/>
  <line x1="147" y1="242" x2="52" y2="215" stroke="#996600" stroke-width="1" opacity="0.6"/>

  <!-- Right wing -->
  <path d="M245,235 Q300,180 340,160 Q310,200 320,230 Q290,215 270,240 Z" fill="#cc8800" opacity="0.9"/>
  <path d="M245,235 Q320,195 360,185 Q330,215 335,240 Q300,228 270,242 Z" fill="#ffaa00" opacity="0.7"/>
  <!-- Wing feather lines -->
  <line x1="245" y1="235" x2="335" y2="170" stroke="#996600" stroke-width="1" opacity="0.6"/>
  <line x1="250" y1="238" x2="345" y2="190" stroke="#996600" stroke-width="1" opacity="0.6"/>
  <line x1="253" y1="242" x2="348" y2="215" stroke="#996600" stroke-width="1" opacity="0.6"/>

  <!-- Fish head (bottom, since upside down) -->
  <ellipse cx="200" cy="285" rx="42" ry="35" fill="url(#bodyGrad)" filter="url(#glow)"/>

  <!-- Eyes (compound, insect-like) -->
  <ellipse cx="178" cy="275" rx="14" ry="14" fill="url(#eyeGrad)"/>
  <ellipse cx="222" cy="275" rx="14" ry="14" fill="url(#eyeGrad)"/>
  <!-- Eye grid pattern -->
  <ellipse cx="178" cy="275" rx="14" ry="14" fill="none" stroke="#cc4400" stroke-width="0.5" opacity="0.8"/>
  <line x1="164" y1="275" x2="192" y2="275" stroke="#cc4400" stroke-width="0.5" opacity="0.6"/>
  <line x1="178" y1="261" x2="178" y2="289" stroke="#cc4400" stroke-width="0.5" opacity="0.6"/>
  <ellipse cx="222" cy="275" rx="14" ry="14" fill="none" stroke="#cc4400" stroke-width="0.5" opacity="0.8"/>
  <line x1="208" y1="275" x2="236" y2="275" stroke="#cc4400" stroke-width="0.5" opacity="0.6"/>
  <line x1="222" y1="261" x2="222" y2="289" stroke="#cc4400" stroke-width="0.5" opacity="0.6"/>

  <!-- Mouth (fish mouth, upside down) -->
  <path d="M185,300 Q200,312 215,300" stroke="#003366" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M188,302 Q200,295 212,302" stroke="#88ddff" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Antenna (two, pointing down from head) -->
  <path d="M188,315 Q180,335 170,345" stroke="#7ecfff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="170" cy="345" r="5" fill="#ff00ff" filter="url(#glow)"/>
  <path d="M212,315 Q220,335 230,345" stroke="#7ecfff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="230" cy="345" r="5" fill="#ff00ff" filter="url(#glow)"/>

  <!-- Label -->
  <text x="200" y="390" text-anchor="middle" font-family="serif" font-size="13" fill="#aaddff" opacity="0.8">Pez Arácnido Ígneo Invertido</text>
</svg>