    <circle cx="70" cy="80" r="0.8" opacity="0.4"/>
    <circle cx="320" cy="120" r="0.7" opacity="0.35"/>
    <circle cx="180" cy="30" r="0.5" opacity="0.25"/>
    <circle cx="220" cy="40" r="0.6" opacity="0.3"/>
