<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="60%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </radialGradient>
    <radialGradient id="bhGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="1"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="diskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb46b" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ffb46b" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#ffd9a0" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#ffd9a0" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#ffb46b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffb46b" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur5" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="blur20" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <circle cx="200" cy="200" r="90" fill="url(#bhGrad)"/>
  <circle cx="200" cy="200" r="55" fill="#000000"/>

  <ellipse cx="200" cy="200" rx="130" ry="28" fill="none" stroke="url(#diskGrad)" stroke-width="3" filter="url(#blur5)" transform="rotate(-15 200 200)" opacity="0.8"/>
  <ellipse cx="200" cy="200" rx="110" ry="20" fill="none" stroke="url(#diskGrad)" stroke-width="2" filter="url(#blur5)" transform="rotate(-25 200 200)" opacity="0.6"/>
  <ellipse cx="200" cy="200" rx="90" ry="15" fill="none" stroke="url(#diskGrad)" stroke-width="1.5" filter="url(#blur5)" transform="rotate(10 200 200)" opacity="0.5"/>

  <circle cx="200" cy="200" r="60" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" filter="url(#blur5)"/>

  <g fill="#ffffff">
    <circle cx="30" cy="50" r="0.7" opacity="0.3"/>
