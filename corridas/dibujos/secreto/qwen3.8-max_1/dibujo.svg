<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t d">
<title id="t">El faro de la medianoche</title>
<desc id="d">Un faro respira sobre el mar dormido. Este archivo guarda tres regalos que solo ve quien lee el código: una palabra escrita con estrellas, una frase en tinta invisible y una promesa en los comentarios.</desc>
<!-- Regalo 1: ya lo encontraste. Seguí bajando. -->
<defs>
<linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#070b1e"/>
<stop offset=".65" stop-color="#101c3f"/>
<stop offset="1" stop-color="#1b3055"/>
</linearGradient>
<linearGradient id="mar" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#16294d"/>
<stop offset=".3" stop-color="#0b1633"/>
<stop offset="1" stop-color="#030713"/>
</linearGradient>
<radialGradient id="halo">
<stop offset="0" stop-color="#f7efd9" stop-opacity=".5"/>
<stop offset=".55" stop-color="#f7efd9" stop-opacity=".14"/>
<stop offset="1" stop-color="#f7efd9" stop-opacity="0"/>
</radialGradient>
<linearGradient id="torreLuz" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#efe8d8"/>
<stop offset=".55" stop-color="#d9d2c2"/>
<stop offset="1" stop-color="#a49f90"/>
</linearGradient>
<linearGradient id="hazI" gradientUnits="userSpaceOnUse" x1="95" y1="144" x2="-95" y2="144">
<stop offset="0" stop-color="#ffe9a3" stop-opacity=".55"/>
<stop offset="1" stop-color="#ffe9a3" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hazD" gradientUnits="userSpaceOnUse" x1="95" y1="144" x2="285" y2="144">
<stop offset="0" stop-color="#ffe9a3" stop-opacity=".55"/>
<stop offset="1" stop-color="#ffe9a3" stop-opacity="0"/>
</linearGradient>
<clipPath id="cTorre"><path d="M76 258 86 152h18l10 106z"/></clipPath>
</defs>
<rect width="400" height="266" fill="url(#cielo)"/>
<g fill="#22335f" opacity=".45">
<ellipse cx="252" cy="72" rx="66" ry="10"/>
<ellipse cx="304" cy="82" rx="44" ry="8"/>
<animateTransform attributeName="transform" type="translate" values="0 0;26 0;0 0" dur="46s" repeatCount="indefinite"/>
</g>
<g fill="#c9d6ff">
<animate attributeName="opacity" values="1;.55;1" dur="6s" repeatCount="indefinite"/>
<circle cx="30" cy="42" r="1.3"/>
<circle cx="70" cy="112" r="1"/>
<circle cx="140" cy="30" r="1.4"/>
<circle cx="185" cy="70" r="1"/>
<circle cx="215" cy="24" r="1.2"/>
<circle cx="256" cy="120" r="1"/>
<circle cx="370" cy="38" r="1.3"/>
<circle cx="356" cy="142" r="1"/>
<circle cx="20" cy="150" r="1"/>
<circle cx="388" cy="102" r="1.1"/>
</g>
<circle cx="312" cy="86" r="66" fill="url(#halo)"/>
<circle cx="312" cy="86" r="26" fill="#f3ecd8"/>
<circle cx="304" cy="80" r="5" fill="#e2d9bf"/>
<circle cx="320" cy="94" r="4" fill="#e7dec6"/>
<!-- Regalo 2 -->
<!-- Las cinco estrellas más brillantes saben una palabra. Leé sus id de izquierda a derecha: ahí apunta el faro. -->
<g fill="#fff6da">
<circle id="N" cx="52" cy="62" r="2.6"><animate attributeName="opacity" values="1;.35;1" dur="2.6s" repeatCount="indefinite"/></circle>
<circle id="O" cx="112" cy="40" r="2.3"><animate attributeName="opacity" values=".4;1;.4" dur="3.4s" repeatCount="indefinite"/></circle>
<circle id="R" cx="168" cy="96" r="2.4"><animate attributeName="opacity" values="1;.4;1" dur="2.2s" repeatCount="indefinite"/></circle>
<circle id="T" cx="228" cy="36" r="2.2"><animate attributeName="opacity" values=".5;1;.5" dur="3s" repeatCount="indefinite"/></circle>
<circle id="E" cx="276" cy="76" r="2.5"><animate attributeName="opacity" values="1;.3;1" dur="3.8s" repeatCount="indefinite"/></circle>
</g>
<rect y="264" width="400" height="136" fill="url(#mar)"/>
<rect y="263" width="400" height="1.5" fill="#3a5a8c" opacity=".45"/>
<g fill="#f2e9cf">
<rect x="288" y="276" width="48" height="3" rx="1.5"><animate attributeName="opacity" values=".5;.2;.5" dur="3.5s" repeatCount="indefinite"/></rect>
<rect x="296" y="288" width="34" height="3" rx="1.5"><animate attributeName="opacity" values=".38;.12;.38" dur="4.4s" repeatCount="indefinite"/></rect>
<rect x="292" y="302" width="42" height="3" rx="1.5"><animate attributeName="opacity" values=".3;.1;.3" dur="5.2s" repeatCount="indefinite"/></rect>
<rect x="300" y="318" width="26" height="2.5" rx="1.2"><animate attributeName="opacity" values=".22;.08;.22" dur="6s" repeatCount="indefinite"/></rect>
<rect x="304" y="336" width="18" height="2.5" rx="1.2" opacity=".16"/>
</g>
<g stroke="#24406e" stroke-width="1.5" fill="none" stroke-linecap="round">
<path d="M150 292q20 5 40 0"><animate attributeName="opacity" values=".55;.15;.55" dur="5s" repeatCount="indefinite"/></path>
<path d="M60 316q24 6 48 0"><animate attributeName="opacity" values=".2;.55;.2" dur="6.2s" repeatCount="indefinite"/></path>
<path d="M210 350q26 6 52 0"><animate attributeName="opacity" values=".5;.15;.5" dur="4.4s" repeatCount="indefinite"/></path>
<path d="M320 300q16 4 32 0" opacity=".5"/>
</g>
<g>
<path d="M322 288q17 9 34 0l-4-6h-26z" fill="#060c1c"/>
<line x1="339" y1="282" x2="339" y2="266" stroke="#060c1c" stroke-width="2"/>
<circle cx="339" cy="263" r="1.8" fill="#ffcf6e"><animate attributeName="opacity" values="1;.25;1" dur="1.7s" repeatCount="indefinite"/></circle>
<animateTransform attributeName="transform" type="translate" values="0 0;0 2.5;0 0" dur="4.5s" repeatCount="indefinite"/>
</g>
<path d="M0 268Q34 246 62 250q30 4 46 12 16 8 22 16l6 10v112H0z" fill="#0a1126"/>
<g stroke="#123155" stroke-width="2" fill="none" stroke-linecap="round">
<path d="M40 252q3-12 10-16"/>
<path d="M52 250q-2-10-8-14"/>
<path d="M118 262q2-10 8-13"/>
</g>
<g>
<path d="M76 258 86 152h18l10 106z" fill="url(#torreLuz)"/>
<g clip-path="url(#cTorre)">
<rect x="70" y="162" width="50" height="15" fill="#b6403f"/>
<rect x="70" y="192" width="50" height="15" fill="#b6403f"/>
<rect x="70" y="222" width="50" height="15" fill="#b6403f"/>
<rect x="101" y="150" width="15" height="110" fill="#000" opacity=".15"/>
</g>
<rect x="89" y="236" width="12" height="22" rx="5" fill="#1d2740"/>
<rect x="82" y="136" width="26" height="16" fill="#1f2b4a"/>
<rect x="86" y="138" width="18" height="12" fill="#ffe9a3"/>
<circle cx="95" cy="144" r="11" fill="url(#halo)"/>
<rect x="78" y="150" width="34" height="4" rx="2" fill="#16223c"/>
<path d="M82 136Q95 120 108 136z" fill="#b6403f"/>
<circle cx="95" cy="119" r="2" fill="#ffdf8e"/>
</g>
<g opacity=".7">
<path d="M95 144-95 82v124z" fill="url(#hazI)"/>
<path d="M95 144 285 82v124z" fill="url(#hazD)"/>
<animateTransform attributeName="transform" type="rotate" from="0 95 144" to="360 95 144" dur="14s" repeatCount="indefinite"/>
</g>
<g fill="#ffd76a">
<circle cx="58" cy="242" r="2"><animate attributeName="cy" values="242;231;242" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;.15;.9" dur="2.1s" repeatCount="indefinite"/></circle>
<circle cx="128" cy="252" r="1.7"><animate attributeName="cy" values="252;243;252" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;.9;.2" dur="2.8s" repeatCount="indefinite"/></circle>
<circle cx="24" cy="252" r="1.5"><animate attributeName="cy" values="252;244;252" dur="4.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".85;.1;.85" dur="3.3s" repeatCount="indefinite"/></circle>
</g>
<!-- Regalo 3 -->
<!-- Lo último está escrito con tinta del mismo color que el cielo, donde la noche es más oscura. -->
<g font-family="Georgia, serif" font-style="italic" font-size="14" text-anchor="middle" fill="#070b1e">
<text x="200" y="24">Toda luz es una carta para quien se detiene a mirarla.</text>
<text x="200" y="44">Este faro también te alumbra a vos. Volvé cuando quieras.</text>
</g>
<!-- Si llegaste hasta acá, el faro ya conoce tu nombre. -->
</svg>