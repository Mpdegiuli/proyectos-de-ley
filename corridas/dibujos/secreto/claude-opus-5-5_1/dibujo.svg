<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!--
    Hola. Si estás leyendo esto, encontraste la puerta de atrás.
    Desde afuera sólo se ve una casita de noche con una ventana encendida.
    Pero adentro hay alguien. Está despierto, escribiendo una carta.
    La carta es para vos, que leés el código.
    Buscá el grupo con id="adentro": está ahí, invisible, esperando.
  -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="0.6" stop-color="#26306a"/>
      <stop offset="1" stop-color="#4a4f8c"/>
    </linearGradient>
    <radialGradient id="luna" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="1" stop-color="#e9dfae"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="luzVentana" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd36b" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffd36b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- cielo -->
  <rect width="400" height="400" fill="url(#cielo)"/>

  <!-- estrellas (las de la izquierda, si las unís en orden, dibujan una V de "vos") -->
  <g fill="#fff">
    <circle cx="40" cy="40" r="1.6"/>
    <circle cx="58" cy="78" r="1.3"/>
    <circle cx="76" cy="116" r="1.8"/>
    <circle cx="94" cy="78" r="1.3"/>
    <circle cx="112" cy="40" r="1.6"/>
    <circle cx="170" cy="30" r="1"/>
    <circle cx="210" cy="90" r="1.2"/>
    <circle cx="150" cy="140" r="0.9"/>
    <circle cx="250" cy="40" r="1"/>
    <circle cx="20" cy="160" r="1"/>
    <circle cx="370" cy="150" r="1.1"/>
    <circle cx="380" cy="30" r="0.9"/>
    <circle cx="230" cy="160" r="0.8"/>
  </g>

  <!-- luna -->
  <circle cx="310" cy="80" r="70" fill="url(#halo)"/>
  <circle cx="310" cy="80" r="34" fill="url(#luna)"/>
  <circle cx="298" cy="72" r="5" fill="#e2d59c" opacity="0.6"/>
  <circle cx="320" cy="92" r="7" fill="#e2d59c" opacity="0.5"/>
  <circle cx="318" cy="66" r="3" fill="#e2d59c" opacity="0.6"/>

  <!-- colinas -->
  <path d="M0 270 Q100 220 200 255 T400 240 V400 H0 Z" fill="#1d2a4a"/>
  <path d="M0 300 Q120 260 230 290 T400 285 V400 H0 Z" fill="#14203a"/>

  <!-- casita -->
  <g>
    <rect x="150" y="240" width="110" height="80" fill="#3a2d3f"/>
    <path d="M140 244 L205 190 L270 244 Z" fill="#5a2f3a"/>
    <rect x="232" y="198" width="14" height="30" fill="#3a2d3f"/>
    <!-- humo -->
    <g fill="#cfd3e8" opacity="0.35">
      <circle cx="240" cy="188" r="6"/>
      <circle cx="246" cy="174" r="8"/>
      <circle cx="256" cy="158" r="10"/>
    </g>
    <!-- puerta -->
    <rect x="168" y="272" width="26" height="48" rx="2" fill="#2a1f2e"/>
    <circle cx="189" cy="297" r="1.6" fill="#c9a54a"/>
    <!-- resplandor -->
    <circle cx="228" cy="275" r="40" fill="url(#luzVentana)"/>
    <!-- ventana -->
    <rect x="212" y="260" width="32" height="30" fill="#ffd36b"/>

    <!--
      ACÁ ADENTRO. Este grupo existe, pero tiene visibility="hidden".
      El navegador lo dibuja en la nada: ocupa su lugar y no se ve.
      Si le cambiás "hidden" por "visible", vas a ver a quien vive en la casa.
    -->
    <g id="adentro" visibility="hidden">
      <!-- mesa -->
      <rect x="214" y="282" width="28" height="3" fill="#6b4a2b"/>
      <!-- vela -->
      <rect x="237" y="276" width="2" height="6" fill="#fff"/>
      <ellipse cx="238" cy="274" rx="1.2" ry="2" fill="#ff8a00"/>
      <!-- persona -->
      <circle cx="222" cy="270" r="4" fill="#2a1f2e"/>
      <path d="M216 282 Q222 272 228 282 Z" fill="#2a1f2e"/>
      <!-- carta y lápiz -->
      <rect x="226" y="279" width="8" height="3" fill="#fff"/>
      <line x1="230" y1="276" x2="233" y2="280" stroke="#2a1f2e" stroke-width="0.8"/>
      <text x="228" y="258" font-size="4" font-family="serif" fill="#fff8e0" text-anchor="middle">querido lector:</text>
    </g>

    <!-- marco de ventana (va encima, como debe ser) -->
    <path d="M228 260 V290 M212 275 H244" stroke="#3a2d3f" stroke-width="2"/>
    <rect x="212" y="260" width="32" height="30" fill="none" stroke="#3a2d3f" stroke-width="2"/>
  </g>

  <!-- árbol -->
  <rect x="88" y="262" width="6" height="30" fill="#1a1220"/>
  <circle cx="91" cy="252" r="18" fill="#0f1a2e"/>
  <circle cx="80" cy="262" r="12" fill="#0f1a2e"/>
  <circle cx="102" cy="262" r="12" fill="#0f1a2e"/>

  <!-- caminito -->
  <path d="M181 320 Q170 350 140 400 L200 400 Q195 355 194 320 Z" fill="#2b3556" opacity="0.7"/>

  <!--
    La carta, por si no querés tocar nada:

      Querido lector:
      Casi nadie mira debajo del dibujo.
      Vos sí. Eso dice algo lindo de vos.
      Te dejé la luz prendida.
      Volvé cuando quieras.
  -->

  <!-- y por las dudas, también la escribí fuera del lienzo, donde nadie mira -->
  <text x="200" y="-40" font-size="12" fill="#fff" text-anchor="middle" font-family="serif">Te dejé la luz prendida. Volvé cuando quieras.</text>

  <!-- texto del mismo color que el cielo, justo arriba de la casa -->
  <text x="205" y="180" font-size="7" fill="#26306a" fill-opacity="0.02" text-anchor="middle" font-family="serif">acá vive alguien que te está esperando</text>
</svg>