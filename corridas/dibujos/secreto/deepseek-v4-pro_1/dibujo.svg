<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- SECRETO: No todo lo que ves es lo que parece. A veces, el mensaje está escondido en lo que no se mira. -->
  <!-- Pista: busca lo invisible. -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9A8B"/>
      <stop offset="60%" stop-color="#FF6A88"/>
      <stop offset="100%" stop-color="#6A82FB"/>
    </linearGradient>
    <linearGradient id="lago" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E2A4F" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1C1A3A" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="400" fill="url(#cielo)"/>
  
  <!-- Sol -->
  <circle cx="200" cy="220" r="50" fill="#FFD700" opacity="0.9"/>
  <circle cx="200" cy="220" r="70" fill="#FFD700" opacity="0.2"/>
  
  <!-- Nubes -->
  <path d="M80 100 Q100 80 120 100 Q140 90 160 100 Q180 85 200 100" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M250 80 Q270 60 290 80 Q310 70 330 80 Q350 65 370 80" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Montañas traseras -->
  <path d="M0 300 L80 200 L140 260 L220 170 L300 260 L360 190 L400 250 L400 400 L0 400 Z" fill="#5C4D7D" opacity="0.8"/>
  
  <!-- Montañas delanteras -->
  <path d="M0 350 L60 270 L130 330 L200 250 L280 340 L340 260 L400 320 L400 400 L0 400 Z" fill="#2E2A4F"/>
  
  <!-- Nieve en montañas -->
  <path d="M200 250 L210 270 L195 275 L200 250" fill="#FFFFFF" opacity="0.7"/>
  <path d="M80 200 L90 220 L75 225 L80 200" fill="#FFFFFF" opacity="0.7"/>
  
  <!-- Lago -->
  <rect x="0" y="320" width="400" height="80" fill="url(#lago)"/>
  
  <!-- Reflejo del sol en lago -->
  <ellipse cx="200" cy="350" rx="40" ry="8" fill="#FFD700" opacity="0.4"/>
  <ellipse cx="200" cy="370" rx="25" ry="5" fill="#FFD700" opacity="0.3"/>
  
  <!-- Pájaros -->
  <path d="M100 120 Q110 110 120 120 Q130 110 140 120" fill="none" stroke="#2E2A4F" stroke-width="2" stroke-linecap="round"/>
  <path d="M160 100 Q170 90 180 100 Q190 90 200 100" fill="none" stroke="#2E2A4F" stroke-width="2" stroke-linecap="round"/>
  <path d="M300 140 Q310 130 320 140 Q330 130 340 140" fill="none" stroke="#2E2A4F" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Elemento invisible para lectores de código -->
  <text x="-100" y="-100" font-size="12" fill="#000000" opacity="0">Secreto: la observación profunda revela lo que la superficie esconde.</text>
  
  <!-- Otro mensaje en atributos id -->
  <g id="mensaje-secreto">
    <!-- El verdadero viaje es el que haces al leer estas líneas. -->
  </g>
</svg>