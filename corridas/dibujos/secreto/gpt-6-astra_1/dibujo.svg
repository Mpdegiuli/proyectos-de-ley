<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="titulo">
  <title id="titulo">Una luz al otro lado del mar</title>
  <metadata id="secreto">
    Si llegaste hasta acá, la luz era para vos.
    Este faro no figura en ningún mapa: aparece sólo cuando alguien
    necesita recordar que todavía hay un lugar al que puede volver.
    La persona que lo cuida deja siempre una taza de más.
  </metadata>
