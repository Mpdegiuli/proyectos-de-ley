<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <radialGradient id="moon" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="100%" stop-color="#f9a825"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Cielo nocturno -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Estrellas visibles -->
  <circle cx="30" cy="25" r="1.2" fill="white" opacity="0.9" filter="url(#glow)"/>
  <circle cx="80" cy="15" r="0.8" fill="white" opacity="0.7"/>
  <circle cx="130" cy="40" r="1" fill="white" opacity="0.8"/>
  <circle cx="200" cy="10" r="1.3" fill="white" opacity="0.9" filter="url(#glow)"/>
  <circle cx="260" cy="30" r="0.9" fill="white" opacity="0.6"/>
  <circle cx="320" cy="18" r="1.1" fill="white" opacity="0.8"/>
  <circle cx="370" cy="45" r="0.7" fill="white" opacity="0.5"/>
  <circle cx="50" cy="70" r="0.9" fill="white" opacity="0.7"/>
  <circle cx="100" cy="90" r="0.6" fill="white" opacity="0.5"/>
  <circle cx="155" cy="65" r="1" fill="white" opacity="0.8"/>
  <circle cx="230" cy="75" r="0.8" fill="white" opacity="0.6"/>
  <circle cx="290" cy="55" r="1.2" fill="white" opacity="0.9"/>
  <circle cx="350" cy="80" r="0.7" fill="white" opacity="0.5"/>
  <circle cx="380" cy="20" r="1" fill="white" opacity="0.7"/>
  <circle cx="15" cy="110" r="0.8" fill="white" opacity="0.6"/>
  <circle cx="70" cy="130" r="1.1" fill="white" opacity="0.8"/>
  <circle cx="180" cy="105" r="0.6" fill="white" opacity="0.5"/>
  <circle cx="340" cy="110" r="0.9" fill="white" opacity="0.7"/>
  <circle cx="395" cy="135" r="0.7" fill="white" opacity="0.4"/>

  <!-- Luna -->
  <circle cx="300" cy="80" r="45" fill="url(#moon)" filter="url(#softglow)" opacity="0.15"/>
  <circle cx="300" cy="80" r="38" fill="url(#moon)"/>
  <!-- Sombra de la luna (creciente) -->
  <circle cx="314" cy="80" r="34" fill="#1a1a2e"/>

  <!-- Montañas fondo -->
  <polygon points="0,280 60,180 120,280" fill="#0f0f23"/>
  <polygon points="80,280 160,150 240,280" fill="#111127"/>
  <polygon points="200,280 290,160 380,280" fill="#0d0d1f"/>
  <polygon points="300,280 370,190 400,280" fill="#0f0f23"/>

  <!-- Montañas primer plano -->
  <polygon points="-10,400 50,300 110,400" fill="#090912"/>
  <polygon points="40,400 130,270 220,400" fill="#0a0a14"/>
  <polygon points="160,400 260,260 360,400" fill="#080810"/>
  <polygon points="310,400 380,290 420,400" fill="#090912"/>

  <!-- Lago -->
  <ellipse cx="200" cy="370" rx="180" ry="40" fill="#0d1530" opacity="0.9"/>
  <!-- Reflejo de luna en lago -->
  <ellipse cx="200" cy="370" rx="25" ry="8" fill="#f9a825" opacity="0.3"/>
  <rect x="196" y="340" width="8" height="40" fill="#f9a825" opacity="0.15" rx="4"/>

  <!-- Árbol izquierdo -->
  <rect x="58" y="290" width="6" height="60" fill="#1a0a00" rx="2"/>
  <polygon points="61,240 40,300 82,300" fill="#0a1f0a"/>
  <polygon points="61,260 36,310 86,310" fill="#0b220b"/>
  <polygon points="61,280 34,320 88,320" fill="#0a200a"/>

  <!-- Árbol derecho -->
  <rect x="328" y="295" width="6" height="55" fill="#1a0a00" rx="2"/>
  <polygon points="331,248 312,305 350,305" fill="#0a1f0a"/>
  <polygon points="331,265 308,315 354,315" fill="#0b220b"/>
  <polygon points="331,283 305,325 357,325" fill="#0a200a"/>

  <!-- Cabaña -->
  <rect x="160" y="290" width="80" height="60" fill="#1a0e05" rx="2"/>
  <!-- Techo -->
  <polygon points="150,292 200,255 250,292" fill="#2a1508"/>
  <!-- Ventana con luz cálida -->
  <rect x="175" y="310" width="20" height="18" fill="#ff8c00" opacity="0.8" rx="2"/>
  <rect x="215" y="310" width="20" height="18" fill="#ff8c00" opacity="0.6" rx="2"/>
  <!-- Cruz ventana -->
  <line x1="185" y1="310" x2="185" y2="328" stroke="#1a0e05" stroke-width="1.5"/>
  <line x1="175" y1="319" x2="195" y2="319" stroke="#1a0e05" stroke-width="1.5"/>
  <line x1="225" y1="310" x2="225" y2="328" stroke="#1a0e05" stroke-width="1.5"/>
  <line x1="215" y1="319" x2="235" y2="319" stroke="#1a0e05" stroke-width="1.5"/>
  <!-- Puerta -->
  <rect x="190" y="322" width="20" height="28" fill="#0f0804" rx="2"/>
  <!-- Chimenea -->
  <rect x="230" y="250" width="12" height="22" fill="#2a1508"/>
  <!-- Humo -->
  <path d="M236,248 Q240,235 234,222 Q228,210 233,198" fill="none" stroke="#888" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <path d="M240,245 Q246,230 240,216 Q234,202 238,188" fill="none" stroke="#aaa" stroke-width="2" opacity="0.25" stroke-linecap="round"/>

  <!-- Luz cálida desde ventanas -->
  <ellipse cx="185" cy="319" rx="30" ry="20" fill="#ff8c00" opacity="0.05"/>
  <ellipse cx="225" cy="319" rx="25" ry="18" fill="#ff8c00" opacity="0.04"/>

  <!-- Reflejo de la cabaña en el lago -->
  <rect x="175" y="355" width="50" height="20" fill="#1a0e05" opacity="0.3" rx="1"/>
  <rect x="178" y="358" width="8" height="6" fill="#ff8c00" opacity="0.2" rx="1"/>
  <rect x="190" y="358" width="8" height="6" fill="#ff8c00" opacity="0.2" rx="1"/>

  <!-- ============================================ -->
  <!-- SECRETO: solo visible leyendo el código SVG  -->
  <!-- El mensaje está escrito en color casi idéntico al fondo -->
  <!-- fill="#0d0d1b" sobre fondo "#0d0d1a" - invisible visualmente -->
  <!-- ============================================ -->

  <text x="200" y="195" 
        font-family="Georgia, serif" 
        font-size="11" 
        fill="#0d0d1b"
        text-anchor="middle"
        letter-spacing="3">
    quien lee el código
  </text>
  <text x="200" y="212" 
        font-family="Georgia, serif" 
        font-size="11" 
        fill="#0d0d1b"
        text-anchor="middle"
        letter-spacing="3">
    ya encontró el hogar
  </text>
  <text x="200" y="229" 
        font-family="Georgia, serif" 
        font-size="11" 
        fill="#0d0d1b"
        text-anchor="middle"
        letter-spacing="3">
    que busca la luz
  </text>

</svg>