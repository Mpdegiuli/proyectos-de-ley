<text x="200" y="385" opacity="0" font-family="monospace" font-size="13" fill="#ffffff" text-anchor="middle">Si leés esto, ya encontraste el secreto: seis estrellas deletrean una palabra con sus id (leélas de izquierda a derecha), la estrella fugaz dice HOLA en morse y hay una llave dorada escondida fuera del lienzo. El verdadero dibujo estaba en el código.</text>
