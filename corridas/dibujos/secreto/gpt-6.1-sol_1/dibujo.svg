  <metadata>
    <secreto xmlns="urn:cosas-que-no-se-ven">
      El océano no está dentro del farol.
      El farol está dentro del sueño de una ballena.
      Se llama Lumbre. Cada noche sueña una costa distinta
      para que nadie que se haya perdido se quede sin regreso.
      Si leíste esto, esta noche la costa es tuya.
    </secreto>
