<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="55%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#18263b"/>
      <stop offset="65%" stop-color="#0d1522"/>
      <stop offset="100%" stop-color="#070b12"/>
    </radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#263954" stroke-width="0.4" opacity="0.5"/>
    </pattern>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#7c8d9e"/>
      <stop offset="40%" stop-color="#cdd8e3"/>
      <stop offset="70%" stop-color="#8b9cad"/>
      <stop offset="100%" stop-color="#4e5d6c"/>
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a4424"/>
      <stop offset="50%" stop-color="#542c14"/>
      <stop offset="100%" stop-color="#33190a"/>
    </linearGradient>
    <linearGradient id="snailBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6e3d8"/>
      <stop offset="55%" stop-color="#69b8b3"/>
      <stop offset="100%" stop-color="#3b6e75"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffe985" stop-opacity="0.65"/>
      <stop offset="45%" stop-color="#ffd56b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd56b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbe0" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffd15c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff9d2e" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo y carta técnica astral -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#grid)"/>

  <!-- Trazos geométricos astronómicos de fondo -->
  <g stroke="#3d5a80" fill="none" stroke-width="0.6" opacity="0.45">
    <circle cx="134" cy="112" r="95" stroke-dasharray="3 4"/>
    <circle cx="134" cy="112" r="155" stroke-dasharray="1 6"/>
    <circle cx="305" cy="95" r="52"/>
    <line x1="20" y1="360" x2="380" y2="40" stroke-dasharray="2 5"/>
    <path d="M 40 160 A 210 210 0 0 1 340 310"/>
  </g>

  <!-- Estrellas sutiles -->
  <g fill="#cfe8ff" opacity="0.65">
    <circle cx="48" cy="52" r="1.2"/>
    <circle cx="92" cy="34" r="0.8"/>
    <circle cx="215" cy="48" r="1.4"/>
    <circle cx="365" cy="45" r="1.1"/>
    <circle cx="352" cy="342" r="1.3"/>
    <circle cx="268" cy="366" r="0.9"/>
    <circle cx="64" cy="210" r="1"/>
    <circle cx="250" cy="295" r="0.8"/>
  </g>

  <!-- Haz de luz del faro -->
  <polygon points="134,112 365,25 365,175" fill="url(#beam)"/>
  <g fill="#fff2a6" opacity="0.65">
    <circle cx="195" cy="105" r="1.1"/>
    <circle cx="222" cy="92" r="0.8"/>
    <circle cx="248" cy="118" r="1.3"/>
    <circle cx="275" cy="84" r="0.9"/>
    <circle cx="335" cy="132" r="1"/>
  </g>

  <!-- Serrucho musical curvado -->
  <g id="musical-saw">
    <!-- Hoja metálica con dientes inferiores -->
    <path d="M 76 296 Q 200 220 380 220 L 382 238
             l -7 6 l -4 -7 l -7 6 l -4 -7 l -7 6 l -4 -7 l -7 6 l -4 -7
             l -7 6 l -4 -7 l -7 6 l -4 -7 l -7 6 l -4 -7 l -7 6 l -4 -7
             l -7 6 l -4 -7 l -7 6 l -4 -7 l -7 6 l -4 -7 l -7 6 l -4 -7
             l -7 6 l -4 -7 l -7 6 l -4 -7 l -7 6 l -4 -7 l -7 6 l -4 -7
             l -7 6 l -4 -7 l -7 6 l -4 -7 l -7 6 l -4 -7 l -7 6 l -4 -7
             l -7 6 l -4 -7 l -7 6 l -4 -7 l -7 6 l -4 -7 l -7 6 l -4 -7
             l -7 6 l -4 -7 l -7 6 l -4 -7 L 82 340 Z"
          fill="url(#blade)" stroke="#384654" stroke-width="1"/>
    <!-- Reflejo de vibración en la hoja -->
    <path d="M 92 302 Q 205 232 372 227" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.45"/>
    <!-- Ondas sonoras y notas bajo el serrucho -->
    <g stroke="#7bc8f6" fill="none" stroke-width="0.9" opacity="0.55">
      <path d="M 225 278 Q 245 290 265 276"/>
      <path d="M 218 286 Q 245 302 272 284"/>
      <path d="M 210 295 Q 245 315 280 292"/>
    </g>
    <g fill="#9ad9ff" opacity="0.7">
      <circle cx="295" cy="306" r="3"/>
      <path d="M 298 306 L 298 288 L 308 285 L 308 302" stroke="#9ad9ff" stroke-width="1.3" fill="none"/>
      <circle cx="305" cy="302" r="3"/>
      <circle cx="204" cy="322" r="2.6"/>
      <path d="M 206.5 322 L 206.5 306 L 213 309" stroke="#9ad9ff" stroke-width="1.2" fill="none"/>
    </g>
    <!-- Mango de madera -->
    <path d="M 32 292 C 22 296 20 315 26 338 C 31 356 46 364 62 358 L 94 345 L 82 286 L 50 286 C 42 286 36 289 32 292 Z"
          fill="url(#wood)" stroke="#241005" stroke-width="1.5"/>
    <!-- Abertura del mango -->
    <path d="M 42 308 C 38 315 41 334 48 340 C 54 344 65 340 65 332 L 62 307 C 59 301 46 301 42 308 Z"
          fill="url(#bg)" stroke="#241005" stroke-width="1.2"/>
    <!-- Remaches de latón -->
    <circle cx="78" cy="300" r="3.2" fill="#d9a441" stroke="#5e400b" stroke-width="0.8"/>
    <circle cx="84" cy="332" r="3.2" fill="#d9a441" stroke="#5e400b" stroke-width="0.8"/>
  </g>

  <!-- Caracol con Caparazón-Biblioteca y Faro -->
  <g transform="translate(185, 248) rotate(-17)">
    <!-- Estela luminosa sobre el lomo -->
    <path d="M -90 1 Q -65 -2 -45 0" fill="none" stroke="#8ff0e4" stroke-width="2" opacity="0.45" stroke-linecap="round"/>

    <!-- Cuerpo del caracol -->
    <path d="M -54 0 C -40 -2 -20 -4 15 -4 C 36 -4 48 -14 55 -24 C 60 -30 68 -28 69 -21 C 70 -14 60 -3 47 1 C 25 4 -38 4 -54 0 Z"
          fill="url(#snailBody)" stroke="#244b52" stroke-width="1.2"/>
    <!-- Textura punteada en el cuerpo -->
    <g fill="#c9fff4" opacity="0.55">
      <circle cx="-28" cy="-2" r="1"/>
      <circle cx="-15" cy="-1.5" r="1.3"/>
      <circle cx="34" cy="-7" r="1.2"/>
      <circle cx="46" cy="-13" r="1"/>
      <circle cx="56" cy="-18" r="1.1"/>
    </g>

    <!-- Tentáculos inferiores -->
    <path d="M 65 -17 Q 74 -15 78 -11" fill="none" stroke="#69b8b3" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 62 -14 Q 70 -10 73 -6" fill="none" stroke="#69b8b3" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Antenas superiores con ojos-farolillo -->
    <path d="M 61 -25 Q 64 -43 72 -50" fill="none" stroke="#8ad9d2" stroke-width="2" stroke-linecap="round"/>
    <path d="M 55 -24 Q 52 -42 56 -52" fill="none" stroke="#8ad9d2" stroke-width="2" stroke-linecap="round"/>
    <circle cx="72" cy="-50" r="3.2" fill="#ffe680" filter="url(#softGlow)"/>
    <circle cx="56" cy="-52" r="3" fill="#ffe680" filter="url(#softGlow)"/>

    <!-- Caparazón: Torre-Biblioteca en Espiral -->
    <g id="library-shell">
      <!-- Base de piedra cálida -->
      <path d="M -44 -3 C -50 -25 -46 -58 -36 -82 C -26 -104 -18 -118 -10 -122
               C 0 -118 14 -102 22 -78 C 30 -52 28 -20 18 -3 Z"
            fill="#d9c6a5" stroke="#4a3a28" stroke-width="1.4"/>

      <!-- Franjas de cornisas espirales -->
      <path d="M -46 -28 Q -10 -18 26 -30" fill="none" stroke="#7a5e42" stroke-width="3"/>
      <path d="M -41 -58 Q -8 -48 25 -60" fill="none" stroke="#7a5e42" stroke-width="2.8"/>
      <path d="M -31 -86 Q -7 -78 18 -88" fill="none" stroke="#7a5e42" stroke-width="2.5"/>

      <!-- Piso 1: Estanterías abiertas con libros de colores -->
      <g>
        <rect x="-35" y="-23" width="16" height="16" rx="7" fill="#2b1d12" stroke="#5c442e" stroke-width="1"/>
        <rect x="-33" y="-17" width="3" height="9" fill="#c94c4c"/>
        <rect x="-29.5" y="-19" width="2.5" height="11" fill="#4f86c6"/>
        <rect x="-26.5" y="-16" width="3" height="8" fill="#e6b84c"/>
        <rect x="-23" y="-18" width="2.5" height="10" fill="#5da670"/>

        <rect x="-12" y="-24" width="16" height="17" rx="7" fill="#2b1d12" stroke="#5c442e" stroke-width="1"/>
        <rect x="-10" y="-19" width="3" height="11" fill="#e07a5f"/>
        <rect x="-6.5" y="-17" width="3" height="9" fill="#81b29a"/>
        <rect x="-3" y="-20" width="2.5" height="12" fill="#f2cc8f"/>
        <rect x="0" y="-17" width="2.5" height="9" fill="#5b6abf"/>
      </g>

      <!-- Piso 2: Ventanales iluminados y escalera exterior -->
      <g>
        <path d="M -32 -32 L -32 -47 A 6 6 0 0 1 -20 -47 L -20 -32 Z" fill="#ffd97d" stroke="#5c442e" stroke-width="1"/>
        <path d="M -11 -32 L -11 -49 A 6.5 6.5 0 0 1 2 -49 L 2 -32 Z" fill="#2b1d12" stroke="#5c442e" stroke-width="1"/>
        <!-- Libros piso 2 -->
        <rect x="-9" y="-44" width="2.5" height="11" fill="#e6b84c"/>
        <rect x="-6" y="-42" width="2.5" height="9" fill="#c94c4c"/>
        <rect x="-3" y="-45" width="3" height="12" fill="#5299d3"/>

        <path d="M 9 -34 L 9 -47 A 5 5 0 0 1 19 -47 L 19 -34 Z" fill="#ffd97d" stroke="#5c442e" stroke-width="1"/>
      </g>

      <!-- Piso 3: Ventanas redondas de observatorio -->
      <circle cx="-18" cy="-70" r="5" fill="#ffe699" stroke="#5c442e" stroke-width="1"/>
      <circle cx="-2" cy="-71" r="5" fill="#ffe699" stroke="#5c442e" stroke-width="1"/>
      <circle cx="12" cy="-73" r="4" fill="#2b1d12" stroke="#5c442e" stroke-width="1"/>

      <!-- Cúpula azul pizarra -->
      <path d="M -25 -90 C -22 -112 -14 -120 -9 -122 C -4 -120 6 -112 11 -90 Z"
            fill="#345678" stroke="#1d3247" stroke-width="1.2"/>
      <line x1="-9" y1="-122" x2="-9" y2="-90" stroke="#527ca6" stroke-width="0.9"/>

      <!-- Barandilla del faro -->
      <rect x="-18" y="-125" width="18" height="4" fill="#2b3d4f" stroke="#15202b" stroke-width="0.8"/>

      <!-- Torre del faro en la cima -->
      <rect x="-15" y="-140" width="12" height="15" fill="#f5efe6" stroke="#3b2f24" stroke-width="1"/>
      <rect x="-15" y="-135" width="12" height="4" fill="#c94c4c"/>
      <!-- Linterna luminosa -->
      <circle cx="-9" cy="-145" r="10" fill="url(#lampGlow)"/>
      <rect x="-13" y="-149" width="8" height="9" fill="#fff7b2" stroke="#3b2f24" stroke-width="0.9"/>
      <path d="M -16 -149 L -9 -157 L -2 -149 Z" fill="#2c3e50" stroke="#15202b" stroke-width="0.9"/>
    </g>
  </g>

  <!-- Polilla de Vitral atrapada en el haz de luz -->
  <g transform="translate(306, 102) rotate(-25)">
    <!-- Alas posteriores -->
    <g stroke="#14181f" stroke-width="1.3">
      <path d="M -3 6 C -22 14 -36 32 -22 42 C -12 48 -2 32 -1 12 Z" fill="#2a9d8f" opacity="0.88"/>
      <path d="M 3 6 C 22 14 36 32 22 42 C 12 48 2 32 1 12 Z" fill="#2a9d8f" opacity="0.88"/>
      <!-- Celdas de vitral en alas posteriores -->
      <path d="M -10 18 L -26 30 M -6 22 L -16 40" stroke="#14181f" stroke-width="1.1"/>
      <path d="M 10 18 L 26 30 M 6 22 L 16 40" stroke="#14181f" stroke-width="1.1"/>
      <polygon points="-2,12 -14,26 -4,36" fill="#e9c46a" opacity="0.85"/>
      <polygon points="2,12 14,26 4,36" fill="#e9c46a" opacity="0.85"/>
    </g>

    <!-- Alas anteriores (estilo Tiffany multicolor) -->
    <g stroke="#14181f" stroke-width="1.5" stroke-linejoin="round">
      <!-- Ala izquierda -->
      <path d="M -3 -4 C -28 -26 -58 -16 -52 6 C -48 22 -18 18 -3 4 Z" fill="#e76f51" opacity="0.9"/>
      <polygon points="-3,-4 -26,-16 -30,2 -3,4" fill="#f4a261" opacity="0.9"/>
      <polygon points="-26,-16 -52,-10 -46,6 -30,2" fill="#e63946" opacity="0.85"/>
      <polygon points="-30,2 -46,6 -32,16 -12,12" fill="#457b9d" opacity="0.9"/>
      <circle cx="-38" cy="-3" r="4.5" fill="#fff3b0" stroke="#14181f" stroke-width="1.2"/>

      <!-- Ala derecha -->
      <path d="M 3 -4 C 28 -26 58 -16 52 6 C 48 22 18 18 3 4 Z" fill="#e76f51" opacity="0.9"/>
      <polygon points="3,-4 26,-16 30,2 3,4" fill="#f4a261" opacity="0.9"/>
      <polygon points="26,-16 52,-10 46,6 30,2" fill="#e63946" opacity="0.85"/>
      <polygon points="30,2 46,6 32,16 12,12" fill="#457b9d" opacity="0.9"/>
      <circle cx="38" cy="-3" r="4.5" fill="#fff3b0" stroke="#14181f" stroke-width="1.2"/>
    </g>

    <!-- Cuerpo de la polilla -->
    <ellipse cx="0" cy="6" rx="4" ry="15" fill="#1d242e" stroke="#667788" stroke-width="0.8"/>
    <ellipse cx="0" cy="-7" rx="4.5" ry="5" fill="#2a3340"/>
    <circle cx="0" cy="-12" r="3" fill="#1d242e"/>
    <!-- Antenas plumosas -->
    <path d="M -1.5 -14 Q -8 -24 -14 -26" fill="none" stroke="#f4d35e" stroke-width="1.1"/>
    <path d="M 1.5 -14 Q 8 -24 14 -26" fill="none" stroke="#f4d35e" stroke-width="1.1"/>
    <path d="M -6 -20 L -10 -18 M -9 -23 L -13 -21 M 6 -20 L 10 -18 M 9 -23 L 13 -21" stroke="#f4d35e" stroke-width="0.9"/>
  </g>
</svg>