<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a237e"/>
      <stop offset="1" stop-color="#4527a0"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e91e63"/>
      <stop offset="1" stop-color="#ff6f00"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#fff8e1"/>
      <stop offset="1" stop-color="#ffe0b2"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- sombra suave -->
  <g opacity="0.18" transform="translate(7,10)">
    <path d="M 120 80 L 120 330" stroke="#4e342e" stroke-width="34" stroke-linecap="round"/>
    <path d="M 120 140 C 120 90 200 80 225 115 C 250 150 215 195 170 195 L 120 195"
          fill="none" stroke="#4e342e" stroke-width="30" stroke-linecap="round"/>
    <path d="M 185 250 L 295 250 C 320 250 320 285 295 285 L 150 285"
          fill="none" stroke="#4e342e" stroke-width="26" stroke-linecap="round"/>
    <path d="M 240 250 C 240 250 250 320 200 330 C 250 340 260 300 260 285"
          fill="none" stroke="#4e342e" stroke-width="24" stroke-linecap="round"/>
    <circle cx="285" cy="115" r="24" fill="#4e342e"/>
  </g>

  <!-- la letra: "N̈ox" — un trazo vertical con bucle, brazo horizontal y gancho -->
  <!-- asta vertical -->
  <path d="M 120 80 L 120 330" stroke="url(#g1)" stroke-width="34" stroke-linecap="round" fill="none"/>

  <!-- bucle superior -->
  <path d="M 120 140 C 120 90 200 80 225 115 C 250 150 215 195 170 195 L 120 195"
        fill="none" stroke="url(#g2)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- brazo medio con retorno -->
  <path d="M 185 250 L 295 250 C 320 250 320 285 295 285 L 150 285"
        fill="none" stroke="url(#g1)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- gancho inferior -->
  <path d="M 240 250 C 240 250 250 320 200 330 C 250 340 260 300 260 285"
        fill="none" stroke="url(#g2)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- punto diacrítico -->
  <circle cx="285" cy="115" r="24" fill="url(#g2)"/>
  <circle cx="285" cy="115" r="9" fill="#fff8e1"/>

  <!-- líneas guía sutiles -->
  <line x1="30" y1="80" x2="370" y2="80" stroke="#8d6e63" stroke-width="2" stroke-dasharray="8 6" opacity="0.5"/>
  <line x1="30" y1="330" x2="370" y2="330" stroke="#8d6e63" stroke-width="2" stroke-dasharray="8 6" opacity="0.5"/>
</svg>