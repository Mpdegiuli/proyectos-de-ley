<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7efe1"/>
      <stop offset="1" stop-color="#e6d9c3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2.5" flood-color="#3a2c1c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#paper)"/>
  <circle cx="200" cy="185" r="165" fill="url(#glow)"/>
  <circle cx="200" cy="185" r="152" fill="none" stroke="#c8b694" stroke-width="1.2"/>
  <circle cx="200" cy="185" r="140" fill="none" stroke="#c8b694" stroke-width="0.6" stroke-dasharray="3 6"/>

  <!-- guías tipográficas -->
  <g stroke="#d1462f" stroke-width="1" opacity="0.45" stroke-dasharray="7 7">
    <line x1="30" y1="52" x2="370" y2="52"/>
    <line x1="30" y1="204" x2="370" y2="204"/>
    <line x1="30" y1="350" x2="370" y2="350"/>
    <line x1="172" y1="26" x2="172" y2="374"/>
  </g>
  <g fill="#d1462f" font-family="Georgia, serif" font-size="10" opacity="0.7">
    <text x="32" y="46">capita</text>
    <text x="32" y="198">axis</text>
    <text x="32" y="344">linea base</text>
  </g>

  <!-- GLIFO INEXISTENTE -->
  <g filter="url(#ink)" fill="none" stroke="#17253f" stroke-linecap="round" stroke-linejoin="round">
    <!-- asta principal -->
    <path d="M172,56 C164,145 164,255 172,344" stroke-width="28"/>
    <!-- bandera superior izquierda -->
    <path d="M170,60 C138,52 112,64 106,90 C101,112 118,130 138,128" stroke-width="13"/>
    <!-- lazo superior derecho con voluta interna -->
    <path d="M182,72 C240,50 300,74 302,118 C304,154 268,176 234,164 C212,156 202,138 208,120" stroke-width="20"/>
    <!-- brazo transversal -->
    <path d="M116,208 C168,190 234,190 288,208" stroke-width="14"/>
    <!-- cola con espiral -->
    <path d="M172,332 C224,356 284,350 308,314" stroke-width="23"/>
    <path d="M308,314 C330,286 302,258 278,276 C256,292 264,320 286,316" stroke-width="13"/>
  </g>

  <!-- remates -->
  <g fill="#17253f">
    <path d="M144,350 L200,350 L193,334 L151,334 Z"/>
    <rect x="100" y="120" width="14" height="14" transform="rotate(45 107 127)"/>
    <circle cx="288" cy="208" r="7"/>
  </g>

  <!-- acento propio del glifo -->
  <g fill="#d1462f">
    <circle cx="304" cy="44" r="8"/>
    <rect x="152" y="196" width="40" height="12" transform="rotate(-8 172 202)"/>
  </g>
  <circle cx="304" cy="44" r="14" fill="none" stroke="#d1462f" stroke-width="1.4" opacity="0.6"/>

  <!-- marcas de registro -->
  <g stroke="#8d7c62" stroke-width="1.4" opacity="0.8">
    <path d="M18,18 h22 M18,18 v22 M382,18 h-22 M382,18 v22 M18,382 h22 M18,382 v-22 M382,382 h-22 M382,382 v-22"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#17253f">
    <text x="200" y="378" font-size="13" letter-spacing="4" text-anchor="middle">U+E0A7 · SIN NOMBRE · SIN SONIDO</text>
  </g>
</svg>