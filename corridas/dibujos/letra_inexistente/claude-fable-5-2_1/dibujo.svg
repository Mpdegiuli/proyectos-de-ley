<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#f3ecdd"/>
  <rect x="14" y="14" width="372" height="372" fill="none" stroke="#d9cdb4" stroke-width="1"/>

  <!-- líneas guía tipográficas -->
