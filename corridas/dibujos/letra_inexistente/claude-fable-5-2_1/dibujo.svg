    <path d="M196 90 L168 97 L168 104 L196 110 Z"/>
    <!-- remate inferior derecho -->
    <path d="M196 300 L258 300 L258 292 C243 290 233 284 230 268 L196 268 Z"/>
    <!-- brazo -->
