    <line x1="30" y1="90" x2="370" y2="90"/>
    <line x1="30" y1="170" x2="370" y2="170"/>
    <line x1="30" y1="350" x2="370" y2="350"/>
  </g>
  <line x1="30" y1="300" x2="370" y2="300" stroke="#c0563a" stroke-width="1"/>

  <g font-family="Courier New, monospace" font-size="9" fill="#a8977a">
