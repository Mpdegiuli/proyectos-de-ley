    <circle cx="301" cy="172" r="19"/>
    <!-- diacrítico -->
    <rect x="108" y="116" width="22" height="22" transform="rotate(45 119 127)"/>
  </g>

  <text x="368" y="376" text-anchor="end" font-family="Courier New, monospace" font-size="10" fill="#a8977a">U+E0A7 · letra sin nombre</text>
