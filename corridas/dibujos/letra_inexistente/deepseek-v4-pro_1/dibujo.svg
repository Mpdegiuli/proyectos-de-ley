<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="100%" stop-color="#302b63"/>
    </linearGradient>
    <linearGradient id="letterGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfcfcf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <path d="M 100 340 
             C 100 250, 120 150, 160 80 
             C 130 30, 70 50, 90 110 
             C 120 150, 180 170, 240 140 
             C 280 120, 300 200, 270 260 
             C 330 300, 350 370, 300 380 
             C 260 388, 240 350, 260 330 
             C 240 300, 200 310, 180 320 
             C 140 330, 120 340, 100 340 Z 
             M 150 250 
             C 170 210, 200 190, 230 210 
             C 250 230, 260 260, 240 280 
             C 210 300, 170 290, 150 260 
             C 140 240, 140 260, 150 250 Z" 
          fill="url(#letterGrad)" stroke="#d4af37" stroke-width="5" fill-rule="evenodd"/>
    <path d="M 130 250 C 160 220, 200 300, 250 230" fill="none" stroke="#d4af37" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <circle cx="100" cy="80" r="5" fill="#d4af37"/>
    <path d="M 80 370 C 150 380, 250 360, 320 370" fill="none" stroke="#d4af37" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
