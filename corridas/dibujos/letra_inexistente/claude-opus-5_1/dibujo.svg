<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2430"/>
      <stop offset="1" stop-color="#35506b"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="#f3ead9"/>

  <!-- pauta tipográfica -->
  <g stroke="#c9b9a0" stroke-width="1.4">
    <line x1="30" y1="90" x2="370" y2="90"/>
    <line x1="30" y1="160" x2="370" y2="160" stroke-dasharray="6 7"/>
    <line x1="30" y1="270" x2="370" y2="270"/>
    <line x1="30" y1="335" x2="370" y2="335" stroke-dasharray="6 7"/>
  </g>

  <g fill="none" stroke="url(#ink)" stroke-linecap="round" stroke-linejoin="round">

    <!-- asta principal con cola descendente -->
    <path d="M132,88 V296 C132,330 112,344 82,336" stroke-width="26"/>

    <!-- panza abierta, no cerrada del todo -->
    <path d="M132,178 C196,152 240,186 236,220 C232,256 190,274 136,258" stroke-width="24"/>

    <!-- travesaño inclinado que atraviesa el asta -->
    <path d="M92,126 L196,100" stroke-width="15"/>

    <!-- brazo suelto a la derecha -->
    <path d="M276,186 C312,212 310,258 278,278" stroke-width="18"/>

    <!-- gancho inferior que une sin tocar -->
    <path d="M176,300 C212,318 252,312 270,288" stroke-width="13" stroke-dasharray="54 22"/>
  </g>

  <!-- signo diacrítico propio de la letra -->
  <circle cx="268" cy="104" r="14" fill="#1b2430"/>
  <path d="M232,70 C254,54 290,54 310,70" fill="none" stroke="#1b2430" stroke-width="10" stroke-linecap="round"/>

  <!-- punto de apoyo en la base -->
  <circle cx="310" cy="316" r="7.5" fill="#35506b"/>
</svg>