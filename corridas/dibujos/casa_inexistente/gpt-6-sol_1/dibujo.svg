<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#101a40"/>
      <stop offset=".58" stop-color="#354b79"/>
      <stop offset="1" stop-color="#8a7592"/>
    </linearGradient>
    <linearGradient id="walls" x2="1" y2="1">
      <stop stop-color="#f8d7a0"/>
      <stop offset="1" stop-color="#b87877"/>
    </linearGradient>
    <linearGradient id="roof" x2="0" y2="1">
      <stop stop-color="#84d1cc"/>
      <stop offset="1" stop-color="#397c91"/>
    </linearGradient>
    <linearGradient id="island" x2="0" y2="1">
      <stop stop-color="#5a706b"/>
      <stop offset="1" stop-color="#252c52"/>
    </linearGradient>
    <radialGradient id="moon">
      <stop stop-color="#fff7ca"/>
      <stop offset=".65" stop-color="#f4dda5"/>
      <stop offset="1" stop-color="#e0a8a1"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="319" cy="78" r="38" fill="#ffe8b2" opacity=".25" filter="url(#glow)"/>
  <circle cx="319" cy="78" r="29" fill="url(#moon)"/>
  <circle cx="311" cy="69" r="4" fill="#d8bba6" opacity=".5"/>
  <circle cx="330" cy="85" r="6" fill="#d8bba6" opacity=".4"/>

  <g fill="#fff1d2">
    <circle cx="42" cy="55" r="1.7"/><circle cx="92" cy="28" r="1"/>
    <circle cx="155" cy="62" r="1.4"/><circle cx="228" cy="35" r="1"/>
    <circle cx="270" cy="121" r="1.3"/><circle cx="366" cy="38" r="1.5"/>
    <circle cx="378" cy="165" r="1"/><circle cx="26" cy="171" r="1.3"/>
    <circle cx="68" cy="109" r="1"/><circle cx="351" cy="223" r="1.2"/>
  </g>
  <g stroke="#fff1d2" stroke-width="1.5" stroke-linecap="round" opacity=".8">
    <path d="M73 75v10m-5-5h10M245 85v8m-4-4h8M356 126v10m-5-5h10"/>
  </g>

  <!-- Una isla que flota, con sus raíces al aire. -->
  <ellipse cx="199" cy="307" rx="125" ry="16" fill="#1a2448" opacity=".35" filter="url(#glow)"/>
  <path d="M65 271 Q109 259 153 269 Q211 277 264 260 Q302 253 333 272 Q315 285 283 287 L240 319 L216 346 L199 326 L180 365 L160 328 L133 345 L119 303 Q83 293 65 271Z"
