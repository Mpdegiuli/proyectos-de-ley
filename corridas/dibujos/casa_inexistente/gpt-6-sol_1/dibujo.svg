  <path d="M139 194l8 9 7-12m-15 3 15-3" fill="none" stroke="#bde9dc" stroke-width="1"/>
  <circle cx="139" cy="194" r="2" fill="#fff4c8"/>
  <circle cx="147" cy="203" r="2" fill="#fff4c8"/>
  <circle cx="154" cy="191" r="2" fill="#fff4c8"/>
  <path d="M233 189 Q233 178 247 178 Q261 178 261 189v33h-28Z"
        fill="#26375f" stroke="#fbe4b0" stroke-width="4"/>
  <circle cx="246" cy="198" r="9" fill="#fbd5a7"/>
  <path d="M233 206h28M247 179v43" stroke="#fbe4b0" stroke-width="2"/>

  <!-- La puerta abre directamente a un cielo distinto. -->
  <path d="M174 270v-50 Q174 199 196 199 Q218 199 218 220v50Z"
        fill="#443b66" stroke="#fbe4b0" stroke-width="5"/>
  <path d="M181 269v-49 Q181 205 196 205 Q211 205 211 220v49Z"
        fill="#15244e"/>
  <circle cx="196" cy="229" r="12" fill="#7468a5" opacity=".65" filter="url(#glow)"/>
  <path d="M183 260q13-13 27-4M185 242l7-7 6 4 8-13"
        fill="none" stroke="#a8d5db" stroke-width="1.5"/>
  <circle cx="192" cy="235" r="2" fill="#fff3c9"/>
