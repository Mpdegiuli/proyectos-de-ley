  <path d="M238 94h27v-7h-27z" fill="#f1bf9c" stroke="#4c466a" stroke-width="3"/>
  <circle cx="251" cy="72" r="7" fill="#f5cfa9"/>
  <circle cx="267" cy="55" r="5" fill="#a7e0d2"/>
  <circle cx="282" cy="35" r="9" fill="#eaa8ae"/>
  <ellipse cx="282" cy="35" rx="15" ry="4" transform="rotate(-24 282 35)"
