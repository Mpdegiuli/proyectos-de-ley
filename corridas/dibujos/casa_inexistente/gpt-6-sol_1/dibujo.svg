  <path d="M65 271 Q109 259 153 269 Q211 277 264 260 Q302 253 333 272 Q274 285 212 278 Q129 283 65 271Z"
        fill="#9ab494" stroke="#344d63" stroke-width="3"/>
  <path d="M117 288 Q137 304 133 345 M176 289 Q181 318 180 365 M226 284 Q220 313 216 346 M285 283 Q259 296 240 319"
        fill="none" stroke="#8c918a" stroke-width="2" opacity=".7"/>

  <!-- El agua sube desde las nubes hasta la casa. -->
  <path d="M302 365 C331 337 305 306 320 281 C332 258 320 241 313 230"
        fill="none" stroke="#b5f5ef" stroke-width="11" opacity=".18" filter="url(#glow)"/>
  <path d="M302 365 C331 337 305 306 320 281 C332 258 320 241 313 230"
        fill="none" stroke="#a9f5ed" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 7"/>
  <path d="M307 350l-6-10 9 3m7-33-5-10 9 3m-2-40-5-10 9 3"
        fill="none" stroke="#d7fff1" stroke-width="2" stroke-linejoin="round"/>

