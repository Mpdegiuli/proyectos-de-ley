  <circle cx="183" cy="246" r="1" fill="#fff3c9"/>
  <circle cx="207" cy="250" r="2" fill="#f7c8b2"/>
  <circle cx="205" cy="248" r="2" fill="#ffe7a6"/>

  <path d="M80 267q-8-13-17-9m23 11q-2-17 6-22m187 15q13-18 22-11"
        fill="none" stroke="#c6d8a5" stroke-width="3" stroke-linecap="round"/>
  <g fill="#f7d5ab">
    <circle cx="68" cy="256" r="3"/><circle cx="92" cy="245" r="3"/>
    <circle cx="302" cy="250" r="3"/>
  </g>
  <path d="M38 342q25-11 49 0t48 0m132 20q27-12 51 0t49 0"
