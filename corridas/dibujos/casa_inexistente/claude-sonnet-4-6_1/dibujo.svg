<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8d5ff"/>
      <stop offset="100%" stop-color="#9b59b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1b69"/>
      <stop offset="100%" stop-color="#1a0a3d"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6a0dad"/>
      <stop offset="100%" stop-color="#3d0070"/>
    </linearGradient>
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f0a4a"/>
      <stop offset="100%" stop-color="#2d1b69"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="bricks" x="0" y="0" width="20" height="12" patternUnits="userSpaceOnUse">
      <rect width="20" height="12" fill="none"/>
      <rect x="1" y="1" width="17" height="9" rx="1" fill="#3d1a7a" opacity="0.4"/>
      <rect x="11" y="7" width="17" height="9" rx="1" fill="#3d1a7a" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="white" opacity="0.8">
    <circle cx="20" cy="15" r="1"/>
    <circle cx="55" cy="30" r="1.2"/>
    <circle cx="90" cy="10" r="0.8"/>
    <circle cx="130" cy="25" r="1"/>
    <circle cx="170" cy="8" r="1.3"/>
    <circle cx="220" cy="20" r="0.9"/>
    <circle cx="260" cy="12" r="1.1"/>
    <circle cx="300" cy="30" r="0.8"/>
    <circle cx="340" cy="15" r="1.2"/>
    <circle cx="375" cy="35" r="1"/>
    <circle cx="385" cy="10" r="0.7"/>
    <circle cx="40" cy="55" r="0.9"/>
    <circle cx="110" cy="50" r="1"/>
    <circle cx="155" cy="60" r="0.8"/>
    <circle cx="350" cy="55" r="1.1"/>
    <circle cx="30" cy="80" r="1"/>
    <circle cx="380" cy="70" r="0.8"/>
  </g>

  <!-- Moon glow -->
  <circle cx="320" cy="60" r="45" fill="url(#moonGlow)" opacity="0.6"/>
  <!-- Moon -->
  <circle cx="320" cy="60" r="28" fill="#d4b8ff" filter="url(#softglow)"/>
  <circle cx="330" cy="52" r="22" fill="#1a0533"/>
  <!-- Moon craters -->
  <circle cx="308" cy="65" r="4" fill="#c0a0ee" opacity="0.5"/>
  <circle cx="318" cy="72" r="2.5" fill="#c0a0ee" opacity="0.4"/>

  <!-- Ground -->
  <ellipse cx="200" cy="390" rx="220" ry="30" fill="#0d0520"/>
  <rect x="0" y="370" width="400" height="30" fill="#0d0520"/>

  <!-- Ground mist -->
  <ellipse cx="200" cy="375" rx="200" ry="12" fill="#2d1b69" opacity="0.3"/>

  <!-- Main house body -->
  <rect x="80" y="220" width="240" height="155" fill="url(#wallGrad)"/>
  <rect x="80" y="220" width="240" height="155" fill="url(#bricks)"/>

  <!-- House outline glow -->
  <rect x="80" y="220" width="240" height="155" fill="none" stroke="#7b2fbe" stroke-width="1.5" opacity="0.7"/>

  <!-- Main roof (floating, tilted) -->
  <polygon points="60,225 200,120 340,225" fill="url(#roofGrad)" filter="url(#glow)"/>
  <polygon points="60,225 200,120 340,225" fill="none" stroke="#b44fff" stroke-width="2"/>

  <!-- Second floating roof layer -->
  <polygon points="90,210 200,140 310,210" fill="#4a0099" opacity="0.5"/>

  <!-- Roof eye window (cyclops) -->
  <ellipse cx="200" cy="185" rx="22" ry="14" fill="#ff6bff" filter="url(#softglow)"/>
  <ellipse cx="200" cy="185" rx="16" ry="10" fill="#1a0533"/>
  <ellipse cx="200" cy="185" rx="8" ry="8" fill="#ff00ff" opacity="0.9"/>
  <ellipse cx="196" cy="182" rx="3" ry="3" fill="white" opacity="0.8"/>

  <!-- Left tower -->
  <rect x="65" y="175" width="45" height="205" fill="url(#towerGrad)"/>
  <rect x="65" y="175" width="45" height="205" fill="url(#bricks)" opacity="0.5"/>
  <polygon points="55,178 87,100 120,178" fill="#5a0099"/>
  <polygon points="55,178 87,100 120,178" fill="none" stroke="#b44fff" stroke-width="1.5"/>
  <!-- Tower eye -->
  <ellipse cx="87" cy="215" rx="12" ry="18" fill="#1a0533" stroke="#7700ff" stroke-width="2"/>
  <ellipse cx="87" cy="215" rx="6" ry="10" fill="#4400cc"/>
  <ellipse cx="87" cy="215" rx="3" ry="5" fill="#aa00ff" filter="url(#glow)"/>
  <ellipse cx="85" cy="211" rx="2" ry="2" fill="white" opacity="0.7"/>

  <!-- Right tower -->
  <rect x="290" y="175" width="45" height="205" fill="url(#towerGrad)"/>
  <rect x="290" y="175" width="45" height="205" fill="url(#bricks)" opacity="0.5"/>
  <polygon points="280,178 312,100 345,178" fill="#5a0099"/>
  <polygon points="280,178 312,100 345,178" fill="none" stroke="#b44fff" stroke-width="1.5"/>
  <!-- Tower eye -->
  <ellipse cx="312" cy="215" rx="12" ry="18" fill="#1a0533" stroke="#7700ff" stroke-width="2"/>
  <ellipse cx="312" cy="215" rx="6" ry="10" fill="#4400cc"/>
  <ellipse cx="312" cy="215" rx="3" ry="5" fill="#aa00ff" filter="url(#glow)"/>
  <ellipse cx="310" cy="211" rx="2" ry="2" fill="white" opacity="0.7"/>

  <!-- Main door (arched, unusual) -->
  <path d="M170,375 L170,280 Q200,250 230,280 L230,375 Z" fill="#0a0020"/>
  <path d="M170,375 L170,280 Q200,250 230,280 L230,375 Z" fill="none" stroke="#9900ff" stroke-width="2"/>
  <!-- Door glow inside -->
  <path d="M178,375 L178,285 Q200,260 222,285 L222,375 Z" fill="#1a004d" opacity="0.8"/>
  <!-- Door handle -->
  <circle cx="215" cy="325" r="4" fill="#ff00ff" filter="url(#glow)"/>

  <!-- Windows row -->
  <!-- Left window -->
  <rect x="100" y="255" width="45" height="55" rx="5" fill="#0a0020"/>
  <rect x="100" y="255" width="45" height="55" rx="5" fill="none" stroke="#7700ff" stroke-width="2"/>
  <line x1="122" y1="255" x2="122" y2="310" stroke="#7700ff" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="282" x2="145" y2="282" stroke="#7700ff" stroke-width="1" opacity="0.5"/>
  <rect x="100" y="255" width="45" height="55" rx="5" fill="#6600ff" opacity="0.15"/>

  <!-- Right window -->
  <rect x="255" y="255" width="45" height="55" rx="5" fill="#0a0020"/>
  <rect x="255" y="255" width="45" height="55" rx="5" fill="none" stroke="#7700ff" stroke-width="2"/>
  <line x1="277" y1="255" x2="277" y2="310" stroke="#7700ff" stroke-width="1" opacity="0.5"/>
  <line x1="255" y1="282" x2="300" y2="282" stroke="#7700ff" stroke-width="1" opacity="0.5"/>
  <rect x="255" y="255" width="45" height="55" rx="5" fill="#6600ff" opacity="0.15"/>

  <!-- Floating steps -->
  <rect x="155" y="375" width="90" height="10" rx="3" fill="#3d0070" stroke="#9900ff" stroke-width="1"/>
  <rect x="165" y="385" width="70" height="8" rx="3" fill="#2d0055" stroke="#7700ff" stroke-width="1"/>

  <!-- Floating orbs around house -->
  <circle cx="60" cy="290" r="6" fill="#ff00ff" opacity="0.7" filter="url(#softglow)"/>
  <circle cx="345" cy="310" r="5" fill="#00ffff" opacity="0.6" filter="url(#softglow)"/>
  <circle cx="45" cy="340" r="4" fill="#aa00ff" opacity="0.8" filter="url(#glow)"/>
  <circle cx="358" cy="260" r="7" fill="#ff00aa" opacity="0.5" filter="url(#softglow)"/>
  <circle cx="190" cy="108" r="4" fill="#ffaaff" opacity="0.9" filter="url(#glow)"/>
  <circle cx="210" cy="112" r="3" fill="#ffffff" opacity="0.7" filter="url(#glow)"/>

  <!-- Chimney emitting spiral smoke -->
  <rect x="235" y="155" width="18" height="40" fill="#2d1b69" stroke="#5a0099" stroke-width="1"/>
  <path d="M244,155 Q255,140 244,128 Q233,116 244,104" fill="none" stroke="#aa88ff" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
  <path d="M248,155 Q262,138 248,124 Q234,110 248,96" fill="none" stroke="#cc99ff" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>

  <!-- Bottom edge glow -->
  <rect x="80" y="370" width="240" height="4" fill="#7700ff" opacity="0.5" filter="url(#glow)"/>
</svg>