    <defs>
        <radialGradient id="space" cx="50%" cy="50%" r="75%">
            <stop offset="0%" stop-color="#1b1236"/>
            <stop offset="50%" stop-color="#0c071c"/>
            <stop offset="100%" stop-color="#000000"/>
        </radialGradient>
        <linearGradient id="waterGlow" x1="0%" y1="0%" x2="100%" y2="100%">
