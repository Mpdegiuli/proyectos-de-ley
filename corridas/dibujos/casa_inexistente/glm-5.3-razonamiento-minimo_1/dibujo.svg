<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2a5e"/>
      <stop offset="0.5" stop-color="#5a4a9e"/>
      <stop offset="1" stop-color="#e88a6a"/>
    </linearGradient>
    <radialGradient id="luna" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8e0"/>
      <stop offset="1" stop-color="#f0d890"/>
    </radialGradient>
    <linearGradient id="pared" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a6aa8"/>
      <stop offset="1" stop-color="#4a3f78"/>
    </linearGradient>
    <linearGradient id="techo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c94f6d"/>
      <stop offset="1" stop-color="#8e2f4a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#cielo)"/>
  <circle cx="70" cy="60" r="34" fill="url(#luna)"/>
  <circle cx="330" cy="90" r="3" fill="#fff"/>
  <circle cx="300" cy="50" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="360" cy="140" r="2.5" fill="#fff" opacity="0.7"/>
  <circle cx="40" cy="140" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="250" cy="40" r="2" fill="#fff" opacity="0.6"/>

  <!-- isla flotante -->
  <g>
    <path d="M110 250 Q200 220 290 250 Q300 290 260 320 Q200 360 140 320 Q100 290 110 250 Z" fill="#5a8f5a"/>
    <path d="M110 250 Q200 220 290 250 Q200 268 110 250 Z" fill="#76b56e"/>
    <path d="M140 320 Q160 345 200 352 Q240 345 260 320 Q230 335 200 332 Q170 335 140 320 Z" fill="#6b4f35"/>
    <path d="M200 355 Q190 380 200 400 Q210 380 200 355 Z" fill="#8a6a45" opacity="0.7"/>
    <!-- raíces colgantes -->
    <path d="M150 315 q-5 20 3 38" stroke="#8a6a45" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M250 315 q6 22 -2 40" stroke="#8a6a45" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M200 330 q-3 25 0 45" stroke="#8a6a45" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- cascada que sube -->
  <g opacity="0.85">
    <path d="M120 252 q-20 -40 -12 -70 q-14 -30 -4 -55" stroke="#9fd8ff" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M282 252 q18 -35 10 -62 q12 -28 4 -50" stroke="#9fd8ff" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="106" cy="122" r="4" fill="#cfeeff"/>
    <circle cx="296" cy="132" r="3.5" fill="#cfeeff"/>
    <circle cx="112" cy="100" r="2.5" fill="#cfeeff" opacity="0.7"/>
    <circle cx="290" cy="112" r="2" fill="#cfeeff" opacity="0.7"/>
  </g>

  <!-- casa invertida -->
  <g>
    <!-- cuerpo -->
    <rect x="140" y="140" width="120" height="90" fill="url(#pared)" stroke="#2e2450" stroke-width="3"/>
    <!-- techo hacia abajo -->
    <path d="M132 232 L200 282 L268 232 Z" fill="url(#techo)" stroke="#5e1f33" stroke-width="3"/>
    <!-- base superior donde estaba el techo -->
    <rect x="134" y="132" width="132" height="12" fill="#3a3160" stroke="#2e2450" stroke-width="2"/>
    <!-- chimenea apuntando abajo-desde-techo invertido -->
    <rect x="228" y="252" width="16" height="26" fill="#8e2f4a" stroke="#5e1f33" stroke-width="2"/>
    <ellipse cx="236" cy="281" rx="10" ry="4" fill="#5e1f33"/>
    <!-- humo cayendo hacia arriba? no: humo dibujado cayendo -->
    <path d="M236 252 q-8 -18 2 -32 q10 -14 2 -30" stroke="#d8d0e8" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8"/>

    <!-- ventanas -->
    <rect x="156" y="158" width="28" height="28" rx="3" fill="#ffe9a0" stroke="#2e2450" stroke-width="2.5"/>
    <path d="M170 158 v28 M156 172 h28" stroke="#2e2450" stroke-width="2"/>
    <rect x="216" y="158" width="28" height="28" rx="3" fill="#ffe9a0" stroke="#2e2450" stroke-width="2.5"/>
    <path d="M230 158 v28 M216 172 h28" stroke="#2e2450" stroke-width="2"/>

    <!-- puerta sobre el techo invertido -->
    <rect x="188" y="236" width="24" height="34" rx="4" fill="#3a2a4a" stroke="#1e1428" stroke-width="2.5"/>
    <circle cx="206" cy="254" r="2.5" fill="#ffd27a"/>

    <!-- escalera impossible: sube del techo al aire -->
    <g stroke="#d8c8a0" stroke-width="3.5" stroke-linecap="round">
      <path d="M200 268 l0 0"/>
      <path d="M188 276 L188 284 L212 284 L212 276"/>
      <path d="M186 286 L186 294 L214 294 L214 286"/>
      <path d="M184 296 L184 304 L216 304 L216 296"/>
    </g>
    <!-- persona mirando -->
    <g fill="#f0e0d0">
      <circle cx="152" cy="140" r="7"/>
      <path d="M146 148 q6 -4 12 0 l4 18 h-20 Z"/>
    </g>
  </g>

  <!-- reloj derretido en la esquina de la casa -->
  <path d="M132 210 q-22 -6 -18 -26 q4 -22 -14 -28" stroke="#f5e6b8" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="100" cy="152" r="11" fill="#f5e6b8" stroke="#a89050" stroke-width="2"/>
  <path d="M100 152 l5 -4" stroke="#a89050" stroke-width="2"/>
  <path d="M100 152 l-3 6" stroke="#a89050" stroke-width="2"/>

  <!-- pájaros -->
  <g stroke="#2e2450" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M310 60 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M60 200 q7 -7 14 0 q7 -7 14 0" opacity="0.7"/>
  </g>

  <!-- piedras flotantes -->
  <g fill="#8a8aa8">
    <ellipse cx="60" cy="300" rx="14" ry="9" opacity="0.9"/>
    <ellipse cx="340" cy="280" rx="10" ry="7" opacity="0.8"/>
    <ellipse cx="330" cy="330" rx="16" ry="10" opacity="0.85"/>
  </g>
  <g fill="#76b56e">
    <ellipse cx="60" cy="296" rx="14" ry="4"/>
    <ellipse cx="340" cy="277" rx="10" ry="3"/>
    <ellipse cx="330" cy="326" rx="16" ry="4"/>
  </g>

  <!-- arbolito creciendo hacia abajo -->
  <g>
    <path d="M96 262 q4 -14 -2 -26" stroke="#8a6a45" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="88" cy="228" rx="16" ry="11" fill="#5a8f5a"/>
    <ellipse cx="104" cy="236" rx="13" ry="9" fill="#76b56e"/>
  </g>
</svg>