<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde0c5"/>
      <stop offset="100%" stop-color="#f4b89e"/>
    </linearGradient>
    <linearGradient id="hair-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="hair-front" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="hair-accent" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="jacket-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="glass-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.1)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg-grad)"/>

  <!-- Background Bokeh/Orbs -->
  <circle cx="50" cy="80" r="30" fill="#f472b6" opacity="0.2"/>
  <circle cx="320" cy="120" r="50" fill="#38bdf8" opacity="0.2"/>
  <circle cx="350" cy="300" r="40" fill="#a78bfa" opacity="0.2"/>
  <circle cx="80" cy="320" r="60" fill="#fb7185" opacity="0.15"/>

  <!-- Background Stars -->
  <path d="M 50 150 L 53 158 L 61 161 L 53 164 L 50 172 L 47 164 L 39 161 L 47 158 Z" fill="#fef08a"/>
  <path d="M 330 80 L 332 85 L 337 87 L 332 89 L 330 94 L 328 89 L 323 87 L 328 85 Z" fill="#fef08a"/>
  <path d="M 350 250 L 354 260 L 364 264 L 354 268 L 350 278 L 346 268 L 336 264 L 346 260 Z" fill="#fef08a"/>

  <!-- Back Hair -->
  <path d="M 200 50 C 100 50, 60 150, 70 250 C 80 350, 40 400, 100 400 C 120 400, 110 300, 130 250 C 130 250, 135 150, 200 150 C 265 150, 270 250, 270 250 C 290 300, 280 400, 300 400 C 360 400, 320 350, 330 250 C 340 150, 300 50, 200 50 Z" fill="url(#hair-back)"/>

  <!-- Neck -->
  <path d="M 165 240 L 165 310 C 165 330, 235 330, 235 310 L 235 240 Z" fill="url(#skin)"/>
  <path d="M 165 240 L 235 240 L 235 285 C 220 295, 180 295, 165 285 Z" fill="rgba(0,0,0,0.15)"/>
  <path d="M 180 270 L 180 300" stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-linecap="round"/>

  <!-- Jacket & Body -->
  <path d="M 165 295 Q 120 310, 60 400 L 340 400 Q 280 310, 235 295 Z" fill="url(#jacket-grad)"/>
  <path d="M 165 295 L 140 350 L 200 400 L 260 350 L 235 295 L 200 330 Z" fill="#1e1b4b"/>
  <path d="M 165 295 L 200 330 L 235 295 C 210 310, 190 310, 165 295 Z" fill="#f43f5e"/>

  <!-- Ears -->
  <path d="M 135 160 C 120 150, 120 180, 135 190 Z" fill="url(#skin)"/>
  <path d="M 265 160 C 280 150, 280 180, 265 190 Z" fill="url(#skin)"/>

  <!-- Earrings -->
  <circle cx="130" cy="200" r="12" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <circle cx="270" cy="200" r="12" fill="none" stroke="#fbbf24" stroke-width="3"/>

  <!-- Face Base -->
  <path d="M 135 150 C 135 90, 265 90, 265 150 C 265 220, 230 265, 200 270 C 170 265, 135 220, 135 150 Z" fill="url(#skin)"/>
  <path d="M 145 150 C 145 110, 200 100, 220 105 C 180 110, 155 130, 155 160 Z" fill="rgba(255,255,255,0.2)"/>

  <!-- Cheeks -->
  <circle cx="160" cy="195" r="14" fill="#f43f5e" opacity="0.25"/>
  <circle cx="240" cy="195" r="14" fill="#f43f5e" opacity="0.25"/>

  <!-- Freckles -->
  <circle cx="180" cy="205" r="1" fill="#a0522d" opacity="0.5"/>
  <circle cx="188" cy="200" r="1" fill="#a0522d" opacity="0.4"/>
  <circle cx="192" cy="208" r="1.5" fill="#a0522d" opacity="0.5"/>
  <circle cx="210" cy="202" r="1" fill="#a0522d" opacity="0.5"/>
  <circle cx="218" cy="207" r="1" fill="#a0522d" opacity="0.4"/>
  <circle cx="225" cy="201" r="1.2" fill="#a0522d" opacity="0.5"/>

  <!-- Eyebrows -->
  <path d="M 145 148 Q 165 138, 185 150" fill="none" stroke="#4a3f35" stroke-width="4" stroke-linecap="round"/>
  <path d="M 215 150 Q 235 138, 255 148" fill="none" stroke="#4a3f35" stroke-width="4" stroke-linecap="round"/>

  <!-- Eyes Whites -->
  <path d="M 148 170 Q 168 155, 188 170 Q 168 180, 148 170 Z" fill="#ffffff"/>
  <path d="M 212 170 Q 232 155, 252 170 Q 232 180, 212 170 Z" fill="#ffffff"/>

  <!-- Irises -->
  <circle cx="168" cy="168" r="7" fill="#10b981"/>
  <circle cx="232" cy="168" r="7" fill="#10b981"/>

  <!-- Pupils -->
  <circle cx="168" cy="168" r="3" fill="#111827"/>
  <circle cx="232" cy="168" r="3" fill="#111827"/>

  <!-- Eye Reflections -->
  <circle cx="166" cy="166" r="1.5" fill="#ffffff"/>
  <circle cx="230" cy="166" r="1.5" fill="#ffffff"/>

  <!-- Eyelashes -->
  <path d="M 146 172 Q 168 150, 190 172" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 210 172 Q 232 150, 254 172" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 200 170 L 200 205 Q 195 210, 190 205" fill="none" stroke="#d98c7c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 200 170 L 200 200" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Lips -->
  <path d="M 178 230 Q 200 220, 222 230 Q 200 233, 178 230 Z" fill="#e11d48"/>
  <path d="M 178 230 Q 200 245, 222 230 Q 200 233, 178 230 Z" fill="#f43f5e"/>
  <path d="M 176 230 Q 200 233, 224 230" fill="none" stroke="#881337" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 205 225 Q 210 225, 215 226" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Glasses -->
  <circle cx="168" cy="170" r="24" fill="url(#glass-grad)" stroke="#fbbf24" stroke-width="3"/>
  <circle cx="232" cy="170" r="24" fill="url(#glass-grad)" stroke="#fbbf24" stroke-width="3"/>
  <path d="M 192 170 Q 200 160, 208 170" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

  <!-- Front Hair Bangs -->
  <path d="M 200 60 Q 140 60, 120 140 Q 150 120, 200 135 Q 230 145, 270 160 Q 280 100, 200 60 Z" fill="url(#hair-front)"/>
  <path d="M 240 100 Q 280 120, 290 190 Q 275 160, 250 145 Q 230 135, 200 135 Q 210 110, 240 100 Z" fill="url(#hair-accent)"/>
  
  <!-- Front Hair Strands Over Shoulders -->
  <path d="M 130 130 C 110 180, 110 280, 125 360 C 100 280, 120 180, 145 140 Z" fill="url(#hair-front)"/>
  <path d="M 270 140 C 290 180, 290 280, 275 360 C 300 280, 280 180, 255 140 Z" fill="url(#hair-front)"/>

  <!-- Hair Fine Highlights -->
  <path d="M 130 130 C 115 180, 115 280, 130 360" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 270 140 C 285 180, 285 280, 270 360" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 200 65 Q 150 70, 130 130" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>