<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffd27a"/>
      <stop offset="60%" stop-color="#ff8a5c"/>
      <stop offset="100%" stop-color="#5a2a6b"/>
    </radialGradient>
    <linearGradient id="water" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#2b4a7a"/>
      <stop offset="100%" stop-color="#0b1d3a"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff2b0"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#4a5a7a"/>
      <stop offset="50%" stop-color="#2a3a5a"/>
      <stop offset="100%" stop-color="#101828"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e8e4d8"/>
      <stop offset="100%" stop-color="#b8b0a0"/>
    </linearGradient>
  </defs>

  <!-- cielo -->
  <rect width="400" height="260" fill="url(#sky)"/>
  <!-- sol -->
  <circle cx="280" cy="130" r="80" fill="url(#sun)"/>
  <circle cx="280" cy="130" r="32" fill="#fff5c8"/>

  <!-- agua -->
  <rect y="240" width="400" height="160" fill="url(#water)"/>
  <!-- reflejo del sol -->
  <ellipse cx="280" cy="248" rx="40" ry="4" fill="#ffe6a0" opacity="0.8"/>
  <ellipse cx="280" cy="258" rx="55" ry="3" fill="#ffd27a" opacity="0.6"/>
  <ellipse cx="280" cy="270" rx="35" ry="2" fill="#ffb86a" opacity="0.5"/>
  <ellipse cx="280" cy="282" rx="60" ry="2.5" fill="#ffa060" opacity="0.4"/>

  <!-- ondas -->
  <path d="M0 245 Q50 242 100 245 T200 245 T300 245 T400 245" stroke="#6a8ab5" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M0 300 Q40 297 80 300 T160 300 T240 300 T320 300 T400 300" stroke="#4a6a95" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M0 350 Q50 347 100 350 T200 350 T300 350 T400 350" stroke="#3a5a85" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- ballena saltando -->
  <g transform="translate(140,220) rotate(-18)">
    <!-- cola -->
    <path d="M-80 20 Q-120 -10 -150 -40 Q-130 -5 -160 10 Q-120 15 -90 25 Z" fill="url(#body)"/>
    <!-- cuerpo -->
    <ellipse cx="0" cy="20" rx="110" ry="48" fill="url(#body)"/>
    <!-- vientre -->
    <path d="M-70 40 Q0 85 80 35 Q70 60 0 68 Q-60 65 -70 40 Z" fill="url(#belly)"/>
    <!-- surcos del vientre -->
    <path d="M-40 55 Q0 72 60 50" stroke="#8a826e" stroke-width="0.8" fill="none" opacity="0.6"/>
    <path d="M-30 62 Q0 76 55 58" stroke="#8a826e" stroke-width="0.8" fill="none" opacity="0.6"/>
    <path d="M-20 67 Q0 78 48 64" stroke="#8a826e" stroke-width="0.8" fill="none" opacity="0.6"/>
    <!-- aleta pectoral -->
    <path d="M20 55 Q50 90 85 95 Q65 75 55 50 Z" fill="#1a2638"/>
    <!-- boca -->
    <path d="M70 25 Q95 32 108 22" stroke="#0a0f1a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- ojo -->
    <circle cx="78" cy="10" r="3.5" fill="#0a0f1a"/>
    <circle cx="79" cy="9" r="1.2" fill="#fff"/>
    <!-- soplador con chorro -->
    <ellipse cx="20" cy="-20" rx="4" ry="2" fill="#0a0f1a"/>
  </g>

  <!-- chorro de agua -->
  <g transform="translate(140,220) rotate(-18)" opacity="0.85">
    <path d="M20 -22 Q10 -55 -5 -80 Q0 -55 15 -25" fill="#cfe4ff" opacity="0.7"/>
    <path d="M20 -22 Q25 -50 35 -75 Q30 -50 25 -25" fill="#cfe4ff" opacity="0.7"/>
    <circle cx="5" cy="-78" r="4" fill="#cfe4ff" opacity="0.6"/>
    <circle cx="33" cy="-72" r="3" fill="#cfe4ff" opacity="0.6"/>
    <circle cx="18" cy="-88" r="2.5" fill="#e8f2ff" opacity="0.7"/>
  </g>

  <!-- salpicaduras -->
  <g fill="#e8f2ff" opacity="0.8">
    <ellipse cx="60" cy="245" rx="35" ry="5"/>
    <circle cx="40" cy="235" r="3"/>
    <circle cx="55" cy="228" r="2.5"/>
    <circle cx="80" cy="232" r="2"/>
    <circle cx="95" cy="238" r="3"/>
    <circle cx="25" cy="240" r="2"/>
  </g>

  <!-- aves lejanas -->
  <g fill="none" stroke="#3a1f4a" stroke-width="1.5" stroke-linecap="round">
    <path d="M60 90 q5 -5 10 0 q5 -5 10 0"/>
    <path d="M100 70 q4 -4 8 0 q4 -4 8 0"/>
    <path d="M340 60 q4 -4 8 0 q4 -4 8 0"/>
  </g>
</svg>