<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a44"/>
      <stop offset="55%" stop-color="#2f4b6e"/>
      <stop offset="100%" stop-color="#607b8c"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8dc" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#f7e3a1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f7e3a1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="foxFur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f06b24"/>
      <stop offset="60%" stop-color="#d94e16"/>
      <stop offset="100%" stop-color="#a8340b"/>
    </linearGradient>
    <linearGradient id="foxLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#e35619"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#e8dcc8"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c4a3e"/>
      <stop offset="100%" stop-color="#172922"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#fff8dc" opacity="0.8">
    <circle cx="55" cy="48" r="1.5"/>
    <circle cx="110" cy="30" r="1"/>
    <circle cx="165" cy="65" r="1.8"/>
    <circle cx="240" cy="40" r="1.2"/>
    <circle cx="345" cy="75" r="1.5"/>
    <circle cx="370" cy="35" r="1"/>
    <circle cx="42" cy="115" r="1.1"/>
    <circle cx="215" cy="95" r="1"/>
  </g>

  <!-- Moon -->
  <circle cx="305" cy="88" r="56" fill="url(#moonGlow)"/>
  <circle cx="305" cy="88" r="24" fill="#fff6d6"/>
  <circle cx="297" cy="82" r="4" fill="#eedfa8" opacity="0.5"/>
  <circle cx="314" cy="96" r="5" fill="#eedfa8" opacity="0.4"/>
  <circle cx="312" cy="78" r="2.5" fill="#eedfa8" opacity="0.45"/>

  <!-- Distant Hills & Pine Silhouettes -->
  <path d="M0 275 Q95 225 200 265 T400 250 L400 400 L0 400 Z" fill="#223747"/>
  <g fill="#1b2d3b">
    <polygon points="35,260 52,205 69,260"/>
    <polygon points="62,255 84,185 106,255"/>
    <polygon points="95,262 110,215 125,262"/>
    <polygon points="315,255 335,190 355,255"/>
    <polygon points="348,258 370,178 392,258"/>
  </g>

  <!-- Midground Hill -->
  <path d="M0 305 Q150 270 280 295 T400 285 L400 400 L0 400 Z" fill="url(#groundGrad)"/>

  <!-- Ground Shadow under Fox -->
  <ellipse cx="205" cy="340" rx="108" ry="18" fill="#0f1c17" opacity="0.55"/>

  <!-- Fox Tail -->
  <path d="M225 312 C285 322, 335 280, 325 225 C318 190, 282 182, 268 205 C254 228, 260 275, 222 292 Z" fill="url(#foxFur)"/>
  <path d="M325 225 C328 242, 316 268, 294 275 C304 252, 304 224, 292 204 C308 192, 322 205, 325 225 Z" fill="#c44010" opacity="0.45"/>
  <!-- Tail White Tip -->
  <path d="M294 192 C310 186, 326 202, 326 226 C316 222, 308 228, 302 220 C295 226, 287 218, 282 224 C276 210, 280 197, 294 192 Z" fill="url(#cream)"/>

  <!-- Back Hind Leg -->
  <path d="M210 265 C245 270, 260 305, 245 332 L212 332 C210 315, 200 295, 205 275 Z" fill="#b83b0e"/>
  <path d="M245 332 C248 338, 236 342, 226 340 C222 336, 224 331, 228 330 Z" fill="#291d1a"/>

  <!-- Torso -->
  <path d="M162 195 C140 235, 136 290, 152 330 L232 332 C245 292, 234 232, 204 195 Z" fill="url(#foxFur)"/>

  <!-- Chest White Fur -->
  <path d="M158 195 C150 225, 152 268, 174 295 C192 272, 202 232, 198 195 C185 202, 172 202, 158 195 Z" fill="url(#cream)"/>
  <path d="M162 245 L168 256 L174 247 L180 262 L187 248" fill="none" stroke="#e3d5be" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Front Left Leg -->
  <path d="M154 248 C150 278, 152 308, 155 332 L173 332 C174 306, 176 276, 174 250 Z" fill="url(#foxLight)"/>
  <!-- Front Left Dark Sock -->
  <path d="M153 302 L174 302 C175 316, 176 328, 174 336 C168 340, 155 340, 151 335 C150 326, 152 314, 153 302 Z" fill="#2c201c"/>

  <!-- Front Right Leg -->
  <path d="M186 248 C184 278, 185 308, 188 334 L206 334 C207 308, 208 278, 205 250 Z" fill="url(#foxFur)"/>
  <!-- Front Right Dark Sock -->
  <path d="M186 304 L206 304 C207 318, 208 330, 206 338 C200 342, 187 342, 183 337 C182 328, 185 316, 186 304 Z" fill="#2c201c"/>

  <!-- Head Group -->
  <g transform="translate(0, -4)">
    <!-- Left Ear -->
    <path d="M148 134 L126 76 C125 72, 130 70, 134 73 L172 114 Z" fill="#b83b0e"/>
    <path d="M148 134 L126 76 C125 72, 130 70, 134 73 L144 84 L136 96 Z" fill="#2c201c"/>
    <path d="M148 128 L135 88 L164 116 Z" fill="#f7e8d0"/>

    <!-- Right Ear -->
    <path d="M214 134 L236 76 C237 72, 232 70, 228 73 L190 114 Z" fill="#b83b0e"/>
    <path d="M214 134 L236 76 C237 72, 232 70, 228 73 L218 84 L226 96 Z" fill="#2c201c"/>
    <path d="M214 128 L227 88 L198 116 Z" fill="#f7e8d0"/>

    <!-- Head Base -->
    <path d="M134 150 C134 118, 158 104, 181 104 C204 104, 228 118, 228 150 C228 172, 204 198, 181 202 C158 198, 134 172, 134 150 Z" fill="url(#foxLight)"/>

    <!-- Cheek White Fur Left & Right -->
    <path d="M134 152 C126 164, 132 178, 146 184 C156 194, 168 201, 181 202 C178 184, 168 166, 152 158 C144 154, 138 152, 134 152 Z" fill="url(#cream)"/>
    <path d="M228 152 C236 164, 230 178, 216 184 C206 194, 194 201, 181 202 C184 184, 194 166, 210 158 C218 154, 224 152, 228 152 Z" fill="url(#cream)"/>

    <!-- Muzzle Bridge -->
    <path d="M168 154 C168 175, 174 196, 181 202 C188 196, 194 175, 194 154 Z" fill="url(#foxLight)"/>

    <!-- Forehead Fur Detail -->
    <path d="M174 118 L181 111 L188 118" fill="none" stroke="#ff9d5c" stroke-width="2" stroke-linecap="round"/>

    <!-- Eyes -->
    <g>
      <!-- Left Eye -->
      <ellipse cx="158" cy="149" rx="7.5" ry="8.5" fill="#1e1512"/>
      <ellipse cx="158" cy="150" rx="5.5" ry="6.5" fill="#703510"/>
      <circle cx="158" cy="150" r="3.6" fill="#140d0b"/>
      <circle cx="155.5" cy="146.5" r="2.2" fill="#ffffff"/>
      <circle cx="160.5" cy="152.5" r="1" fill="#ffffff" opacity="0.8"/>

      <!-- Right Eye -->
      <ellipse cx="204" cy="149" rx="7.5" ry="8.5" fill="#1e1512"/>
      <ellipse cx="204" cy="150" rx="5.5" ry="6.5" fill="#703510"/>
      <circle cx="204" cy="150" r="3.6" fill="#140d0b"/>
      <circle cx="201.5" cy="146.5" r="2.2" fill="#ffffff"/>
      <circle cx="206.5" cy="152.5" r="1" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Nose & Mouth -->
    <path d="M173 188 C173 183, 189 183, 189 188 C189 193, 184 197, 181 197 C178 197, 173 193, 173 188 Z" fill="#231916"/>
    <ellipse cx="179" cy="187" rx="3" ry="1.2" fill="#59453e"/>
    <path d="M181 197 L181 200 M176 200 Q181 203 186 200" fill="none" stroke="#3b2b26" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Whiskers -->
    <g stroke="#e8dcc8" stroke-width="1" stroke-linecap="round" opacity="0.65">
      <path d="M164 184 Q146 182 132 186"/>
      <path d="M164 189 Q146 191 134 196"/>
      <path d="M198 184 Q216 182 230 186"/>
      <path d="M198 189 Q216 191 228 196"/>
    </g>
  </g>

  <!-- Foreground Grass Tufts & Mushrooms -->
  <g fill="#223d32">
    <path d="M90 345 Q84 326 78 345 Q74 328 68 346 Z"/>
    <path d="M295 344 Q301 322 308 344 Q314 326 320 345 Z"/>
    <path d="M122 356 Q118 340 112 356 Z"/>
  </g>

  <!-- Small Mushrooms -->
  <g transform="translate(86, 336)">
    <rect x="6" y="8" width="4" height="10" rx="1.5" fill="#e6dcc8"/>
    <path d="M0 10 C0 2, 16 2, 16 10 Z" fill="#d94e34"/>
    <circle cx="5" cy="6" r="1.2" fill="#fff5e6"/>
    <circle cx="11" cy="7" r="1" fill="#fff5e6"/>
  </g>
  <g transform="translate(103, 342) scale(0.75)">
    <rect x="6" y="8" width="4" height="10" rx="1.5" fill="#e6dcc8"/>
    <path d="M0 10 C0 2, 16 2, 16 10 Z" fill="#d94e34"/>
    <circle cx="8" cy="6" r="1.3" fill="#fff5e6"/>
  </g>

  <!-- Subtle Fireflies -->
  <g fill="#ffe885">
    <circle cx="72" cy="245" r="2.2" opacity="0.8"/>
    <circle cx="72" cy="245" r="6" opacity="0.2"/>
    <circle cx="338" cy="282" r="2" opacity="0.75"/>
    <circle cx="338" cy="282" r="5.5" opacity="0.2"/>
    <circle cx="268" cy="162" r="1.8" opacity="0.7"/>
    <circle cx="268" cy="162" r="5" opacity="0.18"/>
  </g>
</svg>