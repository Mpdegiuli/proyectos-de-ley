<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Background -->
  <rect width="400" height="400" fill="#87CEEB"/>
  <!-- Ground -->
  <ellipse cx="200" cy="370" rx="180" ry="30" fill="#90EE90"/>

  <!-- Fox body -->
  <ellipse cx="200" cy="280" rx="75" ry="55" fill="#E8621A"/>

  <!-- Fox tail -->
  <path d="M270 290 Q340 250 350 310 Q340 360 280 330 Z" fill="#E8621A"/>
  <path d="M340 310 Q345 360 280 330 Q310 320 330 330 Z" fill="white"/>

  <!-- Fox legs -->
  <rect x="150" y="320" width="22" height="45" rx="10" fill="#E8621A"/>
  <rect x="185" y="325" width="22" height="45" rx="10" fill="#E8621A"/>
  <rect x="215" y="325" width="22" height="45" rx="10" fill="#E8621A"/>
  <rect x="248" y="320" width="22" height="45" rx="10" fill="#E8621A"/>

  <!-- Paws -->
  <ellipse cx="161" cy="367" rx="13" ry="7" fill="#CC4A00"/>
  <ellipse cx="196" cy="372" rx="13" ry="7" fill="#CC4A00"/>
  <ellipse cx="226" cy="372" rx="13" ry="7" fill="#CC4A00"/>
  <ellipse cx="259" cy="367" rx="13" ry="7" fill="#CC4A00"/>

  <!-- Fox neck -->
  <ellipse cx="185" cy="245" rx="30" ry="25" fill="#E8621A"/>

  <!-- Fox head -->
  <ellipse cx="175" cy="205" rx="55" ry="48" fill="#E8621A"/>

  <!-- White cheeks/muzzle area -->
  <ellipse cx="175" cy="220" rx="35" ry="28" fill="white"/>

  <!-- Ears -->
  <polygon points="130,175 115,120 160,160" fill="#E8621A"/>
  <polygon points="210,170 230,118 195,158" fill="#E8621A"/>
  <!-- Inner ears -->
  <polygon points="132,172 120,132 158,162" fill="#CC2244"/>
  <polygon points="208,168 225,130 197,160" fill="#CC2244"/>

  <!-- Eyes -->
  <ellipse cx="155" cy="198" rx="12" ry="13" fill="white"/>
  <ellipse cx="195" cy="198" rx="12" ry="13" fill="white"/>
  <!-- Irises -->
  <ellipse cx="157" cy="200" rx="8" ry="9" fill="#8B4513"/>
  <ellipse cx="197" cy="200" rx="8" ry="9" fill="#8B4513"/>
  <!-- Pupils -->
  <ellipse cx="158" cy="201" rx="5" ry="7" fill="#111"/>
  <ellipse cx="198" cy="201" rx="5" ry="7" fill="#111"/>
  <!-- Eye shine -->
  <circle cx="161" cy="197" r="2" fill="white"/>
  <circle cx="201" cy="197" r="2" fill="white"/>

  <!-- Nose -->
  <ellipse cx="175" cy="222" rx="10" ry="7" fill="#222"/>
  <!-- Nose shine -->
  <ellipse cx="172" cy="219" rx="3" ry="2" fill="#555"/>

  <!-- Mouth -->
  <path d="M175 229 Q165 238 158 235" stroke="#555" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M175 229 Q185 238 192 235" stroke="#555" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Whiskers -->
  <line x1="140" y1="225" x2="100" y2="218" stroke="#888" stroke-width="1.5"/>
  <line x1="140" y1="230" x2="98" y2="232" stroke="#888" stroke-width="1.5"/>
  <line x1="140" y1="235" x2="102" y2="243" stroke="#888" stroke-width="1.5"/>
  <line x1="210" y1="225" x2="250" y2="218" stroke="#888" stroke-width="1.5"/>
  <line x1="210" y1="230" x2="252" y2="232" stroke="#888" stroke-width="1.5"/>
  <line x1="210" y1="235" x2="248" y2="243" stroke="#888" stroke-width="1.5"/>

  <!-- Belly white patch -->
  <ellipse cx="200" cy="295" rx="40" ry="35" fill="white" opacity="0.7"/>
</svg>