<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#183653"/>
      <stop offset=".55" stop-color="#0b1c31"/>
      <stop offset="1" stop-color="#050b16"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="1" x2=".85" y2="0">
      <stop stop-color="#087f9b"/>
      <stop offset=".48" stop-color="#20d9dc"/>
      <stop offset="1" stop-color="#c7ffff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff1a1"/>
      <stop offset=".4" stop-color="#ffc84f"/>
      <stop offset="1" stop-color="#e84f57"/>
    </linearGradient>
    <linearGradient id="red" x1=".1" y1="0" x2=".85" y2="1">
      <stop stop-color="#ffdf82"/>
      <stop offset=".25" stop-color="#ff765d"/>
      <stop offset=".72" stop-color="#d32d75"/>
      <stop offset="1" stop-color="#681b68"/>
    </linearGradient>
    <linearGradient id="cyanEdge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#05516f"/>
      <stop offset="1" stop-color="#10a7b5"/>
    </linearGradient>
    <linearGradient id="redEdge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#721c69"/>
      <stop offset="1" stop-color="#310f49"/>
    </linearGradient>
    <linearGradient id="barEdge" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a52a63"/>
      <stop offset="1" stop-color="#54194e"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#b8eaff" stroke-opacity=".045" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="#b8eaff" fill-opacity=".09"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000713" flood-opacity=".72"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="apex">
      <path d="M128 20H246V153H128Z"/>
    </clipPath>
    <g id="leftBeam">
      <path d="M57 347 174 66Q183 42 198 46L222 82 118 347Z"
            fill="url(#cyan)" stroke="#061521" stroke-width="5" stroke-linejoin="round"/>
      <path d="M57 347 174 66 188 51 84 347Z" fill="url(#cyanEdge)"/>
      <path d="M222 82 118 347H94L207 64Z" fill="#006a83" opacity=".58"/>
      <path d="M67 330 178 69" fill="none" stroke="#c9ffff" stroke-opacity=".55" stroke-width="3"/>
      <path d="M108 341 213 82" fill="none" stroke="#002f4a" stroke-opacity=".7" stroke-width="3"/>
    </g>
    <g id="barBeam">
      <path d="M102 220H291L321 273 309 288H87L77 273Z"
            fill="url(#gold)" stroke="#071522" stroke-width="5" stroke-linejoin="round"/>
      <path d="M77 273H321L309 288H87Z" fill="url(#barEdge)"/>
      <path d="M102 220H291L298 233H96Z" fill="#fff7bd" opacity=".7"/>
      <path d="M87 274H316" stroke="#ff9b6a" stroke-opacity=".6" stroke-width="2"/>
    </g>
    <g id="rightBeam">
      <path d="M198 46 355 347H296L168 88Z"
            fill="url(#red)" stroke="#071522" stroke-width="5" stroke-linejoin="round"/>
      <path d="M168 88 296 347H322L188 65Z" fill="url(#redEdge)" opacity=".68"/>
      <path d="M198 46 355 347H334L187 65Z" fill="#ffd47c" opacity=".28"/>
      <path d="M207 65 342 330" fill="none" stroke="#ffe5a1" stroke-opacity=".5" stroke-width="3"/>
      <path d="M178 89 306 341" fill="none" stroke="#4a124f" stroke-opacity=".75" stroke-width="3"/>
    </g>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#grid)"/>
  <ellipse cx="202" cy="349" rx="139" ry="23" fill="#00050d" opacity=".65" filter="url(#glow)"/>
  <circle cx="200" cy="197" r="166" fill="none" stroke="#83dded" stroke-opacity=".09"/>
  <circle cx="200" cy="197" r="146" fill="none" stroke="#83dded" stroke-opacity=".055" stroke-dasharray="3 12"/>
  <path d="M31 198H369M200 29V371" stroke="#b7efff" stroke-opacity=".045"/>
  
  <g filter="url(#shadow)">
    <use href="#leftBeam"/>
    <path d="M79 262 102 220H137L113 279Z" fill="#001a2d" opacity=".45"/>
    <use href="#barBeam"/>
    <path d="M276 220H300L321 260 302 282Z" fill="#42154d" opacity=".5"/>
    <use href="#rightBeam"/>
    <use href="#leftBeam" clip-path="url(#apex)"/>
  </g>

  <path d="M177 65Q184 43 198 46L216 73" fill="none" stroke="#e5ffff" stroke-opacity=".75" stroke-width="2.5"/>
  <path d="M173 88 198 46 222 82" fill="none" stroke="#071522" stroke-opacity=".45" stroke-width="1.5"/>
  <circle cx="47" cy="94" r="2" fill="#a9f6ff" opacity=".55"/>
  <circle cx="348" cy="105" r="1.5" fill="#ffd77a" opacity=".6"/>
  <circle cx="365" cy="292" r="2" fill="#ff7891" opacity=".45"/>
  <circle cx="48" cy="300" r="1.5" fill="#8cebf5" opacity=".5"/>
</svg>