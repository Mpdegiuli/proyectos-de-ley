<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070211"/>
      <stop offset="40%" stop-color="#190731"/>
      <stop offset="80%" stop-color="#3d0e45"/>
      <stop offset="100%" stop-color="#140224"/>
    </linearGradient>
    
    <radialGradient id="planetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7eb3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff7eb3" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="planetBody" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a0845"/>
      <stop offset="100%" stop-color="#050117"/>
    </radialGradient>
    
    <linearGradient id="ringGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#ff00e4"/>
      <stop offset="80%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="glowStrong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <g id="s">
      <polygon points="10,5 30,5 20,35" fill="#ff00e4" filter="url(#glow)" opacity="0.6"/>
      <polygon points="0,0 20,-10 40,0 20,10" fill="#4dffff" opacity="0.9"/>
      <polygon points="0,0 20,10 20,20 0,10" fill="#005f8c"/>
      <polygon points="20,10 40,0 40,10 20,20" fill="#003554"/>
      <polyline points="0,0 20,10 40,0" fill="none" stroke="#ffffff" stroke-width="0.5"/>
      <line x1="20" y1="10" x2="20" y2="20" stroke="#ffffff" stroke-width="0.5"/>
    </g>
  </defs>

  <rect width="400" height="400" fill="url(#sky)"/>

  <g stroke="#ffffff" fill="none" stroke-width="0.5" opacity="0.1" transform="translate(200,200) rotate(20)">
    <circle cx="0" cy="0" r="180"/>
    <circle cx="0" cy="0" r="175" stroke-dasharray="4 6"/>
    <polygon points="0,-180 156,90 -156,90"/>
    <polygon points="0,180 156,-90 -156,-90"/>
    <circle cx="0" cy="0" r="90"/>
  </g>

  <path d="M10,10h1v1h-1z M40,80h2v2h-2z M150,20h1v1h-1z M300,40h1.5v1.5h-1.5z M380,120h1v1h-1z M350,10h2v2h-2z M50,300h1v1h-1z M250,350h1.5v1.5h-1.5z M100,380h1v1h-1z M20,200h1.5v1.5h-1.5z M380,250h1v1h-1z" fill="#fff" opacity="0.7"/>
  <path d="M 120 40 L 122 48 L 130 50 L 122 52 L 120 60 L 118 52 L 110 50 L 118 48 Z" fill="#00f3ff" opacity="0.8"/>
  <path d="M 280 80 L 281 85 L 286 86 L 281 87 L 280 92 L 279 87 L 274 86 L 279 85 Z" fill="#ff00e4" opacity="0.8"/>

  <g transform="translate(200, 200) rotate(-15)">
    <path d="M -170 0 A 170 40 0 0 1 170 0" fill="none" stroke="url(#ringGradient)" stroke-width="4" opacity="0.4"/>
    <circle cx="0" cy="0" r="100" fill="url(#planetBody)"/>
    <circle cx="0" cy="0" r="100" fill="url(#planetGlow)" opacity="0.5"/>
    <path d="M -170 0 A 170 40 0 0 0 170 0" fill="none" stroke="url(#ringGradient)" stroke-width="8" opacity="0.9"/>
    <path d="M -150 0 A 150 25 0 0 0 150 0" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
  </g>

  <polygon points="-10,180 60,190 80,230 40,280 60,340 -10,380" fill="#0f0518"/>
  <polygon points="-10,190 40,200 50,240 20,270 -10,300" fill="#1b0b2e"/>
  <polygon points="-10,210 30,215 20,250 -10,270" fill="#2d134a"/>
  
  <polygon points="410,50 300,70 290,110 330,160 310,210 370,260 410,280" fill="#0f0518"/>
  <polygon points="410,65 320,80 310,120 350,150 410,190" fill="#1b0b2e"/>
  <polygon points="410,80 340,95 330,130 410,160" fill="#2d134a"/>

  <g fill="#ff00e4" filter="url(#glow)">
    <polygon points="10,220 15,200 20,215"/>
    <polygon points="15,230 22,190 28,225"/>
    <polygon points="25,235 30,210 35,235"/>
  </g>
  <g fill="#00f3ff" filter="url(#glow)">
    <polygon points="340,120 345,95 350,115"/>
    <polygon points="345,130 352,85 358,125"/>
    <polygon points="355,135 360,105 365,135"/>
  </g>

  <path d="M 40 280 Q 20 200 60 50" fill="none" stroke="#ff00e4" stroke-width="1.5" stroke-dasharray="10 15" filter="url(#glow)" opacity="0.6"/>
  <path d="M 50 280 Q 30 200 70 50" fill="none" stroke="#ff00e4" stroke-width="0.5" stroke-dasharray="5 10" filter="url(#glow)" opacity="0.4"/>
  <path d="M 330 180 Q 360 280 320 380" fill="none" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="8 12" filter="url(#glow)" opacity="0.6"/>

  <g transform="translate(40, 210) rotate(15)">
    <ellipse cx="0" cy="0" rx="15" ry="45" fill="#050117" stroke="#ff00e4" stroke-width="3" filter="url(#glowStrong)"/>
    <ellipse cx="0" cy="0" rx="8" ry="35" fill="none" stroke="#fff" stroke-width="1.5" filter="url(#glow)"/>
    <ellipse cx="0" cy="0" rx="3" ry="25" fill="#fff" filter="url(#glowStrong)"/>
    <path d="M -15 0 L 15 0 M 0 -45 L 0 45" stroke="#ff00e4" stroke-width="1" opacity="0.5"/>
  </g>

  <g transform="translate(315, 95) rotate(-15)">
    <ellipse cx="0" cy="0" rx="15" ry="45" fill="#050117" stroke="#00f3ff" stroke-width="3" filter="url(#glowStrong)"/>
    <ellipse cx="0" cy="0" rx="8" ry="35" fill="none" stroke="#fff" stroke-width="1.5" filter="url(#glow)"/>
    <ellipse cx="0" cy="0" rx="3" ry="25" fill="#fff" filter="url(#glowStrong)"/>
    <path d="M -15 0 L 15 0 M 0 -45 L 0 45" stroke="#00f3ff" stroke-width="1" opacity="0.5"/>
  </g>

  <path d="M 40 210 Q 80 160 135 158" fill="none" stroke="#00f3ff" stroke-width="2" filter="url(#glow)"/>
  <path d="M 135 158 Q 190 100 245 109" fill="none" stroke="#ff00e4" stroke-width="2" filter="url(#glow)"/>
  <path d="M 245 109 Q 275 105 315 95" fill="none" stroke="#00f3ff" stroke-width="2" filter="url(#glow)"/>

  <use href="#s" transform="translate(80, 205) scale(0.6) rotate(-15)"/>
  <use href="#s" transform="translate(115, 174) scale(0.7) rotate(-5)"/>
  <use href="#s" transform="translate(150, 145) scale(0.85) rotate(5)"/>
  <use href="#s" transform="translate(185, 125) scale(1.0) rotate(15)"/>
  <use href="#s" transform="translate(225, 112) scale(0.85) rotate(5)"/>
  <use href="#s" transform="translate(260, 106) scale(0.7) rotate(-5)"/>
  <use href="#s" transform="translate(290, 105) scale(0.5) rotate(-15)"/>

  <g fill="#4dffff" opacity="0.8" filter="url(#glow)">
    <polygon points="65,225 70,222 68,230"/>
    <polygon points="100,220 105,215 102,223"/>
    <polygon points="280,125 285,120 282,128"/>
    <polygon points="310,115 315,110 312,118"/>
  </g>

  <g transform="translate(92, 203)">
    <path d="M 0 0 C -2 -4, -3 -8, 0 -12 C 3 -8, 2 -4, 0 0 Z" fill="#050117" stroke="#fff" stroke-width="0.5"/>
    <circle cx="0" cy="-14" r="1.5" fill="#050117" stroke="#fff" stroke-width="0.5"/>
    <line x1="3" y1="-2" x2="5" y2="-18" stroke="#00f3ff" stroke-width="0.5" filter="url(#glow)"/>
    <circle cx="5" cy="-18" r="0.8" fill="#fff" filter="url(#glowStrong)"/>
  </g>

  <path d="M 40 210 Q 90 220 135 158" fill="none" stroke="#ff00e4" stroke-width="3" filter="url(#glow)"/>
  <path d="M 135 158 Q 190 160 245 109" fill="none" stroke="#00f3ff" stroke-width="3" filter="url(#glow)"/>
  <path d="M 245 109 Q 275 120 315 95" fill="none" stroke="#ff00e4" stroke-width="3" filter="url(#glow)"/>

  <g fill="#00f3ff" filter="url(#glow)">
    <circle cx="100" cy="150" r="1.5"/>
    <circle cx="180" cy="80" r="1"/>
    <circle cx="260" cy="70" r="2"/>
    <circle cx="280" cy="140" r="1"/>
  </g>
  <g fill="#ff00e4" filter="url(#glow)">
    <circle cx="120" cy="220" r="2"/>
    <circle cx="160" cy="200" r="1"/>
    <circle cx="220" cy="170" r="1.5"/>
    <circle cx="200" cy="90" r="1"/>
  </g>
</svg>