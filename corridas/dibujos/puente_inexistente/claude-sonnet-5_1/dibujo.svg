<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2a4a"/>
      <stop offset="45%" stop-color="#5c6fa3"/>
      <stop offset="75%" stop-color="#e8a870"/>
      <stop offset="100%" stop-color="#f4d9a0"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a6b"/>
      <stop offset="100%" stop-color="#14202f"/>
    </linearGradient>
    <linearGradient id="towerG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2e2a26"/>
      <stop offset="50%" stop-color="#6b5d4f"/>
      <stop offset="100%" stop-color="#2e2a26"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="400" height="260" fill="url(#sky)"/>
  <circle cx="320" cy="60" r="28" fill="#fce4b0" opacity="0.9"/>
  <circle cx="320" cy="60" r="40" fill="#fce4b0" opacity="0.15"/>

  <rect x="0" y="260" width="400" height="140" fill="url(#water)"/>

  <!-- distant hills -->
  <path d="M0,255 Q80,225 160,250 T400,235 L400,260 L0,260 Z" fill="#101a2c" opacity="0.6"/>

  <!-- Reflections -->
  <g opacity="0.25">
    <path d="M70,270 C70,320 70,360 70,400" stroke="#8a7a63" stroke-width="10"/>
    <path d="M330,270 C330,320 330,360 330,400" stroke="#8a7a63" stroke-width="10"/>
    <path d="M100,300 Q200,340 300,300" stroke="#cfd7e6" stroke-width="4" fill="none"/>
  </g>

  <!-- Spiral towers (fictional bridge feature) -->
  <g>
    <path d="M70,270 
             C40,250 40,210 70,190
             C100,170 100,130 70,110
             C40,90 40,60 70,40" 
          fill="none" stroke="url(#towerG)" stroke-width="14" stroke-linecap="round"/>
    <path d="M330,270 
             C360,250 360,210 330,190
             C300,170 300,130 330,110
             C360,90 360,60 330,40" 
          fill="none" stroke="url(#towerG)" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Top ornament spheres -->
  <circle cx="70" cy="40" r="8" fill="#e8c990"/>
  <circle cx="330" cy="40" r="8" fill="#e8c990"/>

  <!-- Suspension cables draping in wide helical curves -->
  <g fill="none" stroke="#d8cdb8" stroke-width="2" opacity="0.85">
    <path d="M70,110 Q200,60 330,110"/>
    <path d="M70,190 Q200,260 330,190"/>
    <path d="M70,110 Q200,180 330,190"/>
    <path d="M70,190 Q200,120 330,110"/>
  </g>

  <!-- Vertical hangers connecting cables to deck -->
  <g stroke="#cfcab8" stroke-width="1.3" opacity="0.8">
    <line x1="100" y1="150" x2="100" y2="270"/>
    <line x1="130" y1="140" x2="130" y2="270"/>
    <line x1="160" y1="135" x2="160" y2="270"/>
    <line x1="200" y1="132" x2="200" y2="270"/>
    <line x1="240" y1="135" x2="240" y2="270"/>
    <line x1="270" y1="140" x2="270" y2="270"/>
    <line x1="300" y1="150" x2="300" y2="270"/>
  </g>

  <!-- Twisted deck ribbon -->
  <path d="M20,275 
           C80,290 120,260 160,275 
           C200,290 240,260 280,275 
           C320,290 360,260 380,270" 
        fill="none" stroke="#403528" stroke-width="16" stroke-linecap="round"/>
  <path d="M20,275 
           C80,290 120,260 160,275 
           C200,290 240,260 280,275 
           C320,290 360,260 380,270" 
        fill="none" stroke="#6d5a42" stroke-width="10" stroke-linecap="round"/>
  <path d="M20,275 
           C80,290 120,260 160,275 
           C200,290 240,260 280,275 
           C320,290 360,260 380,270" 
        fill="none" stroke="#9c8462" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round" opacity="0.7"/>

  <!-- Small lanterns along the deck -->
  <g fill="#ffe8b0">
    <circle cx="90" cy="278" r="2.5"/>
    <circle cx="150" cy="272" r="2.5"/>
    <circle cx="210" cy="278" r="2.5"/>
    <circle cx="270" cy="272" r="2.5"/>
    <circle cx="330" cy="278" r="2.5"/>
  </g>

  <!-- Birds -->
  <g stroke="#1b2a4a" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M200,80 q5,-6 10,0 q5,-6 10,0"/>
    <path d="M230,100 q4,-5 8,0 q4,-5 8,0"/>
  </g>

  <!-- Subtle mist at base of towers -->
  <ellipse cx="70" cy="272" rx="40" ry="8" fill="#ffffff" opacity="0.08"/>
  <ellipse cx="330" cy="272" rx="40" ry="8" fill="#ffffff" opacity="0.08"/>
</svg>