    <circle cx="250" cy="108" r="6" fill="#ffe9a8"/>
    <circle cx="308" cy="162" r="6" fill="#ffe9a8"/>
    <circle cx="264" cy="218" r="5" fill="#ffe9a8"/>
    <circle cx="216" cy="220" r="5" fill="#ffe9a8"/>
    <circle cx="288" cy="178" r="4.5" fill="#ffe9a8"/>
    <circle cx="120" cy="146" r="14" fill="url(#lumo)"/>
    <circle cx="250" cy="108" r="14" fill="url(#lumo)"/>
    <circle cx="308" cy="162" r="12" fill="url(#lumo)"/>
  </g>

