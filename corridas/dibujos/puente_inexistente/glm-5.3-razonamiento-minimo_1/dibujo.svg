<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="celo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1040"/>
      <stop offset="0.5" stop-color="#5b2a6e"/>
      <stop offset="0.8" stop-color="#d4547a"/>
      <stop offset="1" stop-color="#f5a35c"/>
    </linearGradient>
    <linearGradient id="akvo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c1b4d"/>
      <stop offset="1" stop-color="#0d0824"/>
    </linearGradient>
    <radialGradient id="lumo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4c4"/>
      <stop offset="0.4" stop-color="#ffd98a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#celo)"/>
  <circle cx="80" cy="70" r="55" fill="#ffe9b0" opacity="0.9"/>
  <circle cx="80" cy="70" r="80" fill="#ffd98a" opacity="0.15"/>

  <g fill="#fff">
