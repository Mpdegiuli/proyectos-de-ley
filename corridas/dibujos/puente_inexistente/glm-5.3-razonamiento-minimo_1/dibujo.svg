  <g>
    <circle cx="95" cy="184" r="4" fill="#f5e6c8"/>
    <path d="M95,188 L95,200 M95,192 L90,196 M95,192 L101,195 M95,200 L91,208 M95,200 L99,208" stroke="#f5e6c8" stroke-width="2" fill="none"/>
    <ellipse cx="95" cy="189" rx="7" ry="3" fill="none" stroke="#a8c8e8" stroke-width="1.5"/>
  </g>

  <!-- pájaros -->
  <g stroke="#2a1a44" stroke-width="2" fill="none">
    <path d="M150,80 q6,-6 12,0 q6,-6 12,0"/>
    <path d="M185,65 q5,-5 10,0 q5,-5 10,0"/>
    <path d="M330,90 q5,-5 10,0 q5,-5 10,0"/>
  </g>

  <!-- nebulosa -->
  <ellipse cx="330" cy="200" rx="70" ry="35" fill="#c66aa0" opacity="0.12"/>
  <ellipse cx="350" cy="230" rx="45" ry="20" fill="#8a5ad0" opacity="0.12"/>
</svg>