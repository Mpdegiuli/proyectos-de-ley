    <circle cx="200" cy="22" r="1.8"/><circle cx="300" cy="35" r="1.3"/>
    <circle cx="350" cy="60" r="1.6"/><circle cx="250" cy="55" r="1"/>
    <circle cx="30" cy="120" r="1.2"/><circle cx="370" cy="110" r="1.5"/>
    <circle cx="160" cy="70" r="1"/><circle cx="330" cy="150" r="1.1"/>
    <circle cx="55" cy="180" r="1.3"/><circle cx="380" cy="40" r="1.2"/>
  </g>

  <!-- agua -->
  <rect y="300" width="400" height="100" fill="url(#akvo)"/>
  <g stroke="#8a6fc9" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M0,315 q20,-6 40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0"/>
    <path d="M0,335 q25,-7 50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0"/>
    <path d="M0,358 q20,-6 40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0"/>
    <path d="M0,382 q25,-7 50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0"/>
  </g>

  <!-- reflejo espiral -->
  <g stroke="#e8b45a" stroke-width="6" fill="none" opacity="0.2" transform="translate(0,610) scale(1,-1)">
    <path d="M40,200 Q120,185 190,200 A60,60 0 0 1 310,200 A48,48 0 0 1 214,200 A38,38 0 0 1 290,200 A30,30 0 0 1 230,200 A24,24 0 0 1 278,200 A19,19 0 0 1 240,200 A15,15 0 0 1 270,200 A12,12 0 0 1 246,200"/>
  </g>

  <!-- precipicio izquierdo -->
  <path d="M0,240 L45,235 L55,215 L48,195 L60,175 L52,155 L70,130 L60,300 L0,300 Z" fill="#241638"/>
  <path d="M0,240 L45,235 L55,215 L48,195 L60,175 L52,155 L70,130" fill="none" stroke="#4a2f6b" stroke-width="3"/>
  <g fill="#3d5a3a">
