  <circle cx="26" cy="136" r="3" fill="#ff9ecb"/>
  <circle cx="42" cy="142" r="3" fill="#ffd0e8"/>
  <circle cx="56" cy="149" r="2.5" fill="#ff9ecb"/>

  <!-- obelisco central flotante -->
