    <line x1="252" y1="65" x2="250" y2="140"/>
    <line x1="252" y1="65" x2="308" y2="196"/>
    <line x1="252" y1="70" x2="264" y2="246"/>
    <line x1="252" y1="70" x2="216" y2="244"/>
    <line x1="252" y1="75" x2="288" y2="200"/>
    <line x1="252" y1="75" x2="232" y2="200"/>
  </g>

  <!-- puente espiral: estructura -->
  <path d="M40,200 Q120,185 190,200 A60,60 0 0 1 310,200 A48,48 0 0 1 214,200 A38,38 0 0 1 290,200 A30,30 0 0 1 230,200 A24,24 0 0 1 278,200 A19,19 0 0 1 240,200 A15,15 0 0 1 270,200 A12,12 0 0 1 246,200 A9,9 0 0 1 264,200 A7,7 0 0 1 250,200"
        fill="none" stroke="#22203a" stroke-width="14" stroke-linecap="round"/>
  <path d="M40,200 Q120,185 190,200 A60,60 0 0 1 310,200 A48,48 0 0 1 214,200 A38,38 0 0 1 290,200 A30,30 0 0 1 230,200 A24,24 0 0 1 278,200 A19,19 0 0 1 240,200 A15,15 0 0 1 270,200 A12,12 0 0 1 246,200 A9,9 0 0 1 264,200 A7,7 0 0 1 250,200"
        fill="none" stroke="#7a6296" stroke-width="10" stroke-linecap="round"/>
  <path d="M40,197 Q120,182 190,197 A60,60 0 0 1 310,197 A48,48 0 0 1 214,197 A38,38 0 0 1 290,197 A30,30 0 0 1 230,197 A24,24 0 0 1 278,197 A19,19 0 0 1 240,197 A15,15 0 0 1 270,197 A12,12 0 0 1 246,197 A9,9 0 0 1 264,197 A7,7 0 0 1 250,197"
        fill="none" stroke="#e8b45a" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>

  <!-- torres con faroles -->
  <g stroke="#3a2a55" stroke-width="4">
    <line x1="120" y1="190" x2="120" y2="150"/>
    <line x1="250" y1="140" x2="250" y2="112"/>
    <line x1="308" y1="200" x2="308" y2="166"/>
    <line x1="264" y1="248" x2="264" y2="222"/>
    <line x1="216" y1="248" x2="216" y2="224"/>
    <line x1="288" y1="200" x2="288" y2="182"/>
  </g>
  <g>
