    <line x1="308" y1="200" x2="308" y2="166"/>
  </g>

  <!-- pilar imposible bajo el arco -->
  <g stroke="#d9c08a" stroke-width="1.3" opacity="0.7">
    <line x1="252" y1="200" x2="252" y2="298"/>
    <line x1="244" y1="200" x2="244" y2="298"/>
    <line x1="248" y1="215" x2="270" y2="215"/>
    <line x1="248" y1="235" x2="270" y2="235"/>
    <line x1="248" y1="255" x2="270" y2="255"/>
    <line x1="248" y1="275" x2="270" y2="275"/>
    <path d="M240,298 L280,298" stroke="#3a2a55" stroke-width="5"/>
