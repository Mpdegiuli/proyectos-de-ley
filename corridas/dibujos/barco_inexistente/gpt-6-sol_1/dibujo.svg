<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#101936"/>
      <stop offset=".7" stop-color="#24546a"/>
      <stop offset="1" stop-color="#397b80"/>
    </linearGradient>
    <linearGradient id="sea" x2="0" y2="1">
      <stop stop-color="#214c64"/>
      <stop offset="1" stop-color="#0b253e"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2=".6" y2="1">
      <stop stop-color="#edac80"/>
      <stop offset=".35" stop-color="#a85d66"/>
      <stop offset="1" stop-color="#352c53"/>
    </linearGradient>
    <linearGradient id="sail" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#baf5dd" stop-opacity=".9"/>
      <stop offset=".48" stop-color="#69bfc1" stop-opacity=".72"/>
      <stop offset="1" stop-color="#6372a4" stop-opacity=".5"/>
    </linearGradient>
    <radialGradient id="moon">
      <stop stop-color="#fff9d2"/>
      <stop offset=".45" stop-color="#f6d99a"/>
      <stop offset="1" stop-color="#f6d99a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="waves" width="52" height="19" patternUnits="userSpaceOnUse">
      <path d="M-10 11q13-8 26 0t26 0 26 0" fill="none" stroke="#80c5bd" stroke-opacity=".18" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="206" cy="100" r="83" fill="url(#moon)" opacity=".24"/>
  <g fill="#f9e9bd">
    <circle cx="45" cy="45" r="1.8"/><circle cx="93" cy="85" r="1"/>
    <circle cx="315" cy="49" r="1.5"/><circle cx="351" cy="105" r="1"/>
    <circle cx="34" cy="155" r="1"/><circle cx="370" cy="166" r="1.7"/>
    <circle cx="103" cy="35" r="1"/><circle cx="290" cy="117" r="1"/>
    <circle cx="74" cy="184" r="1.4"/><circle cx="334" cy="153" r="1"/>
  </g>
  <g stroke="#f9e9bd" stroke-linecap="round" opacity=".7">
    <path d="M51 103v10m-5-5h10M326 79v12m-6-6h12M268 36v8m-4-4h8M375 46v8m-4-4h8"/>
  </g>

  <path d="M0 308q55-13 105 0t105 0 105 0 85-1v92H0Z" fill="url(#sea)"/>
  <path d="M0 308q55-13 105 0t105 0 105 0 85-1v92H0Z" fill="url(#waves)"/>
  <g fill="none" stroke="#a5d6cb" stroke-linecap="round" opacity=".4">
    <path d="M18 338h47m242-4h68M74 359h85m133 1h46M28 381h93m205-5h44"/>
    <path d="M163 347h88m-64 13h48m-94 18h109" opacity=".6"/>
  </g>

  <!-- Un ancla hecha de raíz, suspendida sobre el agua -->
  <path d="M92 299q-12 24 1 44m0 0q-13 9-24-2m24 2q10 8 23-4" fill="none" stroke="#d9a884" stroke-width="3" stroke-linecap="round"/>
  <path d="M65 335l4 9 8-5m42-7-3 10-9-3" fill="none" stroke="#d9a884" stroke-width="2"/>

  <!-- Casco de luna creciente -->
  <path d="M46 248q144 71 300-17-6 53-55 80-45 25-91 22Q91 331 46 248Z" fill="url(#hull)" stroke="#f2bd95" stroke-width="2"/>
  <path d="M310 254q44-22 43-57 24 42-11 75Z" fill="#cb7972" stroke="#f2bd95" stroke-width="2"/>
  <path d="M50 250q148 69 294-17" fill="none" stroke="#ffe0ab" stroke-width="6" stroke-linecap="round"/>
