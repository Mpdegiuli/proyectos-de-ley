  <path d="M344 223q-7 25-27 35" fill="none" stroke="#ffe0ab" stroke-width="2"/>
  <circle cx="346" cy="218" r="3" fill="#fff0bb"/>

  <!-- Ventanas, como pequeñas constelaciones -->
  <g fill="#ffe3a6" stroke="#553c59" stroke-width="3">
    <circle cx="122" cy="292" r="10"/><circle cx="163" cy="306" r="9"/>
    <circle cx="204" cy="310" r="8"/><circle cx="244" cy="302" r="7"/>
  </g>
  <g fill="#fff8d5">
    <circle cx="119" cy="289" r="2"/><circle cx="160" cy="303" r="2"/>
    <circle cx="202" cy="308" r="2"/><circle cx="242" cy="300" r="2"/>
