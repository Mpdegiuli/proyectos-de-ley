  <path d="M207 98v166" stroke="#493e5e" stroke-width="8" stroke-linecap="round"/>
  <path d="M207 99v163" stroke="#ffdbab" stroke-width="3" stroke-linecap="round"/>
  <path d="M196 111q-56 22-65 81-7 39 66 52-32-62-1-133Z" fill="url(#sail)" stroke="#d4f2d5" stroke-width="2.5"/>
  <path d="M214 105q65 31 72 82 5 39-75 57 38-70 3-139Z" fill="url(#sail)" stroke="#d4f2d5" stroke-width="2.5"/>
