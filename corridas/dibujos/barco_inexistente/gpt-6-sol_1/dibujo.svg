    <path d="M196 112q-6 70 1 132m-1-132q-42 59-64 81m64-81q-22 99 1 132"/>
    <path d="M214 106q7 76-3 138m3-138q48 60 71 81m-71-81q28 94-3 138"/>
    <path d="M140 215q28-21 43-49m42 0q24 33 54 44"/>
