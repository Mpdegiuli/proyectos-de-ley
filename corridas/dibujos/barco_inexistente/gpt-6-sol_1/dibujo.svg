    <circle cx="245" cy="149" r="2.5"/><circle cx="263" cy="185" r="2"/>
    <circle cx="240" cy="218" r="1.5"/>
  </g>
  <path d="M107 252q42-107 100-155m0 0q99 65 115 150" fill="none" stroke="#e6c7aa" stroke-opacity=".6" stroke-width="1.5"/>

  <!-- Una luna cautiva hace de brújula -->
  <circle cx="207" cy="91" r="19" fill="url(#moon)"/>
  <circle cx="207" cy="91" r="9" fill="#fff4c5"/>
  <ellipse cx="207" cy="91" rx="28" ry="8" transform="rotate(-23 207 91)" fill="none" stroke="#f7d5a2" stroke-width="2"/>

  <!-- Faroles flotantes siguen al barco -->
  <g stroke="#c4ede0" stroke-width="1.5">
    <path d="M55 213v23m-5 0h10l-2 10h-6Z" fill="#fbd797"/>
    <path d="M364 274v15m-5 0h10l-2 9h-6Z" fill="#fbd797"/>
  </g>
  <circle cx="55" cy="240" r="12" fill="url(#moon)" opacity=".65"/>
  <circle cx="364" cy="293" r="12" fill="url(#moon)" opacity=".6"/>
</svg>