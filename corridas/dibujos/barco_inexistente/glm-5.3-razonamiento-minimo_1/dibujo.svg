<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1440"/>
      <stop offset="0.6" stop-color="#4b2a6b"/>
      <stop offset="1" stop-color="#a34a7a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2a4a"/>
      <stop offset="1" stop-color="#05101f"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.7" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ffd066"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e8f83"/>
      <stop offset="0.5" stop-color="#1f6f6b"/>
      <stop offset="1" stop-color="#123f4a"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfefff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7fd4e8" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="sail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4e9d0"/>
      <stop offset="1" stop-color="#d9b98a"/>
    </linearGradient>
  </defs>

  <!-- cielo -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- estrellas -->
  <g fill="#fff">
    <circle cx="40" cy="40" r="1.6"/><circle cx="90" cy="70" r="1.1"/>
    <circle cx="150" cy="35" r="1.3"/><circle cx="210" cy="55" r="1"/>
    <circle cx="260" cy="30" r="1.7"/><circle cx="320" cy="60" r="1.2"/>
    <circle cx="360" cy="35" r="1.5"/><circle cx="60" cy="110" r="1"/>
    <circle cx="130" cy="120" r="0.9"/><circle cx="330" cy="110" r="1"/>
    <circle cx="300" cy="140" r="0.8"/><circle cx="30" cy="160" r="1.1"/>
  </g>

  <!-- luna doble -->
  <circle cx="310" cy="95" r="38" fill="url(#moon)"/>
  <circle cx="340" cy="70" r="14" fill="#ffe9a8" opacity="0.85"/>

  <!-- mar -->
  <path d="M0 260 Q 50 248 100 260 T 200 260 T 300 260 T 400 260 L400 400 L0 400 Z" fill="url(#sea)"/>
  <!-- olas -->
  <g fill="none" stroke="#3f7fae" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M10 285 q 20 -12 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0"/>
    <path d="M-10 315 q 20 -12 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0" opacity="0.6"/>
    <path d="M10 345 q 20 -12 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0" opacity="0.45"/>
  </g>

  <!-- reflejo de luna -->
  <g stroke="#ffe08a" stroke-width="2" opacity="0.5" stroke-linecap="round">
    <line x1="300" y1="270" x2="308" y2="270"/>
    <line x1="290" y1="285" x2="312" y2="285"/>
    <line x1="296" y1="300" x2="318" y2="300"/>
    <line x1="288" y1="318" x2="314" y2="318"/>
    <line x1="292" y1="336" x2="310" y2="336"/>
  </g>

  <!-- ===== EL BARCO INEXISTENTE ===== -->

  <!-- burbujas-propulsión -->
  <g fill="none" stroke="#9fe8dd" stroke-width="2" opacity="0.8">
    <circle cx="88" cy="248" r="6"/>
    <circle cx="76" cy="258" r="4"/>
    <circle cx="66" cy="252" r="3"/>
    <circle cx="58" cy="260" r="2.5"/>
  </g>

  <!-- tentáculo proa -->
  <path d="M110 235 C 85 240 70 255 58 250 C 48 246 52 236 62 236 C 70 236 68 244 60 243"
        fill="none" stroke="#1f6f6b" stroke-width="10" stroke-linecap="round"/>
  <path d="M110 235 C 85 240 70 255 58 250 C 48 246 52 236 62 236 C 70 236 68 244 60 243"
        fill="none" stroke="#2e8f83" stroke-width="5" stroke-linecap="round"/>

  <!-- casco-orgánico tipo lágrima -->
  <path d="M120 240
           C 130 265 175 275 210 270
           C 250 264 275 245 278 222
           C 280 205 268 192 248 190
           C 240 170 215 160 195 165
           C 175 170 165 185 162 198
           C 140 200 122 220 120 240 Z"
        fill="url(#hull)" stroke="#0c333d" stroke-width="3"/>

  <!-- costillas del casco -->
  <g fill="none" stroke="#0c333d" stroke-width="2" opacity="0.5">
    <path d="M150 205 q 8 30 2 55"/>
    <path d="M172 195 q 6 35 0 62"/>
    <path d="M195 190 q 4 38 0 66"/>
    <path d="M218 194 q 0 38 2 60"/>
    <path d="M240 202 q -4 32 -8 52"/>
  </g>

  <!-- ojo-lámpara (linterna de proa) -->
  <circle cx="140" cy="225" r="11" fill="#ffd97a" stroke="#0c333d" stroke-width="2.5"/>
  <circle cx="140" cy="225" r="4.5" fill="#0c333d"/>
  <circle cx="143" cy="221" r="1.6" fill="#fff"/>

  <!-- ventanillas -->
  <g fill="#bfefff" stroke="#0c333d" stroke-width="2">
    <circle cx="240" cy="222" r="7"/>
    <circle cx="258" cy="214" r="6"/>
    <circle cx="272" cy="204" r="5"/>
  </g>

  <!-- aleta dorsal-timón -->
  <path d="M198 165 C 195 140 205 118 220 108 C 214 128 216 148 224 162 Z"
        fill="#2e8f83" stroke="#0c333d" stroke-width="3"/>
  <path d="M204 158 C 203 142 208 128 215 120" fill="none" stroke="#0c333d" stroke-width="2" opacity="0.5"/>

  <!-- mástil-coral -->
  <path d="M185 190 L 182 60" stroke="#d9b98a" stroke-width="6" stroke-linecap="round"/>
  <g stroke="#d9b98a" stroke-width="4" stroke-linecap="round">
    <path d="M182 90 l -16 -8"/>
    <path d="M182 120 l 15 7"/>
    <path d="M182 78 l 13 -10"/>
    <path d="M182 148 l -14 -6"/>
  </g>
  <circle cx="182" cy="56" r="7" fill="#ffd97a" stroke="#0c333d" stroke-width="2"/>

  <!-- vela-medusa -->
  <path d="M182 95 C 130 100 112 140 128 172 C 140 158 152 156 164 160
           C 150 128 160 105 182 95 Z"
        fill="url(#sail)" stroke="#8a6b42" stroke-width="2.5"/>
  <path d="M182 95 C 234 100 252 140 236 172 C 224 158 212 156 200 160
           C 214 128 204 105 182 95 Z"
        fill="url(#sail)" stroke="#8a6b42" stroke-width="2.5"/>
  <g fill="none" stroke="#8a6b42" stroke-width="1.5" opacity="0.6">
    <path d="M150 108 q -10 30 -2 55"/>
    <path d="M170 100 q -6 32 0 58"/>
    <path d="M196 100 q 6 32 0 58"/>
    <path d="M214 108 q 10 30 2 55"/>
  </g>

  <!-- frutas de la vela -->
  <g>
    <circle cx="150" cy="128" r="4" fill="#e88" />
    <circle cx="210" cy="122" r="4" fill="#8be"/>
    <circle cx="168" cy="150" r="3.5" fill="#ed8"/>
    <circle cx="196" cy="148" r="3.5" fill="#b8e"/>
  </g>

  <!-- cúpula de cristal -->
  <path d="M170 190 A 30 30 0 0 1 230 190 Z" fill="url(#dome)" stroke="#0c333d" stroke-width="3"/>

  <!-- navegante pulpo -->
  <g>
    <circle cx="200" cy="180" r="9" fill="#e07aa8" stroke="#0c333d" stroke-width="2"/>
    <circle cx="197" cy="178" r="1.6" fill="#fff"/>
    <circle cx="204" cy="178" r="1.6" fill="#fff"/>
    <path d="M196 184 q 4 3 8 0" fill="none" stroke="#0c333d" stroke-width="1.4" stroke-linecap="round"/>
    <g fill="none" stroke="#e07aa8" stroke-width="3.5" stroke-linecap="round">
      <path d="M193 186 q -8 2 -10 -4"/>
      <path d="M207 186 q 8 2 10 -4"/>
    </g>
    <path d="M192 178 q 3 -4 6 0 M202 178 q 3 -4 6 0" fill="none" stroke="#0c333d" stroke-width="1.2"/>
  </g>

  <!-- remos-pétalos -->
  <g stroke="#d9b98a" stroke-width="4" stroke-linecap="round">
    <line x1="235" y1="235" x2="262" y2="256"/>
    <line x1="245" y1="245" x2="270" y2="262"/>
  </g>
  <ellipse cx="268" cy="260" rx="10" ry="5" transform="rotate(35 268 260)" fill="#2e8f83" stroke="#0c333d" stroke-width="2"/>
  <ellipse cx="276" cy="266" rx="9" ry="4.5" transform="rotate(40 276 266)" fill="#2e8f83" stroke="#0c333d" stroke-width="2"/>

  <!-- sombra en el agua -->
  <ellipse cx="205" cy="268" rx="80" ry="9" fill="#05101f" opacity="0.5"/>

  <!-- gaviota-fantasmas -->
  <g fill="none" stroke="#f4e9d0" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path d="M70 100 q 8 -8 16 0 q 8 -8 16 0"/>
    <path d="M120 80 q 6 -6 12 0 q 6 -6 12 0"/>
  </g>
</svg>