<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0221"/>
      <stop offset="60%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#3c1b5a"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d6" stop-opacity="1"/>
      <stop offset="60%" stop-color="#f0e6a0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e0d080" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hullGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="50%" stop-color="#4a2a5a"/>
      <stop offset="100%" stop-color="#2a1a3a"/>
    </linearGradient>
    <linearGradient id="sailGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c07ab0"/>
      <stop offset="100%" stop-color="#6a3a6a"/>
    </linearGradient>
    <linearGradient id="sailGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#80c0e0"/>
      <stop offset="100%" stop-color="#2a5a7a"/>
    </linearGradient>
    <radialGradient id="balloon1" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffb3c6"/>
      <stop offset="100%" stop-color="#c04a6a"/>
    </radialGradient>
    <radialGradient id="balloon2" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#c0e0ff"/>
      <stop offset="100%" stop-color="#3a6a9a"/>
    </radialGradient>
    <radialGradient id="balloon3" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffd699"/>
      <stop offset="100%" stop-color="#c07a2a"/>
    </radialGradient>
    <linearGradient id="tentacleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a3a8a"/>
      <stop offset="100%" stop-color="#d090d0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#sky)"/>

  <g fill="#ffffff" opacity="0.7">
    <circle cx="30" cy="50" r="1.5"/>
    <circle cx="80" cy="120" r="1"/>
    <circle cx="150" cy="40" r="1.8"/>
    <circle cx="220" cy="70" r="1.2"/>
    <circle cx="290" cy="30" r="1.5"/>
    <circle cx="350" cy="90" r="1"/>
    <circle cx="50" cy="180" r="1.2"/>
    <circle cx="120" cy="130" r="1"/>
    <circle cx="340" cy="180" r="1.4"/>
    <circle cx="370" cy="220" r="1"/>
    <circle cx="20" cy="280" r="1.3"/>
    <circle cx="60" cy="340" r="1"/>
    <circle cx="180" cy="20" r="1.6"/>
  </g>

  <circle cx="320" cy="80" r="30" fill="url(#moon)" opacity="0.9"/>
  <circle cx="320" cy="80" r="18" fill="#fff8d6" opacity="0.6" filter="url(#glow)"/>

  <g fill="#ffffff" opacity="0.08">
    <path d="M0,300 Q50,270 100,290 Q150,260 200,285 Q250,255 300,280 Q350,260 400,290 L400,400 L0,400 Z"/>
    <path d="M0,330 Q80,300 160,320 Q240,290 320,315 Q360,305 400,320 L400,400 L0,400 Z"/>
  </g>

  <g>
    <g stroke="url(#tentacleGrad)" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M130,280 Q110,320 90,350 Q80,370 100,380"/>
      <path d="M160,290 Q150,330 140,360 Q130,390 150,400"/>
      <path d="M200,295 Q200,340 190,370 Q180,400 200,410" opacity="0.8"/>
      <path d="M240,290 Q250,330 260,360 Q270,390 250,400"/>
      <path d="M280,275 Q300,310 320,340 Q330,360 310,380"/>
    </g>

    <path d="M110,250 Q70,260 60,280 Q80,270 110,265 Z" fill="#4a2a5a"/>
    <path d="M300,250 Q340,260 350,280 Q320,270 300,265 Z" fill="#4a2a5a"/>

    <path d="M85,230 
             C95,245 110,260 140,275 
             C170,290 230,300 280,295 
             C310,290 335,275 345,255 
             L355,225 
             C360,210 350,195 335,190 
             C325,195 315,200 305,200 
             C280,205 180,210 140,220 
             C105,225 90,225 85,230 Z" 
          fill="url(#hullGrad)" stroke="#1a0b2e" stroke-width="2"/>

    <path d="M100,225 L140,215 L280,205 L340,190" stroke="#1a0b2e" stroke-width="2" fill="none"/>

    <path d="M85,230 C70,225 55,235 50,250 C45,265 55,275 70,270 C80,267 85,260 88,250 Z" fill="#4a2a5a" stroke="#1a0b2e" stroke-width="2"/>
    <circle cx="70" cy="245" r="4" fill="#ffd699"/>
    <circle cx="70" cy="245" r="2" fill="#1a0b2e"/>
    <path d="M60,260 Q75,275 90,265" stroke="#1a0b2e" stroke-width="2" fill="none"/>

    <path d="M300,200 L305,175 L335,185 L345,190 L340,190 Z" fill="#4a2a5a" stroke="#1a0b2e" stroke-width="2"/>
    <path d="M305,175 L320,170 L340,182 L335,185 Z" fill="#2a1a3a" stroke="#1a0b2e" stroke-width="1"/>

    <g stroke="#1a0b2e" stroke-width="5" stroke-linecap="round">
      <line x1="200" y1="220" x2="195" y2="80"/>
      <line x1="150" y1="225" x2="145" y2="120"/>
      <line x1="280" y1="205" x2="285" y2="100"/>
    </g>

    <path d="M120,140 Q145,160 160,140 Q155,190 145,200 Q130,190 120,140 Z" 
          fill="url(#sailGrad)" opacity="0.85" stroke="#1a0b2e" stroke-width="1.5"/>
    <path d="M170,100 Q200,125 225,100 Q220,170 195,190 Q175,170 170,100 Z" 
          fill="url(#sailGrad)" opacity="0.85" stroke="#1a0b2e" stroke-width="1.5"/>
    <path d="M185,120 Q195,140 205,120 Q202,175 195,185 Q188,175 185,120 Z" 
          fill="url(#sailGrad2)" opacity="0.7" stroke="#1a0b2e" stroke-width="1"/>
    <path d="M260,110 Q285,130 300,110 Q295,170 285,185 Q265,170 260,110 Z" 
          fill="url(#sailGrad2)" opacity="0.85" stroke="#1a0b2e" stroke-width="1.5"/>

    <g stroke="#c0a0c0" stroke-width="1" fill="none" opacity="0.6">
      <path d="M145,120 Q170,150 200,90"/>
      <path d="M195,80 Q220,120 285,100"/>
      <path d="M145,120 Q130,160 100,225"/>
      <path d="M285,100 Q300,150 340,190"/>
    </g>

    <g>
      <ellipse cx="120" cy="100" rx="22" ry="28" fill="url(#balloon1)" stroke="#1a0b2e" stroke-width="1.5"/>
      <path d="M120,128 Q125,150 140,220" stroke="#c0a0c0" stroke-width="1.5" fill="none" opacity="0.8"/>
      <ellipse cx="180" cy="70" rx="18" ry="24" fill="url(#balloon2)" stroke="#1a0b2e" stroke-width="1.5"/>
      <path d="M180,94 Q184,120 195,200" stroke="#c0a0c0" stroke-width="1.5" fill="none" opacity="0.8"/>
      <ellipse cx="240" cy="85" rx="20" ry="25" fill="url(#balloon3)" stroke="#1a0b2e" stroke-width="1.5"/>
      <path d="M240,110 Q244,140 280,205" stroke="#c0a0c0" stroke-width="1.5" fill="none" opacity="0.8"/>
    </g>

    <circle cx="180" cy="250" r="6" fill="#ffd699" stroke="#1a0b2e" stroke-width="1.5"/>
    <circle cx="180" cy="250" r="3" fill="#1a0b2e"/>
    <circle cx="260" cy="255" r="6" fill="#ffd699" stroke="#1a0b2e" stroke-width="1.5"/>
    <circle cx="260" cy="255" r="3" fill="#1a0b2e"/>

    <g stroke="#1a0b2e" stroke-width="3" stroke-linecap="round">
      <path d="M140,265 L100,290 L85,285" fill="none"/>
      <path d="M160,275 L130,305 L115,300" fill="none"/>
      <path d="M240,275 L270,300 L285,295" fill="none"/>
      <path d="M260,268 L290,290 L305,285" fill="none"/>
    </g>

    <path d="M345,255 Q370,250 380,270 Q365,280 345,270 Z" fill="#4a2a5a" stroke="#1a0b2e" stroke-width="2"/>
    <path d="M370,255 Q390,260 400,275 Q380,280 365,270 Z" fill="#c07ab0" opacity="0.8"/>
  </g>
</svg>