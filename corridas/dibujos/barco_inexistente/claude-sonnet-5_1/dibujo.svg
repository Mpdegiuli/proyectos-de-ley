<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b1055"/>
      <stop offset="50%" stop-color="#7b4397"/>
      <stop offset="100%" stop-color="#ff7e5f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a5276"/>
      <stop offset="100%" stop-color="#0b2545"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a5a"/>
      <stop offset="100%" stop-color="#15202b"/>
    </linearGradient>
    <radialGradient id="bulb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8c4"/>
      <stop offset="100%" stop-color="#ffb100"/>
    </radialGradient>
    <linearGradient id="finG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8e44ad"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#sky)"/>

  <circle cx="320" cy="70" r="30" fill="#ffe9a8" opacity="0.9"/>
  <circle cx="320" cy="70" r="40" fill="#ffe9a8" opacity="0.2"/>

  <g opacity="0.5">
    <circle cx="60" cy="40" r="1.5" fill="#fff"/>
    <circle cx="100" cy="60" r="1" fill="#fff"/>
    <circle cx="150" cy="30" r="1.2" fill="#fff"/>
    <circle cx="200" cy="55" r="1" fill="#fff"/>
    <circle cx="40" cy="90" r="1" fill="#fff"/>
    <circle cx="250" cy="25" r="1.3" fill="#fff"/>
  </g>

  <rect y="230" width="400" height="170" fill="url(#sea)"/>
  <path d="M0 230 Q50 220 100 230 T200 230 T300 230 T400 230 V250 H0 Z" fill="#12415e" opacity="0.6"/>
  <path d="M0 245 Q60 235 120 245 T240 245 T360 245 T400 245 V260 H0 Z" fill="#0f3550" opacity="0.6"/>

  <!-- Barco imposible: criatura marina mecánica -->
  <g transform="translate(200,240)">

    <!-- Casco en forma de medialuna con escamas -->
    <path d="M-150 20 Q-140 70 -60 85 Q0 95 60 85 Q140 70 150 20 Q140 0 100 -5 Q0 10 -100 -5 Q-140 0 -150 20 Z"
          fill="url(#hull)" stroke="#0a0f14" stroke-width="2"/>

    <!-- Escamas en el casco -->
    <g fill="none" stroke="#4a5a6a" stroke-width="1.5" opacity="0.7">
      <path d="M-120 20 Q-110 35 -100 20"/>
      <path d="M-90 25 Q-80 40 -70 25"/>
      <path d="M-60 30 Q-50 45 -40 30"/>
      <path d="M-30 32 Q-20 47 -10 32"/>
      <path d="M0 33 Q10 48 20 33"/>
      <path d="M30 32 Q40 47 50 32"/>
      <path d="M60 30 Q70 45 80 30"/>
      <path d="M90 25 Q100 38 110 25"/>
    </g>

    <!-- Ojo de buey con bulbo luminoso -->
    <circle cx="-60" cy="30" r="12" fill="url(#bulb)" stroke="#5a3b00" stroke-width="2"/>
    <circle cx="0" cy="35" r="10" fill="url(#bulb)" stroke="#5a3b00" stroke-width="2"/>
    <circle cx="60" cy="28" r="12" fill="url(#bulb)" stroke="#5a3b00" stroke-width="2"/>

    <!-- Cabeza de criatura en la proa -->
    <g transform="translate(150,10)">
      <path d="M0 0 Q30 -10 45 10 Q50 25 30 30 Q10 35 -5 20 Z" fill="url(#hull)" stroke="#0a0f14" stroke-width="2"/>
      <circle cx="30" cy="8" r="5" fill="#ffd700"/>
      <circle cx="30" cy="8" r="2" fill="#111"/>
      <path d="M45 10 Q60 8 65 15 Q60 20 45 18" fill="#2c3e50" stroke="#0a0f14" stroke-width="1.5"/>
    </g>

    <!-- Cola trasera tipo pez -->
    <g transform="translate(-150,10)">
      <path d="M0 0 Q-30 -30 -10 -10 Q-40 -5 -15 5 Q-45 20 -10 15 Q-30 35 0 10 Z"
            fill="url(#finG)" stroke="#1a0a2a" stroke-width="2"/>
    </g>

    <!-- Mástiles asimétricos con velas de membrana -->
    <g>
      <line x1="-40" y1="-5" x2="-50" y2="-110" stroke="#3a2a1a" stroke-width="4"/>
      <path d="M-50 -110 Q-20 -90 -50 -40 Q-70 -80 -50 -110 Z" fill="#c49ed9" opacity="0.85" stroke="#6a3a7a" stroke-width="1.5"/>

      <line x1="10" y1="-10" x2="25" y2="-150" stroke="#3a2a1a" stroke-width="5"/>
      <path d="M25 -150 Q60 -120 25 -50 Q0 -110 25 -150 Z" fill="#e8c6ff" opacity="0.85" stroke="#6a3a7a" stroke-width="1.5"/>

      <line x1="60" y1="-5" x2="80" y2="-80" stroke="#3a2a1a" stroke-width="3"/>
      <path d="M80 -80 Q100 -65 80 -30 Q65 -55 80 -80 Z" fill="#c49ed9" opacity="0.85" stroke="#6a3a7a" stroke-width="1.5"/>
    </g>

    <!-- Tentáculos colgando del casco, sirviendo de remos -->
    <g stroke="#2c3e50" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9">
      <path d="M-100 60 Q-110 90 -95 110 Q-85 125 -95 140"/>
      <path d="M-30 75 Q-35 100 -20 115 Q-10 128 -22 140"/>
      <path d="M50 70 Q60 95 45 112 Q35 125 48 138"/>
      <path d="M110 55 Q125 80 110 100 Q100 115 115 128"/>
    </g>

    <!-- Pequeñas burbujas -->
    <g fill="#8fd3ff" opacity="0.5">
      <circle cx="-70" cy="100" r="3"/>
      <circle cx="-40" cy="120" r="2"/>
      <circle cx="20" cy="110" r="2.5"/>
      <circle cx="70" cy="105" r="3"/>
      <circle cx="100" cy="125" r="2"/>
    </g>

    <!-- Bandera con símbolo extraño -->
    <line x1="25" y1="-150" x2="25" y2="-170" stroke="#3a2a1a" stroke-width="2"/>
    <path d="M25 -170 L55 -162 L25 -154 Z" fill="#ff5e5e" stroke="#7a1a1a" stroke-width="1"/>
    <circle cx="35" cy="-162" r="3" fill="#fff"/>
  </g>

  <!-- Reflejo en el agua -->
  <g transform="translate(200,320) scale(1,-0.4)" opacity="0.25">
    <path d="M-150 20 Q-140 70 -60 85 Q0 95 60 85 Q140 70 150 20 Q140 0 100 -5 Q0 10 -100 -5 Q-140 0 -150 20 Z"
          fill="#15202b"/>
  </g>

  <!-- Olas superpuestas delante del barco -->
  <path d="M0 300 Q50 290 100 300 T200 300 T300 300 T400 300 V400 H0 Z" fill="#0b2545" opacity="0.7"/>
  <path d="M0 330 Q60 320 120 330 T240 330 T360 330 T400 330 V400 H0 Z" fill="#071b33" opacity="0.8"/>
</svg>