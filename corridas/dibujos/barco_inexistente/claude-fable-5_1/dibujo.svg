<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1040"/>
      <stop offset="0.6" stop-color="#4a2c6e"/>
      <stop offset="1" stop-color="#b85c8a"/>
    </linearGradient>
    <linearGradient id="casco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fe0c5"/>
      <stop offset="1" stop-color="#0d6b63"/>
    </linearGradient>
    <linearGradient id="vela" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd6f2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8affec" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="luna" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7d0"/>
      <stop offset="0.7" stop-color="#ffe9a0"/>
      <stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brillo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#aefff0"/>
      <stop offset="1" stop-color="#aefff0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- cielo -->
  <rect width="400" height="400" fill="url(#cielo)"/>

  <!-- luna -->
  <circle cx="320" cy="75" r="55" fill="url(#luna)"/>
  <circle cx="320" cy="75" r="32" fill="#fff3c4"/>
  <circle cx="310" cy="68" r="6" fill="#f0dfa8"/>
  <circle cx="330" cy="85" r="4" fill="#f0dfa8"/>

  <!-- estrellas -->
  <g fill="#ffffff">
    <circle cx="40" cy="40" r="1.8"/>
    <circle cx="90" cy="70" r="1.2"/>
    <circle cx="150" cy="35" r="1.5"/>
    <circle cx="220" cy="55" r="1.2"/>
    <circle cx="60" cy="120" r="1.4"/>
    <circle cx="370" cy="150" r="1.5"/>
    <circle cx="200" cy="100" r="1"/>
    <circle cx="30" cy="200" r="1.3"/>
    <circle cx="380" cy="40" r="1.2"/>
    <circle cx="120" cy="150" r="1"/>
  </g>

  <!-- nubes bajo el barco (navega por el cielo) -->
  <g fill="#e8d8f5" opacity="0.5">
    <ellipse cx="80" cy="330" rx="70" ry="18"/>
    <ellipse cx="300" cy="350" rx="90" ry="20"/>
    <ellipse cx="180" cy="370" rx="100" ry="22"/>
  </g>

  <!-- estela de polvo estelar -->
  <g fill="#8affec">
    <circle cx="70" cy="290" r="2.5" opacity="0.8"/>
    <circle cx="50" cy="300" r="1.8" opacity="0.6"/>
    <circle cx="35" cy="285" r="1.3" opacity="0.5"/>
    <circle cx="85" cy="300" r="2" opacity="0.7"/>
    <circle cx="25" cy="298" r="1" opacity="0.4"/>
  </g>

  <!-- barco -->
  <g>
    <!-- casco con forma de pez-ballena -->
    <path d="M90 285 Q70 270 60 245 Q85 262 105 262 L300 262 Q330 262 345 245 Q345 285 310 300 Q260 318 180 312 Q120 307 90 285 Z"
          fill="url(#casco)" stroke="#0a4f49" stroke-width="3"/>
    <!-- cola de pez en la popa -->
    <path d="M345 245 Q370 225 380 200 Q375 235 385 260 Q360 255 340 262 Z"
          fill="url(#casco)" stroke="#0a4f49" stroke-width="3"/>
    <!-- escamas del casco -->
    <g fill="none" stroke="#7df5dd" stroke-width="2" opacity="0.7">
      <path d="M110 268 Q118 280 110 292"/>
      <path d="M140 268 Q148 282 140 298"/>
      <path d="M170 268 Q178 284 170 302"/>
      <path d="M200 268 Q208 284 200 304"/>
      <path d="M230 268 Q238 283 230 302"/>
      <path d="M260 268 Q268 281 260 298"/>
      <path d="M290 268 Q298 278 290 292"/>
    </g>
    <!-- ojo del barco en la proa -->
    <circle cx="92" cy="278" r="9" fill="#fff" />
    <circle cx="94" cy="279" r="4.5" fill="#1a1040"/>
    <circle cx="92" cy="276" r="1.5" fill="#fff"/>

    <!-- cubierta -->
    <rect x="100" y="254" width="220" height="10" rx="4" fill="#14897d" stroke="#0a4f49" stroke-width="2"/>

    <!-- mástil principal -->
    <rect x="196" y="105" width="8" height="152" rx="3" fill="#0d6b63"/>
    <!-- vela mayor: medusa luminosa -->
    <path d="M200 110 Q130 160 140 235 Q200 215 260 235 Q270 160 200 110 Z"
          fill="url(#vela)" stroke="#ffd6f2" stroke-width="2"/>
    <g stroke="#ffd6f2" stroke-width="2" fill="none" opacity="0.8">
      <path d="M160 238 Q155 252 162 262"/>
      <path d="M185 232 Q182 248 188 260"/>
      <path d="M215 232 Q218 248 212 260"/>
      <path d="M240 238 Q245 252 238 262"/>
    </g>
    <circle cx="200" cy="170" r="22" fill="url(#brillo)"/>

    <!-- mástil de proa -->
    <rect x="128" y="170" width="6" height="90" rx="3" fill="#0d6b63"/>
    <path d="M131 175 Q95 200 100 245 Q131 232 160 245 Q165 200 131 175 Z"
          fill="url(#vela)" stroke="#ffd6f2" stroke-width="2" opacity="0.9"/>

    <!-- mástil de popa -->
    <rect x="278" y="160" width="6" height="100" rx="3" fill="#0d6b63"/>
    <path d="M281 165 Q245 192 250 242 Q281 229 312 242 Q317 192 281 165 Z"
          fill="url(#vela)" stroke="#ffd6f2" stroke-width="2" opacity="0.9"/>

    <!-- farol colgante -->
    <line x1="200" y1="105" x2="200" y2="88" stroke="#0d6b63" stroke-width="3"/>
    <circle cx="200" cy="80" r="10" fill="#ffe17a" stroke="#c9a53a" stroke-width="2"/>
    <circle cx="200" cy="80" r="20" fill="url(#brillo)" opacity="0.6"/>

    <!-- banderín -->
    <path d="M200 88 L200 70 L235 78 L200 86 Z" fill="#ff6b9d"/>

    <!-- aletas laterales que reman en el aire -->
    <path d="M120 300 Q100 330 70 338 Q95 315 105 295 Z" fill="#3fe0c5" stroke="#0a4f49" stroke-width="2"/>
    <path d="M250 310 Q240 342 210 352 Q232 328 238 306 Z" fill="#3fe0c5" stroke="#0a4f49" stroke-width="2"/>

    <!-- burbujas-ojo de buey -->
    <g fill="#bffff2" stroke="#0a4f49" stroke-width="2">
      <circle cx="150" cy="282" r="6"/>
      <circle cx="210" cy="285" r="6"/>
      <circle cx="270" cy="282" r="6"/>
    </g>
  </g>

  <!-- peces voladores acompañando -->
  <g fill="#ff9ec4">
    <path d="M60 180 q10 -8 20 0 q-10 8 -20 0 Z"/>
    <path d="M62 180 l-10 -7 l3 7 l-3 7 Z"/>
    <path d="M340 300 q9 -7 18 0 q-9 7 -18 0 Z" opacity="0.8"/>
    <path d="M342 300 l-9 -6 l2.5 6 l-2.5 6 Z" opacity="0.8"/>
  </g>
</svg>