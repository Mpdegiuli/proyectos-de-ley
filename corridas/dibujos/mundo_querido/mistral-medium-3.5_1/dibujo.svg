<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F7FF"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </radialGradient>
    <filter id="cloud" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#sky)"/>

  <circle cx="350" cy="50" r="30" fill="url(#sun)"/>

  <g filter="url(#cloud)">
    <ellipse cx="100" cy="80" rx="40" ry="20" fill="white"/>
    <ellipse cx="120" cy="70" rx="30" ry="15" fill="white"/>
    <ellipse cx="80" cy="70" rx="25" ry="12" fill="white"/>
  </g>

  <g filter="url(#cloud)">
    <ellipse cx="250" cy="120" rx="35" ry="18" fill="white"/>
    <ellipse cx="270" cy="110" rx="25" ry="12" fill="white"/>
    <ellipse cx="230" cy="110" rx="20" ry="10" fill="white"/>
  </g>

  <path d="M0,300 Q100,250 200,280 Q300,300 400,250 L400,400 L0,400 Z" fill="#4CAF50"/>

  <path d="M0,350 Q50,320 100,340 Q150,360 200,330 Q250,300 300,340 Q350,370 400,340 L400,400 L0,400 Z" fill="#2E7D32"/>

  <circle cx="50" cy="320" r="15" fill="#FF5722"/>
  <circle cx="150" cy="310" r="12" fill="#FF5722"/>
  <circle cx="250" cy="330" r="10" fill="#FF5722"/>
  <circle cx="350" cy="325" r="14" fill="#FF5722"/>

  <rect x="180" y="200" width="40" height="100" fill="#795548"/>
  <polygon points="180,200 200,150 220,200" fill="#5D4037"/>
  <rect x="190" y="220" width="20" height="30" fill="#8D6E63"/>
  <circle cx="200" cy="240" r="5" fill="#FFD700"/>

  <path d="M300,250 Q320,230 340,250 Q360,270 380,250" stroke="#4CAF50" stroke-width="3" fill="none"/>
  <circle cx="340" cy="250" r="8" fill="#4CAF50"/>

  <path d="M50,280 Q70,260 90,280 Q110,300 130,280" stroke="#4CAF50" stroke-width="3" fill="none"/>
  <circle cx="90" cy="280" r="8" fill="#4CAF50"/>

  <rect x="320" y="220" width="60" height="40" fill="#FFEB3B" rx="5"/>
  <rect x="330" y="230" width="40" height="20" fill="#FFC107" rx="3"/>
  <circle cx="350" cy="240" r="3" fill="#FF9800"/>
</svg>