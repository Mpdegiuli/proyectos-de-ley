      <path d="M 260 110 Q 265 105 270 110 Q 275 105 280 110 Q 275 108 270 115 Q 265 108 260 110 Z"/>
      <path d="M 285 100 Q 288 96 291 100 Q 294 96 297 100 Q 294 98 291 103 Q 288 98 285 100 Z"/>
