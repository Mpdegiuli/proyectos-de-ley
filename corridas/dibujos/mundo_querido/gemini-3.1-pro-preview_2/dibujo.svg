<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050117"/>
      <stop offset="40%" stop-color="#0f0c29"/>
      <stop offset="100%" stop-color="#24133b"/>
    </linearGradient>
    
    <linearGradient id="skyGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="25%" stop-color="#fb8500"/>
      <stop offset="60%" stop-color="#219ebc"/>
      <stop offset="100%" stop-color="#023047"/>
    </linearGradient>
    
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="lotusGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f72585" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7209b7" stop-opacity="0.1"/>
    </linearGradient>

    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#ffe066" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fb8500" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="globeClip">
      <circle cx="200" cy="200" r="130"/>
    </clipPath>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <path d="M 20 30 h 1.5 v 1.5 h -1.5 Z M 80 50 h 1 v 1 h -1 Z M 150 20 h 2 v 2 h -2 Z M 300 40 h 1 v 1 h -1 Z M 350 90 h 2 v 2 h -2 Z M 380 150 h 1 v 1 h -1 Z M 40 180 h 2 v 2 h -2 Z M 20 280 h 1 v 1 h -1 Z M 80 350 h 1.5 v 1.5 h -1.5 Z M 150 380 h 1 v 1 h -1 Z M 300 360 h 2 v 2 h -2 Z M 360 300 h 1.5 v 1.5 h -1.5 Z M 380 220 h 1 v 1 h -1 Z M 100 120 h 1 v 1 h -1 Z M 280 80 h 1.5 v 1.5 h -1.5 Z M 330 180 h 1 v 1 h -1 Z M 50 100 h 2 v 2 h -2 Z M 120 40 h 1 v 1 h -1 Z M 250 20 h 1.5 v 1.5 h -1.5 Z M 10 130 h 1 v 1 h -1 Z M 380 60 h 1.5 v 1.5 h -1.5 Z" fill="#ffffff" opacity="0.8"/>

  <path d="M 10 100 L 80 50 L 150 120 L 220 40 L 300 90 L 390 60 M 10 300 L 90 350 L 150 280 L 250 360 L 330 290 L 390 340 M 80 50 L 90 350 M 300 90 L 250 360" fill="none" stroke="#4cc9f0" stroke-width="0.3" opacity="0.4"/>
  <g fill="#4cc9f0" filter="url(#glow)">
    <circle cx="80" cy="50" r="2"/>
    <circle cx="150" cy="120" r="1.5"/>
    <circle cx="300" cy="90" r="2.5"/>
    <circle cx="90" cy="350" r="2"/>
    <circle cx="250" cy="360" r="1.5"/>
    <circle cx="330" cy="290" r="2"/>
