      <line x1="145" y1="210" x2="151" y2="204"/>
      <line x1="145" y1="210" x2="145" y2="200"/>

      <line x1="325" y1="270" x2="325" y2="240"/>
      <line x1="325" y1="240" x2="317" y2="232"/>
      <line x1="325" y1="240" x2="333" y2="232"/>
