  <circle cx="200" cy="200" r="130" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
  <circle cx="200" cy="200" r="130" fill="none" stroke="#4cc9f0" stroke-width="5" opacity="0.7" filter="url(#glowSoft)"/>

  <g fill="url(#lotusGrad)" filter="url(#glow)">
    <path d="M 200 325 C 180 370 140 380 200 395 C 260 380 220 370 200 325 Z"/>
    <path d="M 155 305 C 120 335 90 355 140 380 C 165 380 180 365 200 375 C 170 355 165 330 155 305 Z"/>
    <path d="M 110 260 C 75 285 55 315 95 350 C 125 350 140 340 165 350 C 135 330 120 300 110 260 Z"/>
    <path d="M 245 305 C 280 335 310 355 260 380 C 235 380 220 365 200 375 C 230 355 235 330 245 305 Z"/>
    <path d="M 290 260 C 325 285 345 315 305 350 C 275 350 260 340 235 350 C 265 330 280 300 290 260 Z"/>
  </g>
</svg>