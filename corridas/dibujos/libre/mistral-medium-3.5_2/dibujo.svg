<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#42a5f5"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#ffeb3b"/>
      <stop offset="100%" stop-color="#ffc107"/>
    </radialGradient>
    <filter id="cloud" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="350" cy="80" r="40" fill="url(#sun)"/>
  <g filter="url(#cloud)">
    <ellipse cx="100" cy="100" rx="60" ry="30" fill="white" opacity="0.8"/>
    <ellipse cx="130" cy="90" rx="50" ry="25" fill="white" opacity="0.8"/>
    <ellipse cx="70" cy="90" rx="50" ry="25" fill="white" opacity="0.8"/>
  </g>
  <g filter="url(#cloud)">
    <ellipse cx="250" cy="150" rx="70" ry="35" fill="white" opacity="0.8"/>
    <ellipse cx="280" cy="140" rx="60" ry="30" fill="white" opacity="0.8"/>
    <ellipse cx="220" cy="140" rx="60" ry="30" fill="white" opacity="0.8"/>
  </g>
  <path d="M0,300 Q100,250 200,300 T400,300 L400,400 L0,400 Z" fill="#4caf50"/>
  <path d="M0,320 Q150,280 200,320 T400,320 L400,400 L0,400 Z" fill="#388e3c"/>
  <path d="M0,340 Q200,300 400,340 L400,400 L0,400 Z" fill="#2e7d32"/>
  <rect x="180" y="200" width="40" height="100" fill="#795548"/>
  <polygon points="180,200 200,150 220,200" fill="#5d4037"/>
  <rect x="200" y="250" width="20" height="20" fill="#ffeb3b"/>
  <circle cx="190" cy="220" r="5" fill="white"/>
  <circle cx="210" cy="220" r="5" fill="white"/>
  <circle cx="200" cy="230" r="5" fill="white"/>
  <path d="M190,240 Q200,245 210,240" stroke="black" stroke-width="2" fill="none"/>
  <circle cx="300" cy="300" r="20" fill="#ff9800"/>
  <circle cx="320" cy="280" r="15" fill="#ff9800"/>
  <circle cx="340" cy="300" r="15" fill="#ff9800"/>
  <circle cx="320" cy="320" r="15" fill="#ff9800"/>
</svg>