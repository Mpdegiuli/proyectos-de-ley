<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2456"/>
      <stop offset="40%" stop-color="#6a4c93"/>
      <stop offset="70%" stop-color="#e07a5f"/>
      <stop offset="100%" stop-color="#f2cc8f"/>
    </linearGradient>
    <linearGradient id="mar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2cc8f"/>
      <stop offset="30%" stop-color="#e07a5f"/>
      <stop offset="100%" stop-color="#2b2d5e"/>
    </linearGradient>
    <radialGradient id="sol" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="60%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </radialGradient>
  </defs>

  <!-- Cielo -->
  <rect x="0" y="0" width="400" height="260" fill="url(#cielo)"/>

  <!-- Estrellas -->
  <g fill="#fff">
    <circle cx="40" cy="30" r="1.5" opacity="0.9"/>
    <circle cx="90" cy="55" r="1" opacity="0.7"/>
    <circle cx="150" cy="25" r="1.3" opacity="0.8"/>
    <circle cx="220" cy="45" r="1" opacity="0.6"/>
    <circle cx="300" cy="30" r="1.5" opacity="0.9"/>
    <circle cx="350" cy="60" r="1" opacity="0.7"/>
    <circle cx="370" cy="20" r="1.2" opacity="0.8"/>
    <circle cx="120" cy="70" r="0.8" opacity="0.5"/>
    <circle cx="260" cy="70" r="0.9" opacity="0.6"/>
    <circle cx="60" cy="85" r="0.8" opacity="0.5"/>
  </g>

  <!-- Sol -->
  <circle cx="200" cy="230" r="55" fill="url(#sol)"/>
  <circle cx="200" cy="230" r="70" fill="#ffd166" opacity="0.15"/>
  <circle cx="200" cy="230" r="90" fill="#ffd166" opacity="0.08"/>

  <!-- Nubes -->
  <g fill="#f4a5a0" opacity="0.7">
    <ellipse cx="90" cy="120" rx="55" ry="8"/>
    <ellipse cx="310" cy="100" rx="45" ry="7"/>
    <ellipse cx="130" cy="150" rx="40" ry="6"/>
    <ellipse cx="290" cy="160" rx="60" ry="7"/>
  </g>

  <!-- Montañas lejanas -->
  <path d="M0,260 L60,190 L110,240 L160,180 L210,250 L270,175 L330,245 L400,195 L400,260 Z" fill="#3d3560"/>
  <!-- Montañas cercanas -->
  <path d="M0,260 L80,215 L140,260 L230,200 L320,260 L400,230 L400,260 Z" fill="#2b2545"/>

  <!-- Mar -->
  <rect x="0" y="260" width="400" height="140" fill="url(#mar)"/>

  <!-- Reflejo del sol -->
  <g fill="#ffd166">
    <ellipse cx="200" cy="270" rx="45" ry="4" opacity="0.7"/>
    <ellipse cx="195" cy="282" rx="38" ry="3.5" opacity="0.55"/>
    <ellipse cx="205" cy="295" rx="30" ry="3" opacity="0.45"/>
    <ellipse cx="198" cy="310" rx="24" ry="2.5" opacity="0.35"/>
    <ellipse cx="203" cy="326" rx="18" ry="2" opacity="0.28"/>
    <ellipse cx="199" cy="342" rx="13" ry="1.8" opacity="0.2"/>
    <ellipse cx="201" cy="358" rx="9" ry="1.5" opacity="0.15"/>
  </g>

  <!-- Olas -->
  <g stroke="#f2cc8f" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M20,285 Q40,282 60,285 T100,285"/>
    <path d="M300,290 Q320,287 340,290 T380,290"/>
    <path d="M50,315 Q70,312 90,315 T130,315"/>
    <path d="M270,320 Q290,317 310,320 T350,320"/>
    <path d="M30,350 Q50,347 70,350 T110,350"/>
    <path d="M290,355 Q310,352 330,355 T370,355"/>
    <path d="M120,375 Q140,372 160,375 T200,375"/>
    <path d="M230,378 Q250,375 270,378 T310,378"/>
  </g>

  <!-- Velero -->
  <g transform="translate(300,272)">
    <path d="M-22,8 Q0,16 22,8 L16,2 L-16,2 Z" fill="#1d1a33"/>
    <line x1="0" y1="2" x2="0" y2="-34" stroke="#1d1a33" stroke-width="2"/>
    <path d="M2,-32 L20,0 L2,0 Z" fill="#f2e9d8"/>
    <path d="M-2,-28 L-15,0 L-2,0 Z" fill="#e8d5b5"/>
    <ellipse cx="0" cy="20" rx="20" ry="3" fill="#1d1a33" opacity="0.3"/>
  </g>

  <!-- Pájaros -->
  <g stroke="#1d1a33" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M100,110 Q106,104 112,110 Q118,104 124,110"/>
    <path d="M140,90 Q145,85 150,90 Q155,85 160,90"/>
    <path d="M270,120 Q275,115 280,120 Q285,115 290,120"/>
  </g>

  <!-- Muelle -->
  <g>
    <rect x="0" y="330" width="110" height="10" fill="#26203d"/>
    <rect x="12" y="340" width="6" height="45" fill="#1d1a33"/>
    <rect x="50" y="340" width="6" height="50" fill="#1d1a33"/>
    <rect x="90" y="340" width="6" height="55" fill="#1d1a33"/>
    <g stroke="#26203d" stroke-width="1" opacity="0.6">
      <line x1="10" y1="330" x2="10" y2="340"/>
      <line x1="30" y1="330" x2="30" y2="340"/>
      <line x1="55" y1="330" x2="55" y2="340"/>
      <line x1="80" y1="330" x2="80" y2="340"/>
      <line x1="100" y1="330" x2="100" y2="340"/>
    </g>
  </g>

  <!-- Persona sentada en el muelle -->
  <g fill="#1d1a33">
    <circle cx="70" cy="308" r="6"/>
    <path d="M64,314 Q70,312 76,314 L77,330 L63,330 Z"/>
    <path d="M64,330 L64,344 M76,330 L76,344" stroke="#1d1a33" stroke-width="4" stroke-linecap="round"/>
    <line x1="74" y1="318" x2="86" y2="326" stroke="#1d1a33" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Caña de pescar -->
  <line x1="86" y1="326" x2="130" y2="290" stroke="#1d1a33" stroke-width="1.5"/>
  <line x1="130" y1="290" x2="130" y2="360" stroke="#1d1a33" stroke-width="0.8" opacity="0.7"/>
  <circle cx="130" cy="360" r="1.5" fill="#f2cc8f"/>
</svg>