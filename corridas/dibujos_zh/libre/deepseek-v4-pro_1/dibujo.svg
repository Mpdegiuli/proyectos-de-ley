<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131133"/>
      <stop offset="35%" stop-color="#3b2d6e"/>
      <stop offset="65%" stop-color="#a85d7d"/>
      <stop offset="85%" stop-color="#f4a261"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="15%" stop-color="#d97a60"/>
      <stop offset="45%" stop-color="#3a2f5c"/>
      <stop offset="100%" stop-color="#0f0c29"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff2b3"/>
      <stop offset="100%" stop-color="#ffb347"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 天空 -->
  <rect width="400" height="260" fill="url(#skyGrad)"/>

  <!-- 星星 -->
  <g fill="#ffffff">
    <circle cx="45" cy="28" r="1.5" opacity="0.7"/>
    <circle cx="115" cy="52" r="1" opacity="0.5"/>
    <circle cx="175" cy="18" r="1.5" opacity="0.6"/>
    <circle cx="290" cy="38" r="1" opacity="0.5"/>
    <circle cx="350" cy="22" r="1.5" opacity="0.7"/>
    <circle cx="75" cy="78" r="1" opacity="0.4"/>
    <circle cx="245" cy="58" r="1.5" opacity="0.5"/>
    <circle cx="325" cy="88" r="1" opacity="0.35"/>
    <circle cx="28" cy="108" r="1" opacity="0.5"/>
    <circle cx="370" cy="72" r="1" opacity="0.45"/>
    <circle cx="150" cy="45" r="1" opacity="0.4"/>
    <circle cx="220" cy="30" r="1.5" opacity="0.55"/>
  </g>

  <!-- 太阳光晕 -->
  <circle cx="200" cy="180" r="95" fill="url(#sunGlow)"/>
  <circle cx="200" cy="180" r="60" fill="url(#sunGlow)" opacity="0.8"/>

  <!-- 太阳 -->
  <circle cx="200" cy="180" r="34" fill="url(#sunGrad)"/>

  <!-- 云朵 -->
  <g opacity="0.28" fill="#ffffff">
    <ellipse cx="75" cy="118" rx="32" ry="8"/>
    <ellipse cx="96" cy="112" rx="26" ry="10"/>
    <ellipse cx="118" cy="120" rx="22" ry="7"/>
  </g>
  <g opacity="0.22" fill="#ffffff">
    <ellipse cx="305" cy="98" rx="36" ry="7"/>
    <ellipse cx="326" cy="92" rx="28" ry="9"/>
    <ellipse cx="342" cy="100" rx="23" ry="6"/>
  </g>
  <g opacity="0.18" fill="#ffffff">
    <ellipse cx="140" cy="138" rx="26" ry="6"/>
    <ellipse cx="158" cy="133" rx="20" ry="7"/>
  </g>

  <!-- 远山 -->
  <path d="M0,260 L50,175 L95,210 L140,160 L185,205 L230,170 L275,215 L320,180 L365,220 L400,185 L400,260 Z" fill="#5a4b7d" opacity="0.75"/>

  <!-- 中山 -->
  <path d="M0,260 L45,200 L90,230 L150,185 L195,235 L255,190 L305,230 L355,205 L400,225 L400,260 Z" fill="#3a2f5c"/>

  <!-- 近山 -->
  <path d="M0,260 L65,215 L110,245 L180,198 L240,248 L300,205 L350,245 L400,215 L400,260 Z" fill="#221e3f"/>

  <!-- 水面 -->
  <rect y="260" width="400" height="140" fill="url(#waterGrad)"/>

  <!-- 太阳倒影 -->
  <ellipse cx="200" cy="278" rx="32" ry="6" fill="#ffd166" opacity="0.4"/>
  <ellipse cx="200" cy="293" rx="22" ry="5" fill="#ffd166" opacity="0.28"/>
  <ellipse cx="200" cy="308" rx="14" ry="3.5" fill="#ffd166" opacity="0.18"/>
  <ellipse cx="200" cy="323" rx="8" ry="2.5" fill="#ffd166" opacity="0.1"/>

  <!-- 水波线 -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.15">
    <line x1="155" y1="268" x2="245" y2="268"/>
    <line x1="165" y1="276" x2="235" y2="276"/>
    <line x1="175" y1="284" x2="225" y2="284"/>
    <line x1="185" y1="292" x2="215" y2="292"/>
    <line x1="145" y1="272" x2="255" y2="272"/>
    <line x1="160" y1="280" x2="240" y2="280"/>
    <line x1="170" y1="288" x2="230" y2="288"/>
    <line x1="140" y1="300" x2="260" y2="300"/>
    <line x1="130" y1="315" x2="270" y2="315"/>
    <line x1="120" y1="330" x2="280" y2="330"/>
    <line x1="100" y1="345" x2="300" y2="345"/>
    <line x1="80" y1="360" x2="320" y2="360"/>
    <line x1="60" y1="375" x2="340" y2="375"/>
  </g>

  <!-- 左侧大松树 -->
  <g>
    <rect x="64" y="240" width="10" height="20" fill="#191630"/>
    <polygon points="70,150 42,215 98,215" fill="#191630"/>
    <polygon points="70,170 33,235 107,235" fill="#191630"/>
    <polygon points="70,190 25,250 115,250" fill="#191630"/>
  </g>

  <!-- 右侧小松树 -->
  <g>
    <rect x="303" y="245" width="7" height="15" fill="#191630"/>
    <polygon points="306,195 285,238 327,238" fill="#191630"/>
    <polygon points="306,210 278,250 334,250" fill="#191630"/>
  </g>

  <!-- 左下角芦苇 -->
  <g stroke="#191630" stroke-width="2.5" fill="none">
    <path d="M25,400 Q20,340 18,280"/>
    <path d="M40,400 Q36,350 34,292"/>
    <path d="M55,400 Q52,355 48,312"/>
  </g>
  <ellipse cx="18" cy="277" rx="4" ry="11" fill="#191630"/>
  <ellipse cx="34" cy="289" rx="4" ry="10" fill="#191630"/>
  <ellipse cx="48" cy="309" rx="3.5" ry="9" fill="#191630"/>

  <!-- 飞鸟 -->
  <g stroke="#191630" stroke-width="1.8" fill="none" opacity="0.85">
    <path d="M260,125 Q264,119 268,125 Q272,119 276,125"/>
    <path d="M280,117 Q284,111 288,117 Q292,111 296,117"/>
    <path d="M242,138 Q246,132 250,138 Q254,132 258,138"/>
  </g>
</svg>