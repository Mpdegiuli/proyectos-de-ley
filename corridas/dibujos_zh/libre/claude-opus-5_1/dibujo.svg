<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a1c"/>
      <stop offset="35%" stop-color="#1b2352"/>
      <stop offset="65%" stop-color="#6b3b6b"/>
      <stop offset="85%" stop-color="#d9684f"/>
      <stop offset="100%" stop-color="#f6a95f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e08a5a"/>
      <stop offset="12%" stop-color="#5b3b64"/>
      <stop offset="50%" stop-color="#16204a"/>
      <stop offset="100%" stop-color="#070b20"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0%" stop-color="#fff6d8" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#ffe6a8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffe6a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow">
      <stop offset="0%" stop-color="#fff8c9" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ffd76a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff3c0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff3c0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="towerClip">
      <polygon points="57,220 98,220 90,128 65,128"/>
    </clipPath>
    <clipPath id="seaClip">
      <rect x="0" y="250" width="400" height="150"/>
    </clipPath>
  </defs>

  <!-- sky -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="35" cy="28" r="1.4" opacity=".9"/>
    <circle cx="80" cy="60" r="1" opacity=".7"/>
    <circle cx="120" cy="25" r="1.6" opacity=".85"/>
    <circle cx="165" cy="70" r="1" opacity=".6"/>
    <circle cx="200" cy="35" r="1.3" opacity=".8"/>
    <circle cx="245" cy="18" r="1" opacity=".7"/>
    <circle cx="275" cy="55" r="1.5" opacity=".75"/>
    <circle cx="330" cy="30" r="1.1" opacity=".8"/>
    <circle cx="370" cy="62" r="1.3" opacity=".7"/>
    <circle cx="58" cy="100" r="1" opacity=".5"/>
    <circle cx="150" cy="110" r="1.2" opacity=".55"/>
    <circle cx="225" cy="95" r="1" opacity=".5"/>
    <circle cx="300" cy="120" r="1" opacity=".45"/>
    <circle cx="385" cy="15" r="1" opacity=".6"/>
    <circle cx="15" cy="70" r="1.1" opacity=".6"/>
  </g>

  <!-- moon -->
  <circle cx="312" cy="78" r="46" fill="url(#moonGlow)"/>
  <circle cx="312" cy="78" r="18" fill="#fdf3d4"/>
  <circle cx="306" cy="72" r="3.4" fill="#e9dcb8" opacity=".7"/>
  <circle cx="317" cy="85" r="2.4" fill="#e9dcb8" opacity=".6"/>
  <circle cx="318" cy="69" r="1.6" fill="#e9dcb8" opacity=".5"/>

  <!-- distant clouds -->
  <g fill="#3a2a4e" opacity=".55">
    <ellipse cx="120" cy="175" rx="70" ry="9"/>
    <ellipse cx="300" cy="200" rx="85" ry="8"/>
    <ellipse cx="60" cy="205" rx="55" ry="6"/>
  </g>

  <!-- distant headland -->
  <path d="M400 250 L400 232 Q370 222 345 232 Q320 240 295 250 Z" fill="#241b3a" opacity=".85"/>

  <!-- sea -->
  <rect x="0" y="250" width="400" height="150" fill="url(#sea)"/>

  <!-- moon reflection -->
  <g clip-path="url(#seaClip)" fill="#ffe9b4">
    <ellipse cx="312" cy="262" rx="14" ry="1.6" opacity=".35"/>
    <ellipse cx="309" cy="274" rx="20" ry="1.8" opacity=".28"/>
    <ellipse cx="314" cy="288" rx="16" ry="2" opacity=".22"/>
    <ellipse cx="308" cy="304" rx="24" ry="2.2" opacity=".16"/>
    <ellipse cx="315" cy="322" rx="18" ry="2.4" opacity=".12"/>
  </g>

  <!-- waves -->
  <g stroke="#9fb6d8" fill="none" opacity=".35" stroke-linecap="round">
    <path d="M20 268 q10 -4 20 0 t20 0" stroke-width="1.2"/>
    <path d="M110 280 q12 -4 24 0 t24 0" stroke-width="1.3"/>
    <path d="M200 300 q14 -5 28 0 t28 0" stroke-width="1.4"/>
    <path d="M40 320 q16 -5 32 0 t32 0" stroke-width="1.6"/>
    <path d="M250 345 q18 -6 36 0 t36 0" stroke-width="1.8"/>
    <path d="M60 370 q20 -6 40 0 t40 0" stroke-width="2"/>
    <path d="M280 385 q20 -6 40 0" stroke-width="2"/>
  </g>

  <!-- light beams -->
  <polygon points="77,118 400,42 400,128" fill="url(#beam)" opacity=".5"/>
  <polygon points="77,118 400,168 400,246" fill="url(#beam)" opacity=".3"/>

  <!-- cliff -->
  <path d="M0 400 L0 236 Q22 224 46 232 Q70 216 104 228 Q128 238 140 262 Q150 300 130 400 Z" fill="#1a1428"/>
  <path d="M0 400 L0 236 Q22 224 46 232 Q70 216 104 228 Q116 233 126 246 Q100 258 70 300 Q46 350 44 400 Z" fill="#241c36"/>
  <path d="M12 246 q18 -8 36 -2 q-16 6 -36 2 Z" fill="#3b2f52" opacity=".8"/>

  <!-- lighthouse -->
  <g>
    <polygon points="57,220 98,220 90,128 65,128" fill="#f3ece0"/>
    <g clip-path="url(#towerClip)">
      <rect x="50" y="134" width="60" height="16" fill="#c0453c"/>
      <rect x="50" y="166" width="60" height="16" fill="#c0453c"/>
      <rect x="50" y="198" width="60" height="16" fill="#c0453c"/>
      <polygon points="80,120 110,120 110,225 80,225" fill="#000" opacity=".16"/>
    </g>
    <rect x="53" y="216" width="49" height="8" rx="2" fill="#2e2540"/>
    <rect x="60" y="124" width="35" height="6" rx="2" fill="#2e2540"/>
    <rect x="65" y="105" width="25" height="20" fill="#3a3050"/>
    <rect x="68" y="108" width="19" height="14" fill="#ffe9a0"/>
    <polygon points="61,105 94,105 77.5,86" fill="#c0453c"/>
    <circle cx="77.5" cy="83" r="2.4" fill="#2e2540"/>
    <rect x="68" y="196" width="8" height="12" rx="3" fill="#2e2540"/>
    <rect x="72" y="150" width="6" height="8" rx="2" fill="#2e2540" opacity=".8"/>
    <circle cx="77" cy="116" r="26" fill="url(#lampGlow)"/>
  </g>

  <!-- birds -->
  <g stroke="#1a1428" fill="none" stroke-width="1.6" stroke-linecap="round" opacity=".8">
    <path d="M190 120 q6 -6 12 0 q6 -6 12 0"/>
    <path d="M225 140 q5 -5 10 0 q5 -5 10 0"/>
    <path d="M205 160 q4 -4 8 0 q4 -4 8 0"/>
  </g>

  <!-- vignette -->
  <rect width="400" height="400" fill="none" stroke="#000" stroke-width="10" opacity=".18"/>
</svg>