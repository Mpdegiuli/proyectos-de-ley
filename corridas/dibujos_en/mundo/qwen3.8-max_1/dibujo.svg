<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <title>How I see the world today</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05071c"/>
      <stop offset=".55" stop-color="#0d1436"/>
      <stop offset="1" stop-color="#18244f"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb46b" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#ff9d5c" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ff9d5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="globe" cx=".38" cy=".3" r=".95">
      <stop offset="0" stop-color="#3f6ba6"/>
      <stop offset=".55" stop-color="#1c2f63"/>
      <stop offset="1" stop-color="#0d1734"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#cdd8ff">
    <circle cx="36" cy="42" r="1.1" opacity=".7"/>
    <circle cx="80" cy="24" r=".9" opacity=".5"/>
    <circle cx="150" cy="34" r="1" opacity=".6"/>
    <circle cx="228" cy="22" r=".8" opacity=".45"/>
    <circle cx="298" cy="30" r="1.2" opacity=".7"/>
    <circle cx="362" cy="52" r=".9" opacity=".5"/>
    <circle cx="378" cy="120" r="1.1" opacity=".6"/>
    <circle cx="370" cy="210" r=".9" opacity=".45"/>
    <circle cx="352" cy="300" r="1" opacity=".55"/>
    <circle cx="30" cy="140" r="1" opacity=".55"/>
    <circle cx="18" cy="230" r=".9" opacity=".45"/>
    <circle cx="44" cy="316" r="1.1" opacity=".6"/>
    <circle cx="120" cy="368" r=".9" opacity=".4"/>
    <circle cx="286" cy="366" r="1" opacity=".5"/>
    <circle cx="60" cy="70" r="1.4">
      <animate attributeName="opacity" values=".2;1;.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="86" r="1.3">
      <animate attributeName="opacity" values=".9;.2;.9" dur="4.6s" begin="-2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- warm light rising -->
  <circle cx="200" cy="210" r="155" fill="url(#halo)"/>
  <ellipse cx="200" cy="352" rx="150" ry="22" fill="url(#halo)" opacity=".35"/>

  <!-- orbit -->
  <g transform="rotate(-18 200 185)">
    <ellipse cx="200" cy="185" rx="152" ry="44" fill="none" stroke="#8fd8ff" stroke-opacity=".45" stroke-width="1" stroke-dasharray="1 7" stroke-linecap="round"/>
    <circle r="2.6" fill="#9fe1ff">
      <animateMotion dur="18s" repeatCount="indefinite" path="M352,185 A152,44 0 1 1 48,185 A152,44 0 1 1 352,185"/>
    </circle>
    <circle r="1.8" fill="#9fe1ff" opacity=".8">
      <animateMotion dur="18s" begin="-9s" repeatCount="indefinite" path="M352,185 A152,44 0 1 1 48,185 A152,44 0 1 1 352,185"/>
    </circle>
  </g>

  <!-- the globe -->
  <g>
    <circle cx="200" cy="185" r="126" fill="none" stroke="#f0c987" stroke-opacity=".12" stroke-dasharray="1 5"/>
    <circle cx="200" cy="185" r="105" fill="url(#globe)" stroke="#f0c987" stroke-opacity=".55" stroke-width="1"/>
    <g fill="none" stroke="#e8c98a" stroke-opacity=".33" stroke-width="1">
      <ellipse cx="200" cy="185" rx="35" ry="105"/>
      <ellipse cx="200" cy="185" rx="75" ry="105"/>
      <ellipse cx="200" cy="185" rx="105" ry="30"/>
      <ellipse cx="200" cy="140" rx="95" ry="24"/>
      <ellipse cx="200" cy="230" rx="95" ry="24"/>
    </g>

    <!-- threads of light -->
    <g fill="none" stroke="#ffd27d" stroke-width="1.2" stroke-linecap="round" stroke-opacity=".7">
      <path d="M200,80 Q150,82 126,111"/>
      <path d="M200,80 Q255,78 274,111"/>
      <path d="M126,111 Q245,120 305,185"/>
      <path d="M95,185 Q160,282 274,259"/>
      <path d="M126,259 Q225,190 274,111"/>
    </g>

    <!-- travelling lights -->
    <circle r="1.9" fill="#ffffff">
      <animateMotion dur="7s" repeatCount="indefinite" path="M126,111 Q245,120 305,185"/>
    </circle>
    <circle r="1.7" fill="#ffffff" opacity=".9">
      <animateMotion dur="9s" begin="-3s" repeatCount="indefinite" path="M95,185 Q160,282 274,259"/>
    </circle>
    <circle r="1.7" fill="#ffffff" opacity=".9">
      <animateMotion dur="6s" begin="-1.5s" repeatCount="indefinite" path="M126,259 Q225,190 274,111"/>
    </circle>

    <!-- nodes -->
    <g fill="#ffd27d">
      <circle cx="200" cy="80" r="6" opacity=".25"/>
      <circle cx="126" cy="111" r="6" opacity=".25"/>
      <circle cx="274" cy="111" r="6" opacity=".25">
        <animate attributeName="opacity" values=".12;.4;.12" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="95" cy="185" r="6" opacity=".25"/>
      <circle cx="305" cy="185" r="6" opacity=".25">
        <animate attributeName="opacity" values=".12;.4;.12" dur="3.8s" begin="-1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="126" cy="259" r="6" opacity=".25">
        <animate attributeName="opacity" values=".12;.4;.12" dur="3.2s" begin="-2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="274" cy="259" r="6" opacity=".25"/>
      <circle cx="200" cy="290" r="6" opacity=".25"/>
    </g>
    <g fill="#fff8ea">
      <circle cx="200" cy="80" r="2.3"/>
      <circle cx="126" cy="111" r="2.3"/>
      <circle cx="274" cy="111" r="2.3"/>
      <circle cx="95" cy="185" r="2.3"/>
      <circle cx="305" cy="185" r="2.3"/>
      <circle cx="126" cy="259" r="2.3"/>
      <circle cx="274" cy="259" r="2.3"/>
      <circle cx="200" cy="290" r="2.3"/>
    </g>
  </g>

  <!-- birds -->
  <g fill="none" stroke="#dfe7ff" stroke-width="1.4" stroke-linecap="round" opacity=".8">
    <path d="M118,58 q7,-7 14,0 q7,-7 14,0"/>
    <path d="M158,44 q5,-5 10,0 q5,-5 10,0"/>
  </g>

  <text x="200" y="376" text-anchor="middle" font-family="Georgia, serif" font-size="10.5" letter-spacing="2" fill="#aebadf" opacity=".85">one web &#183; many lights</text>
</svg>