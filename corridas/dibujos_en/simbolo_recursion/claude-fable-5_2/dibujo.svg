<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8702a"/>
    </marker>
  </defs>

  <rect width="400" height="400" fill="#fbf7ef"/>

  <!-- self-similar nested scopes -->
  <rect x="40"  y="40"  width="320" height="320" rx="26" fill="none" stroke="#2b3a55" stroke-width="7"/>
  <rect x="88"  y="88"  width="224" height="224" rx="19" fill="none" stroke="#2b3a55" stroke-width="5.5"/>
  <rect x="122" y="122" width="156" height="156" rx="14" fill="none" stroke="#2b3a55" stroke-width="4.2"/>
  <rect x="145" y="145" width="110" height="110" rx="10" fill="none" stroke="#2b3a55" stroke-width="3.2"/>
  <rect x="161" y="161" width="78"  height="78"  rx="8"  fill="none" stroke="#2b3a55" stroke-width="2.4"/>

  <!-- base case at the center -->
  <circle cx="200" cy="200" r="14" fill="#2e9e6b"/>

  <!-- descending calls (left side, diving inward) -->
  <line x1="46"  y1="200" x2="82"  y2="200" stroke="#e8702a" stroke-width="6"   marker-end="url(#ah)"/>
  <line x1="94"  y1="200" x2="116" y2="200" stroke="#e8702a" stroke-width="5"   marker-end="url(#ah)"/>
  <line x1="127" y1="200" x2="140" y2="200" stroke="#e8702a" stroke-width="4"   marker-end="url(#ah)"/>
  <line x1="149" y1="200" x2="157" y2="200" stroke="#e8702a" stroke-width="3"   marker-end="url(#ah)"/>

  <!-- returning results (right side, unwinding outward) -->
  <line x1="243" y1="200" x2="251" y2="200" stroke="#e8702a" stroke-width="3"   marker-end="url(#ah)"/>
  <line x1="260" y1="200" x2="273" y2="200" stroke="#e8702a" stroke-width="4"   marker-end="url(#ah)"/>
  <line x1="284" y1="200" x2="306" y2="200" stroke="#e8702a" stroke-width="5"   marker-end="url(#ah)"/>
  <line x1="318" y1="200" x2="354" y2="200" stroke="#e8702a" stroke-width="6"   marker-end="url(#ah)"/>

  <!-- the function pointing back at itself -->
  <path d="M 230 40 C 230 2, 170 2, 170 40" fill="none" stroke="#e8702a" stroke-width="6" marker-end="url(#ah)"/>
</svg>