<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#f4f1e8"/>
  
  <!-- Nested recursive squares with spiraling arrows -->
  <g fill="none" stroke="#2a3d5c" stroke-width="3">
    <rect x="40" y="40" width="320" height="320" rx="8"/>
    <rect x="80" y="80" width="240" height="240" rx="8" opacity="0.85"/>
    <rect x="120" y="120" width="160" height="160" rx="8" opacity="0.7"/>
    <rect x="160" y="160" width="80" height="80" rx="8" opacity="0.55"/>
    <rect x="190" y="190" width="20" height="20" rx="4" opacity="0.4" fill="#2a3d5c"/>
  </g>
  
  <!-- Curved arrow spiraling inward showing recursion -->
  <g fill="none" stroke="#c0392b" stroke-width="5" stroke-linecap="round">
    <path d="M 60 30 Q 370 30 370 200 Q 370 370 200 370 Q 60 370 60 220 Q 60 110 180 110 Q 290 110 290 210 Q 290 290 210 290 Q 150 290 150 230 Q 150 190 200 190" 
          marker-end="url(#arrow)"/>
  </g>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>
  
  <!-- Small self-reference dots -->
  <g fill="#2a3d5c">
    <circle cx="200" cy="200" r="4"/>
  </g>
</svg>