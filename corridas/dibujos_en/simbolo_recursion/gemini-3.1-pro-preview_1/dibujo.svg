<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
    <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40,0 L 0,0 L 0,40" fill="none" stroke="#21262d" stroke-width="1" />
        </pattern>

        <marker id="arrow" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="3" markerHeight="3" orient="auto">
            <path d="M 2,2 L 12,7 L 2,12 Z" fill="#3fb950" />
        </marker>

        <g id="base-case">
            <rect x="20" y="20" width="360" height="360" rx="24" fill="#161b22" stroke="#d2a8ff" stroke-width="8"/>
            <circle cx="70" cy="70" r="16" fill="#d2a8ff" />
            <line x1="120" y1="70" x2="300" y2="70" stroke="#d2a8ff" stroke-width="16" stroke-linecap="round" />
            <line x1="120" y1="110" x2="230" y2="110" stroke="#8b949e" stroke-width="12" stroke-linecap="round" />
        </g>

        <g id="recursive-step">
            <rect x="20" y="20" width="360" height="360" rx="24" fill="#161b22" stroke="#58a6ff" stroke-width="8"/>
            
            <g stroke="#ff7b72" stroke-width="4" stroke-linecap="round">
                <line x1="70" y1="50" x2="45" y2="85" />
                <line x1="70" y1="50" x2="95" y2="85" />
                <circle cx="70" cy="50" r="8" fill="#161b22" />
                <circle cx="45" cy="85" r="8" fill="#161b22" />
                <circle cx="95" cy="85" r="8" fill="#16