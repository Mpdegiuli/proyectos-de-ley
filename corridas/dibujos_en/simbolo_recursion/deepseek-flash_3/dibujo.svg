<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="62%">
      <stop offset="0" stop-color="#132741"/>
      <stop offset="1" stop-color="#070d18"/>
    </radialGradient>
    <linearGradient id="ring" x1="40" y1="40" x2="360" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="b0" fill="none"><line x1="0" y1="0" x2="0" y2="-1"/></g>
    <g id="b1" fill="none"><use xlink:href="#b0"/><g transform="translate(0,-1) rotate(-32) scale(.72)"><use xlink:href="#b0"/></g><g transform="translate(0,-1) rotate(32) scale(.72)"><use xlink:href="#b0"/></g></g>
    <g id="b2" fill="none"><use xlink:href="#b0"/><g transform="translate(0,-1) rotate(-32) scale(.72)"><use xlink:href="#b1"/></g><g transform="translate(0,-1) rotate(32) scale(.72)"><use xlink:href="#b1"/></g></g>
    <g id="b3" fill="none"><use xlink:href="#b0"/><g transform="translate(0,-1) rotate(-32) scale(.72)"><use xlink:href="#b2"/></g><g transform="translate(0,-1) rotate(32) scale(.72)"><use xlink:href="#b2"/></g></g>
    <g id="b4" fill="none"><use xlink:href="#b0"/><g transform="translate(0,-1) rotate(-32) scale(.72)"><use xlink:href="#b3"/></g><g transform="translate(0,-1) rotate(32) scale(.72)"><use xlink:href="#b3"/></g></g>
    <g id="b5" fill="none"><use xlink:href="#b0"/><g transform="translate(0,-1) rotate(-32) scale(.72)"><use xlink:href="#b4"/></g><g transform="translate(0,-1) rotate(32) scale(.72)"><use xlink:href="#b4"/></g></g>
    <g id="b6" fill="none"><use xlink:href="#b0"/><g transform="translate(0,-1) rotate(-32) scale(.72)"><use xlink:href="#b5"/></g><g transform="translate(0,-1) rotate(32) scale(.72)"><use xlink:href="#b5"/></g></g>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#glow)" stroke="#5eead4" stroke-width="0.13" stroke-linecap="round" transform="translate(200,334) scale(64)">
    <use xlink:href="#b6"/>
  </g>
  <circle cx="200" cy="334" r="5" fill="#5eead4" filter="url(#glow)"/>

  <path d="M229.87 30.61 A172 172 0 1 1 114 51.04" fill="none" stroke="url(#ring)" stroke-width="5" stroke-linecap="round"/>
  <path d="M126.99 43.54 L113.8 62.7 L103.8 45.4 Z" fill="#c084fc"/>
