<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#1a1a2e"/>
  
  <!-- Recursive spiral made of nested arrows pointing inward -->
  
  <!-- Outermost ring arrow - circular arrow suggesting recursion -->
  <g transform="translate(200,200)">
    <!-- Large circular arrow -->
    <path d="M 0,-140 A 140,140 0 1,1 -99,-99" 
          fill="none" stroke="#4fc3f7" stroke-width="6" stroke-linecap="round"/>
    <!-- Arrowhead for large circle -->
    <polygon points="-99,-99 -120,-70 -78,-68" fill="#4fc3f7"/>
    
    <!-- Medium circular arrow -->
    <path d="M 0,-95 A 95,95 0 1,1 -67,-67" 
          fill="none" stroke="#29b6f6" stroke-width="5" stroke-linecap="round"/>
    <!-- Arrowhead for medium circle -->
    <polygon points="-67,-67 -82,-46 -52,-44" fill="#29b6f6"/>
    
    <!-- Small circular arrow -->
    <path d="M 0,-55 A 55,55 0 1,1 -39,-39" 
          fill="none" stroke="#0288d1" stroke-width="4" stroke-linecap="round"/>
    <!-- Arrowhead for small circle -->
    <polygon points="-39,-39 -48,-26 -30,-24" fill="#0288d1"/>
    
    <!-- Smaller circular arrow -->
    <path d="M 0,-28 A 28,28 0 1,1 -20,-20" 
          fill="none" stroke="#01579b" stroke-width="3" stroke-linecap="round"/>
    <!-- Arrowhead for smaller circle -->
    <polygon points="-20,-20 -24,-13 -15,-12" fill="#01579b"/>
    
    <!-- Tiny dot at center -->
    <circle cx="0" cy="0" r="5" fill="#4fc3f7"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
  
  <!-- Function calling itself - stack frames visual -->
  <!-- Left side: stacked boxes suggesting call stack -->
  <g transform="translate(30, 100)">
    <!-- Stack frame 1 (bottom) -->
    <rect x="0" y="120" width="60" height="30" rx="3" fill="none" stroke="#4fc3f7" stroke-width="2" opacity="0.4"/>
    <!-- Stack frame 2 -->
    <rect x="5" y="82" width="60" height="30" rx="3" fill="none" stroke="#4fc3f7" stroke-width="2" opacity="0.6"/>
    <!-- Stack frame 3 -->
    <rect x="10" y="44" width="60" height="30" rx="3" fill="none" stroke="#4fc3f7" stroke-width="2" opacity="0.8"/>
    <!-- Stack frame 4 (top) -->
    <rect x="15" y="6" width="60" height="30" rx="3" fill="none" stroke="#4fc3f7" stroke-width="2" opacity="1.0"/>
    
    <!-- Arrows between frames -->
    <line x1="45" y1="36" x2="35" y2="44" stroke="#4fc3f7" stroke-width="1.5" opacity="0.7"/>
    <line x1="40" y1="74" x2="30" y2="82" stroke="#4fc3f7" stroke-width="1.5" opacity="0.6"/>
    <line x1="35" y1="112" x2="25" y2="120" stroke="#4fc3f7" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Right side: mirror stack frames (unwinding) -->
  <g transform="translate(305, 100)">
    <rect x="0" y="120" width="60" height="30" rx="3" fill="none" stroke="#f48fb1" stroke-width="2" opacity="0.4"/>
    <rect x="-5" y="82" width="60" height="30" rx="3" fill="none" stroke="#f48fb1" stroke-width="2" opacity="0.6"/>
    <rect x="-10" y="44" width="60" height="30" rx="3" fill="none" stroke="#f48fb1" stroke-width="2" opacity="0.8"/>
    <rect x="-15" y="6" width="60" height="30" rx="3" fill="none" stroke="#f48fb1" stroke-width="2" opacity="1.0"/>
    
    <!-- Return arrows -->
    <line x1="20" y1="36" x2="30" y2="44" stroke="#f48fb1" stroke-width="1.5" opacity="0.7"/>
    <line x1="25" y1="74" x2="35" y2="82" stroke="#f48fb1" stroke-width="1.5" opacity="0.6"/>
    <line x1="30" y1="112" x2="40" y2="120" stroke="#f48fb1" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Bottom: fractal tree suggestion -->
  <g transform="translate(200, 390)">
    <!-- Trunk -->
    <line x1="0" y1="0" x2="0" y2="-35" stroke="#81c784" stroke-width="4"/>
    <!-- Level 1 branches -->
    <line x1="0" y1="-35" x2="-22" y2="-57" stroke="#81c784" stroke-width="3"/>
    <line x1="0" y1="-35" x2="22" y2="-57" stroke="#81c784" stroke-width="3"/>
    <!-- Level 2 branches -->
    <line x1="-22" y1="-57" x2="-33" y2="-72" stroke="#66bb6a" stroke-width="2"/>
    <line x1="-22" y1="-57" x2="-11" y2="-72" stroke="#66bb6a" stroke-width="2"/>
    <line x1="22" y1="-57" x2="11" y2="-72" stroke="#66bb6a" stroke-width="2"/>
    <line x1="22" y1="-57" x2="33" y2="-72" stroke="#66bb6a" stroke-width="2"/>
    <!-- Level 3 branches -->
    <line x1="-33" y1="-72" x2="-39" y2="-82" stroke="#4caf50" stroke-width="1.5"/>
    <line x1="-33" y1="-72" x2="-27" y2="-82" stroke="#4caf50" stroke-width="1.5"/>
    <line x1="-11" y1="-72" x2="-17" y2="-82" stroke="#4caf50" stroke-width="1.5"/>
    <line x1="-11" y1="-72" x2="-5" y2="-82" stroke="#4caf50" stroke-width="1.5"/>
    <line x1="11" y1="-72" x2="5" y2="-82" stroke="#4caf50" stroke-width="1.5"/>
    <line x1="11" y1="-72" x2="17" y2="-82" stroke="#4caf50" stroke-width="1.5"/>
    <line x1="33" y1="-72" x2="27" y2="-82" stroke="#4caf50" stroke-width="1.5"/>
    <line x1="33" y1="-72" x2="39" y2="-82" stroke="#4caf50" stroke-width="1.5"/>
  </g>
</svg>