<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#0d1b2a"/>

  <!-- Nested self-similar squares suggesting recursion -->
  <g fill="none" stroke-linecap="round" transform="translate(200,200)">
    <rect x="-170" y="-170" width="340" height="340" stroke="#e0e1dd" stroke-width="3" transform="rotate(0)"/>
    <rect x="-128" y="-128" width="256" height="256" stroke="#a9d6e5" stroke-width="3" transform="rotate(12)"/>
    <rect x="-96" y="-96" width="192" height="192" stroke="#90e0ef" stroke-width="3" transform="rotate(24)"/>
    <rect x="-72" y="-72" width="144" height="144" stroke="#48cae4" stroke-width="3" transform="rotate(36)"/>
    <rect x="-54" y="-54" width="108" height="108" stroke="#00b4d8" stroke-width="3" transform="rotate(48)"/>
    <rect x="-40" y="-40" width="80" height="80" stroke="#0096c7" stroke-width="3" transform="rotate(60)"/>
    <rect x="-30" y="-30" width="60" height="60" stroke="#0077b6" stroke-width="3" transform="rotate(72)"/>
    <rect x="-22" y="-22" width="44" height="44" stroke="#023e8a" stroke-width="3" transform="rotate(84)"/>
  </g>

  <!-- Circular arrow spiraling inward: the recursive call returning into itself -->
  <g transform="translate(200,200)" fill="none" stroke="#ffd166" stroke-width="6" stroke-linecap="round">
    <path d="M 0,-150
             A 150,150 0 1 1 -130,75
             A 110,110 0 1 0 -55,-95
             A 70,70 0 1 1 -35,60
             A 40,40 0 1 0 -15,-35"/>
  </g>
  <!-- Arrowhead pointing inward -->
  <g transform="translate(200,200)">
    <polygon points="-15,-35 -30,-28 -3,-18" fill="#ffd166"/>
  </g>

  <!-- central dot: the base case -->
  <circle cx="200" cy="200" r="8" fill="#ef476f"/>
</svg>