<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#1a1a2e"/>
  
  <!-- Recursive spiral arrows suggesting recursion -->
  <!-- Outermost circle arrow -->
  <path d="M 200 60 A 140 140 0 1 1 72 185" 
        fill="none" stroke="#4fc3f7" stroke-width="4" stroke-linecap="round"/>
  <polygon points="72,185 55,165 85,168" fill="#4fc3f7"/>
  
  <!-- Middle circle arrow -->
  <path d="M 200 105 A 95 95 0 1 1 112 218" 
        fill="none" stroke="#29b6f6" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="112,218 98,200 126,201" fill="#29b6f6"/>
  
  <!-- Inner circle arrow -->
  <path d="M 200 148 A 52 52 0 1 1 155 237" 
        fill="none" stroke="#0288d1" stroke-width="3" stroke-linecap="round"/>
  <polygon points="155,237 143,222 167,219" fill="#0288d1"/>
  
  <!-- Innermost tiny circle arrow -->
  <path d="M 200 178 A 22 22 0 1 1 180 218" 
        fill="none" stroke="#01579b" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="180,218 170,207 186,204" fill="#01579b"/>
  
  <!-- Center dot representing base case -->
  <circle cx="200" cy="200" r="8" fill="#ffffff" opacity="0.9"/>
  <circle cx="200" cy="200" r="4" fill="#4fc3f7"/>
  
  <!-- Fractal tree on the right suggesting recursion -->
  <!-- Trunk -->
  <line x1="340" y1="360" x2="340" y2="310" stroke="#81c784" stroke-width="3"/>
  <!-- Level 1 branches -->
  <line x1="340" y1="310" x2="315" y2="280" stroke="#81c784" stroke-width="2.5"/>
  <line x1="340" y1="310" x2="365" y2="280" stroke="#81c784" stroke-width="2.5"/>
  <!-- Level 2 branches left -->
  <line x1="315" y1="280" x2="302" y2="258" stroke="#a5d6a7" stroke-width="2"/>
  <line x1="315" y1="280" x2="328" y2="258" stroke="#a5d6a7" stroke-width="2"/>
  <!-- Level 2 branches right -->
  <line x1="365" y1="280" x2="352" y2="258" stroke="#a5d6a7" stroke-width="2"/>
  <line x1="365" y1="280" x2="378" y2="258" stroke="#a5d6a7" stroke-width="2"/>
  <!-- Level 3 tiny branches -->
  <line x1="302" y1="258" x2="295" y2="244" stroke="#c8e6c9" stroke-width="1.5"/>
  <line x1="302" y1="258" x2="309" y2="244" stroke="#c8e6c9" stroke-width="1.5"/>
  <line x1="328" y1="258" x2="321" y2="244" stroke="#c8e6c9" stroke-width="1.5"/>
  <line x1="328" y1="258" x2="335" y2="244" stroke="#c8e6c9" stroke-width="1.5"/>
  <line x1="352" y1="258" x2="345" y2="244" stroke="#c8e6c9" stroke-width="1.5"/>
  <line x1="352" y1="258" x2="359" y2="244" stroke="#c8e6c9" stroke-width="1.5"/>
  <line x1="378" y1="258" x2="371" y2="244" stroke="#c8e6c9" stroke-width="1.5"/>
  <line x1="378" y1="258" x2="385" y2="244" stroke="#c8e6c9" stroke-width="1.5"/>
  
  <!-- Fractal tree on the left (mirror) -->
  <line x1="60" y1="360" x2="60" y2="310" stroke="#ef9a9a" stroke-width="3"/>
  <line x1="60" y1="310" x2="35" y2="280" stroke="#ef9a9a" stroke-width="2.5"/>
  <line x1="60" y1="310" x2="85" y2="280" stroke="#ef9a9a" stroke-width="2.5"/>
  <line x1="35" y1="280" x2="22" y2="258" stroke="#ffcdd2" stroke-width="2"/>
  <line x1="35" y1="280" x2="48" y2="258" stroke="#ffcdd2" stroke-width="2"/>
  <line x1="85" y1="280" x2="72" y2="258" stroke="#ffcdd2" stroke-width="2"/>
  <line x1="85" y1="280" x2="98" y2="258" stroke="#ffcdd2" stroke-width="2"/>
  <line x1="22" y1="258" x2="15" y2="244" stroke="#ffebee" stroke-width="1.5"/>
  <line x1="22" y1="258" x2="29" y2="244" stroke="#ffebee" stroke-width="1.5"/>
  <line x1="48" y1="258" x2="41" y2="244" stroke="#ffebee" stroke-width="1.5"/>
  <line x1="48" y1="258" x2="55" y2="244" stroke="#ffebee" stroke-width="1.5"/>
  <line x1="72" y1="258" x2="65" y2="244" stroke="#ffebee" stroke-width="1.5"/>
  <line x1="72" y1="258" x2="79" y2="244" stroke="#ffebee" stroke-width="1.5"/>
  <line x1="98" y1="258" x2="91" y2="244" stroke="#ffebee" stroke-width="1.5"/>
  <line x1="98" y1="258" x2="105" y2="244" stroke="#ffebee" stroke-width="1.5"/>
  
  <!-- Downward arrow pointing into center, suggesting "call into self" -->
  <path d="M 200 20 L 200 45" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,3" opacity="0.5"/>
  <polygon points="200,52 193,40 207,40" fill="#ffffff" opacity="0.5"/>
</svg>