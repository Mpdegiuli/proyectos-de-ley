<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#0b1020"/>
  
  <!-- Nested recursive squares spiraling inward -->
  <g fill="none" stroke-linejoin="round">
    <rect x="40" y="40" width="320" height="320" stroke="#00e5ff" stroke-width="3"/>
    <rect x="80" y="80" width="240" height="240" stroke="#33d9ff" stroke-width="3" transform="rotate(10 200 200)"/>
    <rect x="115" y="115" width="170" height="170" stroke="#66ccff" stroke-width="3" transform="rotate(20 200 200)"/>
    <rect x="145" y="145" width="110" height="110" stroke="#99bfff" stroke-width="3" transform="rotate(30 200 200)"/>
    <rect x="170" y="170" width="60" height="60" stroke="#ccb3ff" stroke-width="3" transform="rotate(40 200 200)"/>
    <rect x="188" y="188" width="24" height="24" stroke="#ffa6ff" stroke-width="2" transform="rotate(50 200 200)"/>
  </g>
  
  <!-- Ouroboros-like arrow curling into itself -->
  <g transform="translate(200 200)">
    <!-- Big spiral arrow -->
    <path d="M 0,-150
             A 150,150 0 1,1 -150,0
             A 150,150 0 0,1 0,-150 Z" 
          fill="none" stroke="#ffcc33" stroke-width="6" opacity="0.0"/>
    
    <path d="M 140,0
             A 140,140 0 1,1 -140,0
             A 140,140 0 0,1 100,-98"
          fill="none" stroke="#ffd84d" stroke-width="5" opacity="0.9"/>
    <!-- arrowhead pointing inward -->
    <polygon points="100,-98 118,-78 86,-74" fill="#ffd84d"/>
    
    <path d="M 95,0
             A 95,95 0 1,1 -95,0
             A 95,95 0 0,1 65,-69"
          fill="none" stroke="#ffb84d" stroke-width="4" opacity="0.9"/>
    <polygon points="65,-69 82,-52 52,-48" fill="#ffb84d"/>
    
    <path d="M 55,0
             A 55,55 0 1,1 -55,0
             A 55,55 0 0,1 35,-42"
          fill="none" stroke="#ff9966" stroke-width="3" opacity="0.9"/>
    <polygon points="35,-42 48,-28 26,-24" fill="#ff9966"/>
    
    <circle cx="0" cy="0" r="8" fill="#ff6688"/>
  </g>
  
  <!-- Small self-reference indicator: a function calling itself (triangle inside triangle) -->
  <g transform="translate(60 340)" opacity="0.85">
    <polygon points="0,0 40,0 20,-35" fill="none" stroke="#7fffd4" stroke-width="2"/>
    <polygon points="8,-4 32,-4 20,-25" fill="none" stroke="#7fffd4" stroke-width="1.5"/>
    <polygon points="14,-7 26,-7 20,-18" fill="none" stroke="#7fffd4" stroke-width="1"/>
  </g>
  <g transform="translate(300 340)" opacity="0.85">
    <polygon points="0,0 40,0 20,-35" fill="none" stroke="#7fffd4" stroke-width="2"/>
    <polygon points="8,-4 32,-4 20,-25" fill="none" stroke="#7fffd4" stroke-width="1.5"/>
    <polygon points="14,-7 26,-7 20,-18" fill="none" stroke="#7fffd4" stroke-width="1"/>
  </g>
</svg>