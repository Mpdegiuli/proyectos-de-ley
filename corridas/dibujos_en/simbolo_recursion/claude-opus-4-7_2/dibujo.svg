<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#fdf6e3"/>
  
  <!-- Nested recursive squares with spiraling arrows -->
  <g fill="none" stroke="#268bd2" stroke-width="3">
    <rect x="40" y="40" width="320" height="320" rx="8"/>
    <rect x="80" y="80" width="240" height="240" rx="8" opacity="0.85"/>
    <rect x="120" y="120" width="160" height="160" rx="8" opacity="0.7"/>
    <rect x="160" y="160" width="80" height="80" rx="8" opacity="0.55"/>
    <rect x="185" y="185" width="30" height="30" rx="4" opacity="0.4"/>
  </g>
  
  <!-- Recursive arrow spiraling inward -->
  <g fill="none" stroke="#d33682" stroke-width="4" stroke-linecap="round">
    <path d="M 60 360 L 60 60 L 360 60 L 360 340 L 100 340 L 100 100 L 320 100 L 320 300 L 140 300 L 140 140 L 280 140 L 280 260 L 180 260 L 180 180 L 240 180 L 240 220 L 200 220" marker-end="url(#arr)"/>
  </g>
  
  <!-- Self-referential circular arrow around center -->
  <g fill="none" stroke="#859900" stroke-width="5" stroke-linecap="round">
    <path d="M 215 200 A 15 15 0 1 1 200 185" marker-end="url(#arr2)"/>
  </g>
  
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d33682"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#859900"/>
    </marker>
  </defs>
</svg>