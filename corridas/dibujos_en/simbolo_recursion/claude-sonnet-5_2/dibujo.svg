<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2b5f6b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="400" height="400" fill="#fbfbf8"/>

  <!-- self-call loop arrow near the root, symbolizing a function calling itself -->
  <path d="M230,392 C285,415 285,345 232,368"
        fill="none" stroke="#2b5f6b" stroke-width="3"
        marker-end="url(#arrow)"/>

  <!-- recursive fractal tree: each branch is a smaller copy of the whole -->
  <g stroke="#30424a" stroke-linecap="round" fill="none">
    <line x1="200" y1="390" x2="200" y2="320" stroke-width="7"/>

    <line x1="200" y1="320" x2="182.76" y2="272.64" stroke-width="5.5"/>
    <line x1="200" y1="320" x2="217.24" y2="272.64" stroke-width="5.5"/>

    <line x1="182.76" y1="272.64" x2="159.42" y2="244.84" stroke-width="4.3"/>
    <line x1="182.76" y1="272.64" x2="182.76" y2="236.35" stroke-width="4.3"/>
    <line x1="217.24" y1="272.64" x2="217.24" y2="236.35" stroke-width="4.3"/>
    <line x1="217.24" y1="272.64" x2="240.58" y2="244.84" stroke-width="4.3"/>

    <line x1="159.42" y1="244.84" x2="136.79" y2="231.77" stroke-width="3.2"/>
    <line x1="159.42" y1="244.84" x2="150.48" y2="220.29" stroke-width="3.2"/>
    <line x1="182.76" y1="236.35" x2="173.82" y2="211.80" stroke-width="3.2"/>
    <line x1="182.76" y1="236.35" x2="191.70" y2="211.80" stroke-width="3.2"/>
    <line x1="217.24" y1="236.35" x2="208.30" y2="211.80" stroke-width="3.2"/>
    <line x1="217.24" y1="236.35" x2="226.18" y2="211.80" stroke-width="3.2"/>
    <line x1="240.58" y1="244.84" x2="249.52" y2="220.29" stroke-width="3.2"/>
    <line x1="240.58" y1="244.84" x2="263.21" y2="231.77" stroke-width="3.2"/>

    <!-- one more generation, smaller still, reinforcing self-similarity -->
    <line x1="136.79" y1="231.77" x2="128.0" y2="222.0" stroke-width="2"/>
    <line x1="136.79" y1="231.77" x2="140.0" y2="215.0" stroke-width="2"/>
    <line x1="150.48" y1="220.29" x2="143.0" y2="212.0" stroke-width="2"/>
    <line x1="150.48" y1="220.29" x2="155.0" y2="205.0" stroke-width="2"/>
    <line x1="173.82" y1="211.80" x2="167.0" y2="202.0" stroke-width="2"/>
    <line x1="173.82" y1="211.80" x2="178.0" y2="196.0" stroke-width="2"/>
    <line x1="191.70" y1="211.80" x2="187.0" y2="197.0" stroke-width="2"/>
    <line x1="191.70" y1="211.80" x2="198.0" y2="202.0" stroke-width="2"/>
    <line x1="208.30" y1="211.80" x2="202.0" y2="202.0" stroke-width="2"/>
    <line x1="208.30" y1="211.80" x2="213.0" y2="197.0" stroke-width="2"/>
    <line x1="226.18" y1="211.80" x2="222.0" y2="196.0" stroke-width="2"/>
    <line x1="226.18" y1="211.80" x2="233.0" y2="202.0" stroke-width="2"/>
    <line x1="249.52" y1="220.29" x2="245.0" y2="205.0" stroke-width="2"/>
    <line x1="249.52" y1="220.29" x2="257.0" y2="212.0" stroke-width="2"/>
    <line x1="263.21" y1="231.77" x2="260.0" y2="215.0" stroke-width="2"/>
    <line x1="263.21" y1="231.77" x2="272.0" y2="222.0" stroke-width="2"/>
  </g>

  <!-- small circles marking the self-similar terminal nodes -->
  <g fill="#2b5f6b">
    <circle cx="128.0" cy="222.0" r="2.6"/>
    <circle cx="140.0" cy="215.0" r="2.6"/>
    <circle cx="143.0" cy="212.0" r="2.6"/>
    <circle cx="155.0" cy="205.0" r="2.6"/>
    <circle cx="167.0" cy="202.0" r="2.6"/>
    <circle cx="178.0" cy="196.0" r="2.6"/>
    <circle cx="187.0" cy="197.0" r="2.6"/>
    <circle cx="198.0" cy="202.0" r="2.6"/>
    <circle cx="202.0" cy="202.0" r="2.6"/>
    <circle cx="213.0" cy="197.0" r="2.6"/>
    <circle cx="222.0" cy="196.0" r="2.6"/>
    <circle cx="233.0" cy="202.0" r="2.6"/>
    <circle cx="245.0" cy="205.0" r="2.6"/>
    <circle cx="257.0" cy="212.0" r="2.6"/>
    <circle cx="260.0" cy="215.0" r="2.6"/>
    <circle cx="272.0" cy="222.0" r="2.6"/>
  </g>

  <!-- base node, the "origin" call -->
  <circle cx="200" cy="390" r="6" fill="#2b5f6b"/>
</svg>