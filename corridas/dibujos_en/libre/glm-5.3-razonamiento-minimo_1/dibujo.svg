<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.5" stop-color="#1b2a52"/>
      <stop offset="0.72" stop-color="#3b4a7a"/>
      <stop offset="0.78" stop-color="#7a6a8a"/>
      <stop offset="0.83" stop-color="#e8927c"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8927c"/>
      <stop offset="0.15" stop-color="#5a4a72"/>
      <stop offset="0.6" stop-color="#1b2a52"/>
      <stop offset="1" stop-color="#0b1026"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8e0" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#ffe9a8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffdca0" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#ff9e6d" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff9e6d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="400" height="320" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="30" cy="30" r="1.4" opacity="0.9"/>
    <circle cx="70" cy="60" r="1" opacity="0.7"/>
    <circle cx="110" cy="20" r="1.2" opacity="0.8"/>
    <circle cx="150" cy="50" r="0.9" opacity="0.6"/>
    <circle cx="200" cy="15" r="1.3" opacity="0.9"/>
    <circle cx="240" cy="45" r="1" opacity="0.7"/>
    <circle cx="280" cy="25" r="1.4" opacity="0.85"/>
    <circle cx="330" cy="55" r="1" opacity="0.65"/>
    <circle cx="365" cy="20" r="1.2" opacity="0.8"/>
    <circle cx="20" cy="100" r="1" opacity="0.5"/>
    <circle cx="55" cy="140" r="1.1" opacity="0.55"/>
    <circle cx="95" cy="115" r="0.8" opacity="0.5"/>
    <circle cx="180" cy="90" r="1" opacity="0.6"/>
    <circle cx="300" cy="95" r="1.1" opacity="0.55"/>
    <circle cx="350" cy="130" r="0.9" opacity="0.5"/>
    <circle cx="250" cy="130" r="0.8" opacity="0.45"/>
    <circle cx="140" cy="150" r="0.9" opacity="0.4"/>
  </g>
  <!-- Twinkles -->
  <g stroke="#ffffff" stroke-width="0.8" opacity="0.8" stroke-linecap="round">
    <path d="M200 12 v6 M197 15 h6"/>
    <path d="M30 28 v5 M27.5 30.5 h5"/>
    <path d="M280 23 v5 M277.5 25.5 h5"/>
  </g>

  <!-- Setting sun glow on horizon -->
  <circle cx="265" cy="318" r="70" fill="url(#sunGlow)"/>
  <circle cx="265" cy="318" r="16" fill="#ffd9a0" opacity="0.9"/>

  <!-- Far mountains -->
  <path d="M0 260 L60 190 L110 235 L160 175 L215 240 L260 200 L320 255 L360 225 L400 260 L400 320 L0 320 Z" fill="#2b2f55"/>
  <!-- Snow caps on far peaks -->
  <path d="M150 192 L160 175 L171 193 L165 197 L157 192 Z" fill="#4a5480" opacity="0.9"/>
  <path d="M48 206 L60 190 L72 207 L65 211 L56 206 Z" fill="#4a5480" opacity="0.85"/>
  <path d="M249 216 L260 200 L272 217 L265 221 L255 216 Z" fill="#4a5480" opacity="0.8"/>

  <!-- Near mountains -->
  <path d="M0 320 L0 290 L80 220 L140 280 L200 235 L280 300 L340 265 L400 305 L400 320 Z" fill="#1a1d3d"/>
  <!-- Snow on near peaks -->
  <path d="M68 235 L80 220 L93 236 L86 241 L78 235 L73 240 Z" fill="#8d92c4" opacity="0.85"/>
  <path d="M188 249 L200 235 L213 250 L206 255 L197 249 L192 254 Z" fill="#8d92c4" opacity="0.8"/>
  <path d="M330 278 L340 265 L351 279 L344 284 L336 278 L332 283 Z" fill="#8d92c4" opacity="0.7"/>

  <!-- Lake -->
  <rect x="0" y="320" width="400" height="80" fill="url(#lake)"/>

  <!-- Moon reflection streak -->
  <g fill="#ffe9b0">
    <rect x="259" y="322" width="12" height="3" opacity="0.7" rx="1.5"/>
    <rect x="255" y="328" width="20" height="2.5" opacity="0.55" rx="1.2"/>
    <rect x="252" y="334" width="26" height="2.5" opacity="0.45" rx="1.2"/>
    <rect x="258" y="341" width="16" height="2" opacity="0.35" rx="1"/>
    <rect x="248" y="347" width="34" height="2" opacity="0.28" rx="1"/>
    <rect x="262" y="354" width="12" height="2" opacity="0.22" rx="1"/>
    <rect x="254" y="361" width="26" height="1.8" opacity="0.16" rx="0.9"/>
    <rect x="260" y="369" width="18" height="1.6" opacity="0.12" rx="0.8"/>
  </g>

  <!-- Ripples -->
  <g stroke="#aab4dd" stroke-width="1" stroke-linecap="round" opacity="0.35" fill="none">
    <path d="M40 336 q15 3 30 0"/>
    <path d="M110 352 q20 4 40 0"/>
    <path d="M60 372 q18 4 36 0"/>
    <path d="M300 344 q18 4 36 0"/>
    <path d="M320 368 q15 3 30 0"/>
    <path d="M170 384 q20 4 40 0"/>
  </g>

  <!-- Moon -->
  <circle cx="265" cy="105" r="46" fill="url(#moonGlow)"/>
  <circle cx="265" cy="105" r="20" fill="#fdf6dc"/>
  <circle cx="272" cy="99" r="3.2" fill="#e8e0c0" opacity="0.7"/>
  <circle cx="258" cy="112" r="2.4" fill="#e8e0c0" opacity="0.6"/>
  <circle cx="268" cy="115" r="1.8" fill="#e8e0c0" opacity="0.5"/>

  <!-- Clouds -->
  <g fill="#3a3f6e" opacity="0.7">
    <ellipse cx="90" cy="200" rx="55" ry="9"/>
    <ellipse cx="120" cy="193" rx="35" ry="7"/>
  </g>
  <g fill="#454a7e" opacity="0.6">
    <ellipse cx="330" cy="170" rx="45" ry="8"/>
    <ellipse cx="305" cy="163" rx="28" ry="6"/>
  </g>

  <!-- Pine tree silhouettes on shore -->
  <g fill="#0d0f24">
    <path d="M30 320 L30 300 L36 312 L36 296 L44 310 L44 292 L52 310 L52 300 L58 314 L58 320 Z"/>
    <path d="M55 320 L55 306 L60 315 L60 302 L66 313 L66 298 L72 312 L72 306 L77 316 L77 320 Z"/>
    <path d="M350 320 L350 304 L357 314 L357 299 L365 312 L365 294 L373 311 L373 304 L380 317 L380 320 Z"/>
  </g>
  <!-- Tree reflections -->
  <g fill="#0d0f24" opacity="0.35">
    <path d="M30 320 L30 332 L36 326 L36 338 L44 328 L44 340 L52 330 L52 336 L58 328 L58 320 Z"/>
    <path d="M350 320 L350 333 L357 327 L357 338 L365 330 L365 342 L373 331 L373 337 L380 326 L380 320 Z"/>
  </g>
</svg>