<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0b1a" />
      <stop offset="100%" stop-color="#1b1b3a" />
    </linearGradient>
    
    <!-- Moon Glow Gradient -->
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffebd6" stop-opacity="0.8" />
      <stop offset="20%" stop-color="#ffebd6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffebd6" stop-opacity="0" />
    </radialGradient>

    <!-- Lake Gradient -->
    <linearGradient id="lakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b1b3a" />
      <stop offset="100%" stop-color="#0b0b1a" />
    </linearGradient>

    <!-- Shooting Star Gradient -->
    <linearGradient id="shootingStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Lantern Glow Gradient -->
    <radialGradient id="lanternGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0" />
    </radialGradient>

    <!-- Fog Blur Filter -->
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>

    <!-- Pine Tree Symbol -->
    <g id="pine">
      <rect x="-1" y="0" width="2" height="5" fill="#08061a" />
      <path d="M0,5 L5,-12 L2,-12 L7,-28 L3,-28 L10,-40 L-10,-40 L-3,-28 L-7,-28 L-2,-12 L-5,-12 Z" fill="#08061a" />
    </g>
  </defs>

  <!-- Background Sky -->
  <rect width="400" height="400" fill="url(#skyGrad)" />

  <!-- Stars -->
  <g fill="#ffffff">
    <!-- Top section stars -->
    <circle cx="20" cy="30" r="1" opacity="0.8" />
    <circle cx="50" cy="80" r="1.5" opacity="0.9" />
    <circle cx="80" cy="20" r="2" opacity="0.5" />
    <circle cx="120" cy="60" r="1" opacity="0.7" />
    <circle cx="150" cy="40" r="0.8" opacity="0.9" />
    <circle cx="180" cy="90" r="1.5" opacity="0.6" />
    <circle cx="210" cy="30" r="2.5" opacity="0.8" />
    <circle cx="260" cy="70" r="1" opacity="0.4" />
    <circle cx="290" cy="20" r="1.8" opacity="0.9" />
    <circle cx="320" cy="50" r="1" opacity="0.7" />
    <circle cx="360" cy="40" r="2" opacity="0.8" />
    <circle cx="380" cy="80" r="1.5" opacity="0.5" />
    <!-- Middle section stars -->
    <circle cx="10" cy="120" r="1.5" opacity="0.6" />
    <circle cx="40" cy="150" r="1" opacity="0.5" />
    <circle cx="70" cy="110" r="2" opacity="0.8" />
    <circle cx="100" cy="180" r="1.5" opacity="0.7" />
    <circle cx="130" cy="140" r="1" opacity="0.9" />
    <circle cx="160" cy="120" r="0.8" opacity="0.4" />
    <circle cx="190" cy="160" r="2" opacity="0.6" />
    <circle cx="220" cy="130" r="1.5" opacity="0.8" />
    <circle cx="250" cy="180" r="1" opacity="0.5" />
    <circle cx="280" cy="110" r="2.5" opacity="0.7" />
    <circle cx="310" cy="150" r="1" opacity="0.9" />
    <circle cx="340" cy="130" r="1.5" opacity="0.6" />
    <circle cx="370" cy="170" r="0.8" opacity="0.8" />
    <circle cx="390" cy="120" r="1" opacity="0.5" />
    <!-- Lower section stars -->
    <circle cx="30" cy="220" r="1" opacity="0.4" />
    <circle cx="60" cy="190" r="1.5" opacity="0.7" />
    <circle cx="90" cy="240" r="0.8" opacity="0.8" />
    <circle cx="120" cy="210" r="2" opacity="0.5" />
    <circle cx="150" cy="260" r="1" opacity="0.6" />
    <circle cx="180" cy="230" r="1.5" opacity="0.9" />
    <circle cx="210" cy="270" r="0.8" opacity="0.4" />
    <circle cx="240" cy="200" r="1" opacity="0.7" />
    <circle cx="270" cy="250" r="2" opacity="0.8" />
    <circle cx="300" cy="210" r="1.5" opacity="0.5" />
    <circle cx="330" cy="260" r="1" opacity="0.9" />
    <circle cx="360" cy="220" r="0.8" opacity="0.6" />
    <circle cx="390" cy="250" r="1.5" opacity="0.7" />
  </g>

  <!-- Shooting Star -->
  <line x1="120" y1="40" x2="180" y2="80" stroke="url(#shootingStarGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="180" y1="80" x2="190" y2="85" stroke="#ffffff" stroke-width="0.5" stroke-linecap="round" opacity="0.4" />

  <!-- Moon -->
  <circle cx="240" cy="160" r="70" fill="url(#moonGlow)" />
  <circle cx="240" cy="160" r="25" fill="#ffebd6" />
  <!-- Moon Craters -->
  <circle cx="235" cy="155" r="4" fill="#e0cda8" opacity="0.4" />
  <circle cx="245" cy="165" r="2" fill="#e0cda8" opacity="0.3" />
  <circle cx="230" cy="170" r="3" fill="#e0cda8" opacity="0.5" />

  <!-- Background Mountains -->
  <path d="M0,220 L40,100 L120,200 L200,80 L300,220 L350,150 L400,220 L400,400 L0,400 Z" fill="#1a153a" />
  <path d="M200,200 L250,120 L320,200 L380,140 L400,220 L400,400 Z" fill="#171235" />

  <!-- Midground Mountains -->
  <path d="M0,280 L80,180 L140,240 L200,160 L280,280 L400,230 L400,400 L0,400 Z" fill="#120e2d" />
  <path d="M150,260 L220,170 L300,300 L400,260 L400,400 Z" fill="#0f0b26" />

  <!-- Distant Trees on Midground -->
  <g transform="translate(100, 270) scale(0.5)"><use href="#pine" /></g>
  <g transform="translate(130, 250) scale(0.6)"><use href="#pine" /></g>
  <g transform="translate(260, 240) scale(0.4)"><use href="#pine" /></g>
  <g transform="translate(290, 270) scale(0.5)"><use href="#pine" /></g>
  <g transform="translate(310, 260) scale(0.6)"><use href="#pine" /></g>

  <!-- Fog / Mist -->
  <ellipse cx="200" cy="320" rx="180" ry="20" fill="#a58ad9" opacity="0.15" filter="url(#blur)" />
  <ellipse cx="100" cy="340" rx="140" ry="15" fill="#a58ad9" opacity="0.1" filter="url(#blur)" />
  <ellipse cx="320" cy="330" rx="150" ry="18" fill="#a58ad9" opacity="0.12" filter="url(#blur)" />

  <!-- Lake -->
  <polygon points="160,400 210,320 270,320 320,400" fill="url(#lakeGrad)" />
  <!-- Lake Edge Highlight -->
  <path d="M 160 400 L 210 320 L 270 320 L 320 400" fill="none" stroke="#2a1b38" stroke-width="2" opacity="0.5" />

  <!-- Moon Reflection on Lake -->
  <polygon points="200,400 235,320 245,320 280,400" fill="#ffffff" opacity="0.15" />
  <!-- Water Ripples -->
  <line x1="220" y1="340" x2="220" y2="370" stroke="#ffffff" stroke-width="1" opacity="0.1" />
  <line x1="230" y1="350" x2="230" y2="385" stroke="#ffffff" stroke-width="1" opacity="0.15" />
  <line x1="240" y1="330" x2="240" y2="390" stroke="#ffffff" stroke-width="1.5" opacity="0.2" />
  <line x1="250" y1="345" x2="250" y2="380" stroke="#ffffff" stroke-width="1" opacity="0.15" />
  <line x1="260" y1="360" x2="260" y2="395" stroke="#ffffff" stroke-width="1" opacity="0.1" />

  <!-- Left Cliff -->
  <path d="M0,400 L20,360 L40,370 L60,340 L90,350 L110,320 L160,320 L200,400 Z" fill="#08061a" />
  
  <!-- Right Cliff -->
  <path d="M240,400 L260,360 L280,370 L300,340 L330,350 L350,320 L370,320 L400,400 Z" fill="#08061a" />

  <!-- Trees on Left Cliff -->
  <g transform="translate(20, 360) scale(1.2)"><use href="#pine" /></g>
  <g transform="translate(50, 340) scale(1)"><use href="#pine" /></g>
  <g transform="translate(80, 350) scale(0.8)"><use href="#pine" /></g>
  <g transform="translate(110, 330) scale(1.1)"><use href="#pine" /></g>
  <g transform="translate(140, 320) scale(0.9)"><use href="#pine" /></g>
  <g transform="translate(170, 330) scale(0.7)"><use href="#pine" /></g>

  <!-- Trees on Right Cliff -->
  <g transform="translate(370, 360) scale(1.2)"><use href="#pine" /></g>
  <g transform="translate(340, 345) scale(1)"><use href="#pine" /></g>
  <g transform="translate(310, 355) scale(0.8)"><use href="#pine" /></g>
  <g transform="translate(280, 340) scale(0.9)"><use href="#pine" /></g>
  <g transform="translate(260, 370) scale(1.1)"><use href="#pine" /></g>

  <!-- Lantern Glow on Left Cliff -->
  <circle cx="100" cy="340" r="25" fill="url(#lanternGlow)" opacity="0.6" />
  
  <!-- Lantern Body -->
  <g transform="translate(100, 340)">
    <line x1="0" y1="-8" x2="0" y2="-15" stroke="#1f1a17" stroke-width="2" />
    <rect x="-4" y="-8" width="8" height="3" rx="1" fill="#1f1a17" />
    <rect x="-3" y="-5" width="6" height="10" rx="2" fill="#ffb347" />
    <rect x="-4" y="5" width="8" height="3" rx="1" fill="#1f1a17" />
    <!-- Lantern Flame -->
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Fox -->
  <g id="fox" transform="translate(315, 355) scale(0.8)">
    <!-- Tail -->
    <path d="M -10 -15 C -30 -15, -45 -30, -30 -45 C -20 -55, -5 -45, -15 -35 C -20 -25, -15 -20, -5 -20 Z" fill="#e07a3f" />
    <!-- Tail Tip -->
    <circle cx="-28" cy="-43" r="6" fill="#f4f4f9" />
    
    <!-- Body -->
    <ellipse cx="0" cy="-15" rx="12" ry="15" fill="#e07a3f" />
    <!-- Chest -->
    <ellipse cx="8" cy="-15" rx="6" ry="10" fill="#f4f4f9" />
    
    <!-- Front Legs -->
    <rect x="0" y="-10" width="4" height="12" rx="2" fill="#1f1a17" />
    <rect x="8" y="-10" width="4" height="12" rx="2" fill="#1f1a17" />
    
    <!-- Outer Ears -->
    <polygon points="-4,-34 -10,-48 0,-38" fill="#1f1a17" />
    <polygon points="4,-34 10,-48 0,-38" fill="#1f1a17" />
    
    <!-- Inner Ears -->
    <polygon points="-4,-35 -8,-45 -1,-38" fill="#f4f4f9" />
    <polygon points="4,-35 8,-45 1,-38" fill="#f4f4f9" />
    
    <!-- Head -->
    <ellipse cx="5" cy="-30" rx="10" ry="8" fill="#e07a3f" />
    
    <!-- Muzzle -->
    <ellipse cx="13" cy="-27" rx="6" ry="4" fill="#f4f4f9" />
    <!-- Nose -->
    <circle cx="18" cy="-27" r="2" fill="#1f1a17" />
    
    <!-- Eyes -->
    <circle cx="7" cy="-32" r="1.5" fill="#1f1a17" />
    <circle cx="11" cy="-32" r="1.5" fill="#1f1a17" />
    
    <!-- Eye Sparkle -->
    <circle cx="7.5" cy="-32.5" r="0.5" fill="#ffffff" />
    <circle cx="11.5" cy="-32.5" r="0.5" fill="#ffffff" />
  </g>
</svg>